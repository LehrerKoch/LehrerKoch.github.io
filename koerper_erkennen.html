      const p0=[mid[0]+u[0]*off-nn[0]*w, mid[1]+u[1]*off-nn[1]*w];
      const p1=[mid[0]+u[0]*off+nn[0]*w, mid[1]+u[1]*off+nn[1]*w];
      out+='<path d="M'+f1(p0)+' L'+f1(tip)+' L'+f1(p1)+'" fill="none" stroke="'+(t.color||CLR.mark)+
        '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>'; } });
  (spec.arcs||[]).forEach(ar=>{ const p=M(ar.at);
    const d1=nrm2([ar.d1[0],-ar.d1[1]]), d2=nrm2([ar.d2[0],-ar.d2[1]]);
    const a1=Math.atan2(d1[1],d1[0]), a2=Math.atan2(d2[1],d2[0]);
    let da=a2-a1; while(da<=-Math.PI)da+=2*Math.PI; while(da>Math.PI)da-=2*Math.PI;
    if(ar.big) da+=(da>0?-2*Math.PI:2*Math.PI);          // überstumpfer Winkel: außen herum
    const large=Math.abs(da)>Math.PI?1:0;
    const n=ar.n||1;
    for(let k=0;k<n;k++){ const r=(ar.r||15)+k*4.2;
      const A=[p[0]+Math.cos(a1)*r,p[1]+Math.sin(a1)*r], B=[p[0]+Math.cos(a1+da)*r,p[1]+Math.sin(a1+da)*r];
      out+='<path d="M'+f1(A)+' A '+r.toFixed(1)+' '+r.toFixed(1)+' 0 '+large+' '+(da>0?1:0)+' '+f1(B)+
        '" fill="none" stroke="'+(ar.color||CLR.mark)+'" stroke-width="1.6"/>'; } });
  (spec.rightAngles||[]).forEach(ra=>{ const p=M(ra.at);
    const d1=nrm2([ra.d1[0],-ra.d1[1]]), d2=nrm2([ra.d2[0],-ra.d2[1]]), k=10;
    const A=[p[0]+d1[0]*k,p[1]+d1[1]*k], B=[p[0]+(d1[0]+d2[0])*k,p[1]+(d1[1]+d2[1])*k], C=[p[0]+d2[0]*k,p[1]+d2[1]*k];
    out+='<path d="M'+f1(A)+' L'+f1(B)+' L'+f1(C)+'" fill="none" stroke="'+(ra.color||'#444')+'" stroke-width="1.4"/>'; });
  (spec.dots||[]).forEach(d=>{ const p=M(d.at);
    out+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(d.r||3)+'" fill="'+(d.color||CLR.ink)+'"/>'; });
  (spec.labels||[]).forEach(l=>{ const p=M(l.at);
    const x=(p[0]+(l.dx||0)).toFixed(1), y=(p[1]+(l.dy||0)).toFixed(1);
    const com='x="'+x+'" y="'+y+'" font-size="'+(l.size||14)+'" font-family="Calibri,\'Segoe UI\',sans-serif" text-anchor="'+
      (l.anchor||'middle')+'" dominant-baseline="middle"'+(l.bold?' font-weight="bold"':'');
    out+='<text '+com+' fill="#fff" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">'+svgSub(esc(l.text))+'</text>';
    out+='<text '+com+' fill="'+(l.color||'#173')+'">'+svgSub(esc(l.text))+'</text>'; });
  return inner? out : out+'</svg>';
}

/* --- Fläche -> spec ---------------------------------------------------- */
/* mode: 'plain' | 'marks' | 'label' | 'color'
   plain  = nur die Figur
   marks  = Maßstriche / Pfeilspitzen / rechte Winkel
   label  = gleiche Seiten gleicher Buchstabe, gleiche Winkel gleicher Buchstabe
   color  = wie label, zusätzlich gleiche Stücke in gleicher Farbe            */
function showHidden(){
  return (typeof state==='undefined')||state.hiddenEdges!==false;
}
/* ohne verdeckte Kanten ist der Körper undurchsichtig — das Raster scheint dann nicht durch */
function opaqueNow(VW){ return !!(VW&&VW.grid)&&!showHidden(); }
function modeFlags(mode){
  const plain=(mode==='plain'), col=(mode==='color'), letters=(mode==='label'||mode==='color');
  return {plain:plain, marks:!plain, tick:(mode==='marks'), letters:letters, col:col};
}
/* Werte nach Gleichheit gruppieren -> {g:[Gruppenindex je Wert], n} ,
   Nummerierung in der Reihenfolge des ersten Auftretens */
function groupIdx(vals,tol){
  const rep=[], g=[];
  vals.forEach(v=>{ let k=rep.findIndex(r=>Math.abs(r-v)<=tol*Math.max(Math.abs(r),Math.abs(v),1e-9));
    if(k<0){ k=rep.length; rep.push(v); } g.push(k); });
  return {g:g,n:rep.length};
}
/* Gruppen-Index je Seite aus fertigen Gruppen, in Reihenfolge des ersten Auftretens */
function firstOrder(groups,n){
  const gi=[], seen={}; let next=0;
  for(let i=0;i<n;i++){
    const k=groups.findIndex(x=>x.indexOf(i)>=0);
    if(seen[k]===undefined) seen[k]=next++;
    gi.push(seen[k]);
  }
  return gi;
}
/* gleich große Winkel gruppieren (rechte Winkel bleiben außen vor) */
function angGroups(ang,tolDeg){
  const gs=[];
  ang.forEach((a,i)=>{ const g=gs.find(x=>Math.abs(ang[x[0]]-a)<=tolDeg); if(g)g.push(i); else gs.push([i]); });
  return gs;
}
function figSpec(fig,mode,opt){
  opt=opt||{};
  const F=modeFlags(mode), col=F.col, lab=F.letters, marks=F.marks;
  const spec={fills:[],paths:[],ellipses:[],ticks:[],chevrons:[],rightAngles:[],arcs:[],labels:[],dots:[]};
  if(fig.kind==='round'){
    const e={c:[0,0],rx:fig.rx,ry:fig.ry,rot:fig.rot||0};
    spec.fillEllipse=Object.assign({},e,{color:CLR.fill});
    spec.ellipses.push(Object.assign({},e,{color:CLR.ink,width:2.2}));
    if(marks){
      const c1=col?LEN_COLORS[0]:CLR.mark, c2=col?LEN_COLORS[1]:CLR.mark;
      spec.dots.push({at:[0,0],color:CLR.ink,r:3});
      const same=Math.abs(fig.rx-fig.ry)<1e-9;
      const big=fig.rx>=fig.ry, ax=rot2([fig.rx,0],e.rot), ay=rot2([0,fig.ry],e.rot);
      if(same){                                   // Kreis: zwei gleich lange Radien
        [ax,ay].forEach(v=>{ spec.paths.push({pts:[[0,0],v],color:c1,width:2.2});
          spec.ticks.push({a:[0,0],b:v,n:1,color:c1}); });
        if(lab){ spec.labels.push({text:'r',at:mul2(ax,0.6),dy:-12,color:c1,bold:true});
                 spec.labels.push({text:'r',at:mul2(ay,0.6),dx:13,color:c1,bold:true}); }
      }else{                                      // Ellipse: a = längere Halbachse
        spec.paths.push({pts:[[0,0],ax],color:big?c1:c2,width:2.2});
        spec.paths.push({pts:[[0,0],ay],color:big?c2:c1,width:2.2});
        if(lab){ spec.labels.push({text:big?'a':'b',at:mul2(ax,0.6),dy:-12,color:big?c1:c2,bold:true});
                 spec.labels.push({text:big?'b':'a',at:mul2(ay,0.6),dx:13,color:big?c2:c1,bold:true}); }
      }
    }
    return spec;
  }
  const P=fig.pts, I=opt.info||polyInfo(P,1), n=P.length;
  spec.fills.push({pts:P,color:CLR.fill});
  spec.paths.push({pts:P,closed:true,color:CLR.ink,width:2.2});
  if(!marks) return spec;
  const gi=firstOrder(I.eqGroups,n);
  // gleich große Winkel gruppieren (rechte Winkel bekommen das Winkelzeichen)
  const tolD=Math.max(1.2,I.tolA*R2D);
  const rest=[]; for(let i=0;i<n;i++) if(I.right.indexOf(i)<0) rest.push(i);
  const gs=angGroups(I.ang,tolD).map(g=>g.filter(i=>rest.indexOf(i)>=0)).filter(g=>g.length);
  const ai={}; gs.forEach((g,k)=>g.forEach(i=>ai[i]=k));
  const bisec=i=>{ const u=nrm2(sub2(P[(i-1+n)%n],P[i])), v=nrm2(sub2(P[(i+1)%n],P[i]));
    let b=nrm2(add2(u,v)); if(I.ang[i]>180) b=[-b[0],-b[1]]; return b; };
  if(lab){
    // gleich lange Seiten: gleicher Buchstabe (bei „farbig" zusätzlich gleiche Farbe)
    for(let i=0;i<n;i++){
      const a=P[i], b=P[(i+1)%n];
      const c=col?LEN_COLORS[gi[i]%LEN_COLORS.length]:'#2c4a2e';
      if(col) spec.paths.push({pts:[a,b],color:c,width:3.2});
      const d=nrm2(sub2(b,a)), nn=[d[1],-d[0]];          // Außennormale (Umlauf gegen den Uhrzeiger)
      spec.labels.push({text:SIDE_LETTERS[gi[i]%SIDE_LETTERS.length],at:[(a[0]+b[0])/2,(a[1]+b[1])/2],
        dx:nn[0]*15, dy:-nn[1]*15, color:c, bold:true, size:13.5});
    }
    // gleich große Winkel: Bogen + gleicher Buchstabe
    rest.forEach(i=>{
      const k=ai[i]||0, c=col?ANG_COLORS[k%ANG_COLORS.length]:'#4a5a4c';
      const bi=bisec(i);
      spec.arcs.push({at:P[i],d1:nrm2(sub2(P[(i+1)%n],P[i])),d2:nrm2(sub2(P[(i-1+n)%n],P[i])),r:15,n:1,color:c,big:I.ang[i]>180});
      const far=I.ang[i]<46?32:(I.ang[i]<80?26:22);
      spec.labels.push({text:ANG_LETTERS[k%ANG_LETTERS.length],at:P[i],dx:bi[0]*far,dy:-bi[1]*far,
        color:c,bold:true,size:13});
    });
  }else{
    // „markiert": Maßstriche für gleich lange Seiten, Bögen für gleich große Winkel
    let g=0;
    I.eqGroups.forEach(gr=>{ if(gr.length<2) return; g++;
      gr.forEach(i=>spec.ticks.push({a:P[i],b:P[(i+1)%n],n:g,color:CLR.mark})); });
    let ga=0;
    gs.forEach(gr=>{ if(gr.length<2) return; ga++;
      gr.forEach(i=>spec.arcs.push({at:P[i],d1:nrm2(sub2(P[(i+1)%n],P[i])),d2:nrm2(sub2(P[(i-1+n)%n],P[i])),
        r:14,n:ga,color:CLR.mark,big:I.ang[i]>180})); });
  }
  // parallele Seiten: Pfeilspitzen (in allen Beschriftungsstufen)
  let pi=0; const used={};
  I.parPairs.forEach(pr=>{ if(used[pr[0]]||used[pr[1]])return; pi++;
    pr.forEach(i=>{ used[i]=1; spec.chevrons.push({a:P[i],b:P[(i+1)%n],n:pi,color:'#4a5a4c'}); }); });
  // rechte Winkel
  I.right.forEach(i=>{ spec.rightAngles.push({at:P[i],d1:nrm2(sub2(P[(i+1)%n],P[i])),d2:nrm2(sub2(P[(i-1+n)%n],P[i]))}); });
  return spec;
}

/* --- Körper: Projektionen ---------------------------------------------
   Eine „Ansicht" ist {proj: 3D->2D, dir: Blickrichtung in die Szene}.      */
const OBL_K=0.5, OBL_C=Math.SQRT1_2, KOB=OBL_K*OBL_C;
const proj3=p=>[p[0]+KOB*p[1], p[2]+KOB*p[1]];
const VIEWD=V3.norm([-KOB,1,-KOB]);
const CAB={proj:proj3,dir:VIEWD,cab:true,flat:true};
/* Vereinfachtes Schrägbild: der Grundkreis wird vor dem Projizieren geschert,
   damit seine Projektion eine waagerechte Ellipse ohne gedrehte Hauptachse wird. */
function cabView(flat){ return {proj:proj3,dir:VIEWD,cab:true,flat:flat!==false}; }
function preShear(S,VW){
  if(!(VW.cab&&VW.flat&&S.round)) return S.V;
  return S.V.map(p=>[p[0]-KOB*p[1],p[1],p[2]]);
}
function viewFrom(right,up,d,eps){
  const dv=V3.norm(V3.add(d,V3.add(V3.mul(right,eps?eps[0]:0),V3.mul(up,eps?eps[1]:0))));
  return {proj:p=>[V3.dot(p,right),V3.dot(p,up)], dir:V3.mul(dv,-1)};
}
function view3D(az,el,off){
  /* mit Koordinatenebenen im Hintergrund; off verschiebt die Objektmitte in den Ursprung */
  const ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el);
  const d=V3.norm([ce*ca,ce*sa,se]);            // Objekt -> Betrachter
  const right=V3.norm([-sa,ca,0]);
  const v=viewFrom(right,V3.cross(d,right),d); v.grid=true;
  if(off){ const p0=v.proj; v.proj=p=>p0(V3.sub(p,off)); }
  return v;
}
/* Dreitafel: Blickrichtung minimal gekippt, damit nichts exakt auf der Kante steht */
const V_FRONT=viewFrom([1,0,0],[0,0,1],[0,-1,0],[0.02,0.013]); V_FRONT.drei=true;
const V_SIDE =viewFrom([0,-1,0],[0,0,1],[-1,0,0],[0.02,0.013]); V_SIDE.drei=true;
const V_TOP  =viewFrom([1,0,0],[0,1,0],[0,0,1],[0.02,0.013]); V_TOP.drei=true;

function faceNormal(pts){ let n=[0,0,0];
  for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];
    n[0]+=(a[1]-b[1])*(a[2]+b[2]); n[1]+=(a[2]-b[2])*(a[0]+b[0]); n[2]+=(a[0]-b[0])*(a[1]+b[1]);}
  return V3.norm(n); }
function cen3(pts){ const c=[0,0,0]; pts.forEach(p=>{c[0]+=p[0];c[1]+=p[1];c[2]+=p[2];});
  return V3.mul(c,1/(pts.length||1)); }
function hull2D(pts){
  const P=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); if(P.length<3)return P;
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const p of P){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop(); lo.push(p); }
  for(let i=P.length-1;i>=0;i--){ const p=P[i]; while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
/* Kanten + Sichtbarkeit für eine Ansicht */
/* Ist die Flaeche in ihrer eigenen Ebene konvex? (Dreiecke immer.) */
function faceKonvex(V, idx){
  if(idx.length<4) return true;
  const n=faceNormal(idx.map(i=>V[i]));
  let vor=0;
  for(let i=0;i<idx.length;i++){
    const a=V[idx[i]], b=V[idx[(i+1)%idx.length]], c=V[idx[(i+2)%idx.length]];
    const z=V3.dot(V3.cross(V3.sub(b,a), V3.sub(c,b)), n);
    if(Math.abs(z)<1e-9) continue;
    if(vor && z*vor<0) return false;
    vor=z;
  }
  return true;
}
/* Eine Flaeche in Dreiecke zerlegen ("Ohren abschneiden").
   Ein Faecher vom ersten Eckpunkt aus (0-1-2, 0-2-3, ...) reicht nur bei
   konvexen Flaechen. Bei einer EINGEBUCHTETEN Flaeche liegen dessen Dreiecke
   teilweise AUSSERHALB der Flaeche - im Einschnitt entstand dadurch ein
   Schein-Verdecker, und genau der hat die Hoehenkante an der ueberstumpfen
   Ecke verschluckt. Ohren abschneiden liefert dagegen immer Dreiecke, die
   zusammen genau die Flaeche ergeben. */
function ohrenSchnitt(P2){
  const n=P2.length;
  if(n<3) return [];
  if(n===3) return [[0,1,2]];
  const kr=(a,b,c)=>(P2[b][0]-P2[a][0])*(P2[c][1]-P2[a][1])-(P2[b][1]-P2[a][1])*(P2[c][0]-P2[a][0]);
  let A2=0;
  for(let i=0;i<n;i++){ const j=(i+1)%n; A2+=P2[i][0]*P2[j][1]-P2[j][0]*P2[i][1]; }
  const rest=[]; for(let i=0;i<n;i++) rest.push(i);
  const umgekehrt=A2<0;
  if(umgekehrt) rest.reverse();                  // ab hier laeuft der Rand links herum
  const tol=1e-9*Math.max(1e-9,Math.abs(A2));
  const out=[];
  let schutz=3*n;
  while(rest.length>3 && schutz-->0){
    let weg=-1;
    for(let k=0;k<rest.length;k++){
      const m=rest.length;
      const a=rest[(k+m-1)%m], b=rest[k], c=rest[(k+1)%m];
      if(kr(a,b,c)<=tol) continue;                // an dieser Ecke buchtet es ein
      let frei=true;
      for(const q of rest){
        if(q===a||q===b||q===c) continue;
        if(kr(a,b,q)>=-tol && kr(b,c,q)>=-tol && kr(c,a,q)>=-tol){ frei=false; break; }
      }
      if(frei){ out.push([a,b,c]); weg=k; break; }
    }
    if(weg<0) break;                             // Notausgang: Rest als Faecher
    rest.splice(weg,1);
  }
  for(let k=1;k+1<rest.length;k++) out.push([rest[0],rest[k],rest[k+1]]);
  /* Umlaufrichtung der Flaeche beibehalten */
  return umgekehrt? out.map(t=>[t[2],t[1],t[0]]) : out;
}
/* Dreiecke einer Flaeche (Indizes in V). Konvex: Faecher, sonst Ohren. */
function faceTris(V,idx,n){
  if(idx.length<3) return [];
  if(idx.length===3) return [[idx[0],idx[1],idx[2]]];
  if(faceKonvex(V,idx)){
    const out=[]; for(let k=1;k+1<idx.length;k++) out.push([idx[0],idx[k],idx[k+1]]);
    return out;
  }
  const ax=(Math.abs(n[0])>=Math.abs(n[1])&&Math.abs(n[0])>=Math.abs(n[2]))?0:
           (Math.abs(n[1])>=Math.abs(n[2])?1:2);
  const flach=p=>ax===0?[p[1],p[2]]:ax===1?[p[2],p[0]]:[p[0],p[1]];
  return ohrenSchnitt(idx.map(q=>flach(V[q]))).map(t=>[idx[t[0]],idx[t[1]],idx[t[2]]]);
}
function solidGeom(S,VW){
  const V=preShear(S,VW), PR=V.map(VW.proj), bc=cen3(V);
  /* Aussenrichtung der Flaechen. Frueher wurde geprueft, ob die Normale vom
     Koerpermittelpunkt wegzeigt. Bei einem KONKAVEN Koerper stimmt das in der
     Einbuchtung nicht - dort zeigten die Normalen nach innen, die Flaechen
     galten als abgewandt und fehlten im Bild. Richtig ist die Umlaufrichtung
     der Flaechen: Sie ist im ganzen Netz einheitlich, und ob sie nach aussen
     oder nach innen zeigt, verraet das Vorzeichen des eingeschlossenen
     Volumens. Nur wenn sich das nicht entscheiden laesst (offenes oder flaches
     Netz), gilt wieder die alte Regel. */
  let nrms=S.F.map(f=>faceNormal(f.idx.map(i=>V[i])));
  let vol=0, gross=0;
  S.F.forEach((f,i)=>{
    const pts=f.idx.map(k=>V[k]); if(pts.length<3) return;
    let A=0;
    for(let k=1;k+1<pts.length;k++)
      A+=V3.dot(V3.cross(V3.sub(pts[k],pts[0]), V3.sub(pts[k+1],pts[0])), nrms[i])/2;
    gross+=Math.abs(A);
    vol+=V3.dot(V3.sub(cen3(pts),bc), nrms[i])*A/3;
  });
  if(Math.abs(vol) < 1e-6*Math.max(1e-9,gross)){
    nrms=S.F.map((f,i)=>{ const pts=f.idx.map(k=>V[k]);
      return V3.dot(nrms[i],V3.sub(cen3(pts),bc))<0 ? V3.mul(nrms[i],-1) : nrms[i]; });
  } else if(vol<0) nrms=nrms.map(n=>V3.mul(n,-1));
  const front=nrms.map(n=>V3.dot(n,VW.dir)<-1e-9);
  /* Ist der Koerper "einfach" (konvex und nicht verdreht), reicht die
     Normalenpruefung fuer die Sichtbarkeit. Sonst - bei verdrehten Koerpern und
     bei einer eingebuchteten (konkaven) Grundflaeche - muss zusaetzlich geprueft
     werden, was wovor liegt, und die Flaechen muessen einzeln gefuellt werden. */
  const komplex = !!S.twist || !S.F.every(f=>faceKonvex(V, f.idx));
  const em=new Map();
  S.F.forEach((f,fi)=>{ const ix=f.idx;
    for(let i=0;i<ix.length;i++){ const a=ix[i], b=ix[(i+1)%ix.length]; if(a===b)continue;
      const key=Math.min(a,b)+'_'+Math.max(a,b);
      let e=em.get(key); if(!e){e={a:Math.min(a,b),b:Math.max(a,b),f:[]};em.set(key,e);} e.f.push(fi); } });
  /* Beim Tordieren wird der Mantel aus zwölf Schichten gebaut. Die einzelnen
     Vierecke sind aber nur ein Notbehelf: In Wirklichkeit ist jede Seitenfläche
     eine GEWÖLBTE Fläche, und ihre Kanten sind nur die Grundfläche, die
     Deckfläche und die vier verdrehten Seitenkanten. Die waagerechten Kanten
     zwischen zwei Schichten gehören nicht dazu und werden deshalb bei einem
     verdrehten Körper immer weggelassen - der Umriss der gewölbten Fläche wird
     statt dessen weiter unten ausgerechnet. */
  const glatt=!!S.twist && S.n>0 && V.length%S.n===0 && V.length/S.n>=3;
  const edges=[];
  em.forEach(e=>{
    const g=e.f.map(i=>S.F[i].grp);
    const smooth=(e.f.length===2 && g[0]===g[1]);
    const allBack=!e.f.some(i=>front[i]);
    if(smooth && (glatt || !(e.f.length===2 && front[e.f[0]]!==front[e.f[1]]))) return;   // Glättung
    if(V3.len(V3.sub(V[e.a],V[e.b]))<1e-7) return;
    edges.push({a:e.a,b:e.b,hidden:allBack,f:e.f.slice()});
  });
  /* ─── Umriss der gewölbten Seitenflächen ──────────────────────────────────
     Auf einer gewölbten Fläche verläuft der Umriss mitten durch die Fläche -
     dort, wo sie genau seitlich steht. Solange nur die Vierecke beurteilt
     wurden ("zeigt dieses Viereck zu mir?"), sprang der Umriss von Kante zu
     Kante: mal fehlte ein Stück ganz (beide Nachbarvierecke zeigten zum
     Betrachter, obwohl die Fläche dazwischen schon wegkippt), mal entstand
     eine lange gerade Linie quer über den Körper (eine waagerechte Kante, die
     zufällig genau am Umriss lag).

     Deshalb wird jetzt gerechnet wie bei einer runden Fläche: An jeder Ecke
     beschreibt das Mittel der angrenzenden Vierecke die Richtung der gewölbten
     Fläche. Wo dieser Wert das Vorzeichen wechselt, liegt der Umriss; die
     Stelle wird auf den Kanten jedes Vierecks ausgerechnet und zu einem
     Streckenzug verbunden ("marching squares"). */
  const umrissRoh=[], umriss=[], mantelFuell=[], mantelFlaechen=[];
  if(glatt && VW.dir){
    const n=S.n, L=V.length/n, ix=(li,i)=>li*n+i;
    const zelle=[];                       // zelle[li][i] = Flächennummer
    for(let li=0;li<L-1;li++) zelle.push(new Array(n).fill(-1));
    S.F.forEach((f,fi)=>{
      if(f.grp==='bot'||f.grp==='top'||f.idx.length!==4) return;
      const li=Math.floor(f.idx[0]/n), i=f.idx[0]%n;
      if(li<L-1 && zelle[li] && f.idx[3]===ix(li+1,i)) zelle[li][i]=fi;
    });
    const rund=!!S.round;                 // runder Mantel: alle Spalten sind EINE Fläche
    /* Die Seitenfläche einer Schicht ist keine ebene Fläche, sondern eine
       Regelfläche: Sie entsteht, wenn die Strecke von einer Ecke zur nächsten
       nach oben wandert und sich dabei dreht. Ihre Richtung ändert sich also
       AUCH längs dieser Strecke - deshalb reicht eine Normale für das ganze
       Viereck nicht, es braucht eine für jede Ecke. Für die Regelfläche
       X(s,t) = (1-t)·((1-s)A + sB) + t·((1-s)D + sC) sind die Ableitungen an
       den Ecken gerade die anliegenden Kanten; ihr Kreuzprodukt ist die
       gesuchte Richtung. */
    const eckNormale=(li,sp)=>{
      const q=zelle[li][sp]; if(q<0) return null;
      const i0=sp, i1=(sp+1)%n;
      const A=V[ix(li,i0)], Bv=V[ix(li,i1)], C=V[ix(li+1,i1)], Dv=V[ix(li+1,i0)];
      const AB=V3.sub(Bv,A), DC=V3.sub(C,Dv), AD=V3.sub(Dv,A), BC=V3.sub(C,Bv);
      const roh=[V3.cross(AB,AD), V3.cross(AB,BC), V3.cross(DC,BC), V3.cross(DC,AD)];
      /* Alle vier zeigen bereits in dieselbe Richtung (sie entstehen aus
         derselben Reihenfolge der Ableitungen). Nach aussen gedreht wird
         deshalb der ganze Satz AUF EINMAL. Jede Ecke einzeln an der mittleren
         Normalen auszurichten geht schief, sobald das Viereck stark gewölbt
         ist: Dann weicht eine Ecke um mehr als 90 Grad vom Mittel ab und wurde
         verkehrt herum gedreht - an dieser Stelle galt die Flaeche dann als
         abgewandt, blieb ungefuellt (ein Loch im Koerper) und bekam eine
         zusaetzliche Umrisslinie. */
      let sum=[0,0,0];
      const eins=roh.map(x=>{ const l=V3.len(x); if(l<1e-12) return [0,0,0];
        const u=V3.mul(x,1/l); sum=V3.add(sum,u); return u; });
      const s=(V3.dot(sum,nrms[q])<0)?-1:1;
      return eins.map(u=>V3.mul(u,s));
    };
    /* Richtung an einer Gitterecke: Mittel der anliegenden Zellen. Nach oben
       und unten gehört die Fläche immer zusammen; zur Seite nur beim runden
       Mantel - beim Vieleck ist die Seitenkante ein Knick. */
    const wGitter=(sp)=>{
      const out=[];
      for(let li=0;li<L;li++){
        const s=[[0,0,0],[0,0,0]];
        const dazu=(a,b,k,e0,e1)=>{ if(a<0||a>=L-1) return; const E=eckNormale(a,(b+n)%n); if(!E) return;
          s[k]=V3.add(s[k],E[e0]); if(e1>=0) s[k]=V3.add(s[k],E[e1]); };
        dazu(li-1,sp,0,3,-1); dazu(li,sp,0,0,-1);      // linke Ecke, Zelle darunter/darüber
        dazu(li-1,sp,1,2,-1); dazu(li,sp,1,1,-1);      // rechte Ecke
        if(rund){
          dazu(li-1,sp-1,0,2,-1); dazu(li,sp-1,0,1,-1);
          dazu(li-1,sp+1,1,3,-1); dazu(li,sp+1,1,0,-1);
        }
        out.push([V3.dot(s[0],VW.dir), V3.dot(s[1],VW.dir)]);
      }
      return out;
    };
    for(let sp=0;sp<n;sp++){
      const i0=sp, i1=(sp+1)%n;
      const w=wGitter(sp);                // w[li] = [links, rechts]
      for(let li=0;li<L-1;li++){
        const fi=zelle[li][sp]; if(fi<0) continue;
        // Ecken des Vierecks im Uhrzeigersinn: A(li,0) B(li,1) C(li+1,1) D(li+1,0)
        const P=[ix(li,i0), ix(li,i1), ix(li+1,i1), ix(li+1,i0)];
        const W=[w[li][0], w[li][1], w[li+1][1], w[li+1][0]];
        /* Gleich mitgenommen: der zugewandte Teil des Vierecks. Er wird als
           Füllung benutzt, damit die gefüllte Fläche GENAU an der Linie endet -
           sonst schaute ein schmaler Streifen über den Umriss hinaus. */
        const treffer=[];
        mantelFlaechen.push(fi);
        /* Innerhalb des Vierecks wird zwischen den vier Ecken fortgesetzt
           (bilinear) - und zwar fuer die Flaeche UND fuer ihre Richtung. Die
           Linie, auf der die Richtung umschlaegt, ist dann keine Gerade,
           sondern gebogen. Wurde sie durch eine einzige Sehne ersetzt, blieb
           zwischen Sehne und Bogen ein linsenfoermiges Stueck ungefuellt - ein
           "Loch" im Koerper mit eigenem Rand. Darum wird jedes Viereck, durch
           das die Linie laeuft, noch einmal unterteilt. */
        const Pkt=(sv,tv)=>[0,1,2].map(d=>
          V[P[0]][d]*(1-sv)*(1-tv) + V[P[1]][d]*sv*(1-tv) +
          V[P[2]][d]*sv*tv       + V[P[3]][d]*(1-sv)*tv);
        const Wst=(sv,tv)=> W[0]*(1-sv)*(1-tv) + W[1]*sv*(1-tv) + W[2]*sv*tv + W[3]*(1-sv)*tv;
        const UNTER=(W.some(x=>x<0) && W.some(x=>x>=0)) ? 4 : 1;
        for(let gi=0;gi<UNTER;gi++) for(let gj=0;gj<UNTER;gj++){
          const s0=gi/UNTER, s1=(gi+1)/UNTER, t0=gj/UNTER, t1=(gj+1)/UNTER;
          const E=[[s0,t0],[s1,t0],[s1,t1],[s0,t1]];
          const w4=E.map(e=>Wst(e[0],e[1]));
          /* Gefuellt wird das GANZE Teilviereck, auch den abgewandten Teil.
             Dort, wo sich die Flaeche umschlaegt, legt sich der abgewandte Teil
             naemlich wieder ueber den zugewandten; liess man ihn weg, blieb an
             einer Spitze der Umrisslinie eine kleine Schlaufe ungefuellt - ein
             "Loch" im Koerper. Weil die Teilvierecke klein sind, endet die
             Fuellung trotzdem dicht an der Umrisslinie. */
          mantelFuell.push(E.map(e=>VW.proj(Pkt(e[0],e[1]))));
          for(let k=0;k<4;k++){
            const a=w4[k], b=w4[(k+1)%4];
            if((a>0)===(b>0) || a===b) continue;
            const f=a/(a-b), e0=E[k], e1=E[(k+1)%4];
            const p3=Pkt(e0[0]+(e1[0]-e0[0])*f, e0[1]+(e1[1]-e0[1])*f);
            treffer.push(p3);
          }
        }
        /* Gegen die eigene gewölbte Fläche wird nicht geprüft. Am Umriss steht
           sie fast in Blickrichtung: Jedes Viereck derselben Fläche liegt dort
           um Haaresbreite mal davor, mal dahinter, und schon ein winziger
           Vorsprung hätte zur Folge, dass der Umriss als verdeckt gilt und
           gestrichelt gezeichnet wird. Deshalb zählt innerhalb derselben
           gewölbten Fläche nur, was DEUTLICH davor liegt; gegenüber allen
           anderen Flächen bleibt es beim kleinen Sicherheitsabstand. */
        const eig=[fi], nah=[];
        for(let a=0;a<L-1;a++) for(let c=0;c<n;c++){
          if(!rund && c!==sp) continue;                 // beim Vieleck nur die eigene Säule
          const q=zelle[a][c]; if(q>=0 && q!==fi) nah.push(q);
        }
        if(treffer.length>=2)
          for(let k=0;k+1<treffer.length;k+=2)
            umrissRoh.push({A:treffer[k], B:treffer[k+1], f:eig, nah:nah});
      }
    }
  }
  /* ─── Verdeckte Kantenteile ausrechnen (Verdeckungsrechnung) ──────────────
     Tordierte und eingebuchtete (konkave) Körper sind nicht konvex: Eine Kante
     kann zu zwei zugewandten Flächen gehören und trotzdem hinter dem Körper
     liegen. Der Blick nur auf die Flächennormalen ("zeigt die Fläche zu mir?")
     reicht dann nicht.

     Gerechnet wird nach dem klassischen Verfahren der Verdeckungsrechnung
     (Kante gegen Fläche, Appel): Jede Kante wird durch einen Parameter
     u ∈ [0,1] beschrieben, und für jedes Dreieck des Körpers wird AUSGERECHNET,
     auf welchem u-Bereich die Kante dahinter verschwindet. Beide Bedingungen
     sind in u linear, der verdeckte Bereich ist also immer ein Intervall:

       (1) Im Bild liegt die Kante innerhalb des Dreiecks. Da die Abbildung
           geradentreu ist, heißt das: die Strecke gegen die drei Kanten des
           Dreiecks abschneiden -> Intervall [u0,u1].
       (2) Die Kante liegt hinter der Ebene des Dreiecks. Der Abstand zur Ebene
           wächst linear mit u; aus den beiden Endwerten ergibt sich, ab (bzw.
           bis) wo sie dahinter liegt.

     Die Schnittmenge beider Intervalle ist der verdeckte Bereich; alle diese
     Bereiche zusammengefasst ergeben die gestrichelten Stücke, der Rest wird
     durchgezogen. Vorher wurden statt dessen nur sechs Stichproben genommen -
     damit lagen die Übergänge immer auf einem Sechstel der Kante, und kurze
     verdeckte Stücke fielen ganz durch das Raster. */
  if(komplex && VW.dir){
    /* VW.dir zeigt vom Betrachter weg (front[] rechnet mit dot(n,dir)<0),
       zum Betrachter hin geht es also in die Gegenrichtung. */
    const zum=[-VW.dir[0],-VW.dir[1],-VW.dir[2]];
    /* Alle Flächen kommen als mögliche Verdecker in Frage - bei einem verdrehten
       Körper liegt auch mal eine abgewandte Fläche vor einer Kante.

       Geprüft wird gegen DREIECKE, nicht gegen die ganze Fläche: Beim Tordieren
       sind die Seitenflächen Vierecke, deren vier Ecken nicht mehr in einer
       Ebene liegen. Mit einer mittleren Ebene für das ganze Viereck kam an den
       Rändern Unsinn heraus - dort fehlten am Umriss kurze Stücke. */
    let gross=0;
    for(let i=0;i<3;i++){ let lo=1e9,hi=-1e9;
      V.forEach(p=>{ lo=Math.min(lo,p[i]); hi=Math.max(hi,p[i]); }); gross=Math.max(gross,hi-lo); }
    const flaechen=[];
    S.F.forEach((f,fi)=>{
      faceTris(V,f.idx,nrms[fi]).forEach(idx=>{
        const P=idx.map(q=>V[q]);
        let n=V3.cross(V3.sub(P[1],P[0]), V3.sub(P[2],P[0]));
        const L=V3.len(n); if(L<1e-12) return;
        n=V3.mul(n,1/L);
        const poly=idx.map(q=>PR[q]);
        /* Im Bild sichtbar schmale Dreiecke (von der Seite gesehene Flächen)
           können nichts verdecken - und ihre Halbebenen wären zahlenmäßig
           unzuverlässig. */
        const fl2=(poly[1][0]-poly[0][0])*(poly[2][1]-poly[0][1])
                 -(poly[1][1]-poly[0][1])*(poly[2][0]-poly[0][0]);
        if(Math.abs(fl2)<1e-9*Math.max(1e-9,gross*gross)) return;
        let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
        poly.forEach(q=>{ x0=Math.min(x0,q[0]); x1=Math.max(x1,q[0]); y0=Math.min(y0,q[1]); y1=Math.max(y1,q[1]); });
        flaechen.push({poly:poly, n:n, p0:P[0], fi:fi, sg:fl2<0?-1:1, bb:[x0,x1,y0,y1]});
      });
    });
    /* Sicherheitsabstand: Eine Kante liegt in der Ebene ihrer eigenen
       Nachbarflächen; durch Rundungsfehler käme sonst heraus, sie liege knapp
       dahinter. Gezählt wird deshalb nur, was merklich davor liegt. */
    const EPS=Math.max(1e-9, gross*0.0015);
    /* Grosszuegiger Abstand innerhalb derselben gewoelbten Flaeche (siehe oben
       beim Umriss): dort liegen die Vierecke am Umriss haarscharf beieinander. */
    const EPS_NAH=Math.max(1e-7, gross*0.03);
    /* Kürzeste Länge, die als eigener Abschnitt noch etwas nützt: etwa ein
       Prozent der Körpergröße, also wenige Bildpunkte. Kürzere verdeckte
       Stücke werden geschluckt, statt eine durchgezogene Linie zu zerhacken,
       und kürzeste freie Stücke gehen im verdeckten Nachbarn auf - sonst sähen
       manche Kanten zerstückelt und beim Drehen unruhig aus. */
    const KURZ=gross*0.012;
    /* Fuer jede Kante wird jetzt wirklich gerechnet. Frueher galt die Abkuerzung
       "zeigen beide Nachbarflaechen weg, ist die Kante verdeckt". Die stimmt nur
       bei einem konvexen Koerper mit ebenen Flaechen. Bei einem verdrehten
       Koerper sind die Seitenflaechen gewoelbt: Schaut man steil von oben, zeigen
       beide Nachbarflaechen einer Seitenkante weg (sie stehen fast senkrecht zur
       Blickrichtung) - die Kante selbst liegt aber genau am Umriss, denn von oben
       beschreibt sie einen Kreisbogen um die Achse. Mit der Abkuerzung wurde
       dieser Bogen gestrichelt gezeichnet, obwohl er den Koerper begrenzt. */
    /* Zerlegt eine Strecke (im Raum A..B, im Bild PA..PB) in sichtbare und
       verdeckte Abschnitte. eig = eigene Flächen, gegen die nicht geprüft wird. */
    const abschnitte=(A,B,PA,PB,eig,nah)=>{
      const MIN=Math.min(0.34, KURZ/Math.max(1e-9, Math.hypot(PB[0]-PA[0], PB[1]-PA[1])));
      const weg=[];
      for(const fl of flaechen){
        // (0) die eigenen Flächen der Kante und ein grober Rechteck-Vorfilter
        if(eig.indexOf(fl.fi)>=0) continue;
        if(Math.max(PA[0],PB[0])<fl.bb[0] || Math.min(PA[0],PB[0])>fl.bb[1] ||
           Math.max(PA[1],PB[1])<fl.bb[2] || Math.min(PA[1],PB[1])>fl.bb[3]) continue;
        const nenner=V3.dot(fl.n,zum);
        if(Math.abs(nenner)<1e-12) continue;
        // (1) Tiefe: linear in u. t>0 heißt "Fläche liegt vor der Kante".
        if(nah && nah.indexOf(fl.fi)>=0) continue;   // dieselbe gewoelbte Flaeche
        const eps=EPS;
        const s=nenner>0?1:-1;
        const t0=-s*V3.dot(fl.n,V3.sub(A,fl.p0));
        const t1=-s*V3.dot(fl.n,V3.sub(B,fl.p0));
        if(t0<=eps && t1<=eps) continue;             // nirgends merklich davor
        let u0=0, u1=1;
        if(t0<=eps || t1<=eps){
          const u=(eps-t0)/(t1-t0);
          if(t1>t0) u0=u; else u1=u;
        }
        if(u1<=u0) continue;
        // (2) im Bild innerhalb des Dreiecks: gegen die drei Kanten abschneiden
        let drin=true;
        for(let k=0;k<3;k++){
          const R=fl.poly[k], Q=fl.poly[(k+1)%3];
          const ex=Q[0]-R[0], ey=Q[1]-R[1];
          const c0=fl.sg*(ex*(PA[1]-R[1])-ey*(PA[0]-R[0]));
          const c1=fl.sg*(ex*(PB[1]-R[1])-ey*(PB[0]-R[0]));
          if(c0>=0 && c1>=0) continue;               // ganz innerhalb dieser Kante
          if(c0<=0 && c1<=0){ drin=false; break; }   // ganz außerhalb
          const u=c0/(c0-c1);
          if(c1>c0) u0=Math.max(u0,u); else u1=Math.min(u1,u);
          if(u1<=u0){ drin=false; break; }
        }
        if(drin) weg.push([Math.max(0,u0),Math.min(1,u1)]);
      }
      // verdeckte Bereiche sortieren und zusammenfassen
      weg.sort((x,y)=>x[0]-y[0]);
      const zus=[];
      for(const iv of weg){
        if(iv[1]<=iv[0]) continue;
        const l=zus[zus.length-1];
        if(l && iv[0]<=l[1]+MIN) l[1]=Math.max(l[1],iv[1]); else zus.push([iv[0],iv[1]]);
      }
      const P=u=>[PA[0]+(PB[0]-PA[0])*u, PA[1]+(PB[1]-PA[1])*u];
      const teile=[]; let u=0;
      const setze=(h,b)=>{ const l=teile[teile.length-1];
        if(l && l.hidden===h){ l.pts[1]=P(b); l.u1=b; }
        else teile.push({hidden:h, pts:[P(u),P(b)], u0:u, u1:b});
        u=b; };
      zus.forEach(iv=>{
        const a=Math.max(u,iv[0]), b=Math.min(1,iv[1]);
        if(b-a<MIN) return;                          // zu kurz, um es zu zeigen
        if(a-u>=MIN) setze(false,a);                 // freies Stück davor
        setze(true,b);                               // sonst wächst das verdeckte Stück
      });
      if(u<1){
        const l=teile[teile.length-1];
        if(l && l.hidden && 1-u<MIN) { l.pts[1]=P(1); l.u1=1; u=1; }   // Reststück anhängen
        else setze(false,1);
      }
      if(!teile.length) teile.push({hidden:false, pts:[P(0),P(1)], u0:0, u1:1});
      return teile;
    };
    edges.forEach(e=>{
      const PA=PR[e.a], PB=PR[e.b];
      e.teile=abschnitte(V[e.a],V[e.b],PA,PB,e.f);
      e.hidden=e.teile.every(t=>t.hidden);
    });
    /* Der ausgerechnete Umriss der gewölbten Seitenflächen wird genauso
       behandelt - er kann ebenso hinter dem Körper verschwinden. */
    umrissRoh.forEach(u=>{
      const PA=VW.proj(u.A), PB=VW.proj(u.B);
      if(Math.hypot(PB[0]-PA[0],PB[1]-PA[1])<1e-9) return;
      abschnitte(u.A,u.B,PA,PB,u.f,u.nah).forEach(t=>{
        const m=(x)=>V3.add(u.A, V3.mul(V3.sub(u.B,u.A), x));
        t.p3=[m(t.u0), m(t.u1)];            // fuer Pruefzwecke: die Punkte im Raum
        umriss.push(t); });
    });
  }
  /* Runde Körper: Grund- und Deckkreis sind in Wahrheit Vielecke mit 48 Ecken.
     Der Umriss des Körpers liegt aber nicht auf einer Ecke, sondern irgendwo
     dazwischen - genau dort, wo die Mantelfläche seitlich steht. Wurde der
     Kreis nur eckenweise beurteilt, sprang der Wechsel von durchgezogen auf
     gestrichelt bis zu einer halben Ecke daneben; am Umriss klaffte dann eine
     sichtbare Lücke oder die Linie lief ein Stück über den verdeckten Bereich
     hinaus. Hier wird die Stelle ausgerechnet: An jeder Ecke beschreibt das
     Mittel der beiden angrenzenden Mantelflächen die Richtung der (gedachten)
     runden Fläche; wo dieser Wert das Vorzeichen wechselt, liegt der Umriss. */
  let ringe=null;
  if(S.round && S.n && VW.dir && !S.twist){
    const n=S.n, listen=[range(n)];
    if(S.apex==null) listen.push(range(n).map(i=>V.length-n+i));
    ringe=listen.map(ring=>{
      const seite=[]; let deckel=-1;
      for(let i=0;i<n;i++){
        const a=ring[i], b=ring[(i+1)%n];
        const e=em.get(Math.min(a,b)+'_'+Math.max(a,b));
        let sf=-1;
        if(e) e.f.forEach(k=>{ if(S.F[k].grp==='side') sf=k; else if(deckel<0) deckel=k; });
        seite.push(sf);
      }
      if(seite.some(k=>k<0)) return null;
      const w=[];
      for(let i=0;i<n;i++){
        const nn=V3.add(nrms[seite[(i-1+n)%n]], nrms[seite[i]]);
        w.push(V3.dot(nn,VW.dir));
      }
      return {idx:ring, w:w, deckelVorn:(deckel>=0)?front[deckel]:false};
    });
    if(ringe.some(r=>!r)) ringe=null;
  }
  return {V,PR,front,edges,nrms,komplex,ringe,umriss,mantelFuell,mantelFlaechen};
}
function solidSpec(S,mode,VW){
  VW=VW||CAB;
  const F=modeFlags(mode);
  const spec={fills:[],paths:[],ellipses:[],ticks:[],chevrons:[],rightAngles:[],arcs:[],labels:[],dots:[]};
  if(S.id==='kugel'){
    const r=1;
    if(VW.grid) addGrid(spec,S,VW,{N:2,H:2,z0:-r});
    spec.fillEllipse={c:[0,0],rx:r,ry:r,color:opaqueNow(VW)?'#e7f5e9':CLR.fill};
    spec.ellipses.push({c:[0,0],rx:r,ry:r,color:CLR.ink,width:2.2});
    // Äquator: berührt die Silhouette genau an ihren beiden seitlichen Punkten.
    // Er wird immer ganz gezeichnet - vorne durchgezogen, hinten gestrichelt.
    if(VW.drei) return spec;                     // Dreitafel: nur der Umriss
    /* Der Äquator wird genau so gezeichnet, wie er aus der aktuellen Richtung
       aussieht: Je flacher man auf die Äquatorebene schaut, desto schmaler wird
       die Ellipse - bis sie beim Blick genau in die Ebene zur Strecke wird und
       vordere und hintere Hälfte die Seiten tauschen. Eine frühere Fassung hielt
       eine Mindestneigung ein; dadurch blieb die Ellipse ab einem gewissen Punkt
       gleich breit und sprang beim Durchgang durch die Waagerechte um. */
    const VWq=VW;
    const eqPt=t=>VW.cab?[r*Math.cos(t),KOB*r*Math.sin(t)]:VWq.proj([r*Math.cos(t),r*Math.sin(t),0]);
    /* Der Äquator wird in zusammenhängende Stücke zerlegt: Wo er hinter der Kugel
       verschwindet, beginnt ein neues Stück. Würde man einfach alle vorderen bzw.
       alle hinteren Punkte in je einen Linienzug packen, entstünde beim Sprung von
       einem Bogenende zum anderen eine gerade Linie quer durch die Kugel - die sah
       aus wie ein eingezeichneter Durchmesser. */
    const stuecke=[];
    let akt=null, letzterPunkt=null;
    for(let k=0;k<=64;k++){ const t=-Math.PI+k/64*2*Math.PI;
      const q=[Math.cos(t),Math.sin(t),0];
      const vorne=VW.cab? (Math.sin(t)<=0) : (V3.dot(q,VWq.dir)<0);
      const punkt=eqPt(t);
      if(!akt||akt.vorne!==vorne){
        akt={vorne:vorne, pts:[]};
        if(letzterPunkt) akt.pts.push(letzterPunkt);   // ohne Lücke am Übergang
        stuecke.push(akt);
      }
      akt.pts.push(punkt); letzterPunkt=punkt;
    }
    /* Anfang und Ende gehören zusammen, wenn beide auf derselben Seite liegen */
    if(stuecke.length>1 && stuecke[0].vorne===stuecke[stuecke.length-1].vorne){
      stuecke[stuecke.length-1].pts=stuecke[stuecke.length-1].pts.concat(stuecke[0].pts);
      stuecke.shift();
    }
    stuecke.filter(x=>!x.vorne).forEach(x=>{ if(x.pts.length>1)
      spec.paths.push({pts:x.pts,color:CLR.hidden,width:1.4,dashed:true}); });
    stuecke.filter(x=>x.vorne).forEach(x=>{ if(x.pts.length>1)
      spec.paths.push({pts:x.pts,color:CLR.ink,width:1.6}); });
    if(F.marks){ const c=F.col?LEN_COLORS[0]:CLR.mark;
      const e=eqPt(-0.9);        // fester Punkt auf dem Äquator: dreht sich mit
      spec.dots.push({at:[0,0],color:c,r:3});
      spec.paths.push({pts:[[0,0],e],color:c,width:2.2});
      if(F.letters) spec.labels.push({text:'r',at:mul2(e,0.55),dy:-11,color:c,bold:true});
      else spec.ticks.push({a:[0,0],b:e,n:1,color:c}); }
    return spec;
  }
  const G=solidGeom(S,VW), V=G.V, PR=G.PR, front=G.front, edges=G.edges;
  const V0=S.V;
  addBounds(spec,S,VW,V);
  if(VW.grid) addGrid(spec,S,VW);
  const op=opaqueNow(VW);
  if(G.komplex){
    /* nach Tiefe sortiert fuellen, sonst decken hintere Flaechen vordere zu */
    /* VW.dir zeigt vom Betrachter weg: groesserer Wert = weiter hinten, also zuerst */
    /* Gefüllt wird dreiecksweise, nicht flächenweise: Beim Tordieren sind die
       Seitenflächen verdrehte Vierecke, deren vier Ecken nicht in einer Ebene
       liegen. Ob so ein Viereck "zum Betrachter zeigt", lässt sich gar nicht
       für das ganze Viereck beantworten - eine Hälfte kann zugewandt sein und
       die andere abgewandt. Über die mittlere Normale gerechnet blieb dann am
       Umriss ein schmaler Streifen des Körpers ungefüllt. */
    const teile=[];
    /* Bei einem verdrehten Körper ist der zugewandte Teil der gewölbten
       Seitenflächen schon ausgerechnet (er endet genau am Umriss). */
    const eigen=new Set(G.mantelFlaechen||[]);
    (G.mantelFuell||[]).forEach(q=>teile.push(q));
    S.F.forEach((f,i)=>{
      if(eigen.has(i)) return;
      faceTris(G.V,f.idx,G.nrms[i]).forEach(idx=>{
        const P=idx.map(k=>G.V[k]);
        let nn=V3.cross(V3.sub(P[1],P[0]), V3.sub(P[2],P[0]));
        if(V3.len(nn)<1e-12) return;
        nn=V3.norm(nn);
        if(V3.dot(nn,G.nrms[i])<0) nn=V3.mul(nn,-1);       // nach aussen drehen
        if(!(VW.dir? V3.dot(nn,VW.dir)<-1e-12 : front[i])) return;
        teile.push(idx.map(k=>PR[k]));
      });
    });
    if(teile.length) spec.fills.push({polys:teile,color:op?'#e7f5e9':CLR.fill});
  }
  else spec.fills.push({pts:hull2D(PR),color:op?'#e7f5e9':CLR.fill});
  // Runde Körper: Ringkanten zu durchgehenden Zügen verbinden — sonst ist die
  // Strichelung auf 48 winzigen Einzelkanten nicht zu sehen
  const skip={};
  if(S.round&&S.n){
    const n=S.n, rings=[range(n)];
    if(S.apex==null) rings.push(range(n).map(i=>V.length-n+i));
    rings.forEach((ring,ri)=>{
      const hid=[];
      for(let i=0;i<n;i++){ const a=ring[i], b=ring[(i+1)%n];
        const k=Math.min(a,b)+'_'+Math.max(a,b);
        const e=edges.filter(x=>(Math.min(x.a,x.b)+'_'+Math.max(x.a,x.b))===k)[0];
        hid.push(e?e.hidden:null); if(e) skip[k]=1; }
      /* Wenn der Umriss ausgerechnet werden konnte (G.ringe), wird der Kreis
         genau dort geteilt und nicht erst an der nächsten Ecke. */
      const R=G.ringe&&G.ringe[ri];
      if(R){
        const w=R.w, vorn=R.deckelVorn;
        const folge=[];                       // Punkt + Zustand des folgenden Stücks
        for(let i=0;i<n;i++){
          const j=(i+1)%n, a=PR[ring[i]], b=PR[ring[j]];
          folge.push({p:a, h:!vorn&&w[i]>0});
          if(!vorn && (w[i]>0)!==(w[j]>0) && w[i]!==w[j]){
            const t=w[i]/(w[i]-w[j]);
            if(t>1e-6&&t<1-1e-6)
              folge.push({p:[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t], h:!vorn&&w[j]>0});
          }
        }
        const m=folge.length;
        let s0=0; while(s0<m&&folge[s0].h===folge[(s0-1+m)%m].h) s0++;
        if(s0>=m) s0=0;
        let k2=0;
        while(k2<m){
          const h=folge[(s0+k2)%m].h, pts=[folge[(s0+k2)%m].p];
          while(k2<m&&folge[(s0+k2)%m].h===h){ pts.push(folge[(s0+k2+1)%m].p); k2++; }
          if(h&&!((VW.cab||VW.drei)||showHidden())) continue;
          spec.paths.push({pts:pts,color:h?CLR.hidden:CLR.ink,width:h?1.4:2.1,dashed:!!h});
        }
        return;
      }
      let st=0; while(st<n&&hid[st]===hid[(st-1+n)%n]) st++;   // Anfang eines Laufs
      if(st>=n) st=0;
      let i=0;
      while(i<n){
        const j=(st+i)%n, h=hid[j];
        const pts=[PR[ring[j]]]; let len=0;
        while(i<n&&hid[(st+i)%n]===h){ const q=(st+i)%n; pts.push(PR[ring[(q+1)%n]]); i++; len++; }
        if(h===null) continue;
        if(h&&!((VW.cab||VW.drei)||showHidden())) continue;
        spec.paths.push({pts:pts,color:h?CLR.hidden:CLR.ink,width:h?1.4:2.1,dashed:!!h});
      }
    });
    /* Die Mantellinien am Umriss gehören an dieselbe Stelle wie der Wechsel auf
       dem Kreis. Als Kante zwischen zwei Ecken des 48-Ecks endeten sie bis zu
       einer halben Ecke daneben - und weil der Kreis dort fast parallel zur
       Mantellinie läuft, klaffte genau am Umriss eine Lücke. Deshalb werden sie
       hier durch Linien an der ausgerechneten Stelle ersetzt. */
    const R0=G.ringe&&G.ringe[0];
    if(R0){
      const w=R0.w, unten=rings[0], oben=(S.apex==null)?rings[1]:null;
      edges.forEach(e=>{ if(e.f.length===2 && S.F[e.f[0]].grp==='side' && S.F[e.f[1]].grp==='side')
        skip[Math.min(e.a,e.b)+'_'+Math.max(e.a,e.b)]=1; });
      for(let i=0;i<n;i++){
        const j=(i+1)%n;
        if((w[i]>0)===(w[j]>0) || Math.abs(w[i]-w[j])<1e-12) continue;
        const t=w[i]/(w[i]-w[j]);
        const misch=(a,b)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
        const p0=misch(PR[unten[i]],PR[unten[j]]);
        const p1=oben? misch(PR[oben[i]],PR[oben[j]]) : PR[S.apex];
        spec.paths.push({pts:[p0,p1],color:CLR.ink,width:2.1});
      }
    }
  }
  // verdeckte Kanten zuerst, damit sichtbare sie überdecken
  const hid=(VW.cab||VW.drei)?true:showHidden();
  /* Umriss der gewölbten Seitenflächen eines verdrehten Körpers */
  (G.umriss||[]).slice().sort((x,y)=>(y.hidden?1:0)-(x.hidden?1:0)).forEach(t=>{
    if(t.hidden&&!hid) return;
    spec.paths.push({pts:t.pts,color:t.hidden?CLR.hidden:CLR.ink,
      width:t.hidden?1.4:2.1,dashed:t.hidden}); });
  edges.slice().sort((x,y)=>(y.hidden?1:0)-(x.hidden?1:0)).forEach(e=>{
    if(skip[Math.min(e.a,e.b)+'_'+Math.max(e.a,e.b)]) return;
    if(e.teile){                       // verdrehte Körper: abschnittsweise gezeichnet
      e.teile.forEach(t=>{ if(t.hidden&&!hid) return;
        spec.paths.push({pts:t.pts,color:t.hidden?CLR.hidden:CLR.ink,
          width:t.hidden?1.4:2.1,dashed:t.hidden}); });
      return;
    }
    if(e.hidden&&!hid) return;
    spec.paths.push({pts:[PR[e.a],PR[e.b]],color:e.hidden?CLR.hidden:CLR.ink,
      width:e.hidden?1.4:2.1,dashed:e.hidden}); });

  const cenP=[0,0]; PR.forEach(p=>{cenP[0]+=p[0]/PR.length;cenP[1]+=p[1]/PR.length;});
  if(!S.round&&(F.tick||F.letters)){
    const L=edges.map(e=>V3.len(V3.sub(V0[e.a],V0[e.b])));
    const gr=groupIdx(L,0.03);
    if(F.tick){
      const cnt={}; gr.g.forEach(k=>cnt[k]=(cnt[k]||0)+1);
      let gi=0; const num={}, used={};
      const many=edges.length>12;                     // bei vielen Kanten nur einige markieren
      gr.g.forEach((k,i)=>{ if(cnt[k]<2) return; if(num[k]==null) num[k]=++gi;
        if(edges[i].hidden&&!hid) return;        // ohne verdeckte Kanten auch keine Striche darauf
        if(many){ if(edges[i].hidden) return; used[k]=(used[k]||0)+1; if(used[k]>4) return; }
        const c=F.col?LEN_COLORS[(num[k]-1)%LEN_COLORS.length]:CLR.mark;
        spec.ticks.push({a:PR[edges[i].a],b:PR[edges[i].b],n:num[k],color:c}); });
    }
    if(F.letters){
      const vis=edges.map((e,i)=>i).filter(i=>!edges[i].hidden);
      let show=vis;
      if(vis.length>14){ const seen={}; show=vis.filter(i=>{ if(seen[gr.g[i]])return false; seen[gr.g[i]]=1; return true; }); }
      show.forEach(i=>{ const e=edges[i], a=PR[e.a], b=PR[e.b];
        const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
        let d=nrm2(sub2(b,a)), nw=[-d[1],d[0]];
        if((m[0]+nw[0]-cenP[0])*nw[0]+(m[1]+nw[1]-cenP[1])*nw[1]<0) nw=mul2(nw,-1);
        const c=F.col?LEN_COLORS[gr.g[i]%LEN_COLORS.length]:'#3a4a3c';
        if(F.col) spec.paths.push({pts:[a,b],color:c,width:3.2});
        spec.labels.push({text:SIDE_LETTERS[gr.g[i]%SIDE_LETTERS.length],at:m,
          dx:nw[0]*13,dy:-nw[1]*13,color:c,bold:true,size:12.5}); });
    }
    if(F.marks&&VW.cab&&!S.skew&&!S.twist&&S.n&&S.apex==null&&!S.platon){
      const n=S.n; let i0=0;
      for(let i=1;i<n;i++) if(PR[i][0]<PR[i0][0]-1e-9||(Math.abs(PR[i][0]-PR[i0][0])<1e-9&&PR[i][1]<PR[i0][1])) i0=i;
      const cand=[(i0+1)%n,(i0-1+n)%n].sort((a,b)=>PR[b][0]-PR[a][0]);
      const dBase=nrm2(sub2(PR[cand[0]],PR[i0])), dUp=nrm2(sub2(PR[i0+n],PR[i0]));
      spec.rightAngles.push({at:PR[i0],d1:dBase,d2:dUp});
    }
  }
  if(S.round&&F.marks){
    const nb=S.n||S.baseN||0;
    const c1=F.col?LEN_COLORS[0]:CLR.mark, c2=F.col?LEN_COLORS[1]:CLR.mark;
    const ctr=ring=>{ const c=[0,0]; for(let i=0;i<nb;i++){ c[0]+=PR[ring+i][0]/nb; c[1]+=PR[ring+i][1]/nb; } return c; };
    const rightMost=ring=>PR[ring];        // fester Punkt des Körpers: dreht sich mit
    const c0=ctr(0), b0=rightMost(0);
    spec.dots.push({at:c0,color:c1,r:2.8});
    spec.paths.push({pts:[c0,b0],color:c1,width:2.2});
    if(F.letters) spec.labels.push({text:'r',at:[(c0[0]+b0[0])/2,(c0[1]+b0[1])/2],dy:-11,color:c1,bold:true});
    else spec.ticks.push({a:c0,b:b0,n:1,color:c1});
    let top=null;
    if(S.apex!=null) top=PR[S.apex];
    else { top=ctr(PR.length-nb);
      const b1=rightMost(PR.length-nb);
      spec.dots.push({at:top,color:c1,r:2.8});
      spec.paths.push({pts:[top,b1],color:c1,width:2.2});
      if(F.letters) spec.labels.push({text:'r',at:[(top[0]+b1[0])/2,(top[1]+b1[1])/2],dy:-11,color:c1,bold:true});
      else spec.ticks.push({a:top,b:b1,n:1,color:c1});      // gleicher Maßstrich = gleich lang
    }
    if(top){
      spec.paths.push({pts:[c0,top],color:c2,width:1.8,dashed:true});
      if(F.letters) spec.labels.push({text:'h',at:[(c0[0]+top[0])/2,(c0[1]+top[1])/2],dx:11,color:c2,bold:true});
      if(!S.skew){                                          // Höhe steht senkrecht auf der Grundfläche
        spec.rightAngles.push({at:c0,d1:nrm2(sub2(b0,c0)),d2:nrm2(sub2(top,c0))});
      }
    }
  }
  /* ─── Schnitt mit einer Ebene parallel zur Grundfläche ────────────────────
     Zeigt, dass ein Prisma auf jeder Höhe dieselbe (deckungsgleiche) Fläche
     hat, eine Pyramide dagegen eine verkleinerte. Gezeichnet wird zuletzt,
     also über dem Körper - die Schnittfläche liegt ja IM Körper und wäre
     sonst nicht zu sehen. */
  if(S.schnitt!=null){
    const R=schnittRand(S,V,S.schnitt);
    if(R && R.length>2){
      const Q=R.map(VW.proj);
      spec.paths.push({pts:Q,closed:true,fill:'rgba(122,92,176,.22)',color:'#7a5cb0',width:2.4});
    }
  }
  return spec;
}
/* Rand der Schnittfläche auf der relativen Höhe t (0 = Grundfläche, 1 = oben).
   Der Körper ist aus waagerechten Schichten aufgebaut; dazwischen wird linear
   fortgesetzt - genau das ist der Schnitt mit einer waagerechten Ebene. Eine
   gerade Pyramide hat statt der Schichten nur Grundfläche und Spitze. */
function schnittRand(S,V,t){
  const n=S.n; if(!n||!V||V.length<n+1) return null;
  const u=Math.max(0,Math.min(1,t));
  const misch=(a,b,f)=>[a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
  if(S.apex!=null && V.length===n+1)                       // Pyramide/Kegel ohne Torsion
    return range(n).map(i=>misch(V[i],V[S.apex],u));
  if(V.length%n) return null;
  const L=V.length/n, x=u*(L-1), k=Math.min(L-2,Math.floor(x)), f=x-k;
  return range(n).map(i=>misch(V[k*n+i],V[(k+1)*n+i],f));
}

/* Gleiche Größe in allen Körperansichten: der Umkreis der Umkugel bestimmt den
   Bildausschnitt — dadurch springt beim Drehen und beim Wechsel der Ansicht nichts. */
function addBounds(spec,S,VW,V){
  if(VW.drei) return;
  const c=cen3(V||S.V); let R=0;
  (V||S.V).forEach(p=>{ R=Math.max(R,V3.len(V3.sub(p,c))); });
  if(!R) return;
  const q=VW.proj(c); R*=1.05/(VW.zoom||1);
  spec.bounds=[[q[0]-R,q[1]-R],[q[0]+R,q[1]+R]];
}
/* Koordinatenebenen als Raster hinter dem Körper (3D-Ansicht) */
function addGrid(spec,S,VW,opt){
  const V=(S.V&&S.V.length)?S.V:[[0,0,0]];
  let mx=1,mz=1;
  V.forEach(p=>{ mx=Math.max(mx,Math.abs(p[0]),Math.abs(p[1])); mz=Math.max(mz,p[2]); });
  const N=(opt&&opt.N)||Math.ceil(mx+0.6), H=(opt&&opt.H)||Math.ceil(mz+0.4);
  const z0=(opt&&opt.z0)||0;
  /* Rasterweite: im Erkundungsmodus dieselbe wie in der Grundflaeche (VW.gridStep),
     sonst wie bisher ganze Einheiten. */
  const w0=(VW&&VW.gridStep)||1;
  const schritt=Math.max(0.25,Math.min(2,w0));
  spec.bg=spec.bg||[];
  spec.fg=spec.fg||[];
  /* VW.dir zeigt vom Betrachter weg. Ist dir[2] positiv, liegt der Betrachter
     unter der Grundebene - dann liegt die Grundebene zwischen ihm und dem
     Koerper, das Raster gehoert also VOR den Koerper und nicht dahinter.
     Sonst saehe man von unten gar kein Raster mehr. */
  const vonUnten = !!(VW.dir && VW.dir[2] > 0);
  const line=(a,b,col,w)=>spec.bg.push({pts:[VW.proj(a),VW.proj(b)],color:col,width:w});
  const boden=(a,b,col,w)=>(vonUnten?spec.fg:spec.bg).push({pts:[VW.proj(a),VW.proj(b)],color:col,width:w});
  const light='#e6ece7', strong='#d3ded4';
  for(let i=-N;i<=N+1e-9;i+=schritt){                        // Grundebene
    const haupt=Math.abs(i)<1e-9;
    boden([i,-N,z0],[i,N,z0], haupt?strong:light, haupt?1.4:1);
    boden([-N,i,z0],[N,i,z0], haupt?strong:light, haupt?1.4:1);
  }
  const sx=(VW.dir[0]>0?1:-1)*N, sy=(VW.dir[1]>0?1:-1)*N;    // die beiden hinteren Wände
  for(let i=-N;i<=N+1e-9;i+=schritt) line([i,sy,z0],[i,sy,z0+H],light,1);
  for(let k=0;k<=H+1e-9;k+=schritt)  line([-N,sy,z0+k],[N,sy,z0+k],light,1);
  for(let i=-N;i<=N+1e-9;i+=schritt) line([sx,i,z0],[sx,i,z0+H],light,1);
  for(let k=0;k<=H+1e-9;k+=schritt)  line([sx,-N,z0+k],[sx,N,z0+k],light,1);
}

/* --- Netz (Abwicklung) -------------------------------------------------- */
function polyOverlap(A,B){
  const shrink=P=>{ const c=centroid2(P); return P.map(p=>[c[0]+(p[0]-c[0])*0.94,c[1]+(p[1]-c[1])*0.94]); };
  const a=shrink(A), b=shrink(B);
  for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)
    if(segX(a[i],a[(i+1)%a.length],b[j],b[(j+1)%b.length])) return true;
  const inside=(p,P)=>{ let c=false;
    for(let i=0,j=P.length-1;i<P.length;j=i++)
      if(((P[i][1]>p[1])!==(P[j][1]>p[1]))&&(p[0]<(P[j][0]-P[i][0])*(p[1]-P[i][1])/(P[j][1]-P[i][1])+P[i][0])) c=!c;
    return c; };
  return inside(centroid2(a),b)||inside(centroid2(b),a);
}
/* eine Fläche so in die Ebene legen, dass Kante (ia,ib) auf A2->B2 fällt */
function placeFace(V,idx,ia,ib,A2,B2){
  const o=V[ia], ex=V3.norm(V3.sub(V[ib],o));
  let nr=faceNormal(idx.map(i=>V[i]));
  const ey=V3.norm(V3.cross(nr,ex));
  const L=V3.len(V3.sub(V[ib],o))||1;
  const ux=[(B2[0]-A2[0])/L,(B2[1]-A2[1])/L], uy=[-ux[1],ux[0]];
  return sgn=>idx.map(i=>{ const d=V3.sub(V[i],o);
    const x=V3.dot(d,ex), y=V3.dot(d,ey)*sgn;
    return [A2[0]+ux[0]*x+uy[0]*y, A2[1]+ux[1]*x+uy[1]*y]; });
}
function unfold(S){
  const V=S.V, F=S.F, N=F.length;
  const em=new Map();
  F.forEach((f,fi)=>{ const ix=f.idx;
    for(let i=0;i<ix.length;i++){ const a=ix[i], b=ix[(i+1)%ix.length];
      const k=Math.min(a,b)+'_'+Math.max(a,b);
      if(!em.has(k)) em.set(k,[]); em.get(k).push(fi); } });
  let f0=0, best=1e9;
  F.forEach((f,i)=>{ const c=cen3(f.idx.map(k=>V[k])); if(c[2]<best){best=c[2];f0=i;} });
  let bestRes=null;
  const R=rngFrom(1234+N*37);
  let done=0;

    const pos=new Array(N).fill(null);
    const idx0=F[f0].idx;
    pos[f0]=placeFace(V,idx0,idx0[0],idx0[1],[0,0],[V3.len(V3.sub(V[idx0[1]],V[idx0[0]])),0])(1);
    let placed=1, guard=0;

      // alle möglichen Anlegestellen sammeln
      const cands=[];
      for(let g=0;g<N;g++){ if(!pos[g])continue; const ig=F[g].idx;
        for(let i=0;i<ig.length;i++){
          const a=ig[i], b=ig[(i+1)%ig.length];
          const nb=(em.get(Math.min(a,b)+'_'+Math.max(a,b))||[]).filter(x=>x!==g);
          nb.forEach(h=>{ if(!pos[h]) cands.push({g:g,h:h,i:i,a:a,b:b}); });
        } }
      if(!cands.length) break;
      // zufällige Reihenfolge, erste überschneidungsfreie Platzierung nehmen
      for(let i=cands.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); const t=cands[i];cands[i]=cands[j];cands[j]=t; }
      let ok=false;
      for(const c of cands){
        if(pos[c.h]) continue;
        const ig=F[c.g].idx;
        const A2=pos[c.g][c.i], B2=pos[c.g][(c.i+1)%ig.length];
        const mk=placeFace(V,F[c.h].idx,c.a,c.b,A2,B2);
        const side=P=>{ const q=centroid2(P), d=[B2[0]-A2[0],B2[1]-A2[1]];
          return Math.sign(d[0]*(q[1]-A2[1])-d[1]*(q[0]-A2[0])); };
        let cand=mk(1); if(side(cand)===side(pos[c.g])) cand=mk(-1);
        let bad=false;
        for(let j=0;j<N;j++) if(pos[j]&&polyOverlap(cand,pos[j])){ bad=true; break; }
        if(bad) continue;
        pos[c.h]=cand; placed++; ok=true; break;
      }
      if(!ok) break;
    }
    let ext=0;
    if(placed===N){ const P=[]; pos.forEach(q=>q&&q.forEach(x=>P.push(x)));
      ext=Math.max(Math.max.apply(null,P.map(x=>x[0]))-Math.min.apply(null,P.map(x=>x[0])),
                   Math.max.apply(null,P.map(x=>x[1]))-Math.min.apply(null,P.map(x=>x[1]))); }
    const res={pos:pos,placed:placed,complete:placed===N,ext:ext};
    if(res.complete) done++;

  }

  bestRes.pos.forEach((p,i)=>{ if(p) faces.push({pts:p,idx:F[i].idx}); });

}

        spec.paths.push({pts:[[0,0],[0,h]],color:c2,width:2.4});

          spec.paths.push({pts:[[w/2,o2[0]],[w/2+r,o2[0]]],color:c1,width:2});
          if(F.letters) spec.labels.push({text:'r',at:[w/2+r/2,o2[0]],dy:-11,color:c1,bold:true});

      if(F.marks){
        const c1=F.col?LEN_COLORS[0]:'#3a4a3c', c2=F.col?LEN_COLORS[1]:'#3a4a3c';
        const e1=[sl*Math.cos(-Math.PI/2-ang/2),sl*Math.sin(-Math.PI/2-ang/2)];
        spec.paths.push({pts:[[0,0],e1],color:c2,width:2.2});
        spec.dots.push({at:[mid[0],mid[1]-r],color:c1,r:2.6});
        spec.paths.push({pts:[[mid[0],mid[1]-r],[mid[0]+r,mid[1]-r]],color:c1,width:2});
        if(F.letters){

          spec.labels.push({text:'r',at:[mid[0]+r/2,mid[1]-r],dy:-11,color:c1,bold:true});

    const A=[f(p[0]),f(p[1])], B=[f(q[0]),f(q[1])];

  const cnt={};
  U.faces.forEach(f=>f.pts.forEach((p,i)=>{ const k=key(p,f.pts[(i+1)%f.pts.length]); cnt[k]=(cnt[k]||0)+1; }));

  gr.g.forEach(k=>{ if(grNum[k]==null&&grCnt[k]>1) grNum[k]=++gn; });
  let n=0; const seen={};
  U.faces.forEach(f=>f.pts.forEach((p,i)=>{
    const q=f.pts[(i+1)%f.pts.length], k=key(p,q), fold=cnt[k]>1, gi=gr.g[n]; n++;
    if(fold){ if(seen[k]) return; seen[k]=1;
      spec.paths.push({pts:[p,q],color:'#9db3a0',width:1.3,dashed:true}); return; }
    const c=F.col?LEN_COLORS[gi%LEN_COLORS.length]:CLR.ink;
    spec.paths.push({pts:[p,q],color:c,width:F.col?2.8:2.1});
    if(F.tick&&grCnt[gi]>1) spec.ticks.push({a:p,b:q,n:(grNum[gi]||1),color:CLR.mark});
    if(F.letters){

      spec.labels.push({text:SIDE_LETTERS[gi%SIDE_LETTERS.length],at:m,dx:nw[0]*12,dy:-nw[1]*12,

/* In der Dreitafel fällt manches Maß auf einen Punkt zusammen - die Höhe
   eines Zylinders ist von oben nicht zu sehen. Solche Beschriftungen und
   Maßstriche gehören dort nicht hin, ebenso wenig zwei gleiche Beschriftungen
   an derselben Stelle. */
function dreiEntrümpeln(spec){
  const lab=spec.labels||[], tk=spec.ticks||[];
  if(!lab.length && !tk.length) return spec;
  /* Maßstab: die Diagonale des Bildausschnitts dieser Ansicht */
  const P=[];
  (spec.paths||[]).forEach(g=>(g.pts||[]).forEach(q=>P.push(q)));
  (spec.fills||[]).forEach(f=>(f.polys||[f.pts]).forEach(q=>q&&q.forEach(r=>P.push(r))));
  if(P.length<2) return spec;
  const xs=P.map(q=>q[0]), ys=P.map(q=>q[1]);
  const d=Math.hypot(Math.max.apply(null,xs)-Math.min.apply(null,xs),
                     Math.max.apply(null,ys)-Math.min.apply(null,ys))||1;
  const winzig=d*0.04, nah=d*0.07;
  const punkte=(spec.paths||[]).filter(g=>g.pts&&g.pts.length===2
      && Math.hypot(g.pts[1][0]-g.pts[0][0], g.pts[1][1]-g.pts[0][1])<winzig)
    .map(g=>[(g.pts[0][0]+g.pts[1][0])/2,(g.pts[0][1]+g.pts[1][1])/2]);
  const gesehen=[];
  const labNeu=lab.filter(l=>{
    if(!l.at) return true;
    if(punkte.some(q=>Math.hypot(q[0]-l.at[0],q[1]-l.at[1])<nah)) return false;
    if(gesehen.some(x=>x.text===l.text && Math.hypot(x.at[0]-l.at[0],x.at[1]-l.at[1])<nah)) return false;
    gesehen.push(l); return true;
  });
  const tkNeu=tk.filter(t=>t.a&&t.b&&Math.hypot(t.b[0]-t.a[0],t.b[1]-t.a[1])>=winzig);
  return Object.assign({},spec,{labels:labNeu,ticks:tkNeu});
}

/* --- Dreitafelprojektion ------------------------------------------------ */
function dreiSVG(S,mode,opt){
  const o=Object.assign({w:340,h:280,pad:10,cls:'fig'},opt||{});
  o.h=Math.max(o.h,Math.round(o.w*0.94));         // fast quadratisch: nutzt beide Hälften des Kreuzes
  const views=[{v:V_FRONT,t:T('Vorderansicht','Front view')},{v:V_SIDE,t:T('Seitenansicht','Side view')},{v:V_TOP,t:T('Draufsicht','Top view')}];
  const sp=views.map(x=>dreiEntrümpeln(solidSpec(S,mode,x.v)));
  const bb=sp.map(spec=>{ const P=[];
    (spec.fills||[]).forEach(f=>(f.polys||[f.pts]).forEach(q=>q&&q.forEach(p=>P.push(p))));
    (spec.paths||[]).forEach(g=>g.pts.forEach(p=>P.push(p)));
    (spec.ellipses||[]).forEach(e=>{P.push([e.c[0]-e.rx,e.c[1]-e.ry]);P.push([e.c[0]+e.rx,e.c[1]+e.ry]);});
    if(spec.fillEllipse){const e=spec.fillEllipse;P.push([e.c[0]-e.rx,e.c[1]-e.ry]);P.push([e.c[0]+e.rx,e.c[1]+e.ry]);}
    if(!P.length)P.push([0,0],[1,1]);
    return {x0:Math.min.apply(null,P.map(p=>p[0])),x1:Math.max.apply(null,P.map(p=>p[0])),
            y0:Math.min.apply(null,P.map(p=>p[1])),y1:Math.max.apply(null,P.map(p=>p[1]))}; });
  const wF=bb[0].x1-bb[0].x0||1, hF=bb[0].y1-bb[0].y0||1;
  const wS=bb[1].x1-bb[1].x0||1, hT=bb[2].y1-bb[2].y0||1;
  const lab=(mode==='plain')?15:23, gap=42;                            // Luft rund um das Mittelkreuz
  const availW=o.w-2*o.pad-gap, availH=o.h-2*o.pad-gap-2*lab;
  const sc=Math.min(availW/(wF+wS), availH/(hF+hT))*(mode==='plain'?1:0.9);
  const blockW=(wF+wS)*sc+gap, blockH=(hF+hT)*sc+gap+2*lab;
  const left=(o.w-blockW)/2, top=(o.h-blockH)/2;
  const xm=left+wF*sc+gap/2;                       // senkrechte Rissachse
  const ym=top+lab+hF*sc+gap/2;                    // waagerechte Rissachse
  let out='<svg class="'+o.cls+'" viewBox="0 0 '+o.w+' '+o.h+'" width="'+o.w+'" height="'+o.h+
    '" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img">';
  out+='<line x1="'+xm.toFixed(1)+'" y1="2" x2="'+xm.toFixed(1)+'" y2="'+(o.h-2)+
    '" stroke="#b9c4ba" stroke-width="1.2"/>';
  out+='<line x1="2" y1="'+ym.toFixed(1)+'" x2="'+(o.w-2)+'" y2="'+ym.toFixed(1)+
    '" stroke="#b9c4ba" stroke-width="1.2"/>';
  const spots=[[xm-gap/2-wF*sc, ym-gap/2],[xm+gap/2, ym-gap/2],[xm-gap/2-wF*sc, ym+gap/2+hT*sc]];
  const Mk=(i,ox,oy)=>p=>[ox+(p[0]-bb[i].x0)*sc, oy-(p[1]-bb[i].y0)*sc];
  sp.forEach((spec,i)=>{ out+=drawBody(spec,o,Mk(i,spots[i][0],spots[i][1]),sc,true); });
  /* Die Namen der Ansichten stehen in den äußeren Ecken - so laufen sie nie
     über das Mittelkreuz. */
  const rand=5;
  const cap=(x,y,t,anker)=>'<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+
      '" font-size="10.5" fill="#5b6b60" text-anchor="'+anker+
      '" font-family="Calibri,\'Segoe UI\',sans-serif">'+t+'</text>';
  out+=cap(rand,       rand+9,     T('Vorderansicht','Front view'), 'start');
  out+=cap(o.w-rand,   rand+9,     T('Seitenansicht','Side view'),  'end');
  out+=cap(rand,       o.h-rand,   T('Draufsicht','Top view'),      'start');
  return out+'</svg>';
}
/* Mittelpunkt und Radius eines Körpers (für Kamera und Bildausschnitt) */
function bodyCenter(fig){
  if(fig.id==='kugel') return [0,0,0];
  return cen3(fig.V||[[0,0,0]]);
}
function bodyRadius(fig){
  if(fig.id==='kugel') return 1;
  const c=bodyCenter(fig); let R=0;
  (fig.V||[]).forEach(p=>{ R=Math.max(R,V3.len(V3.sub(p,c))); });
  return R||1;
}
/* Warum es kein Netz gibt — als kleiner grauer Hinweis unten im Bild */
function netNote(fig){
  if(EN()){
    if(fig.id==='kugel') return ['This solid cannot be unfolded into the plane —','so here is the oblique view.'];
    if(fig.twist) return ['Twisted solids have no flat net —','so here is the oblique view.'];
    if(fig.round&&fig.skew) return ['Oblique round solids have no flat net —','so here is the oblique view.'];
    return ['No non-overlapping net can be drawn for this solid —','so here is the oblique view.'];
  }
  if(fig.id==='kugel') return ['Dieser Körper lässt sich nicht in die Ebene abwickeln —','deshalb hier das Schrägbild.'];
  if(fig.twist) return ['Tordierte Körper haben kein ebenes Netz —','deshalb hier das Schrägbild.'];
  if(fig.round&&fig.skew) return ['Schiefe runde Körper haben kein ebenes Netz —','deshalb hier das Schrägbild.'];
  return ['Für diesen Körper lässt sich kein überschneidungsfreies','Netz zeichnen — deshalb hier das Schrägbild.'];
}
function withNote(svg,lines,opt){
  if(!lines||!lines.length) return svg;
  const o=Object.assign({w:300,h:230},opt||{});
  let t='';
  lines.forEach((ln,i)=>{ t+='<text x="'+(o.w/2)+'" y="'+(o.h-6-(lines.length-1-i)*10)+
    '" font-size="8.5" fill="#98a89b" text-anchor="middle" '+
    'font-family="Calibri,\'Segoe UI\',sans-serif">'+esc(ln)+'</text>'; });

}
function cabNow(opt){
  const t=(opt&&opt.trueCirc!=null)?opt.trueCirc:(typeof state!=='undefined'?state.trueCirc:false);
  return cabView(!t);

function figToSVG(fig,mode,opt){
  opt=opt||{};

    const vw=opt.view||(typeof state!=='undefined'?state.view:'schraeg');
    if(vw==='drei') return dreiSVG(fig,mode,opt);
    if(vw==='netz'){
      const sp=netSpec(fig,mode);
      if(sp) return drawSVG(sp,opt);
      // etwas Platz unten freihalten, damit der Hinweis nicht im Bild liegt
      const oo=Object.assign({},opt,{h:(opt.h||230)-20});
      let sv=drawSVG(solidSpec(fig,mode,cabNow(opt)),oo);
      sv=sv.replace('viewBox="0 0 '+oo.w+' '+oo.h+'"','viewBox="0 0 '+oo.w+' '+(oo.h+20)+'"')
           .replace('height="'+oo.h+'"','height="'+(oo.h+20)+'"');
      return withNote(sv,netNote(fig),{w:oo.w,h:oo.h+20});
    }
    const az=(opt.az!=null)?opt.az:((typeof state!=='undefined'&&state.az!=null)?state.az:-0.62);
    const el=(opt.el!=null)?opt.el:((typeof state!=='undefined'&&state.el!=null)?state.el:0.42);
    if(vw==='d3'){
      const off=bodyCenter(fig);
      const VW=view3D(az,el,off);
      const spec=solidSpec(fig,mode,VW);
      const cam=opt.cam;
      if(cam){
        const o=Object.assign({w:300,h:230,pad:16,stroke:CLR.ink,fill:CLR.fill,cls:'fig'},opt);
        const M=p=>[cam.ox+p[0]*cam.scale, cam.oy-p[1]*cam.scale];
        return marke3D('<svg class="'+o.cls+'" viewBox="0 0 '+o.w+' '+o.h+'" width="'+o.w+'" height="'+o.h+
          '" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img">'+
          drawBody(spec,o,M,cam.scale,true)+'</svg>', o.w);
      }
      return marke3D(drawSVG(spec,opt), (opt&&opt.w)||300);
    }
    const VW=cabNow(opt);
    if(opt.zoom) VW.zoom=opt.zoom;
    return drawSVG(solidSpec(fig,mode,VW),opt);

function deserialize(){
  const raw=(location.search&&location.search.length>1)?location.search
           :((location.hash&&location.hash.length>1)?'?'+location.hash.slice(1):'');
  const p=new URLSearchParams(raw);
  const g=(k,d)=>p.has(k)?p.get(k):d;
  state.mode=g('em','uebung')==='erkundung'?'erkundung':'uebung';
  FAMS_PAGE.forEach(f=>{ const k=P_LIST[f]; if(!p.has(k)) return;
    const ok=ALL_SUBS[f].concat(IS_F?[]:PLATON);
    state.subs[f]=p.get(k).split(',').filter(x=>ok.indexOf(x)>=0); });
  state.skew=g('ks','0')==='1'; state.twist=g('kt','0')==='1'; state.trueCirc=g('kc','0')==='1';
  const vw=g('vw','schraeg'); state.view=VIEWS.some(x=>x[0]===vw)?vw:'schraeg';
  if(p.has('va')) state.views=p.get('va').split(',').filter(x=>VIEWS.some(v=>v[0]===x));
  if(!state.views.length) state.views=['schraeg'];
  state.viewSwitch=g('vs','0')==='1';
  state.viewEach=g('ve','0')==='1';
  state.hiddenEdges=g('hk','0')==='1';
  state.eMarks=g('ek',IS_F?'1':'0')==='1'; state.eLen=g('el',IS_F?'1':'0')==='1';
  const bf=(x,d)=>{ const l=x.split(',').filter(y=>['unten','vorne','seite'].indexOf(y)>=0); return l.length?l:d; };
  state.basePr=bf(g('bp','unten,vorne,seite'),['unten','vorne','seite']);
  state.basePy=bf(g('by','unten'),['unten']);
  const df=g('df','normal');
  if(['einf','leicht','normal','schwer','indiv'].indexOf(df)>=0) state.diff=df;
  if(p.has('at')) state.types=p.get('at').split(',').filter(x=>TYPES.some(t=>t.id===x));
  if(!state.types.length) state.types=['bild2name'];
  state.ansText=g('ta','quiz')==='aufdecken'?'aufdecken':'quiz';
  state.ansBild=g('ba','quiz')==='bauen'?'bauen':'quiz';
  state.quizMode=g('qm','genau')==='alle'?'alle':'genau';
  const pr=g('pr','plain'); state.present=PRESENTS.some(x=>x[0]===pr)?pr:'plain';
  state.rotate=g('ro','1')!=='0';
  const no=parseInt(g('no','4'),10)||4;
  state.nOpts=N_OPTS.indexOf(no)>=0?no:4;
  const nt=parseInt(g('nt','0'),10)||0;
  state.nText=N_TEXT.indexOf(nt)>=0?nt:0;
  state.typenVonHand=g('th','0')==='1';
  state.darstVonHand=g('dh','0')==='1';
  state.lageVonHand=g('lh','0')==='1';
  state.trapIncl=g('ti','1')!=='0';
  state.triCombo=g('tc','0')==='1';
  state.hausShow=g('hs','1')!=='0';
  state.propsOff=p.has('po')?p.get('po').split(',').filter(Boolean):[];
  state.eShape=['dreieck','viereck','kreis'].indexOf(g('ef','viereck'))>=0?g('ef','viereck'):'viereck';
  state.eGrid=Math.max(0,Math.min(2,parseInt(g('eg','1'),10)||1));
  state.eSnap=g('es','1')!=='0';
  state.eEll=g('eb','achsen')==='brenn'?'brenn':'achsen';
}

let ANC={};
function buildAnc(){
  ANC={};
  const R=rngFrom(4242);
  ['dreieck','viereck','kreis'].forEach(fam=>{
    FAM[fam].precise.forEach(id=>{
      const f=genFlaeche(id,R,{trapIncl:state.trapIncl});
      ANC[id]=classify(f,1,state.trapIncl).tags;
    });
  });
  FAM.koerper.precise.forEach(id=>{ ANC[id]=new Set(SOLID_TAGS[id]); });
  // Sammelbegriffe (z. B. „gleichschenklig", „Dreieck"): alles, was ALLE ihre
  // genauen Vertreter gemeinsam haben
  for(const f in FAM){
    FAM[f].all.concat(FAM[f].subs).forEach(id=>{
      if(ANC[id]) return;
      const parts=FAM[f].precise.filter(p=>ANC[p]&&(p===id||ANC[p].has(id)));
      if(!parts.length){ ANC[id]=new Set([id]); return; }
      const s0=new Set(ANC[parts[0]]);
      parts.slice(1).forEach(p=>{ Array.from(s0).forEach(x=>{ if(!ANC[p].has(x)) s0.delete(x); }); });
      s0.add(id); ANC[id]=s0;
    });
  }
}

/* Klick vs. langer Klick */
function attachLong(node,onClick,onLong){
  let t=null,long=false,sx=0,sy=0;
  const clear=()=>{ if(t)clearTimeout(t); t=null; };
  on(node,'pointerdown',e=>{ if(e.button&&e.button!==0)return; long=false; sx=e.clientX; sy=e.clientY;
    clear(); t=setTimeout(()=>{ long=true; onLong&&onLong(); },450); });
  on(node,'pointermove',e=>{ if(t&&(Math.abs(e.clientX-sx)>9||Math.abs(e.clientY-sy)>9)) clear(); });
  /* Nur die linke Taste schaltet um - die rechte öffnet bloß das Menü. */
  on(node,'pointerup',e=>{ clear(); if(e.button&&e.button!==0) return; if(!long) onClick&&onClick(e); });
  on(node,'pointercancel',clear); on(node,'pointerleave',clear);
  on(node,'contextmenu',e=>{ e.preventDefault(); clear(); long=true; onLong&&onLong(); });
}
/* Popover */
let popEl=null,popBack=null;
function closePop(){ if(popEl){popEl.remove();popEl=null;} if(popBack){popBack.remove();popBack=null;} }
function openPop(anchor,build){
  closePop();
  popBack=el('div','pop-back'); on(popBack,'pointerdown',closePop); document.body.appendChild(popBack);
  popEl=el('div','pop'); build(popEl); document.body.appendChild(popEl);
  const r=anchor.getBoundingClientRect(), pw=popEl.offsetWidth, ph=popEl.offsetHeight;
  let x=r.left+window.scrollX, y=r.bottom+window.scrollY+6;
  x=Math.min(x, window.scrollX+document.documentElement.clientWidth-pw-8);
  x=Math.max(x, window.scrollX+8);
  if(r.bottom+ph+10>window.innerHeight && r.top-ph-6>0) y=r.top+window.scrollY-ph-6;
  popEl.style.left=x+'px'; popEl.style.top=y+'px';
}

const prevCache={};
function previewSVG(id){
  if(prevCache[id]) return svgFarben(prevCache[id]);
  const c=PREV_OF[id]; if(!c) return '';
  let fig;
  try{
    fig=(c[0]==='koerper')?genKoerper(c[1],rngFrom(c[2]),{})
       :genFlaeche(c[1],rngFrom(c[2]),{rotate:false,trapIncl:true});
  }catch(e){ return ''; }
  prevCache[id]=figToSVG(fig,'plain',{w:46,h:34,pad:2,view:'schraeg',trueCirc:false});
  return svgFarben(prevCache[id]);

function tabFor(g){

/* Der gerade verwendete Aufgabentyp und die gerade gezeigte Ansicht bekommen
   einen Rahmen - so ist erkennbar, woher die laufende Aufgabe stammt. */
function markiereAktuell(){
  const p=$('#studentPanel'); if(!p) return;
  /* Ohne Aufgabe bleibt keine Kachel umrandet. */
  const typ=task&&task.type;
  /* Die Ansicht wird nur markiert, wenn die Aufgabe ueberhaupt ein Bild zeigt. */
  const hatBild=!!$('#taskArea svg');
  const ans=(!IS_F&&hatBild&&task)?(task.view||state.view):null;
  $$('.seg.checks button, .typ',p).forEach(b=>b.classList.remove('aktuell'));
  const leisten=$$('.ctl',p);
  if(leisten[0]&&typ){ const b=$('.typ[data-v="'+typ+'"]',leisten[0]); if(b)b.classList.add('aktuell'); }
  if(leisten[1]&&ans){ const b=$('.seg button[data-v="'+ans+'"]',leisten[1]); if(b)b.classList.add('aktuell'); }
}
/* Auswahl geändert: die laufende Aufgabe bleibt stehen — neu gewürfelt wird
   ausschließlich über „Neue Aufgabe" (und beim Laden der Seite). */
function afterPick(){
  buildPick(); serialize();
  if(!task){ newTask(); } else { refreshTask(); }
  renderTask();
}
/* Einstellung geändert: dieselbe Aufgabe, nur im neuen Gewand */
function afterSettings(){
  buildSettings(); buildStudentPanel(); buildPick(); serialize();
  /* Lag keine Aufgabe vor (z. B. weil kein Typ gewählt war), kommt sofort eine
     neue - sonst bliebe der Hinweistext stehen. Eine laufende Aufgabe bleibt. */
  if(!task){ newTask(); } else { refreshTask(); }
  renderTask();
  /* Der Erkundungsmodus zeigt dieselben Koerper - Aenderungen an den
     Einstellungen (z. B. verdeckte Kanten) wirken dort sofort. */
  if(state.mode==='erkundung'&&erkBuilt) buildErkundung(); }

  if(EN()) return PLUR_EN[id]||(sName(id)+'s');

/* „Ein Trapez ist ein Viereck mit einem Paar paralleler Seiten." */
function defSatz(id){
  if(EN()){
    if(TAGDEF_EN[id]) return gross(anEn(sName(id)))+sName(id)+' is '+TAGDEF_EN[id]+'.';
    const d=(PROPS_EN[id]||[])[0];
    if(!d) return '';
    return gross(anEn(sName(id)))+sName(id)+' is '+anEn(d)+d+'.';
  }
  if(TAGDEF[id]) return (genOf(id)==='f'?'Eine ':'Ein ')+sName(id)+' ist '+TAGDEF[id]+'.';
  const d=(PROPS[id]||[])[0];
  if(!d) return '';
  return (genOf(id)==='f'?'Eine ':'Ein ')+sName(id)+' ist '+defArt(d)+' '+d+'.';
}
/* Behauptung „Jedes A ist ein B." samt Begründung */
function relClaim(a,b){
  const truth=tagsOfClass(a).has(b), dz=defSatz(b);
  let grund;
  if(EN()){
    if(truth) grund='Every '+sName(a)+' meets all the conditions of '+anEn(sName(b))+sName(b)+'.';
    else if(overlaps(a,b)) grund='There are '+plural(a)+' that are not '+plural(b)+' — here is a counterexample:';
    else grund='That is never true: '+plural(a)+' and '+plural(b)+' exclude each other — here is an example:';
    return {kind:'rel',a:a,b:b,truth:truth,
      text:'Every '+sName(a)+' is '+anEn(sName(b))+sName(b)+'.',
      why:(dz?dz+' ':'')+grund, ex:truth?null:a};
  }
  if(truth) grund=jeder(a)+weakName(a)+' erfüllt alles, was '+artNom(b)+' '+sName(b)+' ausmacht.';
  else if(overlaps(a,b)) grund='Es gibt '+plural(a)+', die keine '+plurWeak(b)+' sind — hier ein Gegenbeispiel:';
  else grund='Das trifft nie zu: '+plural(a)+' und '+plural(b)+' schließen einander aus — hier ein Beispiel:';
  return {kind:'rel',a:a,b:b,truth:truth,
    text:jeder(a)+weakName(a)+' ist '+artNom(b)+' '+sName(b)+'.',
    why:(dz?dz+' ':'')+grund, ex:truth?null:a};
}
/* Gibt es überhaupt Figuren, auf die beide Bezeichnungen zutreffen? */
function overlaps(a,b){
  const fam=famOf(a)||'viereck';
  return FAM[fam].precise.some(p=>tagsOfClass(p).has(a)&&tagsOfClass(p).has(b));

function mischen(l){

    const rest=mischen(l.filter(x=>muss.indexOf(x)<0));

/* --- Aufgaben nicht wiederholen -----------------------------------------
   Zweimal hintereinander dieselbe Aufgabe ist langweilig, und was schon
   sitzt, muss nicht noch einmal kommen. Deshalb wird gemerkt, welche
   Aufgaben richtig beantwortet wurden; die werden uebersprungen, bis nichts
   anderes mehr uebrig ist - dann geht es von vorne los. Falsch beantwortete
   Aufgaben kommen wieder. Die Kennung beschreibt die Aufgabe, nicht die
   einzelne Zeichnung: Fragetyp, Familie, Form und gesuchter Name. */
let aufgVorher = null;
let aufgVorrat = 0;                 /* grobe Zahl moeglicher Aufgaben */
const aufgRichtig = new Set();
const aufgKennung = t => t ? [t.type, t.fam, t.sub, t.target].join('|') : '';
function aufgGemerkt(t, richtig){
  const k = aufgKennung(t); if(!k) return;
  if(richtig) aufgRichtig.add(k); else aufgRichtig.delete(k);
}
function baueTask(sd){
  const P=poolItems();
  if(!P.length||!state.types.length){ task=null; return; }
  const R=rngFrom(sd);
  const withProps=P.filter(it=>propsFor(targetFor(it.sub,rngFrom(1))).length||propsFor(it.sub).length);
  const cl=claimPool();
  let types=state.types.filter(x=>{
    if(x==='eig2name') return withProps.length>0;
    if(x==='wahrfalsch') return cl.text.length>0||cl.fig;
    return true;
  });
  if(!types.length){ task=null; return; }   // nichts Passendes möglich -> Hinweis
  const type=pick(R,types);
  const src=(type==='eig2name'&&withProps.length)?withProps:P;
  aufgVorrat=Math.max(aufgVorrat, types.length*src.length);
  const it=pick(R,src), fam=it.fam, target=targetFor(it.sub,R);
  const fig=makeFig(fam,target,R);
  task={seed:sd,fam:fam,sub:it.sub,target:target,type:type,fig:fig,
        view:IS_F?null:pick(R,state.views.length?state.views:['schraeg']),
        counted:false,claim:null,claimTrap:null};
  deriveTask(task);
}
function newTask(seed){
  if(seed!=null){ baueTask(seed); aufgVorher=aufgKennung(task); return; }
  let ersatz=null, nurRichtig=null;
  for(let k=0;k<60;k++){
    const sd=(Math.random()*1e9)>>>0;
    baueTask(sd);
    if(!task) return;
    const key=aufgKennung(task);
    if(ersatz==null) ersatz=sd;
    if(key===aufgVorher) continue;                 // nie zweimal hintereinander
    if(aufgRichtig.has(key)){ if(nurRichtig==null) nurRichtig=sd; continue; }
    aufgVorher=key; return;
  }
  /* Es blieb nichts Neues uebrig. Sind wirklich schon alle moeglichen Aufgaben
     richtig beantwortet, faengt eine neue Runde an; sonst wird nur diese eine
     Aufgabe wiederholt, die Merkliste bleibt aber stehen. */
  if(nurRichtig!=null){
    if(aufgRichtig.size>=aufgVorrat) aufgRichtig.clear();
    baueTask(nurRichtig);
  }
  else baueTask(ersatz);
  aufgVorher=aufgKennung(task);
}
/* Alles Abgeleitete (Klassifikation, Antwortmöglichkeiten, Bilder, Beschreibung)
   wird bei jeder Einstellungsänderung neu berechnet — die Aufgabe selbst bleibt
   dieselbe. Weil alles am Startwert hängt, kommt beim Zurückschalten wieder
   genau dasselbe heraus. */
function deriveTask(t){
  const R=rngFrom((t.seed^0x9e3779b9)>>>0);
  const cls=classify(t.fig,1,state.trapIncl);
  t.cls=cls; t.tags=cls.tags;
  t.precise=preciseId(cls); t.fullName=nameOfCls(cls);
  t.need=needOf(cls,t.fam); t.got=[]; t.okSet=okSetOf(cls,t.fam);
  t.askId=(state.quizMode==='alle'&&t.target.slice(0,3)==='gs_')?'gleichschenklig':t.target;
  t.done=false; t.tried=false; t.picked=[];
  if(!IS_F&&state.views.length&&state.views.indexOf(t.view)<0) t.view=pick(R,state.views);
  if(t.type==='eig2name'){
    let list=propsFor(t.target); if(!list.length) list=propsFor(t.precise);
    if(!list.length) list=propsFor(t.sub);
    t.prop=list.length?pick(R,list)
      :T('Für diese Form ist in den Einstellungen gerade keine Beschreibung aktiviert.','No description is currently enabled for this shape in the settings.');
  }
  if(t.type==='wahrfalsch'&&(!t.claim||t.claimTrap!==state.trapIncl)){
    t.claim=makeClaim(t,rngFrom((t.seed^0x51ed270b)>>>0)); t.claimTrap=state.trapIncl;
  }
  t.pics=(t.type==='name2bild'&&!canBuild(t.fam))?buildPics(t,rngFrom((t.seed^0x2545f491)>>>0)):null;
}
