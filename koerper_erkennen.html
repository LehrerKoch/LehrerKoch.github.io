function selectedIds(){ const s=[]; FAMS_PAGE.forEach(f=>state.subs[f].forEach(x=>s.push(x)));
  return s; }
function claimPool(){
  const sel=selectedIds();
  return {text:CLAIMS.filter(c=>c[2].some(x=>sel.indexOf(x)>=0)), fig:sel.length>0};
}
function claimNames(fam){
  return FAM[fam].all.filter(id=>['dreieck','viereck','koerper'].indexOf(id)<0);
}
function makeClaim(t,R){
  const pool=claimPool();
  const useText=pool.text.length&&(R()<0.5);
  if(useText){
    const c=pick(R,pool.text), tx=claimTexts(c);
    return {kind:'text',text:tx.text,truth:c[1],why:tx.why};
  }
  if(R()<0.45){    // allgemeine Aussage aus der Hierarchie: „Jedes X ist ein Y."
    const sel=selectedIds().filter(x=>ANC[x]);
    if(sel.length){
      const a=pick(R,sel);
      const fam=famOf(a)||t.fam;
      const cand=claimNames(fam).filter(x=>x!==a);
      if(cand.length){
        return relClaim(a,pick(R,cand));
      }
    }
  }
  // Aussage zur gezeigten Figur
  const cand=claimNames(t.fam);
  const id=pick(R,cand);
  const truth=t.tags.has(id);
  if(EN()) return {kind:'fig',b:id,truth:truth,
    text:(IS_F?'This figure':'This drawing')+' shows '+anEn(sName(id))+sName(id)+'.',
    why:truth?('The drawing meets all the conditions of '+anEn(sName(id))+sName(id)+'.')
             :('The drawing shows '+anEn(sName(t.precise))+sName(t.precise)+'.')};
  return {kind:'fig',b:id,truth:truth,
    text:'Diese '+(IS_F?'Figur':'Zeichnung')+' zeigt '+artAkk(id)+' '+akkName(id)+'.',
    why:truth?('Die Zeichnung erfüllt alles, was '+artNom(id)+' '+sName(id)+' ausmacht.')
             :('Die Zeichnung zeigt '+artAkk(t.precise)+' '+akkName(t.precise)+'.')};
}

/* Bildauswahl erzeugen */
function buildPics(t,R){
  const fam=t.fam, want=state.nOpts, alle=(state.quizMode==='alle');
  const match=p=>alle? p.tags.has(t.askId) : (p.precise===t.precise);
  let subs=state.subs[fam].slice();
  ALL_SUBS[fam].forEach(s=>{ if(subs.indexOf(s)<0) subs.push(s); });
  const other=[];
  (fam==='koerper'?[]:FAMS_PAGE.filter(f=>f!==fam)).forEach(f=>ALL_SUBS[f].forEach(s=>other.push([f,s])));
  for(let att=0;att<40;att++){
    const used={}, pics=[mkPic(fam,t.target,R)]; used[t.target]=1;
    let guard=0;
    while(pics.length<want&&guard++<90){
      const s=pick(R,subs); if(used[s]&&pics.length<subs.length)continue; used[s]=1;
      const p=mkPic(fam,targetFor(s,R),R);
      if(!alle&&p.precise===t.precise) continue;          // nur eine richtige Figur
      pics.push(p);
    }
    while(pics.length<want) pics.push(mkPic(fam,pick(R,subs),R));
    if(alle&&other.length){
      let tries=0;
      while(pics.filter(match).length===pics.length&&tries++<25){
        const o=pick(R,other), p=mkPic(o[0],targetFor(o[1],R),R);
        if(match(p)) continue;
        pics[pics.length-1]=p;
      }
    }
    for(let i=pics.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); const x=pics[i];pics[i]=pics[j];pics[j]=x; }
    const hit=pics.filter(match);
    if(!hit.length) continue;
    if(alle&&hit.length===pics.length) continue;
    if(!alle&&hit.length!==1) continue;
    return pics;
  }
  return [mkPic(fam,t.target,R),mkPic(fam,pick(R,subs),R)];
}
function mkPic(fam,target,R){
  const fig=makeFig(fam,target,R), cls=classify(fig,1,state.trapIncl);
  const view=(!IS_F&&state.viewEach&&state.views.length)?pick(R,state.views):null;
  return {fig,cls,tags:cls.tags,precise:preciseId(cls),target,view:view};
}

/* 3D-Ansicht — Bedienung wie im Erkundungsmodus von volumen.html:
   ziehen dreht (von oben über die Seite bis von unten), rechte Maustaste und
   zwei Finger verschieben, Mausrad und Kneifen zoomen auf den Zeigepunkt.
   Jede Zeichnung hat ihre eigene Kamera. */
function initCam(ent){
  const R=bodyRadius(ent.fig);
  ent.cam={th:state.az, ph:state.el, scale:0.42*Math.min(ent.w,ent.h)/R, ox:ent.w/2, oy:ent.h/2};
}
function makeSpin(ent){
  const node=ent.node; node.classList.add('spin');
  node.style.touchAction='none'; node.style.cursor='grab';
  if(!ent.cam) initCam(ent);
  const redraw=()=>{ node.innerHTML=figHTML(ent.fig,ent.w,ent.h,ent.view,ent); };
  const rel=e=>{ const r=node.getBoundingClientRect();
    const sx=ent.w/(r.width||ent.w), sy=ent.h/(r.height||ent.h);
    return [(e.clientX-r.left)*sx,(e.clientY-r.top)*sy]; };
  const ptr=new Map(); let rot=null, move=null, pinch=null;
  on(node,'contextmenu',e=>e.preventDefault());
  on(node,'pointerdown',e=>{
    e.preventDefault();
    try{ node.setPointerCapture(e.pointerId); }catch(_){}
    const p=rel(e); ptr.set(e.pointerId,p);
    if(ptr.size===2){ rot=null; move=null; const v=Array.from(ptr.values());
      pinch={d:Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]),c:[(v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2]};
      return; }
    if(e.button===2||e.shiftKey){ move={x:p[0],y:p[1]}; node.style.cursor='move'; }
    else { rot={x:p[0],y:p[1]}; node.style.cursor='grabbing'; }
  });
  on(node,'pointermove',e=>{
    if(!ptr.has(e.pointerId)) return;
    const p=rel(e); ptr.set(e.pointerId,p);
    const c=ent.cam;
    if(ptr.size>=2&&pinch){ const v=Array.from(ptr.values());
      const nd=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);
      const nc=[(v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2];
      const k=nd/(pinch.d||1);
      c.ox=nc[0]+(c.ox-pinch.c[0])*k; c.oy=nc[1]+(c.oy-pinch.c[1])*k;
      c.scale=Math.max(4,Math.min(2000,c.scale*k));
      pinch={d:nd,c:nc}; redraw(); return; }
    if(move){ c.ox+=p[0]-move.x; c.oy+=p[1]-move.y; move={x:p[0],y:p[1]}; redraw(); return; }
    if(rot){
      c.th-=(p[0]-rot.x)*0.011;
      c.ph=Math.max(-Math.PI/2+0.002,Math.min(Math.PI/2-0.002,c.ph+(p[1]-rot.y)*0.009));
      rot={x:p[0],y:p[1]}; redraw();
    }
  });
  const up=e=>{ ptr.delete(e.pointerId); if(ptr.size<2)pinch=null;
    if(!ptr.size){ rot=null; move=null; } node.style.cursor='grab'; };
  on(node,'pointerup',up); on(node,'pointercancel',up); on(node,'pointerleave',up);
  on(node,'wheel',e=>{ e.preventDefault();
    const p=rel(e), c=ent.cam, k=e.deltaY<0?1.12:1/1.12;
    c.ox=p[0]+(c.ox-p[0])*k; c.oy=p[1]+(c.oy-p[1])*k;
    c.scale=Math.max(4,Math.min(2000,c.scale*k)); redraw(); },{passive:false});
  on(node,'dblclick',e=>{ e.preventDefault(); initCam(ent); redraw(); });
}

  if(list.indexOf(precise)<0) list.unshift(precise);
  list.sort((a,b)=>(a===precise?-1:b===precise?1:0));
  list.forEach(id=>w.appendChild(el('span','nchip'+(id===precise?' pre':''),nameOf(id))));
  return w;
}
function hausBlock(tags,precise){
  if(!IS_F||!state.hausShow||famOf(precise)!=='viereck') return null;
  const d=el('div'); d.innerHTML=hausSVG(tags,precise);
  d.appendChild(el('div','haus-cap',T('Haus der Vierecke — grün: alle zutreffenden Bezeichnungen','Hierarchy of quadrilaterals — green: all names that apply')));

function askText(t){
  if(EN()){
    const genau=(state.quizMode==='genau');
    if(t.type==='bild2name'||t.type==='eig2name'){
      const frage=(t.type==='bild2name')?(IS_F?'Which shape is this?':'Which solid is this?'):'Which shape is meant?';
      if(state.ansText!=='quiz') return frage;
      return frage+(genau?' Choose only the most precise name.':' Choose all the names that apply.');
    }
    if(t.type==='wahrfalsch') return 'Is this statement true?';
    const n=nameOf(t.askId||t.target), art=anEn(n);
    if(canBuild(t.fam)) return 'Build '+art+n+(genau?' — so that “'+n+'” is the most precise name.':'.');
    if(genau) return (IS_F?'Which figure':'Which solid')+' is '+art+n+'? The picture whose most precise name is “'+n+'” is meant.';
    return 'Select all the pictures that “'+n+'” applies to.';
  }
  const obj=IS_F?'Fläche':'Körper';
  const genau=(state.quizMode==='genau');
  if(t.type==='bild2name'||t.type==='eig2name'){
    const frage=(t.type==='bild2name')?('Welche '+obj+' ist das?'):'Welche Form ist gemeint?';
    if(state.ansText!=='quiz') return frage;
    return frage+(genau?' Wähle nur die genaueste Bezeichnung.':' Wähle alle zutreffenden Bezeichnungen.');
  }
  if(t.type==='wahrfalsch') return 'Stimmt diese Aussage?';
  const n=nameOf(t.askId||t.target);
  const art=(artIndef(n)==='eine'?'eine ':'ein ');
  if(canBuild(t.fam))
    return 'Baue '+art+n+(genau?' — und zwar so, dass „'+n+'" die genaueste Bezeichnung ist.':'.');
  if(genau) return (IS_F?'Welche Figur':'Welcher Körper')+' ist '+art+n+
    '? Gemeint ist das Bild, dessen genaueste Bezeichnung „'+n+'" ist.';
  return 'Wähle alle Bilder aus, auf die „'+n+'" zutrifft.';
}
/* --- Rückmeldungen ------------------------------------------------------ */
function verdict(t,id){
  if(EN()){
    if(t.okSet.has(id)) return {v:'ok',why:'Correct — '+nameOf(id)+'.'};
    if(t.tags.has(id))  return {v:'warn',why:'Correct, but not precise enough: '+whyGeneral(t.precise,id)};
    const f1=famOf(id), f2=famOf(t.precise);
    if(f1&&f2&&(f1==='koerper')!==(f2==='koerper'))
      return {v:'no',why:(f1==='koerper'?gross(nameOf(id))+' is a SOLID — a flat shape is drawn here.'
        :gross(nameOf(id))+' is a flat SHAPE — a solid is drawn here.')+
        ' Don’t mix the two up: '+nameOf(id)+' and '+nameOf(t.precise)+'.'};
    const sp=NOTE_SPECIAL_EN[t.precise]&&NOTE_SPECIAL_EN[t.precise][id];
    if(sp) return {v:'no',why:sp};
    if(tagsOfClass(id).has(t.precise))
      return {v:'no',why:'Too specific — not every '+nameOf(t.precise)+' is '+anEn(nameOf(id))+nameOf(id)+'.'};
    return {v:'no',why:'That does not apply here.'};
  }
  if(t.okSet.has(id)) return {v:'ok',why:'Richtig — '+nameOf(id)+'.'};
  if(t.tags.has(id))  return {v:'warn',why:'Stimmt, aber nicht genau genug: '+whyGeneral(t.precise,id)};
  const f1=famOf(id), f2=famOf(t.precise);
  if(f1&&f2&&(f1==='koerper')!==(f2==='koerper'))
    return {v:'no',why:(f1==='koerper'?nameOf(id)+' ist ein KÖRPER — hier ist eine ebene Figur gezeichnet.'
      :nameOf(id)+' ist eine ebene FLÄCHE — hier ist ein Körper gezeichnet.')+
      ' Verwechsle die beiden nicht: '+nameOf(id)+' und '+nameOf(t.precise)+'.'};
  const sp=NOTE_SPECIAL[t.precise]&&NOTE_SPECIAL[t.precise][id];
  if(sp) return {v:'no',why:sp};
  if(tagsOfClass(id).has(t.precise))
    return {v:'no',why:'Zu speziell — nicht jedes '+nameOf(t.precise)+' ist '+artIndef(nameOf(id))+' '+nameOf(id)+'.'};
  return {v:'no',why:'Das trifft hier nicht zu.'};
}
function countOnce(t,good){ if(t.counted)return; t.counted=true; score.n++; if(good)score.ok++;
  /* merken, wie es ausging - die Lösung bleibt bei laufender Automatik aus */
  t.autoGut=good; antwortGemeldet(t,good);
  /* Zusätzlich führt jeder Aufgabentyp seinen eigenen Stand. */
  const ty=t&&t.type;
  if(ty){ if(!scoreTyp[ty]) scoreTyp[ty]={ok:0,n:0}; scoreTyp[ty].n++; if(good) scoreTyp[ty].ok++; }
  aufgGemerkt(t,good); updateStat(); }
function updateStat(){
  zaehlerMalen();
  const s=$('#statBox');
  if(s) s.textContent=T('Richtig: '+score.ok+' / '+score.n, 'Correct: '+score.ok+' / '+score.n);
}

/* Die Zähler an den Kacheln nachtragen. */

/* ── Automatische Aufgabe ────────────────────────────────────────────────
   Nur dort, wo die Aufgabe allein durch Anklicken entschieden wird: nicht
   beim Aufdecken (da prüft man selbst) und nicht beim Bauen. */
function nurKlicken(){
  const t=task;
  if(!t) return false;
  if(t.type==='bild2name'||t.type==='eig2name') return state.ansText==='quiz';
  if(t.type==='wahrfalsch') return true;
  return !canBuild(t.fam);
}
/* Läuft die Automatik gerade für diese Aufgabe? */
function autoLaeuft(){ return !!(window.abAutoAn && abAutoAn()); }
/* Nach einer entschiedenen Aufgabe: kurz aufleuchten, und wenn sie richtig
   war, kommt gleich die nächste. */
function antwortGemeldet(t,gut){
  if(!autoLaeuft()) return;
  if(window.abBlitz) abBlitz(gut);
  if(gut&&window.abAutoBald) abAutoBald();
}
let autoAn=false;
function autoBauen(){
  if(!window.abAutoStart) return;
  abAutoStart({ an:autoAn, pause:1500, knoepfe:'.new-row button.btn-new',
    moeglich:nurKlicken, naechste:()=>{ newTask(); renderTask(); },
    gemerkt:(an)=>{ autoAn=an; } });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',autoBauen);
else autoBauen();
function outerButtons(){

/* --- Antwort: wahr oder falsch ----------------------------------------- */
/* Erklärung zu einer Bild-Behauptung: Was macht die gefragte Form aus,
   trifft das hier zu — und ist die gezeigte Figur sogar noch spezieller? */
function figClaimText(t,c){
  const B=c.b, P=t.precise;
  if(EN()){
    let s=defSatz(B);
    if(c.truth){
      if(P===B||!PROPS[P]) s+=' That is exactly the case here.';
      else s+=' That is the case here — the drawing even shows '+anEn(sName(P))+sName(P)+', i.e. a special '+sName(B)+'. '+defSatz(P);
    }else s+=' That is not the case here: the drawing shows '+anEn(sName(P))+sName(P)+'.';
    return s.trim();
  }
  const bes={m:'ein besonderer',f:'eine besondere',n:'ein besonderes'}[genOf(B)];
  let s=defSatz(B);
  if(c.truth){
    if(P===B||!PROPS[P]) s+=' Genau das trifft hier zu.';
    else s+=' Das trifft hier zu — die Zeichnung zeigt sogar '+artAkk(P)+' '+akkName(P)+', also '+bes+' '+sName(B)+'. '+
      defSatz(P);
  }else{
    s+=' Das trifft hier nicht zu: Die Zeichnung zeigt '+artAkk(P)+' '+akkName(P)+'.';
  }
  return s.trim();
}
function answerClaim(card,t){
  const c=t.claim;
  /* Erst die Behauptung lesen, dann das Bild dazu ansehen. */
  const b=el('div','claim-box'); b.appendChild(el('span','q',T('Behauptung','Statement')));
  b.appendChild(document.createTextNode(c.kind==='fig'?(EN()?((IS_F?'This figure':'This drawing')+' shows '+anEn(sName(c.b))+sName(c.b)+'.'):('Diese '+(IS_F?'Figur':'Zeichnung')+' zeigt '+artAkk(c.b)+' '+akkName(c.b)+'.')):c.text));
  card.appendChild(b);
  if(c.kind==='fig'){
    const w=el('div','fig-center'); w.appendChild(figBox(t.fig,320,250));
    w.appendChild(presentMini());

  }
  const box=el('div','choices big'), why=el('div','why');
  [[T('wahr','true'),true],[T('falsch','false'),false]].forEach(o=>{
    const btn=el('button','choice',o[0]); btn.dataset.wert=o[1]?'1':'0'; btn.dataset.merk='c:'+btn.dataset.wert;
    on(btn,'click',()=>{
      if(t.done)return; t.done=true;

      why.className='why '+(good?'ok':'no');
      let txt=EN()?((good?'Correct — the statement is ':'Not quite — the statement is ')+(c.truth?'true':'false')+'. '+(c.why||''))
        :((good?'Richtig — die Aussage ist ':'Nicht ganz — die Aussage ist ')+(c.truth?'wahr':'falsch')+'. '+(c.why||''));
      why.textContent=(good&&autoLaeuft())?T('Richtig!','Correct!'):txt.trim();
      countOnce(t,good);
      if(c.kind==='fig') showSolution(card,t,false,figClaimText(t,c));
      else if(c.ex){                                   // Gegenbeispiel zeigen
        const R=rngFrom((t.seed+7)>>>0), fam=famOf(c.ex);
        const f=makeFig(fam,targetFor(c.ex,R),R);
        const bx=el('div','sol-box'); bx.appendChild(el('h4',null,T('Gegenbeispiel','Counterexample')));
        const cen=el('div','fig-center'); cen.appendChild(figBox(f,290,215)); bx.appendChild(cen);
        bx.appendChild(el('div','muted small',EN()?(gross(nameOf(c.ex))+' — but not '+anEn(sName(c.b))+sName(c.b)+'.'):(nameOf(c.ex)+' — aber '+keinN(c.b)+' '+sName(c.b)+'.')));
        const anchor=card.querySelector('.main-act'); card.insertBefore(bx,anchor||null);
      }
    });
    box.appendChild(btn);
  });
  card.appendChild(box); card.appendChild(why);
}

/* Antwort auf eine Namensfrage (Bild→Name, Eigenschaft→Name) */
function answerName(card,t){
  if(state.ansText==='aufdecken'){
    const act=el('div','act-row center');
    const b=el('button','btn-sol',T('Lösung aufdecken','Reveal the answer')); b.dataset.merk='aufdecken';
    on(b,'click',()=>{ b.remove(); showSolution(card,t,true); });
    act.appendChild(b); card.appendChild(act);
    return;
  }
  if(!t.textIds) t.textIds=textAuswahl(optionIds(t.fam),t);
  const ids=t.textIds;
  const box=el('div','choices'), why=el('div','why'), ask2=el('div','ask2');
  if(state.quizMode==='genau'){
    const twoStep=t.need.length>1;
    if(twoStep) ask2.textContent=T('Gefragt sind beide Angaben: Seitenart und Winkelart.','Both are asked for: the type of sides and the type of angles.');
    ids.forEach(id=>{ const c=el('button','choice',nameOf(id)); c.dataset.id=id; c.dataset.merk='n:'+id;
      on(c,'click',()=>{
        if(t.done)return;
        if(c.classList.contains('ok'))return;
        const need=t.need.indexOf(id)>=0;
        if(need){
          c.classList.add('ok'); if(t.got.indexOf(id)<0) t.got.push(id);
          const rest=t.need.filter(x=>t.got.indexOf(x)<0);
          if(rest.length){
            why.className='why ok';
            why.textContent=T('Richtig — ','Correct — ')+nameOf(id)+'.';
            ask2.textContent=isSideId(id)?T('Und welche Winkelart hat dieses Dreieck?','And what type of angles does this triangle have?')
                                         :T('Und was gilt für die Seiten dieses Dreiecks?','And what about the sides of this triangle?');
          }else{
            why.className='why ok';
            why.textContent=twoStep?(EN()?('Both correct — this is '+anEn(t.fullName)+t.fullName+'.'):('Beides richtig — das ist '+artIndef(t.fullName)+' '+t.fullName+'.'))
                                   :(T('Richtig — ','Correct — ')+nameOf(id)+'.');
            ask2.textContent='';
            countOnce(t,!t.tried); t.done=true; showSolution(card,t,false);
          }
          return;
        }
        const v=verdict(t,id);
        c.classList.remove('sel'); c.classList.add(v.v==='warn'?'warn':'no');
        why.className='why '+v.v; why.textContent=v.why; t.tried=true;
      });
      box.appendChild(c); });
    card.appendChild(box); card.appendChild(ask2); card.appendChild(why);
  } else {
    const sel=new Set();
    ids.forEach(id=>{ const c=el('button','choice',nameOf(id));
      on(c,'click',()=>{ if(t.done)return;
        if(sel.has(id)){sel.delete(id);c.classList.remove('sel');} else {sel.add(id);c.classList.add('sel');} });
      c.dataset.id=id; c.dataset.merk='n:'+id; box.appendChild(c); });
    card.appendChild(box);
    const act=el('div','act-row center pruef');
    const pb=el('button','btn-sol',T('✓ Prüfen','✓ Check')); pb.dataset.merk='pruefen';
    on(pb,'click',()=>{ if(t.done)return; t.done=true; pb.disabled=true;
      let miss=0,wrong=0;
      $$('button.choice',box).forEach(c=>{ const id=c.dataset.id, should=t.tags.has(id), has=sel.has(id);
        c.classList.remove('sel');
        if(should&&has)c.classList.add('ok');
        else if(!should&&has){c.classList.add('no');wrong++;}
        else if(should&&!has){c.classList.add('miss');miss++;} });
      why.className='why '+((!miss&&!wrong)?'ok':'no');
      why.textContent=EN()
        ?((!miss&&!wrong)?'All correct — these are exactly the names that apply.'
          :('Not quite: '+(wrong?wrong+' too many clicked':'')+(wrong&&miss?', ':'')+(miss?miss+' missing':'')+
            '. Green dashed = missing, red = does not apply.'))
        :((!miss&&!wrong)?'Alles richtig — das sind genau die zutreffenden Bezeichnungen.'
        :('Noch nicht ganz: '+(wrong?wrong+' zu viel angeklickt':'')+(wrong&&miss?', ':'')+(miss?miss+' fehlt'+(miss>1?'en':''):'')+
          '. Grün gestrichelt = fehlte, rot = trifft nicht zu.'));
      countOnce(t,!miss&&!wrong); showSolution(card,t,false); });
    act.appendChild(pb); card.appendChild(act); card.appendChild(why);
  }
}

      why.className='why '+((!miss&&!wrong)?'ok':'no');

function revealPics(grid,t){
  $$('.pick',grid).forEach((d,i)=>{ if(d.querySelector('.tag'))return;
    const tag=el('span','tag'); tag.textContent=nameOf(t.pics[i].precise);
    tag.style.color=t.pics[i].precise===t.precise?(DUNKEL()?'#81c784':'#2e7d32'):(DUNKEL()?'#9aa5b1':'#889'); tag.style.fontSize='10.5px'; d.appendChild(tag); });
}
/* Antwort: selbst bauen */
function answerBuild(card,t){
  const wrap=el('div'); card.appendChild(wrap);
  const kind=(t.fam==='kreis')?'kreis':t.fam;
  const b=makeBuilder(wrap,{compact:true,kind:kind,quiet:true,onChange:null,memo:(t.bauMemo||(t.bauMemo={}))});
  const why=el('div','why');
  const act=el('div','act-row');
  const pb=el('button','btn-sol',T('Prüfen','Check')); pb.dataset.merk='pruefen';
  on(pb,'click',()=>{
    const fig=b.getFig();
    if(!fig){ why.className='why no'; why.textContent=T('Zieh die Figur zuerst zurecht.','Drag the figure into shape first.'); return; }
    const c=classify(fig,BTOL,state.trapIncl);
    if(!c.ok){ why.className='why no'; why.textContent=T('Die Figur ist überschlagen — die Seiten dürfen sich nicht kreuzen.','The figure is self-intersecting — the sides must not cross.'); return; }
    const pr=preciseId(c);
    const good=state.quizMode==='alle'? c.tags.has(t.askId) : (pr===t.precise||okSetOf(c,t.fam).has(t.target));
    if(good){ why.className='why ok'; why.textContent=EN()?('That works — you have built '+anEn(nameOf(pr))+nameOf(pr)+'.')
        :('Passt — du hast '+(artIndef(nameOf(pr))==='eine'?'eine ':'ein ')+nameOf(pr)+' gebaut.');
      if(!t.done){ t.done=true; countOnce(t,!t.tried); } }
    else if(c.tags.has(t.askId)){ why.className='why warn';
      why.textContent=EN()
        ?('That is also '+anEn(nameOf(t.askId))+nameOf(t.askId)+', but more precisely '+anEn(nameOf(pr))+nameOf(pr)+
          '. A figure whose most precise name is “'+nameOf(t.target)+'” was wanted.')
        :('Das ist zwar auch '+(artIndef(nameOf(t.askId))==='eine'?'eine ':'ein ')+nameOf(t.askId)+
        ', aber genauer '+(artIndef(nameOf(pr))==='eine'?'eine ':'ein ')+nameOf(pr)+'. Gesucht war eine Figur, deren genaueste Bezeichnung „'+nameOf(t.target)+'" ist.');
      t.tried=true; }
    else { why.className='why no'; why.textContent=EN()
      ?('That is '+anEn(nameOf(pr))+nameOf(pr)+' — not yet '+anEn(nameOf(t.askId))+nameOf(t.askId)+'.')
      :('Das ist '+(artIndef(nameOf(pr))==='eine'?'eine ':'ein ')+nameOf(pr)+
      ' — noch k'+(artIndef(nameOf(t.askId))==='eine'?'eine ':'ein ')+nameOf(t.askId)+'.'); t.tried=true; }
    const hb=hausBlock(c.tags,pr);
    const old=card.querySelector('.build-haus'); if(old)old.remove();
    if(hb){ hb.className='build-haus'; card.insertBefore(hb,why); }
  });
  act.appendChild(pb);
  const sb=el('button','btn-ghost',T('Beispiel zeigen','Show an example')); sb.dataset.merk='beispiel';
  on(sb,'click',()=>{ const ex=el('div','sol-box');
    ex.appendChild(el('h4',null,T('So könnte es aussehen','It could look like this')));
    const cen=el('div','fig-center'); cen.appendChild(figBox(t.fig,300,230)); ex.appendChild(cen);
    const o=card.querySelector('.sol-box'); if(o)o.remove(); card.insertBefore(ex,why); });
  act.appendChild(sb);
  card.appendChild(act); card.appendChild(why);
}
/* Lösung / Selbsteinschätzung */
function showSolution(card,t,selfCheck,extra){
  /* Läuft die Automatik und war die Antwort richtig, bleibt nur das kurze
     „Richtig" stehen - zum Lesen einer Begründung bliebe keine Zeit. */
  if(t&&t.autoGut&&autoLaeuft()) return;
  const old=card.querySelector('.sol-box'); if(old)old.remove();
  const box=el('div','sol-box');
  box.appendChild(el('h4',null,T('Lösung','Solution')));
  const two=el('div','two-col'), c1=el('div','c1'), c2=el('div','c2');
  c1.appendChild(el('div','big-name',EN()?gross(t.fullName):t.fullName));
  c1.appendChild(el('div','muted small',T('Zutreffende Bezeichnungen:','Names that apply:')));
  c1.appendChild(nameChips(t.tags,t.precise));
  if(extra){ const e=el('div','small'); e.style.marginTop='7px'; e.style.color='#3a4a3c';
    e.style.lineHeight='1.35'; e.textContent=extra; c1.appendChild(e); }
  /* Bei „Benennen" steht das Bild schon in der Aufgabe - nicht doppelt zeigen. */
  if(t.type==='eig2name'||(selfCheck&&t.type!=='bild2name')){
    const cen=el('div','fig-center'); cen.style.marginTop='8px'; cen.appendChild(figBox(t.fig,290,215)); c1.appendChild(cen);
  }
  const hb=hausBlock(t.tags,t.precise); if(hb) c2.appendChild(hb);
  two.appendChild(c1); if(c2.childNodes.length) two.appendChild(c2);
  box.appendChild(two);
  if(selfCheck){
    const act=el('div','act-row center pruef');
    const y=el('button','btn-ok gross',T('✓ Hatte ich richtig','✓ I had it right'));
    const n=el('button','btn-no gross',T('✗ Daneben','✗ I was wrong'));
    on(y,'click',()=>{ countOnce(t,true); newTask(); renderTask(); });
    on(n,'click',()=>{ countOnce(t,false); newTask(); renderTask(); });
    act.appendChild(y); act.appendChild(n); box.appendChild(act);
  }
  const anchor=card.querySelector('.main-act');
  card.insertBefore(box, anchor&&anchor.parentNode===card?anchor:null);
}
/* Hilfe: erst das Haus der Vierecke, dann die Merkmale */
function toggleHelp(card,t){
  const old=card.querySelector('.help-box'); if(old){old.remove();return;}
  const box=el('div','help-box'); box.appendChild(el('h4',null,T('Woran erkennt man das?','How can you tell?')));
  if(IS_F&&t.fam==='viereck'&&state.hausShow){
    const d=el('div'); d.innerHTML=hausSVG(new Set(),null);
    d.appendChild(el('div','haus-cap',T('Haus der Vierecke: nach unten wird es spezieller.','Hierarchy of quadrilaterals: the further down, the more special.')));
    box.appendChild(d);
  }
  const dl=el('dl');
  FAM[t.fam].subs.forEach(id=>{
    dl.appendChild(el('dt',null,nameOf(id)));
    dl.appendChild(el('dd',null,(PROPSL()[id]||['—'])[0]));
  });
  box.appendChild(dl);
  const anchor=card.querySelector('.main-act');
  card.insertBefore(box, anchor&&anchor.parentNode===card?anchor:null);
}
/* =======================================================================
   8. Baubereich — Erkundungsmodus und „selbst bauen"
   ======================================================================= */
const GRID_STEPS=[2,1,0.5], GRID_LBL_DE=['grob','mittel','fein'], GRID_LBL_EN=['coarse','medium','fine'];
const GRID_LBLL=()=>EN()?GRID_LBL_EN:GRID_LBL_DE;
const VNAMES=['A','B','C','D','E','F','G','H'];
/* Ausgangsfiguren bewusst „ohne Besonderheit": keine gleich langen Seiten,
   keine parallelen Seiten, keine rechten Winkel, konvex */
const START_SHAPE={dreieck:[[-3,-2],[3,-2],[1,3]],
                   viereck:[[-3,-2],[-2,-3],[3,-2],[1,3]],
                   fuenfeck:[[0,3],[3,1],[2,-2.5],[-2,-2.5],[-3,1]],
                   sechseck:[[3,0],[1.5,2.5],[-1.5,2.5],[-3,0],[-1.5,-2.5],[1.5,-2.5]],
                   quadrat:[[-2,-2],[2,-2],[2,2],[-2,2]]};
const BTOL=0.25;   // im Baukasten viel strenger messen als bei erzeugten Figuren

function makeBuilder(host,opt){
  opt=opt||{};
  const memo=opt.memo||null;   // {pts,a,b,view} – ueberlebt einen Neuaufbau
  const B={kind:opt.kind||'viereck',
           pts:(opt.start||START_SHAPE[opt.kind||'viereck']||START_SHAPE.viereck).map(p=>p.slice()),
           a:(opt.startA!=null?opt.startA:3), b:(opt.startB!=null?opt.startB:2), tP:0.9,
           view:{cx:0,cy:0,zoom:34}, drag:null, sel:-1,
           grid:state.eGrid, snap:state.eSnap,
           measures:!opt.quiet, marks:!opt.quiet};
  const tools=el('div','build-tools');
  const noTools=!!opt.noTools;
  const stageWrap=el('div','stage-wrap');
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','stage');
  if(opt.height) svg.style.height=opt.height+'px'; else if(opt.compact) svg.style.height='330px';
  stageWrap.appendChild(svg);
  const val=el('div','stage-val'); if(!opt.quiet) stageWrap.appendChild(val);
  const hint=el('div','stage-hint'); stageWrap.appendChild(hint);

  /* Werkzeugleiste */
  function ctrl(){ return el('div','ctrl'); }
  let c=ctrl(); c.appendChild(el('label',null,T('Raster','Grid')));
  const gs=el('input'); gs.type='range'; gs.min=0; gs.max=GRID_STEPS.length-1; gs.step=1; gs.value=B.grid;
  const gl=el('span','small',GRID_LBLL()[B.grid]);
  on(gs,'input',()=>{ B.grid=+gs.value; gl.textContent=GRID_LBLL()[B.grid]; state.eGrid=B.grid; serialize(); draw(); });
  c.appendChild(gs); c.appendChild(gl);
  const snapL=el('label',null,''); snapL.style.display='flex'; snapL.style.alignItems='center'; snapL.style.gap='6px';
  const snapI=el('input'); snapI.type='checkbox'; snapI.checked=B.snap;
  on(snapI,'change',()=>{ B.snap=snapI.checked; state.eSnap=B.snap; serialize(); if(B.snap)snapAll(); draw(); });
  snapL.appendChild(snapI); snapL.appendChild(el('span',null,T('einrasten','snap')));
  c.appendChild(snapL); tools.appendChild(c);
  const cbRow=el('div','ctrl'); cbRow.style.gap='14px'; tools.appendChild(cbRow);
  const cb=(lbl,val0,fn)=>{ const i=el('input'); i.type='checkbox'; i.checked=val0;
    on(i,'change',()=>fn(i.checked));
    const l=el('label',null,''); l.style.display='flex'; l.style.alignItems='center'; l.style.gap='6px';
    l.appendChild(i); l.appendChild(el('span',null,lbl)); cbRow.appendChild(l); return i; };
  cb(T('Markierungen','Marks'),B.marks,v=>{ B.marks=v; draw(); });
  cb(T('Längen','Lengths'),B.measures,v=>{ B.measures=v; draw(); });
  let ellSeg=null;
  if(B.kind==='kreis'){
    const cc=ctrl(); cc.appendChild(el('label',null,T('ziehen an','drag the')));
    ellSeg=segRow([['achsen',T('Halbachsen','semi-axes')],['brenn',T('Brennpunkten','foci')]],state.eEll,
      v=>{ state.eEll=v; if(v==='brenn'&&B.b>B.a){ const t=B.a;B.a=B.b;B.b=t; } serialize(); draw(); },'small');
    cc.appendChild(ellSeg); tools.appendChild(cc);
  }
  const btnRow=el('div','ctrl'); btnRow.style.gap='6px'; btnRow.style.marginLeft='auto';
  const bRes=el('button','btn',T('Zurücksetzen','Reset'));
  on(bRes,'click',()=>{ reset(); });
  const bCen=el('button','btn',T('Ansicht zentrieren','Centre the view'));
  on(bCen,'click',()=>{ center(); draw(); });
  btnRow.appendChild(bRes); btnRow.appendChild(bCen); tools.appendChild(btnRow);
  if(!noTools) host.appendChild(tools);
  host.appendChild(stageWrap);

  /* Koordinaten */
  let W=600,H=opt.height||(opt.compact?330:400);
  function measure(){ const r=svg.getBoundingClientRect(); if(r.width>10){W=r.width;H=r.height;}
    svg.setAttribute('viewBox','0 0 '+W+' '+H); }
  const M=p=>[(p[0]-B.view.cx)*B.view.zoom+W/2, H/2-(p[1]-B.view.cy)*B.view.zoom];
  const Mi=q=>[(q[0]-W/2)/B.view.zoom+B.view.cx, B.view.cy-(q[1]-H/2)/B.view.zoom];
  const step=()=>GRID_STEPS[B.grid];
  function snapPt(p){ const s=step(); return [Math.round(p[0]/s)*s, Math.round(p[1]/s)*s]; }
  function snapVal(x){ const s=step(); return Math.max(s,Math.round(x/s)*s); }
  function snapAll(){ if(B.kind==='kreis'){ B.a=snapVal(B.a); B.b=snapVal(B.b); } else B.pts=B.pts.map(snapPt); }
  function reset(){
    if(B.kind==='kreis'){ B.a=(opt.startA!=null?opt.startA:3); B.b=(opt.startB!=null?opt.startB:2); B.tP=0.9; }
    else B.pts=(opt.start||START_SHAPE[B.kind]||START_SHAPE.viereck).map(p=>p.slice());
    center(); changed();
  }
  function center(){
    let xs,ys;
    if(B.kind==='kreis'){ xs=[-B.a,B.a]; ys=[-B.b,B.b]; }
    else { xs=B.pts.map(p=>p[0]); ys=B.pts.map(p=>p[1]); }
    const cx=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2, cy=(Math.min.apply(null,ys)+Math.max.apply(null,ys))/2;
    const w=Math.max(1,Math.max.apply(null,xs)-Math.min.apply(null,xs)), h=Math.max(1,Math.max.apply(null,ys)-Math.min.apply(null,ys));
    const z=Math.max(8,Math.min(90,(opt.fit||0.52)*Math.min(W/w,H/h)));
    B.view={cx:cx,cy:cy-(0.06*H)/z,zoom:z};   // Figur nach oben: unten steht der Hinweistext
  }
  const ecc=()=>Math.sqrt(Math.abs(B.a*B.a-B.b*B.b));
  function ellPt(t){ return [B.a*Math.cos(t), B.b*Math.sin(t)]; }
  /* Ziehpunkte */
  function handles(){
    if(B.kind!=='kreis') return B.pts.map((p,i)=>({p:p,i:i,lbl:VNAMES[i]}));
    if(state.eEll==='brenn'){
      const e=ecc();
      return [{p:[-e,0],i:'f1'},{p:[e,0],i:'f2'},{p:ellPt(B.tP),i:'p'}];
    }
    return [{p:[B.a,0],i:'a'},{p:[0,B.b],i:'b'}];
  }
  /* Zeichnen */
  function draw(){
    if(noTools){ B.grid=state.eGrid; B.snap=state.eSnap; B.marks=state.eMarks; B.measures=state.eLen; }
    measure();
    const s=step(), z=B.view.zoom;
    let out='';
    if(s*z>4){
      const p0=Mi([0,H]), p1=Mi([W,0]);
      const x0=Math.floor(p0[0]/s)*s, x1=Math.ceil(p1[0]/s)*s;
      const y0=Math.floor(p0[1]/s)*s, y1=Math.ceil(p1[1]/s)*s;
      let g='<g stroke="#d5e2d7" stroke-width="1">';
      for(let x=x0;x<=x1+1e-9;x+=s){ const X=M([x,0])[0].toFixed(1);
        const strong=Math.abs(Math.round(x/s)%5)<1e-6;
        g+='<line x1="'+X+'" y1="0" x2="'+X+'" y2="'+H+'"'+(strong?' stroke="#bdd2c0"':'')+'/>'; }
      for(let y=y0;y<=y1+1e-9;y+=s){ const Y=M([0,y])[1].toFixed(1);
        const strong=Math.abs(Math.round(y/s)%5)<1e-6;
        g+='<line x1="0" y1="'+Y+'" x2="'+W+'" y2="'+Y+'"'+(strong?' stroke="#bdd2c0"':'')+'/>'; }
      out+=g+'</g>';
    }
    if(B.kind==='kreis'){
      const fig={kind:'round',rx:B.a,ry:B.b,rot:0};
      out+=drawSVG(figSpec(fig,B.marks?'marks':'plain'),{map:M,scale:z,inner:true,w:W,h:H});
      if(state.eEll==='brenn'){
        const e=ecc(), P=ellPt(B.tP), F1=[-e,0], F2=[e,0];
        [[F1,'F₁'],[F2,'F₂']].forEach(f=>{ const q=M(f[0]);
          out+='<line x1="'+q[0].toFixed(1)+'" y1="'+q[1].toFixed(1)+'" x2="'+M(P)[0].toFixed(1)+'" y2="'+M(P)[1].toFixed(1)+
            '" stroke="#2f6fb0" stroke-width="1.8" stroke-dasharray="5 4"/>'; });
      }
      if(B.measures){
        const lab=(t,p,dx,dy,col)=>{ const q=M(p), com='x="'+(q[0]+dx).toFixed(1)+'" y="'+(q[1]+dy).toFixed(1)+
          '" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="bold"';
          out+='<text '+com+' fill="#fff" stroke="#fff" stroke-width="3.4" stroke-linejoin="round">'+t+'</text>'+
               '<text '+com+' fill="'+col+'">'+t+'</text>'; };
        if(state.eEll==='brenn'){
          const e=ecc(), P=ellPt(B.tP);
          lab('r₁ = '+fmtNum(dist2(P,[-e,0])),[(P[0]-e)/2,P[1]/2],0,-12,'#2f6fb0');
          lab('r₂ = '+fmtNum(dist2(P,[e,0])),[(P[0]+e)/2,P[1]/2],0,-12,'#2f6fb0');
          lab('e = '+fmtNum(e),[e/2,0],0,14,'#8552c9');
        }else{
          lab('a = '+fmtNum(B.a),[B.a/2,0],0,-12,'#c0392b');
          lab('b = '+fmtNum(B.b),[0,B.b/2],20,0,'#2f6fb0');
        }
      }
    }else{
      const P=B.pts, simple=isSimple(P);
      if(simple&&B.marks){
        out+=drawSVG(figSpec({kind:'poly',pts:P},'marks',{info:polyInfo(P,BTOL)}),{map:M,scale:z,inner:true,w:W,h:H});
      }else{
        out+='<path d="M'+P.map(M).map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L ')+' Z" fill="'+
          (simple?'rgba(76,175,80,.14)':'rgba(200,60,60,.10)')+'" stroke="'+(simple?CLR.ink:'#c62828')+'" stroke-width="2.2"/>';
      }
      if(B.measures){
        for(let i=0;i<P.length;i++){
          const a=P[i], b=P[(i+1)%P.length];
          const L=dist2(a,b), m=M([(a[0]+b[0])/2,(a[1]+b[1])/2]);
          const d=nrm2(sub2(M(b),M(a))), n=[-d[1],d[0]];
          const cen=M(centroid2(P));
          const sgn=((m[0]+n[0]-cen[0])*n[0]+(m[1]+n[1]-cen[1])*n[1])>0?1:-1;
          const x=m[0]+n[0]*20*sgn, y=m[1]+n[1]*20*sgn;
          const com='x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-size="12.5" text-anchor="middle" dominant-baseline="middle"';
          out+='<text '+com+' fill="#fff" stroke="#fff" stroke-width="3.4" stroke-linejoin="round">'+fmtNum(L)+'</text>';
          out+='<text '+com+' fill="#4a5a4c">'+fmtNum(L)+'</text>';
        }
      }
    }
    // Ziehpunkte
    const HS=handles();
    const cenP=B.kind==='kreis'?M([0,0]):M(centroid2(B.pts));
    if(B.kind==='kreis'){ const q=M([0,0]);
      out+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3" fill="'+CLR.ink+'"/>'; }
    HS.forEach(h=>{ const q=M(h.p);
      const away=nrm2([q[0]-cenP[0],q[1]-cenP[1]]);
      const col=(h.i==='f1'||h.i==='f2')?'#2f6fb0':(h.i==='p'?'#8552c9':'#fff');
      out+='<circle class="hit" data-i="'+h.i+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+
        '" r="18" fill="rgba(0,0,0,0)" style="cursor:grab"/>';
      out+='<circle data-i="'+h.i+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+(B.sel===h.i?8:6.5)+
        '" fill="'+(B.sel===h.i?'#e08b00':col)+'" stroke="'+CLR.ink+'" stroke-width="2.4" pointer-events="none"/>';
      const t=h.lbl||({f1:'F₁',f2:'F₂',p:'P',a:'a',b:'b'})[h.i]||'';
      if(t){ const lx=(q[0]+away[0]*19).toFixed(1), ly=(q[1]+away[1]*19).toFixed(1);
        const lc='x="'+lx+'" y="'+ly+'" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="bold" pointer-events="none"';
        out+='<text '+lc+' fill="#fff" stroke="#fff" stroke-width="3.4" stroke-linejoin="round">'+t+'</text>';
        out+='<text '+lc+' fill="#28502a">'+t+'</text>'; }
    });
    svg.innerHTML=svgFarben(out);
    hint.textContent=(B.kind==='kreis')
      ? (state.eEll==='brenn'?T('Brennpunkte verschieben oder P über die Ellipse ziehen · Hintergrund ziehen: verschieben · Mausrad: zoomen',
                                  'Move the foci or drag P along the ellipse · drag the background: pan · mouse wheel: zoom')
                             :T('An den Griffen a und b ziehen · Hintergrund ziehen: verschieben · Mausrad: zoomen',
                                  'Drag the handles a and b · drag the background: pan · mouse wheel: zoom'))
      : T('Ecken ziehen · Hintergrund ziehen: verschieben · Mausrad / zwei Finger: zoomen',
          'Drag the corners · drag the background: pan · mouse wheel / two fingers: zoom');
    const info=analyse();
    val.textContent=EN()?gross(info.short):info.short;
    if(memo){ memo.kind=B.kind; memo.pts=B.pts.map(q=>q.slice()); memo.a=B.a; memo.b=B.b; memo.view=Object.assign({},B.view); }
    if(opt.onChange) opt.onChange(info);
  }
  function fmtNum(x){ const r=Math.round(x*10)/10; return String(r).replace('.',DEZ()); }
  function analyse(){
    if(B.kind==='kreis'){
      const fig={kind:'round',rx:B.a,ry:B.b,rot:0}, cls=classifyRound(fig,BTOL);
      return {short:nameOfCls(cls),fig:fig,cls:cls,tags:cls.tags,precise:cls.precise,
              round:{a:B.a,b:B.b,e:ecc()}};
    }
    const P=B.pts;
    if(!isSimple(P)) return {short:T('überschlagen — die Seiten kreuzen sich','self-intersecting — the sides cross'),pts:P,crossed:true};
    const fig={kind:'poly',pts:P}, cls=classify(fig,BTOL,state.trapIncl);
    if(!cls.ok||!cls.precise)
      return {short:cls.flat?T('keine Fläche — alle Ecken liegen auf einer Geraden','not a shape — all corners lie on a line'):T('keine gültige Fläche','not a valid shape'),pts:P};
    let short=nameOfCls(cls);
    if(cls.degen) short+=T(' — die gestreckte Ecke zählt nicht mit',' — the straight corner does not count');
    return {short:short,n:P.length,pts:P,fig:fig,cls:cls,degen:cls.degen,
            precise:preciseId(cls),tags:cls.tags,I:cls.I};
  }
  /* Eingabe */
  const ptrs=new Map(); let moved=false, pinch=null, pan=null;
  function local(e){ const r=svg.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
  on(svg,'pointerdown',e=>{
    try{ svg.setPointerCapture(e.pointerId); }catch(_){} ptrs.set(e.pointerId,local(e));
    if(ptrs.size===2){ const v=Array.from(ptrs.values());
      pinch={d:Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]),
             c:[(v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2], zoom:B.view.zoom, cx:B.view.cx, cy:B.view.cy};
      B.drag=null; return; }
    moved=false;
    const t=e.target, i=(t&&t.dataset)?t.dataset.i:null;
    if(i!=null&&i!==''){ B.drag=(/^\d+$/.test(i)?parseInt(i,10):i); B.sel=B.drag; pan=null; draw(); }
    else { B.drag=null; pan={at:local(e),cx:B.view.cx,cy:B.view.cy}; svg.style.cursor='grabbing'; }
  });
  on(svg,'pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;
    ptrs.set(e.pointerId,local(e));
    if(ptrs.size>=2&&pinch){ const v=Array.from(ptrs.values());
      const d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]), c=[(v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2];
      const f=Math.max(.2,Math.min(6,d/(pinch.d||1)));
      B.view.zoom=Math.max(6,Math.min(160,pinch.zoom*f));
      B.view.cx=pinch.cx-(c[0]-pinch.c[0])/B.view.zoom; B.view.cy=pinch.cy+(c[1]-pinch.c[1])/B.view.zoom;
      draw(); return; }
    if(pan){ const q=local(e);
      B.view.cx=pan.cx-(q[0]-pan.at[0])/B.view.zoom;
      B.view.cy=pan.cy+(q[1]-pan.at[1])/B.view.zoom; draw(); return; }
    if(B.drag===null||B.drag===undefined) return;
    moved=true;
    let p=Mi(local(e)); if(B.snap)p=snapPt(p);
    applyDrag(B.drag,p);
    draw();
  });
  function applyDrag(id,p){
    if(B.kind!=='kreis'){ B.pts[id]=p; return; }
    const s=step();
    if(id==='a'){ B.a=Math.max(s,B.snap?snapVal(Math.abs(p[0])):Math.abs(p[0])); }
    else if(id==='b'){ B.b=Math.max(s,B.snap?snapVal(Math.abs(p[1])):Math.abs(p[1])); }
    else if(id==='f1'||id==='f2'){
      let e=Math.abs(p[0]); if(B.snap)e=Math.round(e/s)*s;
      const sum=2*B.a;
      if(e>sum/2-s) e=Math.max(0,sum/2-s);
      B.b=Math.sqrt(Math.max(s*s/4,B.a*B.a-e*e));
    }
    else if(id==='p'){
      const e=ecc();
      const sum=dist2(p,[-e,0])+dist2(p,[e,0]);
      let a=sum/2; if(B.snap)a=Math.max(e+s,Math.round(a/s)*s); else a=Math.max(e+s*0.5,a);
      B.a=a; B.b=Math.sqrt(Math.max(s*s/4,a*a-e*e));
      B.tP=Math.atan2(p[1]/(B.b||1),p[0]/(B.a||1));
    }
  }
  on(svg,'pointerup',e=>{
    ptrs.delete(e.pointerId); if(ptrs.size<2)pinch=null;
    pan=null; svg.style.cursor='';
    if(B.drag!=null){ B.drag=null; if(moved) changed(); }
  });
  on(svg,'pointercancel',e=>{ ptrs.delete(e.pointerId); B.drag=null; pinch=null; pan=null; svg.style.cursor=''; });
  on(svg,'wheel',e=>{ e.preventDefault();
    const before=Mi(local(e));
    B.view.zoom=Math.max(6,Math.min(160,B.view.zoom*(e.deltaY<0?1.12:1/1.12)));
    const after=Mi(local(e));
    B.view.cx+=before[0]-after[0]; B.view.cy+=before[1]-after[1]; draw(); },{passive:false});
  function changed(){ draw(); }
  if(memo&&memo.kind===B.kind&&memo.pts){ B.pts=memo.pts.map(q=>q.slice()); B.a=memo.a; B.b=memo.b;
    measure(); if(memo.view) B.view=Object.assign({},memo.view); else center(); }
  else center();
  measure(); draw();
  window.addEventListener('resize',()=>{ measure(); draw(); });
  return {getFig:()=>analyse().fig||null, set:p=>{B.pts=p.slice();center();draw();},
          setKind:k=>{ B.kind=k; if(k!=='kreis')B.pts=(START_SHAPE[k]||START_SHAPE.viereck).map(q=>q.slice());
            center(); draw(); },
          redraw:draw, info:analyse, el:stageWrap};
}

const BASE_TABS=[['dreieck','Dreieck'],['viereck','Viereck'],['fuenfeck','Fünfeck'],
                 ['sechseck','Sechseck'],['kreis','Kreis']];
const BASE_TABS_EN={dreieck:'Triangle',viereck:'Quadrilateral',fuenfeck:'Pentagon',sechseck:'Hexagon',kreis:'Circle'};
const NUM_ADJ_EN={3:'triangular',4:'quadrilateral',5:'pentagonal',6:'hexagonal',7:'heptagonal',8:'octagonal'};
const NUM_NOUN_EN={3:'triangle',4:'quadrilateral',5:'pentagon',6:'hexagon',7:'heptagon',8:'octagon'};
const NUM_ADJ={3:'dreieckige',4:'viereckige',5:'fünfeckige',6:'sechseckige',7:'siebeneckige',8:'achteckige'};
const NUM_NOUN={3:'Dreieck',4:'Viereck',5:'Fünfeck',6:'Sechseck',7:'Siebeneck',8:'Achteck'};
const DAT={m:'einem',f:'einer',n:'einem'};
/* genaueste Bezeichnung der Grundfläche, z. B. „Trapez" statt nur „Viereck" */
function baseNameOf(pts,round){
  if(round) return T('Kreis','circle');
  if(EN()){
    const n=pts.length;
    if(n===3||n===4){
      const c=classify({kind:'poly',pts:pts},BTOL,state.trapIncl);
      if(c.ok&&c.precise) return nameOfCls(c);
    }
    return NUM_NOUN_EN[n]||(n+'-gon');
  }
  const n=pts.length;
  if(n===3||n===4){
    const c=classify({kind:'poly',pts:pts},BTOL,state.trapIncl);
    if(c.ok&&c.precise) return nameOfCls(c);
  }
  return NUM_NOUN[n]||(n+'-Eck');
}
function baseNameDat(pts,round){
  const nm=baseNameOf(pts,round);
  if(EN()) return anEn(nm)+nm.replace(/\s*\(.*\)/,'');
  if(/Kreis/.test(nm)) return 'einem Kreis';
  const id=(/Drache/.test(nm))?'drache':Object.keys(NAMES).filter(k=>NAMES[k]===nm)[0];
  const g=id?genOf(id):'n';
  // im Dativ wird das Adjektiv schwach gebeugt: „einem spitzwinkligen Dreieck"
  let nn=nm.replace(/\s*\(.*\)/,'');
  if(id==='drache') nn=(/konkav/.test(nm)?'konkaven ':'')+'Drachen';
  else nn=nn.replace(/es (Dreieck|Viereck)$/,'en $1');
  return DAT[g]+' '+nn;
}

function baseKindOf(pts,tol){
  const I=polyInfo(pts,tol||0.25);
  const n=pts.length;
  if(n===4&&I.right.length===4) return I.eqGroups.length===1?'quadrat':'rechteck';
  return null;
}
/* Name des gebauten Körpers */
function bodyNameOf(E,base2){
  const round=(E.baseKind==='kreis'), spitz=(E.taper===1);
  if(EN()){
    if(E.h<0.05) return {name:'not a solid yet',extra:'At height 0 there is only the base — drag it upwards.'};
    if(round){
      const nm=spitz?'cone':'cylinder';
      return {name:gross((E.skew?'oblique ':'')+nm), extra:E.twist?'twisted — the lines on the curved surface are twisted':''};
    }
    const n=base2.length, bk=baseKindOf(base2);
    if(spitz) return {name:gross((E.skew?'oblique ':'')+'pyramid'),
                      extra:'with '+baseNameDat(base2,false)+' as its base'+(E.twist?', twisted':'')};
    if(E.twist) return {name:'Twisted solid', extra:'The base and the top are rotated against each other — not a prism'};
    if(!E.skew&&bk){
      const L=[]; for(let i=0;i<n;i++) L.push(dist2(base2[i],base2[(i+1)%n]));
      const gleich=L.every(x=>Math.abs(x-L[0])<=0.01*L[0]);
      if(bk==='quadrat'&&gleich&&Math.abs(E.h-L[0])<=0.01*Math.max(E.h,L[0]))
        return {name:'Cube', extra:'all twelve edges are equal — a special cuboid'};
      return {name:'Cuboid', extra:'a prism with '+baseNameDat(base2,false)+' as its base'};
    }
    return {name:gross((E.skew?'oblique ':'right ')+'prism'), extra:'with '+baseNameDat(base2,false)+' as its base'};
  }
  if(E.h<0.05) return {name:'noch kein Körper',extra:'Bei der Höhe 0 ist nur die Grundfläche da — zieh sie nach oben.'};
  const sk=E.skew?(spitz?'schiefe':'schiefer'):'';
  if(round){
    const nm=spitz?'Kegel':'Zylinder';
    const full=(E.skew?'schiefer ':'')+nm;
    return {name:full, extra:E.twist?'tordiert — die Mantellinien sind verdreht':''};
  }
  const n=base2.length, bk=baseKindOf(base2);
  const adj=(bk==='quadrat')?'quadratische':(bk==='rechteck'?'rechteckige':(NUM_ADJ[n]||n+'-eckige'));
  if(spitz){
    return {name:(E.skew?'schiefe ':'')+'Pyramide',
            extra:'mit '+baseNameDat(base2,false)+' als Grundfläche'+(E.twist?', tordiert':'')};
  }
  if(E.twist) return {name:'tordierter Körper', extra:'Grund- und Deckfläche sind gegeneinander verdreht — kein Prisma'};
  if(!E.skew&&bk){
    // Würfel oder Quader?
    const L=[]; for(let i=0;i<n;i++) L.push(dist2(base2[i],base2[(i+1)%n]));
    const gleich=L.every(x=>Math.abs(x-L[0])<=0.01*L[0]);
    if(bk==='quadrat'&&gleich&&Math.abs(E.h-L[0])<=0.01*Math.max(E.h,L[0]))
      return {name:'Würfel', extra:'alle zwölf Kanten sind gleich lang — ein besonderer Quader'};
    return {name:'Quader', extra:'ein Prisma mit '+baseNameDat(base2,false)+' als Grundfläche'};
  }
  return {name:(E.skew?'schiefes ':'gerades ')+'Prisma',
          extra:'mit '+baseNameDat(base2,false)+' als Grundfläche'};
}

  const big=el('div','big-name','—'); pan.appendChild(big);
  const extra=el('div','muted small'); pan.appendChild(extra);
  const props=el('ul','props-list'); pan.appendChild(props);
  c3.appendChild(pan);

  let baseB=null;
  function buildBase(){
    bhost.innerHTML='';
    const kind=(E.baseKind==='kreis')?'kreis':E.baseKind;
    E.baseMemo=E.baseMemo||{};
    if(E.baseMemo.kind&&E.baseMemo.kind!==kind) E.baseMemo={};
    baseB=makeBuilder(bhost,{kind:kind,height:200,quiet:true,noTools:true,fit:0.42,startA:3,startB:3,memo:E.baseMemo,
      start:(kind==='viereck')?START_SHAPE.quadrat:null,onChange:info=>{
      if(info.round){ E.a=info.round.a; E.b=info.round.b; }
      else if(info.pts&&info.pts.length>=3) E.pts=info.pts.map(p=>p.slice());
      render();
    }});
  }
  function base2(){
    if(E.baseKind==='kreis') return circPts(1,48).map(p=>[p[0]*E.a,p[1]*E.b]);
    return E.pts.map(p=>p.slice());
  }
  /* ---- zeichnen ---- */
  let W=600,H=400;
  function measure(){ const r=svg.getBoundingClientRect(); if(r.width>10){W=r.width;H=r.height;}
    svg.setAttribute('viewBox','0 0 '+W+' '+H); }
  function buildSolid(){
    const b=base2(), round=(E.baseKind==='kreis');
    const v=shVec();
    const sh=E.skew?[v[0]/Math.max(0.001,E.h),v[1]/Math.max(0.001,E.h)]:null;
    const tw=E.twist?E.tw:0;
    const B=buildBody({base2:b,h:E.h,taper:E.taper,shear:sh,twist:tw,round:round});
    return {kind:'solid',id:'prisma',h:E.h,round:round,taper:E.taper,skew:E.skew,twist:E.twist,
            schnitt:E.schnittAn?E.schnitt:null,
            V:B.V,F:B.F,n:B.n,apex:B.apex,baseN:b.length};
  }
  function baseCen(){ const b=base2(), c=[0,0];
    b.forEach(p=>{ c[0]+=p[0]/b.length; c[1]+=p[1]/b.length; });
    return [c[0],c[1],0]; }
  function viewOf(){ const v=view3D(E.cam.th,E.cam.ph,baseCen());
    v.gridStep=GRID_STEPS[state.eGrid]||1;   // Raster wie in der Grundflaeche
    return v; }
  function initCamera(S){
    const th=(E.cam&&E.cam.th)||-0.62, ph=(E.cam&&E.cam.ph!=null)?E.cam.ph:0.42;
    const VW=view3D(th,ph,baseCen());
    const P=S.V.map(VW.proj);
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    P.forEach(q=>{ x0=Math.min(x0,q[0]); x1=Math.max(x1,q[0]); y0=Math.min(y0,q[1]); y1=Math.max(y1,q[1]); });
    const bw=Math.max(0.6,x1-x0), bh=Math.max(0.6,y1-y0);
    const scale=Math.max(6,Math.min(400,0.66*Math.min(W/bw,H/bh)));
    E.cam={th:th,ph:ph,scale:scale,
           ox:W/2-((x0+x1)/2)*scale, oy:H*0.46+((y0+y1)/2)*scale};
  }
  function render(){
    measure();
    const S=buildSolid(); E.S=S;
    if(!E.cam) initCamera(S);
    const VW=viewOf();
    const spec=solidSpec(S,state.eLen?'label':(state.eMarks?'marks':'plain'),VW);
    const cam=E.cam, M=p=>[cam.ox+p[0]*cam.scale, cam.oy-p[1]*cam.scale];
    let out=drawBody(spec,{w:W,h:H,stroke:CLR.ink,fill:CLR.fill,cls:'fig'},M,cam.scale,true);
    // Griffe: oben Höhe (und Schiefe), am Rand die Torsion
    const tp=topPoint(S), q=M(VW.proj(tp));
    if(E.twist&&E.baseKind!=='kreis'){
      const rq=M(VW.proj(twistPos()));
      out+='<circle class="hit" data-i="t" cx="'+rq[0].toFixed(1)+'" cy="'+rq[1].toFixed(1)+
        '" r="18" fill="rgba(0,0,0,0)" style="cursor:grab"/>';
      out+='<circle cx="'+rq[0].toFixed(1)+'" cy="'+rq[1].toFixed(1)+'" r="6" fill="#f6f0ff" stroke="#7a5cb0"'+
        ' stroke-width="2.4" pointer-events="none"/>';
    }
    out+='<circle class="hit" data-i="h" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="20" fill="rgba(0,0,0,0)" style="cursor:ns-resize"/>';
    out+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="7" fill="#fff" stroke="'+CLR.ink+
      '" stroke-width="2.4" pointer-events="none"/>';
    out+='<path d="M'+(q[0]-4).toFixed(1)+' '+(q[1]+1).toFixed(1)+' l4 -5 l4 5" fill="none" stroke="'+CLR.ink+
      '" stroke-width="1.6" pointer-events="none"/>';
    svg.innerHTML=svgFarben(out);
    // Steckbrief
    const nm=bodyNameOf(E,base2());
    val.textContent=nm.name; big.textContent=nm.name; extra.textContent=nm.extra||'';
    props.innerHTML='';
    const li=x=>props.appendChild(el('li',null,x));
    li(T('Höhe: ','Height: ')+fmt2(E.h));
    if(E.baseKind==='kreis'){
      li(T('Grundfläche: ','Base: ')+(Math.abs(E.a-E.b)<0.01?T('Kreis mit r = ','circle with r = ')+fmt2(E.a):T('Ellipse mit a = ','ellipse with a = ')+fmt2(E.a)+T(' und b = ',' and b = ')+fmt2(E.b)));
      li(E.taper===1?T('Der Mantel läuft in einer Spitze zusammen.','The curved surface meets at an apex.'):T('Grund- und Deckfläche sind deckungsgleiche Kreise.','The base and the top are congruent circles.'));
    }else{
      /* Beim Tordieren wird der Mantel intern aus zwölf Schichten gebaut. Die
         Zwischenpunkte sind aber nur Hilfspunkte - der Körper hat nach wie vor
         so viele Ecken, Kanten und Flächen wie das unverdrehte Vorbild. */
      let eck, kan, fla;
      const nb=base2().length;
      if(E.twist){ eck=E.taper===1?nb+1:2*nb; kan=E.taper===1?2*nb:3*nb; fla=E.taper===1?nb+1:nb+2; }
      else {
        const es=new Set(); S.F.forEach(f=>f.idx.forEach((a,i)=>{ const b=f.idx[(i+1)%f.idx.length];
          es.add(Math.min(a,b)+'-'+Math.max(a,b)); }));
        eck=S.V.length; kan=es.size; fla=S.F.length;
      }
      li(T('Ecken: ','Vertices: ')+eck+T(' · Kanten: ',' · edges: ')+kan+T(' · Flächen: ',' · faces: ')+fla);
      li(T('Grundfläche: ','Base: ')+baseNameOf(base2(),false));
      if(E.taper===1) li(T('Alle Seitenflächen sind Dreiecke mit einer gemeinsamen Spitze.','All the side faces are triangles with a common apex.'));
      else if(!E.twist) li(T('Grund- und Deckfläche sind deckungsgleich und zueinander parallel.','The base and the top are congruent and parallel to each other.'));
      if(!E.skew&&!E.twist&&E.taper===0) li(T('Die Seitenkanten stehen senkrecht auf der Grundfläche.','The side edges are perpendicular to the base.'));
    }
    if(E.schnittAn){
      const k=E.taper?Math.max(0,1-E.schnitt):1;
      li(E.taper
        ? T('Schnitt auf Höhe '+fmt2(E.schnitt*E.h)+': zur Grundfläche ähnlich im Verhältnis '+fmt2(k)+' : 1.',
            'Cross-section at height '+fmt2(E.schnitt*E.h)+': similar to the base in the ratio '+fmt2(k)+' : 1.')
        : T('Schnitt auf Höhe '+fmt2(E.schnitt*E.h)+': auf jeder Höhe deckungsgleich zur Grundfläche'+(E.twist?' (nur verdreht).':'.'),
            'Cross-section at height '+fmt2(E.schnitt*E.h)+': congruent to the base at every height'+(E.twist?' (just rotated).':'.')));
    }
    hs.value=Math.round(E.h*10); hv.textContent=fmt2(E.h);
    [[cSk,skR,E.skew],[cSk,skD,E.skew],[cTw,twR,E.twist]].forEach(x=>{
      x[1].disabled=!x[2]; x[0].style.opacity=x[2]?'1':'.45'; });
    twBox.disabled=(E.baseKind==='kreis');
    twBox.parentNode.parentNode.style.opacity=twBox.disabled?'.45':'1';
    twBox.title=twBox.disabled?T('Ein Kreis sieht verdreht genauso aus.','A circle looks the same when rotated.'):'';
    skR.value=Math.round(E.shMag*10);
    let ang=E.shDir; while(ang<0)ang+=2*Math.PI;
    skD.value=Math.round((ang%(2*Math.PI))/(2*Math.PI)*36);
    twR.value=Math.round(E.tw*R2D); twV.textContent=Math.round(E.tw*R2D)+'°';
    scR.value=Math.round(E.schnitt*100); scV.textContent=fmt2(E.schnitt*E.h);
    scR.disabled=!E.schnittAn; cSc.style.opacity=E.schnittAn?'1':'.45';
  }
  /* Griffpunkt für die Torsion: Randpunkt auf halber Höhe — genau so gebaut,
     wie buildBody die Schicht dort berechnet */
  function twistPos(){
    const b=base2(), t=0.5, sc=E.taper?Math.max(1-t,0.0015):1;
    const a=(E.twist?E.tw:0)*t;
    const A=apexFor(b), rA=rot2(A,a), q=rot2(b[0],a), v=shVec();
    return [(E.taper?rA[0]+(q[0]-rA[0])*sc:q[0]*sc)+(E.skew?v[0]*t:0),
            (E.taper?rA[1]+(q[1]-rA[1])*sc:q[1]*sc)+(E.skew?v[1]*t:0), t*E.h];
  }
  function topPoint(S){
    if(S.apex!=null) return S.V[S.apex];
    const n=S.n, c=[0,0,0];
    for(let i=0;i<n;i++){ const p=S.V[S.V.length-n+i]; c[0]+=p[0]/n; c[1]+=p[1]/n; c[2]+=p[2]/n; }
    return c;
  }
  /* ---- Bedienung: drehen, verschieben, zoomen, Höhe ziehen ---- */
  const ptr=new Map(); let rot=null, mv=null, pinch=null, hdrag=null;
  const rel=e=>{ const r=svg.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
  on(svg,'contextmenu',e=>e.preventDefault());
  on(svg,'pointerdown',e=>{
    e.preventDefault();
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    const p=rel(e); ptr.set(e.pointerId,p);
    if(ptr.size===2){ rot=null; mv=null; hdrag=null; const v=Array.from(ptr.values());
      pinch={d:Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]),c:[(v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2]};
      return; }
    const t=e.target;
    if(t&&t.dataset&&(t.dataset.i==='h'||t.dataset.i==='t')){ hdrag={kind:t.dataset.i,y:p[1],h:E.h}; return; }
    if(e.button===2||e.shiftKey||E.view!=='d3'){ mv={x:p[0],y:p[1]}; svg.style.cursor='move'; }
    else { rot={x:p[0],y:p[1]}; svg.style.cursor='grabbing'; }
  });
  on(svg,'pointermove',e=>{
    if(!ptr.has(e.pointerId))return;
    const p=rel(e); ptr.set(e.pointerId,p); const cam=E.cam;
    if(ptr.size>=2&&pinch){ const v=Array.from(ptr.values());
      const nd=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);
      const nc=[(v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2], k=nd/(pinch.d||1);
      cam.ox=nc[0]+(cam.ox-pinch.c[0])*k; cam.oy=nc[1]+(cam.oy-pinch.c[1])*k;
      cam.scale=Math.max(4,Math.min(2000,cam.scale*k));
      pinch={d:nd,c:nc}; render(); return; }
    if(hdrag){ dragHandle(hdrag,p); render(); return; }
    if(mv){ cam.ox+=p[0]-mv.x; cam.oy+=p[1]-mv.y; mv={x:p[0],y:p[1]}; render(); return; }
    if(rot){ cam.th-=(p[0]-rot.x)*0.011;
      cam.ph=Math.max(-Math.PI/2+0.002,Math.min(Math.PI/2-0.002,cam.ph+(p[1]-rot.y)*0.009));
      rot={x:p[0],y:p[1]}; render(); }
  });
  const up=e=>{ ptr.delete(e.pointerId); if(ptr.size<2)pinch=null;
    if(!ptr.size){ rot=null; mv=null; hdrag=null; svg.style.cursor=''; } };
  on(svg,'pointerup',up); on(svg,'pointercancel',up); on(svg,'pointerleave',up);
  /* Bildpunkt -> Welt, wie in volumen.html: die Blickrichtung liefert zwei
     Gleichungen, die Tiefenkomponente der Schiefe bleibt dabei stehen. */
  function screenXY(p){ const c=E.cam; return [(p[0]-c.ox)/c.scale, (c.oy-p[1])/c.scale]; }
  function dragHandle(hd,p){
    const c=E.cam, sa=Math.sin(c.th), ca=Math.cos(c.th), se=Math.sin(c.ph), ce=Math.cos(c.ph);
    const UU=[-sa,ca], WW=[ca,sa];                 // Rechts- und Tiefenrichtung am Boden
    const XY=screenXY(p);
    if(hd.kind==='t'){                       // Torsion: Randpunkt auf halber Höhe
      if(Math.abs(se)<0.08) return;
      const t=0.5, bc=baseCen();
      // Bildpunkt zurück auf die Ebene z = t·h rechnen (Bezugspunkt ist die Grundmitte)
      const X=XY[0]+ (bc[0]*UU[0]+bc[1]*UU[1]);
      const Y=XY[1]+ (-se*(bc[0]*WW[0]+bc[1]*WW[1]));
      const rest=Y-ce*(t*E.h);
      const alpha=X, beta=-rest/se;
      let q=[alpha*UU[0]+beta*WW[0], alpha*UU[1]+beta*WW[1]];
      const vv=shVec();
      if(E.skew) q=[q[0]-vv[0]*t, q[1]-vv[1]*t];
      const b=base2();
      const a0=Math.atan2(b[0][1],b[0][0]);
      let ang=Math.atan2(q[1],q[0])-a0;
      while(ang>Math.PI)ang-=2*Math.PI; while(ang<-Math.PI)ang+=2*Math.PI;
      E.tw=Math.max(-Math.PI/2,Math.min(Math.PI/2,ang/t));
      return;
    }
    const X=XY[0], Y=XY[1];
    const v0=shVec();
    const beta=E.skew?(v0[0]*WW[0]+v0[1]*WW[1]):0;
    if(Math.abs(ce)>0.05){
      let hh=(Y+se*beta)/ce;
      E.h=Math.max(0,Math.min(9,Math.round(hh*10)/10));
    }
    if(E.skew){ const alpha=X;
      let sx=alpha*UU[0]+beta*WW[0], sy=alpha*UU[1]+beta*WW[1];
      let m=Math.hypot(sx,sy); if(m>3){ sx*=3/m; sy*=3/m; m=3; }
      E.shMag=Math.min(3,m); E.shDir=Math.atan2(sy,sx);
    }
  }
  on(svg,'wheel',e=>{ e.preventDefault(); const p=rel(e), cam=E.cam, k=e.deltaY<0?1.12:1/1.12;
    cam.ox=p[0]+(cam.ox-p[0])*k; cam.oy=p[1]+(cam.oy-p[1])*k;
    cam.scale=Math.max(4,Math.min(2000,cam.scale*k)); render(); },{passive:false});
  let lastW=0,lastH=0;
  function refit(){
    if($('#mode-erkundung').classList.contains('hidden')) return;
    const r=svg.getBoundingClientRect();
    if(r.width>10&&(Math.abs(r.width-lastW)>2||Math.abs(r.height-lastH)>2)){
      lastW=r.width; lastH=r.height; measure(); E.cam=null;   // neu einpassen statt Leerraum lassen
    }
    render();
  }
  window.addEventListener('resize',refit);
  if(typeof ResizeObserver!=='undefined'){ try{ new ResizeObserver(refit).observe(svg); }catch(e){} }

  buildBase(); measure(); render();
  erkBuilder={redraw:render,E:E,setBase:p=>{E.pts=p.map(q=>q.slice());render();}};
}
/* =======================================================================
   9. Start
   ======================================================================= */
function setMode(m){
  state.mode=m;
  $$('#mode-switch button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  $('#mode-uebung').classList.toggle('hidden',m!=='uebung');
  $('#mode-erkundung').classList.toggle('hidden',m!=='erkundung');
  /* Der Schwierigkeitsschalter gehört zu den Aufgaben, nicht zum Erkunden. */
  $$('.nur-uebung').forEach(n=>n.classList.toggle('hidden',m!=='uebung'));
  if(m==='erkundung'){ if(!erkBuilt) buildErkundung(); else if(erkBuilder) erkBuilder.redraw(); }
  serialize();
}
/* ══════════════════════════════════════════════════════════════════════════
   Sprach- und Themawechsel
   Die Aufgabe haengt am Startwert (task.seed) – neu abgeleitet kommt dieselbe
   Aufgabe in der neuen Sprache heraus. Bereits gegebene Antworten werden
   danach in derselben Reihenfolge noch einmal ausgeloest (data-merk).
   ══════════════════════════════════════════════════════════════════════════ */
let wiederholen=false;
document.addEventListener('click',e=>{
  if(wiederholen||!task) return;
  const n=e.target&&e.target.closest?e.target.closest('#taskArea [data-merk]'):null;
  if(n) (task.klicks||(task.klicks=[])).push(n.dataset.merk);
},true);
function neuZeichnen(){
  try{
    buildPick(); buildSettings(); buildStudentPanel();
    if(task){
      const k=(task.klicks||[]).slice(), gezaehlt=task.counted, hilfe=!!document.querySelector('#taskArea .help-box');
      task.claim=null;                 // Behauptung in der neuen Sprache neu bilden (gleicher Zufall)
      deriveTask(task); renderTask();
      wiederholen=true; task.klicks=[];
      k.forEach(key=>{ const n=document.querySelector('#taskArea [data-merk="'+key+'"]');
        if(n){ n.click(); task.klicks.push(key); } });
      wiederholen=false;
      task.counted=gezaehlt;
    } else renderTask();
    if(erkBuilt){ erkBuilt=false; if(state.mode==='erkundung') buildErkundung(); }
  }catch(e){ wiederholen=false; }
}
window.addEventListener('tl-sprache', neuZeichnen);
window.addEventListener('tl-theme',   neuZeichnen);

/* ── Kontext für den Fehler-melden-Knopf ─────────────────────────────────── */
window.fehlerKontext=function(){
  // Die Einstellungen stehen bereits in der URL; hier zaehlt die Aufgabe selbst.
  if(state.mode==='erkundung') return 'mode=erkundung'+(IS_F?' shape='+state.eShape:'');
  if(!task) return T('keine Aufgabe','no task');
  const z=['seed='+task.seed, 'type='+task.type, 'target='+task.target, 'precise='+(task.precise||'?')];
  if(task.view) z.push('view='+task.view);
  if(task.claim) z.push('claim='+(task.claim.kind==='text'?task.claim.text:task.claim.kind+':'+(task.claim.b||'')));
  if(task.klicks&&task.klicks.length) z.push('clicks='+task.klicks.join(','));
  return z.join('; ');
};

function boot(){
  deserialize();
  buildAnc();
  buildPick(); buildSettings(); buildStudentPanel();
  $$('#mode-switch button').forEach(b=>on(b,'click',()=>setMode(b.dataset.mode)));
  newTask(); renderTask();
  setMode(state.mode);
  serialize();
}
document.addEventListener('DOMContentLoaded',boot);

/* ── Schwierigkeitsschalter über der Aufgabe ─────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  stufeSetzen(state.diff || 'normal');
  document.querySelectorAll('input[name="diff"]').forEach(e =>
    e.addEventListener('change', () => {
      if (!e.checked) return;
      if (e.value !== 'indiv'){
        stufeAnwenden(e.value);
        buildSettings(); buildStudentPanel(); serialize();
        newTask(); renderTask();
      } else {
        state.diff = 'indiv'; serialize();
        if (window.abEinstellungenOeffnen) abEinstellungenOeffnen('#teacherSettings');
        else { const d = document.getElementById('teacherSettings'); if (d) d.open = true; }
      }
    }));
});

</script>
