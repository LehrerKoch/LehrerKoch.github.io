function dirDifferSteps(g, h){
  const st = [
    step('Ansatz für die Parallelität', 'Zwei Geraden sind genau dann parallel, wenn ihre Richtungsvektoren '
      + 'Vielfache voneinander sind. Es müsste also ein \\(k\\) geben mit',
      TX.vec(h.u) + ' = k\\cdot ' + TX.vec(g.u)),
    step('Zeilenweise aufschreiben', 'Das sind drei Bedingungen, die alle dasselbe \\(k\\) liefern müssten:',
      eqPairTeX(ROM, [], ['k'], [0, 1, 2].map(i => ({ lc: h.u[i], rc: 0, r: [g.u[i]] }))))
  ];
  /* nur Zeilen mit einem echten Bruch kommen in die Tabelle; Zeilen mit einer
     Null im Richtungsvektor werden darunter im Text erklärt */
  const zeilen = [], hinweise = [];
  [0, 1, 2].forEach(i => {
    if (eq0(g.u[i])){
      hinweise.push(eq0(h.u[i])
        ? 'In Zeile ' + ROM[i] + ' steht in beiden Vektoren eine \\(0\\) – diese Zeile ist für jedes \\(k\\) erfüllt.'
        : 'In Zeile ' + ROM[i] + ' steht bei \\(\\vec{u}_g\\) eine \\(0\\), bei \\(\\vec{u}_h\\) aber \\('
          + numTeX(h.u[i]) + '\\) – das kann kein \\(k\\) erfüllen.');
      return;
    }
    const k2 = snap(h.u[i] / g.u[i]);
    zeilen.push('k_{' + ROM[i] + '} &=& \\frac{' + numTeX(h.u[i]) + '}{' + numTeX(g.u[i]) + '} &=& ' + numTeX(k2));
  });
  const verschieden = zeilen.length > 1;
  st.push(step('Jede Zeile einzeln nach \\(k\\) auflösen', '',
    zeilen.length ? '\\begin{array}{r c l c l}' + zeilen.join(' \\\\ ') + '\\end{array}' : '',
    hinweises(hinweise, verschieden)));
  return st;
}

/** Punktprobe: liegt der Stützpunkt von B auf der Geraden A? */
function probeSteps(A, B, nameA, nameB, drauf){
  const st = [];
  st.push(step('Punktprobe', 'Parallele Geraden sind entweder identisch oder echt parallel. '
    + 'Deshalb prüft man, ob der Stützpunkt von \\(' + nameB + '\\) auch auf \\(' + nameA + '\\) liegt:',
    TX.vec(B.p) + ' = ' + TX.vec(A.p) + ' + ' + par() + '\\cdot ' + TX.vec(A.u)));
  st.push(step('Zeilenweise aufschreiben', '',
    eqPairTeX(ROM, [], [par()], [0, 1, 2].map(k => ({ lc: B.p[k], rc: A.p[k], r: [A.u[k]] })))));
  const solvable = [0, 1, 2].filter(k => !eq0(A.u[k]));
  const fixedBad = [0, 1, 2].filter(k => eq0(A.u[k]) && !eqN(A.p[k], B.p[k]));
  if (fixedBad.length){
    st.push(step('Widerspruch in Zeile ' + ROM[fixedBad[0]],
      'Diese Zeile enthält kein \\(' + par() + '\\); die Koordinaten müssten übereinstimmen:',
      numTeX(B.p[fixedBad[0]]) + ' \\neq ' + numTeX(A.p[fixedBad[0]]), OKNOTE(false)));
  } else if (solvable.length){
    /* Welche Zeile aufgelöst wird, ist frei – die Probe läuft danach mit der
       ganzen Vektorgleichung, also über alle drei Zeilen gleichzeitig. */
    st.push(stepSwitch('Welche Zeile möchtest du nach \\(' + par() + '\\) auflösen?',
      solvable.map(i => {
        const sol = solveT(A.p[i], A.u[i], B.p[i]);
        const probe = V.add(A.p, V.mul(A.u, sol.t));
        const passt = V.same(probe, B.p);
        return { label: 'Zeile ' + ROM[i], steps: [
          step('Zeile ' + ROM[i] + ' auflösen', 'Aus dieser Zeile ergibt sich ein Parameterwert:', sol.tex),
          step('Probe mit der ganzen Gleichung', 'Der Wert wird in die Geradengleichung eingesetzt. '
            + 'Nur wenn dabei genau der gesuchte Punkt herauskommt, stimmen auch die übrigen Zeilen:',
            TX.vec(A.p) + ' + ' + paren(sol.t) + '\\cdot ' + TX.vec(A.u) + ' = ' + TX.vec(probe)
            + (passt ? ' = ' : ' \\neq ') + TX.vec(B.p),
            passt ? '✓ Es kommt genau der Stützpunkt von \\(' + nameB + '\\) heraus.'
                  : '✗ Es kommt ein anderer Punkt heraus.')
        ] };
      })));
  }
  st.push(step('Ergebnis der Punktprobe', 'Der Stützpunkt von \\(' + nameB + '\\) liegt '
    + (drauf ? '' : 'nicht ') + 'auf \\(' + nameA + '\\).', ''));
  return st;
}

/* ---------- Lösungsweg: Gleichsetzen ---------- */
/* ---------- Bausteine ---------- */
function gleichsetzenSteps(g, h){
  return [
    step('Geradengleichungen gleichsetzen', 'Ein gemeinsamer Punkt müsste sich mit beiden Gleichungen '
      + 'darstellen lassen. Also setzt man die rechten Seiten gleich:',
      TX.vec(g.p) + ' + ' + par() + '\\cdot ' + TX.vec(g.u) + ' = ' + TX.vec(h.p) + ' + ' + par2() + '\\cdot ' + TX.vec(h.u)),
    step('Zeilenweise aufschreiben', 'Das ergibt drei Gleichungen mit zwei Unbekannten:',
      eqPairTeX(ROM, [par()], [par2()], [0, 1, 2].map(m =>
        ({ lc: g.p[m], l: [g.u[m]], rc: h.p[m], r: [h.u[m]] }))))
  ];
}
/** Schritte für ein Zeilenpaar: sortieren, lösen, dritte Zeile prüfen */
function paarSteps(g, h, i, j, mitAntwort){
  const k = [0, 1, 2].filter(x => x !== i && x !== j)[0], d = V.sub(h.p, g.p);
  const st = [ step('Zeilen ' + ROM[i] + ' und ' + ROM[j] + ' sortieren',
    'Die Parameter kommen nach links, die Zahlen nach rechts:',
    sysTeX([par(), par2()], [{ coef: [g.u[i], -h.u[i]], rhs: d[i] }, { coef: [g.u[j], -h.u[j]], rhs: d[j] }],
           [ROM[i] + "'", ROM[j] + "'"])) ];
  const sol = solve2(g.u[i], -h.u[i], d[i], g.u[j], -h.u[j], d[j]);
  sol.steps.forEach(x => st.push(x));
  const pz = probeZeileTeX(g.p[k], g.u[k], sol.t, h.p[k], h.u[k], sol.s);
  const passt = pz.ok;
  st.push(step('Probe in Zeile ' + ROM[k], 'Die dritte Zeile wurde noch nicht benutzt – sie entscheidet:',
    pz.tex, OKNOTE(passt)));
  if (mitAntwort && passt){
    const P = V.add(g.p, V.mul(g.u, sol.t));
    st.push(step('Schnittpunkt berechnen', 'Der Parameterwert wird in die Gleichung von \\(g\\) eingesetzt:',
      TX.arrow('OS') + ' = ' + TX.vec(g.p) + ' + ' + paren(sol.t) + '\\cdot ' + TX.vec(g.u) + ' = ' + TX.vec(P)));
  }
  return { steps: st, passt: passt, sol: sol };
}
/** Umschalter über alle brauchbaren Zeilenpaare */
function paarSwitch(g, h, rel, mitAntwort){
  const prs = rel.pairs || pairs().filter(pr => !eq0(det2(g, h, pr[0], pr[1])));
  return stepSwitch('Zwei der drei Zeilen genügen – welche möchtest du benutzen?',
    prs.map(pr => ({ label: 'Zeilen ' + ROM[pr[0]] + ' und ' + ROM[pr[1]],
                     steps: paarSteps(g, h, pr[0], pr[1], mitAntwort).steps })));
}
/** Umschalter über die beiden möglichen Punktproben */
function probeSwitch(g, h, drauf){
  return stepSwitch('Welchen Stützpunkt möchtest du einsetzen?', [
    { label: 'Stützpunkt von h in g', steps: probeSteps(g, h, 'g', 'h', drauf) },
    { label: 'Stützpunkt von g in h', steps: probeSteps(h, g, 'h', 'g', drauf) }
  ]);
}
/** Beim Gleichsetzen paralleler Geraden fallen beide Parameter weg */
function entartetStep(g, h){
  const i = [0, 1, 2].find(x => !eq0(g.u[x]));
  if (i == null) return step('Hinweis', 'Der Richtungsvektor von \\(g\\) ist der Nullvektor.', '');
  const j = [0, 1, 2].find(x => x !== i);
  const d = V.sub(h.p, g.p);
  const c = snap(d[i] * g.u[j] - d[j] * g.u[i]);
  return step('Parameter eliminieren',
    'Multipliziert man Zeile ' + ROM[i] + ' mit \\(' + numTeX(g.u[j]) + '\\) und Zeile ' + ROM[j]
    + ' mit \\(' + numTeX(g.u[i]) + '\\) und subtrahiert, fällt \\(' + par() + '\\) weg – '
    + 'und weil die Richtungsvektoren Vielfache voneinander sind, verschwindet auch \\(' + par2() + '\\):',
    '0 = ' + numTeX(c),
    eq0(c) ? 'Eine wahre Aussage: das System hat unendlich viele Lösungen.'
           : 'Eine falsche Aussage: das System hat keine Lösung.');
}

/* ---------- die beiden Lösungswege ---------- */
function lageVariants(g, h, rel, k){
  const parallelFall = (rel.kind === 'parallel' || rel.kind === 'identisch');
  const drauf = (rel.kind === 'identisch');
  const antwort = {
    schneidend: 'Die Geraden schneiden sich' + (rel.P ? ' in \\(' + ptTeX('S', rel.P) + '\\)' : '') + '.',
    parallel:   'Die Richtungsvektoren sind Vielfache voneinander, der Stützpunkt liegt aber nicht auf der '
                + 'anderen Geraden: die Geraden sind echt parallel.',
    windschief: 'Es gibt keinen gemeinsamen Punkt, und die Geraden sind auch nicht parallel: sie sind windschief.',
    identisch:  'Die Richtungsvektoren sind Vielfache voneinander und ein Stützpunkt liegt auf der anderen '
                + 'Geraden: die Geraden sind identisch.'
  }[rel.kind];

  /* Weg 1: erst die Richtungsvektoren ansehen */
  const weg1 = parallelFall
    ? [ dirCompareStep(g, h, k), probeSwitch(g, h, drauf), step('Antwort', antwort, '') ]
    : dirDifferSteps(g, h).concat(gleichsetzenSteps(g, h), [ paarSwitch(g, h, rel, true), step('Antwort', antwort, '') ]);

  /* Weg 2: erst gleichsetzen, danach das Ergebnis deuten */
  const weg2 = parallelFall
    ? gleichsetzenSteps(g, h).concat([
        entartetStep(g, h),
        step('Ergebnis deuten', drauf
          ? 'Unendlich viele Lösungen bedeuten: jeder Punkt der einen Geraden liegt auch auf der anderen. '
            + 'Zur Sicherheit prüft man das noch an einem Punkt nach.'
          : 'Keine Lösung heißt: es gibt keinen gemeinsamen Punkt. Jetzt entscheidet der Blick auf die '
            + 'Richtungsvektoren, ob die Geraden parallel oder windschief sind.', ''),
        dirCompareStep(g, h, k), probeSwitch(g, h, drauf), step('Antwort', antwort, '')
      ])
    : gleichsetzenSteps(g, h).concat(
        [ paarSwitch(g, h, rel, rel.kind === 'schneidend') ],
        rel.kind === 'schneidend'
          ? [ step('Ergebnis deuten', 'Alle drei Zeilen sind erfüllt – es gibt genau einen gemeinsamen Punkt.', ''),
              step('Antwort', antwort, '') ]
          : [ step('Ergebnis deuten', 'Das Gleichungssystem hat keine Lösung. Damit gibt es keinen gemeinsamen '
                + 'Punkt – die Geraden sind entweder parallel oder windschief. Das entscheiden die Richtungsvektoren:', '')
            ].concat(dirDifferSteps(g, h), [ step('Antwort', antwort, '') ]));

  return [
    { label: 'erst die Richtungsvektoren vergleichen', steps: weg1 },
    { label: 'erst gleichsetzen', steps: weg2 }
  ];
}

/* ---------- Aufgabe bauen ---------- */
function genLage(kind, m){
  let g, h;
  if (m){
    g = { p: m.gp, u: m.gu }; h = { p: m.hp, u: m.hu };
    if (V.zero(g.u) || V.zero(h.u)) throw new Error('Die Richtungsvektoren dürfen nicht der Nullvektor sein.');
  } else {
    const pair = MK[kind]();
    g = pair.g; h = pair.h;
  }
  const rel = relation(g, h);
  const k = V.factor(g.u, h.u);
  const variants = lageVariants(g, h, rel, k);
  const sol = {
    schneidend: 'Die Geraden schneiden sich in \\(' + (rel.P ? ptTeX('S', rel.P) : 'S') + '\\).',
    parallel:   'Die Geraden sind echt parallel.',
    windschief: 'Die Geraden sind windschief.',
    identisch:  'Die Geraden sind identisch.'
  }[rel.kind];

  const vis = visLinePU('g', 'A', g.p, 'u', g.u, VC.obj)
    .concat(visLinePU('h', 'B', h.p, 'v', h.u, VC.zweit));
  if (rel.kind === 'schneidend') vis.push(VIS.schnitt('S', 'g', 'h', { farbe: VC.erg, stufe: 3 }));

  return {
    id: 'lage.' + rel.kind, kap: 'Lage zweier Geraden', kind: rel.kind,
    q: 'Gegeben sind die Geraden<br>\\[' + lineTeX('g', g.p, g.u) + '\\]'
       + '\\[' + lineTeX2('h', h.p, h.u) + '\\]',
    ask: 'Untersuche die gegenseitige Lage von \\(g\\) und \\(h\\).'
       + (S.askS ? ' Gib bei einem Schnittpunkt auch dessen Koordinaten an.' : ''),
    answer: { right: rel.kind, P: rel.P || null, gu: g.u, hu: h.u },
    tipp: 'Vergleiche zuerst die Richtungsvektoren: Sind sie Vielfache voneinander? Wenn ja, entscheidet eine '
      + 'Punktprobe zwischen parallel und identisch. Wenn nein, setze beide Geradengleichungen gleich.',
    stages: lageStages(rel, g, h),
    sol: sol,
    variants: variants,
    vis: vis
  };
}
const WKEY = { schneidend: 'wSchneidend', parallel: 'wParallel', windschief: 'wWindschief', identisch: 'wIdentisch' };
function activeCases(){ return CASES.map(c => c.v).filter(v => S.cases[v]); }
/** Fall nach den eingestellten Häufigkeiten ziehen */
function pickCase(){
  const act = activeCases();
  if (!act.length) return null;
  const gew = act.map(v => Math.max(1, Math.min(5, S[WKEY[v]] || 1)));
  const summe = gew.reduce((a, b) => a + b, 0);
  let x = rnd() * summe;
  for (let i = 0; i < act.length; i++){ x -= gew[i]; if (x < 0) return act[i]; }
  return act[act.length - 1];
}
function makeTask(){
  const k = pickCase();
  return k ? genLage(k) : null;
}

/* ---------- Quiz in Schritten ---------- */
const HINT = {
  'parallel>identisch':    'Die Richtungsvektoren sind wirklich Vielfache voneinander – so weit richtig. Mach zusätzlich die Punktprobe: der Stützpunkt von \\(h\\) liegt auf \\(g\\), die Geraden fallen also zusammen.',
  'identisch>parallel':    'Die Richtungsvektoren sind Vielfache, aber die Punktprobe führt zum Widerspruch: der Stützpunkt von \\(h\\) liegt nicht auf \\(g\\).',
  'schneidend>windschief': 'Aus zwei Zeilen bekommt man zwar Werte für die Parameter, sie erfüllen aber die dritte Zeile nicht. Die Probe in der dritten Zeile entscheidet.',
  'windschief>schneidend': 'Die aus zwei Zeilen berechneten Parameterwerte erfüllen auch die dritte Zeile – es gibt also einen gemeinsamen Punkt.'
};
function lageStages(rel, g, h){
  const opts = CASES.filter(o => !S.onlyActive || S.cases[o.v]).map(o => ({ v: o.v, t: o.t }));
  const hints = {};
  opts.forEach(o => {
    if (o.v === rel.kind) return;
    const parGot = (o.v === 'parallel' || o.v === 'identisch');
    const parReal = (rel.kind === 'parallel' || rel.kind === 'identisch');
    hints[o.v] = HINT[o.v + '>' + rel.kind] || (parGot && !parReal
      ? 'Prüfe die Richtungsvektoren noch einmal: \\(' + TX.vec(h.u) + '\\) ist kein Vielfaches von \\(' + TX.vec(g.u) + '\\).'
      : 'Prüfe die Richtungsvektoren noch einmal: \\(' + TX.vec(h.u) + '\\) <b>ist</b> ein Vielfaches von \\(' + TX.vec(g.u) + '\\).');
  });
  const s1 = stageChoice('Welche Lage haben \\(g\\) und \\(h\\)?', opts, rel.kind, hints, CASENAME[rel.kind]);
  if (rel.kind !== 'schneidend' || !S.askS) return [s1];
  return [s1, stagePoint('Berechne den Schnittpunkt \\(S\\).', 'S', rel.P,
    'Setze den gefundenen Parameterwert in die Gleichung von \\(g\\) ein.',
    'Noch nicht richtig – setze den Parameterwert in eine der beiden Geradengleichungen ein.')];
}

/* ---------- Einstellungen ---------- */
function settingsBlocks(){
  const h = blk('Häufigkeit der Fälle',
    'Die Zahlen geben an, wie oft ein Fall im Verhältnis zu den anderen vorkommt. '
    + 'Abgeschaltete Fälle zählen nicht mit.');
  CASES.forEach(o => h.appendChild(sliderRow(o.t, WKEY[o.v], !S.cases[o.v])));
  const b = blk('Aufgaben und Lösung');
  b.appendChild(cb('Schnittpunkt zusätzlich abfragen', 'askS'));
  b.appendChild(cb('nur die eingeschalteten Fälle zur Auswahl anbieten', 'onlyActive', 'Erleichtert die Aufgabe deutlich.'));
  b.appendChild(cb('Quiz anzeigen (eigene Lösung eingeben)', 'answer'));
  b.appendChild(cb('Quiz beenden, sobald die Lösung geöffnet wird', 'lockOnSolve'));
  b.appendChild(cb('Lösungsweg gleich mit aufklappen', 'autoWeg'));
  return numberBlocks({}).concat([h, notationBlock({ par2: true }), b]);
}
function resetControls(){ buildPills($('#segCases'), CASES, S.cases, () => { save(); buildSettings(); }); }
boot(function(){ buildPills($('#segCases'), CASES, S.cases, () => { save(); buildSettings(); }); });
