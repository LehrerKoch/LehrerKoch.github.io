  <style>

    #flashOverlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;

    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 12px 24px; border-radius: 10px;
      font-size: 0.95em; opacity: 0; pointer-events: none;
      transition: opacity 0.4s; z-index: 999; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* Card area */
    #taskWrap {
      position: relative; width: 100%; height: 140px; margin-top: 20px;
      border: 1px solid var(--wrap-rand); border-radius: 10px; perspective: 1000px; z-index: 1;
    }
    #wrongBtn, #correctBtn {
      position: absolute; top: 0; bottom: 0; width: 100px;
      border: none; font-size: 0.9em; z-index: 1; cursor: pointer;

    #correctBtn{ right: 0; background-color: #d4edda; color: #155724; }
    html.dark #wrongBtn  { background-color: #4a2020; color: #f0b0b0; }
    html.dark #correctBtn{ background-color: #1e4620; color: #a5d6a7; }

    #taskCard {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      text-align: center; border-radius: 15px; cursor: grab;
      width: calc(100% - 220px); max-width: 280px; height: 90%;
      z-index: 2; box-sizing: border-box;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      /* Wischen klappt so auch mit Stift (Promethean): waagerechtes Ziehen wird
         nicht vom Browser zum Schieben/Scrollen abgefangen, senkrecht scrollt

      touch-action: pan-y pinch-zoom;
    }
    #taskCard.flipped { transform: translate(-50%, -50%) rotateY(180deg); }

    .card-face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border: 2px solid var(--karte-rand); border-radius: 15px; background: var(--karte-bg);
      transition: background-color 0.2s ease;
    }
    .card-back { transform: rotateY(180deg); background-color: var(--karte-bg-rueck); }

    .card-formula { font-size: 1.8em; }
    .card-sub { font-size: 0.8em; color: var(--sub-text); margin-top: 6px; }

    #showSolutionBtn { width: 100%; margin-top: 15px; padding: 10px; cursor: pointer; }

    .scale-wrapper {
      overflow: hidden;

<script>
// Übersetzungshilfe: nutzt theme-language.js, fällt ohne sie auf Deutsch zurück
function T(de, en) { return (typeof tlText === 'function') ? tlText(de, en) : de; }

// MathJax wird async geladen: vor dem Laden ist window.MathJax nur die
// Konfiguration ohne typesetPromise. Diese Hilfsfunktion wartet dann ab -
// den ersten Durchlauf erledigt MathJax beim Laden ohnehin selbst.
function mjTypeset(el) {
  if (window.MathJax && MathJax.typesetPromise) {
    return MathJax.typesetPromise(el).catch(() => {});
  }
  if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
    return MathJax.startup.promise.then(() => MathJax.typesetPromise(el)).catch(() => {});
  }
  return Promise.resolve();
}

const funktionen = [
  {funktion: "\\(f(x)=1\\)",          ableitung: "\\(f'(x)=0\\)"},
  {funktion: "\\(f(x)=x\\)",          ableitung: "\\(f'(x)=1\\)"},
  {funktion: "\\(f(x)=x^2\\)",        ableitung: "\\(f'(x)=2x\\)"},
  {funktion: "\\(f(x)=x^3\\)",        ableitung: "\\(f'(x)=3x^2\\)"},
  {funktion: "\\(f(x)=e^x\\)",        ableitung: "\\(f'(x)=e^x\\)"},
  {funktion: "\\(f(x)=\\ln(x)\\)",    ableitung: "\\(f'(x)=\\frac{1}{x}\\)"},
  {funktion: "\\(f(x)=\\frac{1}{x}\\)", ableitung: "\\(f'(x)=-\\frac{1}{x^2}\\)"},
  {funktion: "\\(f(x)=\\sqrt{x}\\)",  ableitung: "\\(f'(x)=\\frac{1}{2\\sqrt{x}}\\)"},
  {funktion: "\\(f(x)=\\sin(x)\\)",   ableitung: "\\(f'(x)=\\cos(x)\\)"},
  {funktion: "\\(f(x)=\\cos(x)\\)",   ableitung: "\\(f'(x)=-\\sin(x)\\)"},
];

function scaleToFit(el) {
  if (!el) return;
  const wrapper = el.parentElement;
  if (!wrapper) return;
  el.style.transformOrigin = 'top left';
  el.style.transform = 'none';
  wrapper.style.height = 'auto';
  // Zweimal warten: MathJax setzt die Formel erst nach und nach zusammen,
  // sonst wird zu frueh gemessen und die fertige Formel laeuft ueber den Rand.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const ws = getComputedStyle(wrapper);
    const avail = wrapper.clientWidth - parseFloat(ws.paddingLeft || 0) - parseFloat(ws.paddingRight || 0);
    const nat = el.scrollWidth;
    el._skalaBreite = nat;
    if (nat > avail && avail > 0) {
      const sc = avail / nat;
      el.style.transform = `scale(${sc})`;
      wrapper.style.height = (el.scrollHeight * sc
        + parseFloat(ws.paddingTop || 0) + parseFloat(ws.paddingBottom || 0)) + 'px';
    }
    skalaBeobachte(el);
  }));
}
// Nachmessen, wenn sich der Inhalt spaeter noch aendert (transform aendert die
// Layoutgroesse nicht, deshalb kann keine Schleife entstehen).
let _skalaBeobachter = null;
function skalaBeobachte(el) {
  if (typeof ResizeObserver !== 'function') return;
  if (!_skalaBeobachter) _skalaBeobachter = new ResizeObserver(es => es.forEach(e => {
    if (e.target.scrollWidth !== e.target._skalaBreite) scaleToFit(e.target);
  }));
  if (!el._skalaBeobachtet) { el._skalaBeobachtet = true; _skalaBeobachter.observe(el); }
}

async function scaleAllElements() {
    // Warten bis MathJax fertig ist, dann skalieren
    await mjTypeset();
    document.querySelectorAll('.scale-el').forEach(scaleToFit);
}

window.addEventListener('resize', scaleAllElements);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => scaleAllElements()).catch(() => {});

let taskPool = [...funktionen];
let currentTask = null, correctCount = 0, totalCount = 0, lastTask = null;
let startX = null, currentX = 0, startTime = 0, ignoreMouseUp = false;

const card     = document.getElementById('taskCard');
const faces    = document.querySelectorAll('.card-face');
const counterEl= document.getElementById('counter');

function showToast(msg, duration = 1800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

function flashResult(color) {
  const ov = document.getElementById('flashOverlay');
  ov.style.transition = 'none';
  ov.style.backgroundColor = color;
  ov.style.opacity = '1';
  setTimeout(() => { ov.style.transition = 'opacity 1s'; ov.style.opacity = '0'; }, 50);
}

function generateTask() {
  if (taskPool.length === 0) {
    taskPool = [...funktionen];
    showToast(T('🎉 Alle Karten geschafft! Stapel wird neu gemischt…', '🎉 All cards done! Reshuffling the deck…'));
  }
  let idx;
  do { idx = Math.floor(Math.random() * taskPool.length); }
  while (taskPool.length > 1 && taskPool[idx] === lastTask);
  
  const sel = taskPool[idx];
  lastTask = sel;
  currentTask = { poolIdx: idx, data: sel };

  // WICHTIG: Lösung sofort für die Logik setzen
  window.currentSolution = sel.ableitung;

  // Vorderseite sofort befüllen
  document.getElementById('taskText').innerHTML = sel.funktion;
  if (document.getElementById('taskTextBack').innerHTML === '') {
    document.getElementById('taskTextBack').innerHTML = sel.funktion; // Der obere Part
  }
  
  // Karte zurücksetzen (drehen)
  card.classList.remove('flipped');
  card.removeAttribute('style');
  faces.forEach(f => f.style.backgroundColor = '');
  
  mjTypeset().then(scaleAllElements);


  // Rückseite erst befüllen, wenn sie NICHT sichtbar ist (nach 600ms)
  setTimeout(() => {
    document.getElementById('taskTextBack').innerHTML = sel.funktion; // Der obere Part
    document.getElementById('loesung').innerHTML = ''; // Lösungstext leeren für neue Aufgabe
    mjTypeset().then(scaleAllElements);
  }, 600);
}

function showSolution() {
  if (!window.currentSolution) return;
  document.getElementById('loesung').innerHTML = window.currentSolution;
  card.classList.add('flipped');
  mjTypeset().then(scaleAllElements);
}

function markAnswer(correct) {
  if (!currentTask) return;
  flashResult(correct ? (typeof tlDunkel === 'function' && tlDunkel() ? '#1e4620' : '#d4edda')
                      : (typeof tlDunkel === 'function' && tlDunkel() ? '#4a2020' : '#f8d7da'));
  punkteMerken();
  totalCount++;
  if (correct) {
    correctCount++;
    taskPool.splice(currentTask.poolIdx, 1);
  }
  counterEl.textContent = `${T('Richtig', 'Correct')}: ${correctCount} / ${totalCount}`;
  showSolution();
  currentTask = null;
  setTimeout(generateTask, 1200);
}

// Click/tap to flip
card.onmousedown = (e) => { startTime = Date.now(); handleStart(e); };
card.onmouseup   = (e) => {
  if (ignoreMouseUp) { ignoreMouseUp = false; return; }
  const duration = Date.now() - startTime;
  if (duration < 250 && Math.abs(currentX) < 20) {
    startX = null; currentX = 0;
    // Beim Klick: Transition muss erst gesetzt werden, dann flipped
    requestAnimationFrame(() => {
      card.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
      requestAnimationFrame(() => { showSolution(); });
    });
    return;
  }
  handleEnd();
};
card.ontouchstart = (e) => { startTime = Date.now(); handleStart(e); };
card.ontouchend   = (e) => {
  ignoreMouseUp = true;
  const duration = Date.now() - startTime;
  if (duration < 250 && Math.abs(currentX) < 20) {
    startX = null; currentX = 0;
    requestAnimationFrame(() => {
      card.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
      requestAnimationFrame(() => { showSolution(); });
    });
    return;
  }
  handleEnd();
};

const handleStart = (e) => {
  document.documentElement.classList.add('karte-zieht'); startX = e.clientX || (e.touches && e.touches[0].clientX); card.style.transition = 'none'; };
const handleMove  = (e) => {
  if (startX === null) return;
  currentX = (e.clientX || (e.touches && e.touches[0].clientX)) - startX;
  const rot = card.classList.contains('flipped') ? 180 : 0;
  card.style.transform = `translate(calc(-50% + ${currentX}px), -50%) rotateY(${rot}deg)`;
  const intensity = Math.min(Math.abs(currentX) / (card.parentElement.offsetWidth * 0.25), 0.8);
  const tint = getComputedStyle(document.documentElement).getPropertyValue(currentX > 0 ? '--tint-richtig' : '--tint-falsch').trim();
  faces.forEach(f => f.style.backgroundColor = `rgba(${tint},${intensity})`);
};
const handleEnd = () => {
  document.documentElement.classList.remove('karte-zieht');
  if (startX === null) return;
  const threshold = card.parentElement.offsetWidth * 0.25;
  const triggered = currentX > threshold || currentX < -threshold;
  const wasCorrect = currentX > 0;
  faces.forEach(f => f.style.backgroundColor = '');
  // Transition setzen BEVOR markAnswer → showSolution → flipped
  card.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
  if (triggered) {
    markAnswer(wasCorrect); // setzt sofort flipped via showSolution
    requestAnimationFrame(() => {
      // Flip (flipped bereits gesetzt) + Zurückgleiten gleichzeitig
      card.style.transform = `translate(-50%, -50%) rotateY(${card.classList.contains('flipped') ? 180 : 0}deg)`;
      setTimeout(() => { card.removeAttribute('style'); }, 600);
    });
  } else {
    card.style.transform = `translate(-50%, -50%) rotateY(${card.classList.contains('flipped') ? 180 : 0}deg)`;
    setTimeout(() => { if (startX === null) card.removeAttribute('style'); }, 600);
  }
  startX = null; currentX = 0;
};
document.onmousemove = handleMove;
card.ontouchmove = handleMove;
document.onmouseup = () => { if (startX !== null) handleEnd(); };

document.onkeydown = (e) => {
  if (e.code === 'Space')      { e.preventDefault(); showSolution(); }
  if (e.code === 'ArrowLeft')  markAnswer(false);
  if (e.code === 'ArrowRight') markAnswer(true);
};

// Sprachwechsel: Zählertext in neuer Sprache neu setzen
window.addEventListener('tl-sprache', () => {
  counterEl.textContent = `${T('Richtig', 'Correct')}: ${correctCount} / ${totalCount}`;
});

document.getElementById('showSolutionBtn').onclick = showSolution;
document.getElementById('wrongBtn').onclick  = () => markAnswer(false);
document.getElementById('correctBtn').onclick = () => markAnswer(true);

generateTask();
</script>

<script>
/* Beim Klick auf "Fehler melden" wird die gerade angezeigte Aufgabe
   mitgeschickt - direkt aus dem DOM, also immer der aktuelle Stand. */
window.fehlerKontext = function () {
  const el = document.getElementById('taskText');
  if (!el) return '';
  return (typeof tlFormelText === 'function') ? tlFormelText(el) : el.innerText;
};

/* ── Punktestand: zurücksetzen und rückgängig ─────────────────────────────
   Ein Vertipper kostet so keine Serie: „rückgängig" stellt Punktzahl, Stapel
   und die zuletzt gezeigte Karte wieder her.                               */
let _stand = null;
function _undoKnopf(an){
  const u = document.getElementById('btnPunkteUndo');
  if (u) u.disabled = !an;
}
function punkteMerken(){
  _stand = { r: correctCount, g: totalCount, pool: taskPool.slice(), karte: currentTask, letzte: lastTask };
  _undoKnopf(true);
}
function zaehlerZeigen(){
  if (counterEl) counterEl.textContent = `${T('Richtig', 'Correct')}: ${correctCount} / ${totalCount}`;
}
function punkteZuruecksetzen(){
  correctCount = 0; totalCount = 0; _stand = null; _undoKnopf(false);
  taskPool = [...funktionen];
  zaehlerZeigen();
  generateTask();
}
function punkteRueckgaengig(){
  if (!_stand) return;
  correctCount = _stand.r; totalCount = _stand.g;
  taskPool = _stand.pool; currentTask = _stand.karte; lastTask = _stand.letzte;
  _stand = null; _undoKnopf(false);
  zaehlerZeigen();
  /* dieselbe Karte noch einmal zeigen */
  if (currentTask && currentTask.data){
    window.currentSolution = currentTask.data.ableitung || currentTask.data.loesung || window.currentSolution;
    const vorn = document.getElementById('taskText');
    if (vorn) vorn.innerHTML = currentTask.data.funktion || vorn.innerHTML;
    const hinten = document.getElementById('taskTextBack');
    if (hinten) hinten.innerHTML = currentTask.data.funktion || hinten.innerHTML;
    card.classList.remove('flipped');
    card.removeAttribute('style');
    faces.forEach(f => f.style.backgroundColor = '');
    mjTypeset().then(() => { if (typeof scaleAllElements === 'function') scaleAllElements(); });
  }
}
document.addEventListener('DOMContentLoaded', () => {
  const r = document.getElementById('btnPunkteReset');
  if (r) r.addEventListener('click', punkteZuruecksetzen);
  const u = document.getElementById('btnPunkteUndo');
  if (u) u.addEventListener('click', punkteRueckgaengig);
});

</script>
