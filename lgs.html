<script>
'use strict';
// =============================================================
// §1  MATH UTILITIES
// =============================================================
function gcd(a,b){
  // Integer gcd, robust against tiny float error by rounding inputs
  a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));
  while(b){var t=b;b=a%b;a=t;}return a||1;
}
function lcm(a,b){if(!a||!b)return 0;return Math.abs(Math.round(a*b))/gcd(a,b);}

// ── Exact rational arithmetic for coefficients ──────────────────
// Convert a (possibly fractional/decimal) value to an exact fraction {n,d}>0
// in lowest terms. Handles integers, up to 3 decimal places and simple
// denominators (2,3,4,5,6,8,10,12,…) reliably.
function toRational(x){
  if(Math.abs(x-Math.round(x))<1e-9)return{n:Math.round(x),d:1};
  for(var d=2;d<=10000;d++){
    var n=x*d;
    if(Math.abs(n-Math.round(n))<1e-7){
      n=Math.round(n);
      var g=gcd(Math.abs(n),d);
      return{n:n/g,d:d/g};
    }
  }
  // fallback: 3-decimal approximation
  var nn=Math.round(x*1000),dd=1000,g2=gcd(Math.abs(nn),dd);
  return{n:nn/g2,d:dd/g2};
}
// kgV of two rationals p/q and r/s: lcm(p,r)/gcd(q,s)  (all taken on |numerators|,
// denominators). Returns a plain number (may be fractional).
function rationalLcm(x,y){
  var a=toRational(x),b=toRational(y);
  if(a.n===0&&b.n===0)return 0;
  if(a.n===0)return Math.abs(y);
  if(b.n===0)return Math.abs(x);
  var numL=lcm(Math.abs(a.n),Math.abs(b.n));
  var denG=gcd(a.d,b.d);
  return snapRational(numL/denG);
}
// Snap a value that is within float noise of an exact simple rational to that
// rational. Divisions like target/coefficient (e.g. 2.1/0.3) otherwise yield
// 7.000000000000001, which leaks into displayed factors and comparisons.
function snapRational(x){
  if(!isFinite(x))return x;
  var r=Math.round(x);
  if(Math.abs(x-r)<1e-9)return r;
  for(var d=2;d<=1000;d++){
    var n=x*d;
    if(Math.abs(n-Math.round(n))<1e-9)return Math.round(n)/d;
  }
  return x;
}
// Determinant of the coefficient matrix (n=2 or n=3) – used to guarantee a unique solution
function detEqs(eqs){
  var n=eqs.length;
  if(n===2)return eqs[0].coeffs[0]*eqs[1].coeffs[1]-eqs[0].coeffs[1]*eqs[1].coeffs[0];
  var a=eqs[0].coeffs,b=eqs[1].coeffs,c=eqs[2].coeffs;
  return a[0]*(b[1]*c[2]-b[2]*c[1])-a[1]*(b[0]*c[2]-b[2]*c[0])+a[2]*(b[0]*c[1]-b[1]*c[0]);
}
// In how many equations does variable vi occur (coefficient ≠ 0)?
function countEqsWithVar(eqs,vi){
  var c=0;for(var i=0;i<eqs.length;i++){if(Math.abs(eqs[i].coeffs[vi])>1e-9)c++;}return c;}

// ── Direct solving of single-variable equations ─────────────────────────────
// Repeatedly: find an equation containing only ONE (still unknown) variable,
// solve it directly, substitute the value into the remaining equations.
// Returns the solved steps and the reduced remaining system with proper labels.
function reduceSingleVarEqs(eqs,vars,baseLbls){
  var work=eqs.map(function(e){return{coeffs:e.coeffs.slice(),rhs:e.rhs};});
  var lbls=baseLbls?baseLbls.slice():eqs.map(function(_,i){return romanNum(i+1);});
  var changed=eqs.map(function(){return false;});
  var known={},steps=[],solvedIdx=[],guard=0;
  while(guard++<10){
    var found=-1,fvi=-1;
    for(var i=0;i<work.length;i++){
      if(solvedIdx.indexOf(i)>=0)continue;
      var nz=[];
      for(var j=0;j<vars.length;j++){if(known[j]===undefined&&Math.abs(work[i].coeffs[j])>1e-9)nz.push(j);}
      if(nz.length===1){found=i;fvi=nz[0];break;}
    }
    if(found<0)break;
    var eqS={coeffs:work[found].coeffs.slice(),rhs:work[found].rhs};
    var val=eqS.rhs/eqS.coeffs[fvi];
    known[fvi]=val;solvedIdx.push(found);
    // substitute into all remaining equations
    var touched=false;
    for(var k=0;k<work.length;k++){
      if(solvedIdx.indexOf(k)>=0)continue;
      if(Math.abs(work[k].coeffs[fvi])>1e-9){
        work[k].rhs-=work[k].coeffs[fvi]*val;
        work[k].coeffs[fvi]=0;
        changed[k]=true;touched=true;
      }
    }
    // snapshot of the remaining system after substitution
    var snapEqs=[],snapLbls=[];
    for(var m=0;m<work.length;m++){
      if(solvedIdx.indexOf(m)>=0)continue;
      snapEqs.push({coeffs:work[m].coeffs.slice(),rhs:work[m].rhs});
      snapLbls.push(lbls[m]+(changed[m]?"'":''));
    }
    steps.push({idx:found,lbl:lbls[found]+(changed[found]?"'":''),
      vi:fvi,val:val,eq:eqS,subChanged:touched,remainEqs:snapEqs,remainLbls:snapLbls});
  }
  var remIdxs=[],remEqs=[],remLbls=[];
  for(var r=0;r<work.length;r++){
    if(solvedIdx.indexOf(r)>=0)continue;
    remIdxs.push(r);remEqs.push(work[r]);remLbls.push(lbls[r]+(changed[r]?"'":''));
  }
  return{steps:steps,known:known,eqs:remEqs,lbls:remLbls,idxs:remIdxs};
}

// HTML rendering of the direct-solve steps for the solution paths
function renderReductionHTML(red,vars){
  var html='';
  red.steps.forEach(function(st){
    html+=solSec('Gl.\u202f'+st.lbl+' enthält nur die Variable '+varTex(vars[st.vi])+' – sie kann direkt gelöst werden:',
      solEq(solveAlignedTex(st.eq.coeffs,vars,st.eq.rhs,st.vi,st.val)));
    if(st.remainEqs.length>0){
      html+=solSec('Setze \\('+vars[st.vi]+' = '+numTex(st.val)+'\\) in die '
        +(st.remainEqs.length>1?'übrigen Gleichungen':'übrige Gleichung')+' ein:',
        solEq(systemTexCompact(st.remainEqs,vars,st.remainLbls)));
    }
  });
  return html;
}
function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function romanNum(n){return['','I','II','III','IV','V'][n]||(''+n);}

function romanNum(n){return['','I','II','III','IV','V','VI'][n]||(''+n);}

// Display mode for non-integer numbers:
//  'fraction' → always \frac{}{}
//  'decimal'  → comma-decimal when the value terminates within a few places,
//               fraction fallback for values like 1/3 that don't terminate
//  'both'     → decimal for values with a short (≤3-place) terminating decimal,
//               fraction otherwise — so 2,5 and 1/3 can both appear in one task
// Set from the settings during generation (see refreshNumMode).
var _numMode='fraction';
function fmtDecimalComma(x){
  // up to 3 decimal places, trailing zeros trimmed, decimal point → LaTeX {,}
  // ({,} typesets the comma tight as a decimal separator instead of as punctuation,
  //  which would add a trailing space). All numTex output lands in math contexts.
  var s=(Math.round(x*1000)/1000).toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
  return s.replace('.','{,}');
}
function hasShortDecimal(x){
  var r=Math.round(x*1000)/1000;
  return Math.abs(r*1000-Math.round(r*1000))<1e-6 && Math.abs(x-r)<1e-9;
}
function numTex(x){
  var r=Math.round(x*1e9)/1e9;
  if(Number.isInteger(r))return''+r;
  if((_numMode==='decimal'||_numMode==='both')&&hasShortDecimal(x))return fmtDecimalComma(x);
  for(var d=2;d<=100;d++){var n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){var g=gcd(Math.abs(n),d);return(n<0?'-':'')+'\\frac{'+Math.abs(n)/g+'}{'+d/g+'}';}}
  // last resort: comma decimal
  return fmtDecimalComma(x);
}

// numTex, but wrapped in \left(...\right) when the value needs visual grouping —
// i.e. it is negative or not an integer (a fraction/decimal). Used wherever a
// value is substituted into a term so that e.g. 3·(−1/2) renders with proper
// tall brackets instead of tiny parentheses.
// Plain-text rendering for <input> values, where LaTeX is not available:
// integers as-is, short terminating decimals with a comma, everything else as
// an exact "n/d" fraction. Round-trips through parseNum (which accepts , . and /).
function numPlain(x){
  var r=Math.round(x*1e9)/1e9;
  if(Number.isInteger(r))return''+r;
  if(hasShortDecimal(x))
    return(Math.round(x*1000)/1000).toFixed(3).replace(/0+$/,'').replace(/\.$/,'').replace('.',',');
  var q=toRational(x);
  if(q.d!==1&&Math.abs(q.n)<1e6)return q.n+'/'+q.d;
  return String(Math.round(x*1000)/1000).replace('.',',');
}
function numNeedsParen(x){return x<-1e-9||Math.abs(x-Math.round(x))>1e-9;}
function numTexParen(x){return numNeedsParen(x)?'\\left('+numTex(x)+'\\right)':numTex(x);}

// Decide how non-integers should be displayed based on the current settings.
//  fractions only         → fraction mode
//  decimals only          → decimal mode
//  both decimals+fractions→ 'both' (mix: short decimals as decimals, rest as fractions)
//  neither                → fraction mode (irrelevant; all integers)
function refreshNumMode(){
  try{
    var p=getParams();
    var fracOn=p.loesFraction||p.coeffFraction;
    var decOn=p.loesDecimal||p.coeffDecimal;
    if(decOn&&fracOn)_numMode='both';
    else if(decOn)_numMode='decimal';
    else _numMode='fraction';
  }catch(e){_numMode='fraction';}
}

function parseNum(s){
  s=(s||'').trim().replace(/[−–]/g,'-').replace(/,/g,'.');
  if(/^-?\d+$/.test(s))return parseInt(s,10);
  var m=s.match(/^(-?)(\d+)\/(\d+)$/);
  if(m)return(m[1]?-1:1)*parseInt(m[2],10)/parseInt(m[3],10);
  if(/^-?\d*\.\d+$/.test(s))return parseFloat(s);
  return null;
}

// =============================================================
// §2  EQUATION FORMATTING
// =============================================================
function termTex(coeff,varStr,isFirst){
  if(coeff===0)return null;
  var absC=Math.abs(coeff);
  var sign=isFirst?(coeff<0?'-':''):(coeff>0?'+':'-');
  var body=absC===1?(varStr||'1'):(numTex(absC)+(varStr||''));
  return sign+body;
}

function eqTex(coeffs,vars,rhs){
  var terms=[];
  for(var i=0;i<coeffs.length;i++){
    var t=termTex(coeffs[i],vars[i],terms.length===0);
    if(t!==null)terms.push(t);
  }
  return(terms.length?terms.join(''):'0')+' = '+numTex(rhs);
}

function systemTex(eqs,vars,labels){
  var n=vars.length;
  // Column-aligned format: label (opt) | first term (r) | [sign(c) + term(r)] * (n-1) | = (c) | rhs (r)
  var spec='';
  if(labels)spec+='r';
  spec+='r';
  for(var j=1;j<n;j++)spec+=' c r';
  spec+=' c r';
  var rows=eqs.map(function(eq,i){
    var row='';
    if(labels){var _l=labels[i];var _tl=(_l.indexOf('\\')<0?'\\text{'+_l+'}':_l);row+=_tl+':\\qquad & ';}
    var firstNZ=true;
    for(var j=0;j<n;j++){
      var cj=eq.coeffs[j];
      if(cj===0){
        if(j===0)row+=' & ';
        else row+=' & & ';
      } else {
        if(j===0){
          row+=(cj<0?'-':'')+(Math.abs(cj)===1?'':numTex(Math.abs(cj)))+vars[j]+' & ';
          firstNZ=false;
        } else {
          var sign=firstNZ?(cj<0?'-':''):(cj>0?'+':'-');
          row+=sign+' & '+(Math.abs(cj)===1?'':numTex(Math.abs(cj)))+vars[j]+' & ';
          firstNZ=false;
        }
      }
    }
    row+='= & '+numTex(eq.rhs);
    return row;
  });
  return'\\begin{array}{'+spec+'}'+rows.join(' \\\\ ')+'\\end{array}';
}

// f1*eq1 OP f2*eq2 (simplifies by GCD)
// Compact version of systemTex that skips all-zero variable columns
function systemTexCompact(eqs,vars,labels){
  var present=vars.map(function(v,i){return eqs.some(function(eq){return Math.abs(eq.coeffs[i])>1e-9;});});
  var fv=vars.filter(function(v,i){return present[i];});
  var fe=eqs.map(function(eq){return{coeffs:eq.coeffs.filter(function(c,i){return present[i];}),rhs:eq.rhs};});
  return systemTex(fe,fv,labels);
}
function applyRowOp(eq1,eq2,f1,f2,op,noReduce){
  var s=op==='add'?1:-1;
  var nc=eq1.coeffs.map(function(c,i){return f1*c+s*f2*eq2.coeffs[i];});
  var nr=f1*eq1.rhs+s*f2*eq2.rhs;
  if(noReduce)return{coeffs:nc,rhs:nr};
  var nums=nc.concat([nr]).filter(function(x){return Math.abs(x)>1e-9;});
  if(nums.length>0){
    var allInt=nums.every(function(x){return Math.abs(x-Math.round(x))<1e-9;});
    if(allInt){
      var g=nums.reduce(function(a,b){return gcd(Math.abs(Math.round(a)),Math.abs(Math.round(b)));});
      if(g>1){nc=nc.map(function(c){return c/g;});nr=nr/g;}
    }
  }
  return{coeffs:nc,rhs:nr};
}

// kgV-based elimination factors for variable vi
function getElimFactors(eq1,eq2,vi){
  var c1=eq1.coeffs[vi],c2=eq2.coeffs[vi];
  if(c1===0&&c2===0)return null;
  if(c1===0)return{f1:0,f2:1,op:'sub',kgv:0};
  if(c2===0)return{f1:1,f2:0,op:'sub',kgv:0};
  var L=rationalLcm(c1,c2);
  var f1=snapRational(L/Math.abs(c1)),f2=snapRational(L/Math.abs(c2));
  var sameSign=(c1>0&&c2>0)||(c1<0&&c2<0);
  return{f1:f1,f2:f2,op:sameSign?'sub':'add',kgv:L};
}

// Returns {ok, op} validating user factors (f1, f2) for eliminating c1, c2.
// The factors may be positive OR negative – all that matters is that the
// resulting coefficients have equal absolute value. The sign combination then
// determines whether the equations must be added or subtracted.
function validateFactors(c1,c2,f1,f2){
  if(isNaN(f1)||isNaN(f2)||Math.abs(f1)<1e-9||Math.abs(f2)<1e-9)return{ok:false};
  var p=f1*c1,q=f2*c2;
  if(Math.abs(p)<1e-9||Math.abs(Math.abs(p)-Math.abs(q))>1e-9)return{ok:false};
  if(Math.abs(p-q)<1e-9)return{ok:true,op:'sub'};
  return{ok:true,op:'add'};
}

// Solve eq for variable vi; returns LaTeX RHS expression (per-term fractions)
function solvedExprTex(eq,vars,vi){
  var ci=eq.coeffs[vi];
  if(Math.abs(ci)<1e-9)return null;
  var denom=Math.abs(ci);
  var flip=ci<0;
  var parts=[];
  var rNum=flip?-eq.rhs:eq.rhs;
  if(Math.abs(rNum)>1e-9)parts.push(denom===1?numTex(rNum):numTex(rNum/denom));
  for(var j=0;j<vars.length;j++){
    if(j===vi)continue;
    var cj=eq.coeffs[j];
    if(Math.abs(cj)<1e-9)continue;
    var nc=flip?cj:-cj;
    var t=termTex(denom===1?nc:nc/denom,vars[j],parts.length===0);
    if(t!==null)parts.push(t);
  }
  return parts.join('')||'0';
}

// Parse a linear expression (variables and/or constants) into {coeffs,const}
function parseLinearExpr(s,vars){
  if(!s)return{coeffs:new Array(vars.length).fill(0),const:0};
  if(s[0]!='+'&&s[0]!='-')s='+'+s;
  var coeffs=new Array(vars.length).fill(0),cnst=0,rem=s;
  var svSorted=vars.slice().sort(function(a,b){return b.length-a.length;});
  while(rem.length>0){
    if(rem[0]!='+'&&rem[0]!='-')return null;
    var sign=rem[0]=='-'?-1:1;rem=rem.substring(1);
    var nm=rem.match(/^(\d+(?:\.\d+)?)/);
    var num=nm?parseFloat(nm[1]):1;
    if(nm)rem=rem.substring(nm[0].length);
    // Check for fraction (e.g. 1/2)
    var frac=rem.match(/^\/(\d+)/);
    if(frac){num=num/parseInt(frac[1]);rem=rem.substring(frac[0].length);}
    var found=false;
    for(var vi=0;vi<svSorted.length;vi++){
      if(rem.startsWith(svSorted[vi])){
        var idx=vars.indexOf(svSorted[vi]);
        if(idx>=0)coeffs[idx]+=sign*num;
        rem=rem.substring(svSorted[vi].length);found=true;break;
      }
    }
    if(!found){if(nm)cnst+=sign*num;else return null;}
  }
  return{coeffs:coeffs,const:cnst};
}

// Parse user-typed equation e.g. "5y=10", "3x-2y=8", or "x=2-3y"
// Handles variables on both sides; also accepts a/b/c as aliases for emoji vars
// ── Emoji-variable input helpers ────────────────────────────────
// With fruit variables, typing the emoji is awkward, so equation inputs get
// insert buttons plus a placeholder documenting the a/b/c aliases (which
// parseUserEq already accepts).
function varsAreEmoji(vars){
  // NB: an emoji like '\ud83c\udf4e' has length 2 (surrogate pair), so a >2 length test
  // silently failed. Anything that is not a single latin letter counts as a symbol variable.
  return (vars||[]).some(function(v){return !/^[a-zA-Z]$/.test(v);});
}
function qzVarAliasList(vars){
  var abc=['a','b','c'];
  return vars.map(function(v,i){return abc[i]+'='+v;}).join(', ');
}
// Placeholder attribute (greyed hint inside the field); '' for non-emoji vars
function qzVarPlaceholder(vars){
  if(!varsAreEmoji(vars))return '';
  return ' placeholder="'+qzVarAliasList(vars)+'"';
}
// Row of buttons inserting each fruit at the caret of the given input
function qzVarInsertBtns(inputId,vars){
  if(!varsAreEmoji(vars))return '';
  var abc=['a','b','c'];
  var h='<div class="qz-varbtns">';
  vars.forEach(function(v){
    h+='<button type="button" class="qz-varbtn" title="'+v+' einfügen" '
      +'onclick="qzInsertVar(\''+inputId+'\',\''+v+'\')">'+v+'</button>';
  });
  h+='<span class="qz-varhint">oder '
    +vars.map(function(v,i){return '<code>'+abc[i]+'</code>';}).join(', ')
    +' tippen</span>';
  return h+'</div>';
}
function qzInsertVar(inputId,ch){
  var inp=document.getElementById(inputId);
  if(!inp)return;
  var val=inp.value||'';
  var a=inp.selectionStart,b=inp.selectionEnd;
  if(typeof a==='number'&&typeof b==='number'){
    inp.value=val.slice(0,a)+ch+val.slice(b);
    var pos=a+ch.length;
    try{inp.focus();inp.setSelectionRange(pos,pos);}catch(e){}
  } else {
    inp.value=val+ch;
    try{inp.focus();}catch(e){}
  }
}

function parseUserEq(input,vars){
  var s=(input||'').replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/,/g,'.');
  var isEmoji=varsAreEmoji(vars);
  if(isEmoji){
    var abc=['a','b','c'];
    var aliasMap={};
    vars.forEach(function(v,i){if(abc[i])aliasMap[abc[i]]=v;});
    Object.keys(aliasMap).sort(function(a,b){return b.length-a.length;}).forEach(function(a){
      s=s.split(a).join(aliasMap[a]);
    });
  }
  var ei=s.indexOf('=');if(ei<0)return null;
  var lhsStr=s.substring(0,ei),rhsStr=s.substring(ei+1);
  var lhs=parseLinearExpr(lhsStr,vars);
  var rhs=parseLinearExpr(rhsStr,vars);
  if(!lhs||!rhs)return null;
  // coeffs[i] = lhs.coeffs[i] - rhs.coeffs[i]; rhs_value = rhs.const - lhs.const
  var coeffs=lhs.coeffs.map(function(c,i){return c-rhs.coeffs[i];});
  return{coeffs:coeffs,rhs:rhs.const-lhs.const};
}

// Proportionality check: is user equation a positive scalar mult of expected?
function eqMatch(uC,uR,eC,eR){
  var n=eC.length,ratio=null;
  for(var i=0;i<=n;i++){
    var e=i<n?eC[i]:eR,u=i<n?uC[i]:uR;
    if(Math.abs(e)<1e-9){if(Math.abs(u)>1e-6)return false;continue;}
    if(Math.abs(u)<1e-9)return false;
    var r=u/e;
    if(ratio===null)ratio=r;
    else if(Math.abs(r-ratio)>1e-5)return false;
  }
  return ratio!==null&&ratio>0;
}

// Position the glider of a segmented switch under its checked label

// ── Difficulty presets ─────────────────────────────────────────
// intro  → simple, no special cases
// leicht → mid, special cases only for 3 equations
// normal → mid, special cases only for 3 equations (default)
// hard   → hard, special cases only for 3 equations
// custom → leaves the settings untouched
function getSelectedDiff(){return(document.querySelector('input[name="diff"]:checked')||{}).value||'custom';}
function setDiffSwitch(v){
  var el=document.getElementById('diff'+({intro:'Intro',leicht:'Leicht',normal:'Normal',hard:'Hard',custom:'Custom'}[v]||'Custom'));
  if(el)el.checked=true;
  positionGlider(document.getElementById('diffSwitch'));
}
function applyDiffPreset(diff){
  if(diff==='custom')return;
  var n=parseInt((document.querySelector('input[name="anzahl"]:checked')||{}).value)||3;
  function setR(name,val){var e=document.querySelector('input[name="'+name+'"][value="'+val+'"]');if(e)e.checked=true;}
  function setCb(id,val){var e=document.getElementById(id);if(e)e.checked=val;}
  // ── Variables ──
  // Einführung → fruits (emoji), unless the user actively picked variables.
  // Other levels → x,y,z, unless the user actively picked variables.
  if(!_varsUserChosen){
    setR('vars',diff==='intro'?'emoji':'xyz');
  }
  // ── Levels, special cases and number ranges per difficulty ──
  // loes/coeff: which radio to select; lDec/lFrac: extras for the solutions;
  // cDec/cFrac: extras for the coefficients; zeros: may coefficients be 0
  var p;
  if(diff==='intro')
    p={loes:'int_easy',coeff:'int_tiny',lDec:false,lFrac:false,cDec:false,cFrac:false,zeros:false};
  else if(diff==='leicht')
    p={loes:'int_mid', coeff:'int_easy',lDec:false,lFrac:false,cDec:false,cFrac:false,zeros:false};
  else if(diff==='normal')
    // fractions/decimals are allowed for the solutions, but the coefficients stay integers
    p={loes:'int_mid', coeff:'int_mid', lDec:true, lFrac:true, cDec:false,cFrac:false,zeros:(n===3)};
  else // 'hard' – everything goes
    p={loes:'int_hard',coeff:'int_hard',lDec:true, lFrac:true, cDec:true, cFrac:true, zeros:(n===3)};
  setR('loes',p.loes);setR('coeff',p.coeff);
  setCb('loesDecimal',p.lDec);setCb('loesFraction',p.lFrac);
  setCb('coeffDecimal',p.cDec);setCb('coeffFraction',p.cFrac);
  setCb('zeros',p.zeros);
}
// True once the user has actively chosen the variable set (so difficulty presets

// Open settings and briefly highlight the difficulty-related blocks
function openSettingsHighlighted(){
  var det=document.getElementById('settingsDetails');
  var form=det?det.querySelector('form'):null;
  var wasOpen=det?det.hasAttribute('open'):false;
  if(det&&!wasOpen){
    det.setAttribute('open','');
    // Animate the panel open instead of letting <details> pop it in at once —
    // the instant layout change is what made the transition feel like a jump.
    if(form&&typeof form.scrollHeight==='number'){
      var target=form.scrollHeight;
      form.style.overflow='hidden';
      form.style.transition='none';
      form.style.maxHeight='0px';
      form.style.opacity='0';
      void form.offsetHeight;   // force reflow so the start state applies
      form.style.transition='max-height 900ms cubic-bezier(.22,.75,.25,1), opacity 800ms ease-out';
      form.style.maxHeight=target+'px';
      form.style.opacity='1';
      // Clear the inline styles afterwards so later content changes aren't clipped
      setTimeout(function(){
        form.style.transition='';form.style.maxHeight='';
        form.style.opacity='';form.style.overflow='';
      },1000);
    }
  }
  // Scroll gently and slowly, in parallel with the expansion. The settings panel
  // sits above the controls, so its top position does not shift while it grows.
  smoothScrollTo(det,1300);
  // Highlight once the panel has finished expanding, so the flash lands in place
  setTimeout(function(){
    var blocks=document.querySelectorAll('.form-block[data-diff]');
    blocks.forEach(function(b){
      b.classList.remove('settings-highlight');
      void b.offsetWidth; // force reflow so the animation restarts
      b.classList.add('settings-highlight');
    });
    setTimeout(function(){blocks.forEach(function(b){b.classList.remove('settings-highlight');});},2600);
  },wasOpen?200:950);
}
// Slow, softly eased scroll bringing an element to the top of the viewport.
// Short distances are shortened proportionally so a tiny correction does not
// crawl for the full duration.
function smoothScrollTo(el,duration){
  if(!el||typeof el.getBoundingClientRect!=='function'){
    if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  var startY=window.pageYOffset||document.documentElement.scrollTop||0;
  var targetY=Math.max(0,startY+el.getBoundingClientRect().top-12);
  var dist=targetY-startY;
  if(Math.abs(dist)<2)return;
  duration=duration||1300;
  // keep short hops brisk, long ones slow
  duration=Math.max(450,Math.min(duration,duration*Math.abs(dist)/420));
  if(typeof requestAnimationFrame!=='function'||typeof window.scrollTo!=='function'){
    if(el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  var t0=null;
  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;} // easeInOutCubic
  function step(ts){
    if(t0===null)t0=ts;
    var p=Math.min(1,(ts-t0)/duration);
    window.scrollTo(0,startY+dist*ease(p));
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ── Value generators respecting decimal/fraction options ────────
// Returns a random value in the range implied by `level`, optionally allowing
// one-decimal-place numbers and/or simple fractions.
function _levelRange(level,forCoeff){
  if(forCoeff){
    // Koeffizienten: sehr einfach (1–3) | einfach (−6…6) | mittel (−12…12) | größer (−20…20)
    if(level==='int_tiny')return[1,3];
    if(level==='int_easy')return[-6,6];
    if(level==='int_hard')return[-20,20];
    return[-12,12];
  }
  // Lösungen: einfach (1–5) | mittel (−10…10) | größer (−35…35)
  if(level==='int_easy'||level==='int_tiny')return[1,5];
  if(level==='int_hard')return[-35,35];
  return[-10,10];
}
function genValue(level,allowDecimal,allowFraction,allowZero,forCoeff){
  var rng=_levelRange(level,forCoeff),lo=rng[0],hi=rng[1];
  if(!allowZero&&lo===0)lo=1;
  // An all-positive range (e.g. the "sehr einfach" coefficients 1–3) must be able
  // to produce 0 when zero coefficients are explicitly allowed.
  if(allowZero&&lo>0)lo=0;
  var modes=['int'];
  if(allowDecimal)modes.push('dec');
  if(allowFraction)modes.push('frac');
  for(var tries=0;tries<50;tries++){
    var mode=modes[Math.floor(Math.random()*modes.length)];
    var v;
    if(mode==='int'){
      v=randomInt(lo,hi);
    } else if(mode==='dec'){
      // one decimal place within the same magnitude range (avoid whole numbers)
      v=Math.round((Math.random()*(hi-lo)+lo)*10)/10;
      if(Math.abs(v-Math.round(v))<1e-9)continue; // want a genuine decimal here
    } else {
      // simple fraction with a small denominator
      var den=[2,3,4,5][Math.floor(Math.random()*4)];
      var mag=Math.max(2,Math.min(Math.abs(lo)||hi,Math.abs(hi)));
      var num=randomInt(-mag*den,mag*den);
      v=num/den;
      if(Math.abs(v-Math.round(v))<1e-9)continue; // want a genuine fraction here
    }
    if(!allowZero&&Math.abs(v)<1e-9)continue;
    if(v<lo-1e-9||v>hi+1e-9)continue;
    return v;
  }
  var f=randomInt(lo,hi);return(!allowZero&&f===0)?(hi>0?1:lo):f;
}

function generateSystem(){
  var params=getParams();
  refreshNumMode();
  var n=params.anzahl;
  var vn=params.vars==='abc'?['a','b','c']:params.vars==='emoji'?['🍎','🍌','🍇']:['x','y','z'];
  vn=vn.slice(0,n);

  var solution=[];
  for(var i=0;i<n;i++){
    solution.push(genValue(params.loes,params.loesDecimal,params.loesFraction,false));
  }

  var equations=[];
  var att=0;
  while(equations.length<n&&att<4000){
    att++;
    var coeffs=[];
    for(var j=0;j<n;j++){
      coeffs.push(genValue(params.coeff,params.coeffDecimal,params.coeffFraction,params.zeros,true));
    }
    if(coeffs.every(function(c){return Math.abs(c)<1e-9;}))continue;
    var rhs=coeffs.reduce(function(s,c,j){return s+c*solution[j];},0);
    var dep=false;
    for(var e=0;e<equations.length;e++){
      var r=null;
      for(var k=0;k<n;k++){
        var ek=equations[e].coeffs[k],ck=coeffs[k];
        if(Math.abs(ek)<1e-9&&Math.abs(ck)<1e-9)continue;
        if(Math.abs(ek)<1e-9||Math.abs(ck)<1e-9){r=null;break;}
        var rv=ck/ek;
        if(r===null)r=rv;
        else if(Math.abs(rv-r)>1e-8){r=null;break;}
      }
      if(r!==null&&Math.abs(rhs-r*equations[e].rhs)<1e-8){dep=true;break;}
    }
    if(dep)continue;
    // Full-rank check for the completed system: pairwise independence alone does not
    // guarantee a unique solution for 3×3 (e.g. eq3 = eq1 + eq2). Reject singular systems,
    // otherwise the solution paths would run into "0 = 0" rows.
    if(equations.length===n-1&&Math.abs(detEqs(equations.concat([{coeffs:coeffs,rhs:rhs}])))<1e-9)continue;
    equations.push({coeffs:coeffs,rhs:rhs});
  }
  if(equations.length<n){alert('Konnte kein LGS generieren – bitte Einstellungen anpassen.');return;}

  // For fractional/decimal tasks, reject a system whose elimination would require
  // absurd factors (large per-column kgV). Retry a few times before accepting.
  if((params.loesDecimal||params.loesFraction||params.coeffDecimal||params.coeffFraction)){
    var maxKgv=0;
    for(var vv=0;vv<n;vv++){
      var col=equations.map(function(e){return e.coeffs[vv];}).filter(function(c){return Math.abs(c)>1e-9;});
      for(var a=0;a<col.length;a++)for(var b2=a+1;b2<col.length;b2++)maxKgv=Math.max(maxKgv,rationalLcm(col[a],col[b2]));
    }
    if(maxKgv>60&&(generateSystem._retry=(generateSystem._retry||0)+1)<=40){return generateSystem();}
  }
  generateSystem._retry=0;

  currentLGS={n:n,vars:vn,equations:equations,solution:solution};
  solPathChoices={elimVar:0,gleich_var:0,einsetz_eq:0,einsetz_var:0,
    add_pair1:[0,1],add_pair2:[0,2],add_target1:null,add_target2:null,
    add_elimVar2:-1,add_target3:null,add_bs0:0,add_bs1:0,add_bs2:0,
    add_target1_ss:false,add_target2_ss:false,add_target3_ss:false,
    gleich_bs0:0,gleich_var2:-1,gleich_bs_sv:0,gleich_pair1:0,gleich_pair2:-1,einsetz_bs:0,
    einsetz_sub_eq:-1,einsetz_sub_var:-1};

  var settingsWereOpen=document.getElementById('settingsDetails').hasAttribute('open');
  if(!settingsWereOpen)document.getElementById('settingsDetails').removeAttribute('open');
  document.getElementById('taskArea').style.display='';
  document.getElementById('lgsDisplay').innerHTML='$$'+systemTex(equations,vn,vn.map(function(_,i){return romanNum(i+1);}))+'$$';
  document.getElementById('solutionContent').innerHTML='';
  document.getElementById('solutionPathContent').innerHTML='';
  document.getElementById('solPathChoicesArea').innerHTML='';
  quizState=null;
  document.getElementById('quizMode').checked=false;
  document.getElementById('quizArea').style.display='none';
  document.getElementById('quizArea').innerHTML='';
  document.getElementById('solutionDetails').removeAttribute('open');
  document.getElementById('solutionPathDetails').removeAttribute('open');

  renderSolution();
  MathJax.typesetPromise([document.getElementById('lgsDisplay')]);
  updateURLParams();
  // Only scroll to the task when the settings panel is closed (i.e. not while
  // the user is actively tweaking settings) to avoid jumping around on each change.
  if(!settingsWereOpen)document.getElementById('taskArea').scrollIntoView({behavior:'smooth',block:'start'});
}

// Aligned version of eqTex (uses &= for \begin{aligned})
function eqTexA(coeffs,vars,rhs){
  var terms=[];
  for(var i=0;i<coeffs.length;i++){
    var t=termTex(coeffs[i],vars[i],terms.length===0);
    if(t!==null)terms.push(t);
  }
  return(terms.length?terms.join(''):'0')+' &= '+numTex(rhs);
}

// Check if equation is already in "v = c" form (coeff 1 for one var, 0 for rest)
function isAlreadySolved(coeffs, varIdx) {
  return Math.abs(coeffs[varIdx])===1 &&
    coeffs.every(function(c,i){return i===varIdx||Math.abs(c)<1e-9;});
}

// Pure LHS of an equation (no = sign)
function eqLHS(coeffs,vars){
  var terms=[];
  for(var i=0;i<coeffs.length;i++){var t=termTex(coeffs[i],vars[i],terms.length===0);if(t)terms.push(t);}
  return terms.length?terms.join(''):'0';
}

// LHS of equation with known vars shown as c·val
function eqSubstLHS(eq,vars,knownVars){
  var parts=[];
  for(var j=0;j<vars.length;j++){
    var c=eq.coeffs[j];if(Math.abs(c)<1e-9)continue;
    var isFirst=parts.length===0;
    if(knownVars[j]!==undefined){
      var val=knownVars[j],absC=Math.abs(c);
      var sign=isFirst?(c<0?'-':''):(c>0?'+':'-');
      var vStr=numTexParen(val);
      parts.push(sign+(absC===1?vStr:numTex(absC)+'\\cdot '+vStr));
    } else {var t=termTex(c,vars[j],isFirst);if(t)parts.push(t);}
  }
  return parts.length?parts.join(''):'0';
}

// Show equation with known vars substituted (for aligned env: LHS &= RHS)
function eqSubstTex(eq,vars,knownVars){
  return eqSubstLHS(eq,vars,knownVars)+' &= '+numTex(eq.rhs);
}

// Solve step as array with right-aligned RHS (avoids duplicate if already solved)
function solveAlignedTex(coeffs,vars,rhs,solvedVar,solvedVal){
  if(isAlreadySolved(coeffs,solvedVar))return vars[solvedVar]+' = '+numTex(solvedVal);
  // Two rows column-aligned via systemTex (compact: skip all-zero cols)
  var n=coeffs.length;
  var eq1={coeffs:coeffs,rhs:rhs};
  var sc=new Array(n).fill(0);sc[solvedVar]=1;
  var eq2={coeffs:sc,rhs:solvedVal};
  return systemTexCompact([eq1,eq2],vars,null);
}

// Back-substitution with proper column alignment matching systemTex style
function backSubAlignedTex(eq,vars,knownVars,solveVar,solveVal){
  var n=vars.length;
  var bc=eq.coeffs.slice(),bsRhs=eq.rhs;
  var hasKnown=false;
  Object.keys(knownVars).forEach(function(k){
    var ki=parseInt(k);
    if(Math.abs(bc[ki])>1e-9){bsRhs-=bc[ki]*knownVars[ki];bc[ki]=0;hasKnown=true;}
  });
  if(!hasKnown)return vars[solveVar]+' = '+numTex(solveVal);

  var spec='r';for(var j=1;j<n;j++)spec+=' c r';spec+=' c r';

  function buildRow(rowCoeffs,prodMap,rhs){
    // prodMap: {idx: displayString} for substituted terms; rowCoeffs holds the actual coeff signs
    var row='';var firstNZ=true;
    for(var j=0;j<n;j++){
      var cj=rowCoeffs[j];
      var disp=prodMap&&prodMap[j]!=null?prodMap[j]:null;
      if(Math.abs(cj)<1e-9&&disp==null){row+=(j===0?' & ':' & & ');continue;}
      var termStr=disp!=null?disp:((Math.abs(cj)===1?'':numTex(Math.abs(cj)))+vars[j]);
      if(j===0){row+=(cj<0?'-':'')+termStr+' & ';firstNZ=false;}
      else{var sg=firstNZ?(cj<0?'-':''):(cj>0?'+':'-');row+=sg+' & '+termStr+' & ';firstNZ=false;}
    }
    row+='= & '+numTex(rhs);
    return row;
  }

  var rows=[];
  // Row 1: substitution shown as c·val
  var substMap={};
  Object.keys(knownVars).forEach(function(k){
    var ki=parseInt(k);
    if(Math.abs(eq.coeffs[ki])<1e-9)return;
    var c=eq.coeffs[ki],val=knownVars[ki];
    var absc=Math.abs(c),vStr=numTexParen(val);
    substMap[ki]=absc===1?vStr:numTex(absc)+'\\cdot '+vStr;
  });
  rows.push(buildRow(eq.coeffs,substMap,eq.rhs));

  // Intermediate: show computed products when >1 known var OR any |coeff|>1
  var nKnown=Object.keys(substMap).length;
  var needsIntermediate=nKnown>1||Object.keys(substMap).some(function(k){return Math.abs(eq.coeffs[parseInt(k)])>1+1e-9;});
  if(needsIntermediate){
    var intCoeffs=bc.slice();var intMap={};
    Object.keys(knownVars).forEach(function(k){
      var ki=parseInt(k);
      if(Math.abs(eq.coeffs[ki])<1e-9)return;
      var p=eq.coeffs[ki]*knownVars[ki];
      intCoeffs[ki]=p;
      intMap[ki]=numTex(Math.abs(p));
    });
    var intRow='';var firstNZ=true;
    for(var j=0;j<n;j++){
      var cj_bc=bc[j];var ip=intMap[j]!=null?intMap[j]:null;
      var effCj=ip!=null?eq.coeffs[j]*knownVars[j]:cj_bc;
      var hasVal=Math.abs(effCj)>1e-9||ip!=null;
      if(!hasVal){intRow+=(j===0?' & ':' & & ');continue;}
      var absCj=Math.abs(effCj);
      var termStr=ip!=null?ip:((absCj===1?'':numTex(absCj))+vars[j]);
      if(j===0){intRow+=(effCj<0?'-':'')+termStr+' & ';firstNZ=false;}
      else{var sg=firstNZ?(effCj<0?'-':''):(effCj>0?'+':'-');intRow+=sg+' & '+termStr+' & ';firstNZ=false;}
    }
    intRow+='= & '+numTex(eq.rhs);
    rows.push(intRow);
  }

  // Simplified row
  if(!isAlreadySolved(bc,solveVar))rows.push(buildRow(bc,null,bsRhs));
  // Solved
  var sc=new Array(n).fill(0);sc[solveVar]=1;
  rows.push(buildRow(sc,null,solveVal));
  return'\\begin{array}{'+spec+'}'+rows.join(' \\\\ ')+'\\end{array}';
}

// Result listing: = aligned, values right-aligned (use @{{}={}} to avoid missing = bug)
function solResultTex(vars,sol){
  return'\\begin{array}{r c r}'+vars.map(function(v,i){return v+' & = & '+numTex(sol[i]);}).join(' \\\\ ')+'\\end{array}';
}

// Elimination step: column-aligned with f·I notation and hline before result
function factorLbl(f,lbl){
  var a=Math.abs(f);
  var neg=f<-1e-9;
  var tl='\\text{'+lbl+'}';
  if(Math.abs(a-1)<1e-9)return neg?'(-'+tl+')':tl;
  if(neg)return'(-'+numTex(a)+') \\cdot '+tl;
  return numTex(f)+' \\cdot '+tl;
}
function elimStepTex(lbl1,eq1,f1,lbl2,eq2,f2,op,resultEq,vars,resultLbl){
  var n=vars.length;
  var eq1s={coeffs:eq1.coeffs.map(function(c){return f1*c;}),rhs:f1*eq1.rhs};
  var eq2s={coeffs:eq2.coeffs.map(function(c){return f2*c;}),rhs:f2*eq2.rhs};
  var opSym=op==='sub'?'-':'+';
  var l1=factorLbl(f1,lbl1),l2=factorLbl(f2,lbl2);
  var lRes=(resultLbl?'\\text{'+resultLbl+'} = ':'')+l1+' '+opSym+' '+l2;
  // Column spec identical to systemTex
  var spec=(true?'r@{\\qquad}':'')+'r';
  for(var j=1;j<n;j++)spec+=' c r';
  spec+=' c r';
  function bldRow(lbl,eq){
    var r=lbl+':\\; & ';
    var fNZ=true;
    for(var j=0;j<n;j++){
      var cj=eq.coeffs[j];
      if(cj===0){r+=(j===0?' & ':' & & ');}
      else{
        if(j===0){r+=(cj<0?'-':'')+(Math.abs(cj)===1?'':numTex(Math.abs(cj)))+vars[j]+' & ';fNZ=false;}
        else{var sg=fNZ?(cj<0?'-':''):(cj>0?'+':'-');r+=sg+' & '+(Math.abs(cj)===1?'':numTex(Math.abs(cj)))+vars[j]+' & ';fNZ=false;}
      }
    }
    return r+'= & '+numTex(eq.rhs);
  }
  return'\\begin{array}{'+spec+'}'
    +bldRow(l1,eq1s)+' \\\\ '
    +bldRow(l2,eq2s)+' \\\\ \\hline '
    +bldRow(lRes,resultEq)
    +'\\end{array}';
}
