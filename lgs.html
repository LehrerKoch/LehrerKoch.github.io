function _addRenderSolveStage(vars,eqs){
  var qs=quizState;
  var lgs=qLGS();
  var sol=lgs.solution;
  var stage=qs.stage;
  var n=lgs.n;

  if(stage==='add_solve'){
    var fe=qs.finalEq;
    var remVar=-1;for(var i=0;i<vars.length;i++){if(Math.abs(fe.coeffs[i])>1e-9){remVar=i;break;}}
    if(remVar<0)return qzCurStep('Fehler','');
    var expected=fe.rhs/fe.coeffs[remVar];
    var hl=qs.helpLevel;
    var alreadySolvedFe=isAlreadySolved(fe.coeffs,remVar);
    var hint='';
    if(hl>=1&&!alreadySolvedFe){
      hint='<div class="qz-hint-box">\\['+solveAlignedTex(fe.coeffs,vars,fe.rhs,remVar,expected)+'\\]</div>';
    }
    var hint2=hl>=2?'<div class="qz-btns"><button class="qz-btn" onclick="addSkipSolve()">Lösung anzeigen</button></div>':'';
    var desc=alreadySolvedFe
      ?'<div class="qz-sub">Die Gleichung ist direkt abzulesen: \\('+eqTex(fe.coeffs,vars,fe.rhs)+'\\)</div>'
      :'<div class="qz-sub">Löse die Gleichung: \\('+eqTex(fe.coeffs,vars,fe.rhs)+'\\)</div>';
    return qzCurStep('Welchen Wert hat \\('+vars[remVar]+'\\)?',
      desc
      +'<div class="qz-inp-row"><input class="qz-inp sm" id="qz_sv" type="text" autofocus onkeydown="if(event.key===\'Enter\')addCheckSolve('+remVar+','+expected+')">'
      +'<button onclick="addCheckSolve('+remVar+','+expected+')">Prüfen</button>'
      +(hl<2&&!alreadySolvedFe?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint+hint2);
  }
  if(stage==='add_backsubst'||stage==='add_backsubst2'){
    var step=qs.backSubStep||0;
    var order=qs.backSubOrder;
    if(!order||step>=order.length){quizState.stage='done';renderQuiz();return'';}
    var vi=order[step];
    var expected2=sol[vi];
    var hl=qs.helpLevel;
    // Use correct back-sub equation
    var bsEq=(qs.backSubEqs&&qs.backSubEqs[step])?qs.backSubEqs[step]:eqs[0];
    // Build substituted form (only mention known vars that actually occur in bsEq)
    var bc=bsEq.coeffs.slice(),bsRhs=bsEq.rhs;
    var subParts=[];
    Object.keys(qs.knownVars).forEach(function(k){
      var ki=parseInt(k);
      if(Math.abs(bc[ki])>1e-9)subParts.push('\\('+vars[ki]+' = '+numTex(qs.knownVars[ki])+'\\)');
      bsRhs-=bc[ki]*qs.knownVars[ki];bc[ki]=0;
    });
    var bsEqLabel=eqs.indexOf?qLbl(eqs.indexOf(bsEq)):'';
    // Find which equation this is
    var bsEqIdx=-1;for(var i=0;i<eqs.length;i++){if(eqs[i]===bsEq){bsEqIdx=i;break;}}
    // For newEqs, find in qs.newEqs
    if(bsEqIdx<0&&qs.newEqs){for(var i=0;i<qs.newEqs.length;i++){if(qs.newEqs[i]===bsEq){bsEqIdx=i;break;}}}
    var eqLbl=bsEqIdx>=0?(qs.newEqs&&qs.newEqs.indexOf&&qs.newEqs.indexOf(bsEq)>=0?qNewLbl(qs.newEqs.indexOf(bsEq)):qLbl(bsEqIdx)):'?';
    var setzTxt=subParts.length
      ?'Setze '+subParts.join(', ')+' in Gl.\u202f'+eqLbl+' ein'
      :'Gl.\u202f'+eqLbl+' enthält nur \\('+vars[vi]+'\\) und ist direkt lösbar';
    var hint3='';
    if(hl>=1){
      // Level 1: tell which equation and values, but don't show result yet
      hint3='<div class="qz-hint-box">'+setzTxt+'.</div>';
    }
    if(hl>=2){
      // Level 2: show the simplified equation after substitution
      hint3='<div class="qz-hint-box">'+setzTxt+':'
        +'\\['+eqTex(bc,vars,bsRhs)+'\\]</div>';
    }
    var hint4=hl>=2?'<div class="qz-btns"><button class="qz-btn" onclick="addSkipSolve()">Lösung anzeigen</button></div>':'';
    return qzCurStep('Welchen Wert hat \\('+vars[vi]+'\\)?'+(subParts.length?' (Rückeinsetzen)':''),
      // Always show the equation that is being substituted into
      qzEqBanner(bsEq,vars,eqLbl)
      +(subParts.length?'<div class="qz-sub">Bekannt: '+subParts.join(', ')+'</div>':'')
      +'<div class="qz-inp-row"><input class="qz-inp sm" id="qz_sv" type="text" autofocus onkeydown="if(event.key===\'Enter\')addCheckSolve('+vi+','+expected2+')">'
      +'<button onclick="addCheckSolve('+vi+','+expected2+')">Prüfen</button>'
      +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint3+hint4);
  }
  return '';
}

function addCheckSolve(vi,expected){
  var inp=document.getElementById('qz_sv');if(!inp)return;
  var val=parseNum(inp.value);
  if(val===null){qzFb('qz_fb','Ungültige Eingabe.','err');inp.classList.add('err');return;}
  if(Math.abs(val-expected)<1e-6){
    inp.classList.add('ok');qzFb('qz_fb','✓ Richtig!','ok');
    quizState.knownVars[vi]=expected;
    setTimeout(function(){_addAdvanceSolve();},500);
  } else {
    inp.classList.add('err');qzFb('qz_fb','Nicht korrekt – überprüfe die Rechnung.','err');
  }
}

function addSkipSolve(){
  var qs=quizState,sol=qLGS().solution;
  var stage=qs.stage;
  var vi;
  if(stage==='add_solve'){
    var fe=qs.finalEq;
    for(var i=0;i<qLGS().vars.length;i++){if(Math.abs(fe.coeffs[i])>1e-9){vi=i;break;}}
  } else {
    vi=(qs.backSubOrder||[])[qs.backSubStep||0];
  }
  if(vi===undefined)return;
  var expected=sol[vi];
  var fb=document.getElementById('qz_fb');
  if(fb){fb.className='qz-fb ok';fb.innerHTML='Lösung: \\('+qLGS().vars[vi]+' = '+numTex(expected)+'\\)';MathJax.typesetPromise([fb]);}
  quizState.knownVars[vi]=expected;
  setTimeout(function(){_addAdvanceSolve();},1200);
}

// Plan the back-substitution: for every still-unknown variable pick an equation
// in which it occurs and in which all other variables are (by then) known.
// Works for all flows, including degenerate ones (single-variable equations,
// skipped elimination rounds, missing variables).
function _addPlanBackSub(){
  var qs=quizState,lgs=qLGS(),vars=lgs.vars;
  var known=Object.keys(qs.knownVars).map(function(k){return parseInt(k);});
  var unknown=[];for(var i=0;i<vars.length;i++){if(qs.knownVars[i]===undefined)unknown.push(i);}
  var pool=(qs.newEqs||[]).concat(lgs.equations);
  var order=[],eqsOut=[],guard=0;
  while(unknown.length&&guard++<12){
    var progress=false;
    for(var u=0;u<unknown.length;u++){
      var vi=unknown[u],pick=null;
      for(var e=0;e<pool.length;e++){
        var eq=pool[e];
        if(!eq||Math.abs(eq.coeffs[vi])<1e-9)continue;
        var ok=true;
        for(var j=0;j<vars.length;j++){
          if(j===vi||Math.abs(eq.coeffs[j])<1e-9)continue;
          if(known.indexOf(j)<0&&order.indexOf(j)<0){ok=false;break;}
        }
        if(ok){pick=eq;break;}
      }
      if(pick){order.push(vi);eqsOut.push(pick);unknown.splice(u,1);progress=true;break;}
    }
    if(!progress){
      // Fallback (should not occur for regular systems): take any equation containing vi
      var vi2=unknown.shift(),eqf=null;
      for(var e2=0;e2<pool.length;e2++){if(pool[e2]&&Math.abs(pool[e2].coeffs[vi2])>1e-9){eqf=pool[e2];break;}}
      order.push(vi2);eqsOut.push(eqf||pool[0]);
    }
  }
  qs.backSubOrder=order;qs.backSubEqs=eqsOut;qs.backSubStep=0;
}

function _addAdvanceSolve(){
  var qs=quizState,lgs=qLGS(),n=lgs.n;
  if(qs.stage==='add_solve'){
    _addPlanBackSub();
    if(!qs.backSubOrder.length){qs.stage='done';renderQuiz();return;}
    qs.stage=(n===3?'add_backsubst2':'add_backsubst');qs.helpLevel=0;
    renderQuiz();
  } else {
    qs.backSubStep=(qs.backSubStep||0)+1;
    qs.helpLevel=0;
    if(qs.backSubStep>=(qs.backSubOrder||[]).length){qs.stage='done';renderQuiz();}
    else{renderQuiz();}
  }
}

// ── Shared quiz helpers ──────────────────────────────────────
function qzGenDistr(correct, vars) {
  // Produce 2 distractor equations (sign flip, RHS flip, double coeff)
  var ds=[]; var n=vars.length;
  // Sign flip on first non-zero coefficient
  for(var j=0;j<n;j++){
    if(Math.abs(correct.coeffs[j])>1e-9){
      var d={coeffs:correct.coeffs.slice(),rhs:correct.rhs};
      d.coeffs[j]=-d.coeffs[j];
      if(!eqMatch(d.coeffs,d.rhs,correct.coeffs,correct.rhs))ds.push(d);
      break;
    }
  }
  // Negate RHS
  var d2={coeffs:correct.coeffs.slice(),rhs:-correct.rhs};
  if(!eqMatch(d2.coeffs,d2.rhs,correct.coeffs,correct.rhs)&&ds.length<2)ds.push(d2);
  // Double a non-leading coefficient
  for(var j=n-1;j>=0;j--){
    if(Math.abs(correct.coeffs[j])>1e-9){
      var d3={coeffs:correct.coeffs.slice(),rhs:correct.rhs};
      d3.coeffs[j]*=2;
      if(!eqMatch(d3.coeffs,d3.rhs,correct.coeffs,correct.rhs)&&ds.length<2)ds.push(d3);
      break;
    }
  }
  // Wrong sign on RHS term
  if(ds.length<2){
    var d4={coeffs:correct.coeffs.slice(),rhs:correct.rhs+2};
    if(!eqMatch(d4.coeffs,d4.rhs,correct.coeffs,correct.rhs))ds.push(d4);
  }
  return ds.slice(0,2);
}

function qzGenValDistr(val) {
  var vs=[-val, val+1, val-1, val*2];
  var ds=[];
  for(var i=0;i<vs.length;i++){if(Math.abs(vs[i]-val)>1e-9&&ds.indexOf(vs[i])<0)ds.push(vs[i]);if(ds.length>=2)break;}
  return ds;
}

function qzShuffleMC(correct, distrs) {
  var opts=[correct].concat(distrs.slice(0,2));
  // Fisher-Yates
  for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=opts[i];opts[i]=opts[j];opts[j]=t;}
  var corr=opts.indexOf(correct);
  // fallback: if indexOf by reference fails, find by value
  if(corr<0){
    for(var i=0;i<opts.length;i++){
      if(typeof correct==='number'?Math.abs(opts[i]-correct)<1e-9:eqMatch(opts[i].coeffs,opts[i].rhs,correct.coeffs,correct.rhs)){corr=i;break;}
    }
  }
  return{opts:opts,corr:corr};
}

function qzMCEqHtml(opts,corr,vars,fn){
  return'<div class="qz-btns">'+opts.map(function(eq,i){
    return'<button class="qz-btn" onclick="'+fn+'('+i+','+corr+',this)">\\('+eqTex(eq.coeffs,vars,eq.rhs)+'\\)</button>';
  }).join('')+'</div>';
}

function qzMCValHtml(opts,corr,varName,fn){
  return'<div class="qz-btns">'+opts.map(function(v,i){
    return'<button class="qz-btn" onclick="'+fn+'('+i+','+corr+',this)">\\('+varName+' = '+numTex(v)+'\\)</button>';

}

function initQuiz_gauss(){
  var lgs=qLGS(),n=lgs.n,vars=lgs.vars;
  var M=lgs.equations.map(function(eq){return{coeffs:eq.coeffs.slice(),rhs:eq.rhs};});
  var primes=M.map(function(){return 0;});
  function lbl(r){return romanNum(r+1)+"'".repeat(primes[r]);}
  function snap(){return M.map(function(r){return{coeffs:r.coeffs.slice(),rhs:r.rhs};});}
  function snapL(){return M.map(function(_,r){return lbl(r);});}
  var qs=quizState;
  qs.gjSteps=[];qs.gjKnown={};
  for(var col=0;col<n;col++){
    var pivRow=col;
    while(pivRow<n&&Math.abs(M[pivRow].coeffs[col])<1e-9)pivRow++;
    if(pivRow>=n)continue;
    if(pivRow!==col){
      var tmp=M[col];M[col]=M[pivRow];M[pivRow]=tmp;
      var tp=primes[col];primes[col]=primes[pivRow];primes[pivRow]=tp;
    }
    var pCoeff=M[col].coeffs[col],pivLbl=lbl(col);
    if(Math.abs(Math.abs(pCoeff)-1)>1e-9||pCoeff<0){
      var Mb=snap(),Lb=snapL();
      var sc={coeffs:M[col].coeffs.map(function(c){return c/pCoeff;}),rhs:M[col].rhs/pCoeff};
      primes[col]++;var newL=lbl(col);M[col]=sc;
      qs.gjSteps.push({type:'scale',col:col,pCoeff:pCoeff,oldL:pivLbl,newL:newL,
        Mb:Mb,Lb:Lb,Ma:snap(),La:snapL(),result:sc,
        h1:'Teile \\(\\text{'+pivLbl+'}\\) durch \\('+numTex(pCoeff)+'\\).'});
      pivLbl=newL;
    }
    for(var r=0;r<n;r++){
      if(r===col)continue;
      var ef=M[r].coeffs[col];
      if(Math.abs(ef)<1e-9)continue;
      var oldL=lbl(r),f2=Math.abs(ef),op=ef>0?'sub':'add';
      var opSym=op==='sub'?'-':'+';
      var Mb2=snap(),Lb2=snapL();
      var ne=applyRowOp(M[r],M[col],1,f2,op);
      primes[r]++;var newLr=lbl(r);M[r]=ne;
      qs.gjSteps.push({type:'elim',col:col,r:r,f2:f2,op:op,oldL:oldL,pivL:pivLbl,newL:newLr,
        pivEq:{coeffs:M[col].coeffs.slice(),rhs:M[col].rhs},
        rowEq:Mb2[r],Mb:Mb2,Lb:Lb2,Ma:snap(),La:snapL(),result:ne,
        h1:'Berechne \\(\\text{'+oldL+'}'+opSym+(f2!==1?numTex(f2)+'\\cdot ':'')+'\\text{'+pivLbl+'}\\to\\text{'+newLr+'}\\).'});
    }
  }
  qs.gjFinalM=snap();qs.gjFinalL=snapL();
  qs.gjStepIdx=0;qs._mcCache=null;qs.stage='gauss_gj';
}

function renderQuiz_gauss(qa){
  var qs=quizState,lgs=qLGS(),vars=lgs.vars,n=lgs.n;
  var html='<div class="qz-stage">Gauß-Verfahren</div>';
  if(qs.stage==='gauss_gj'){
    var si=qs.gjStepIdx,steps=qs.gjSteps;
    for(var i=0;i<si;i++){
      var st=steps[i];
      var opLbl=st.type==='scale'?'\\(\\text{'+st.oldL+'}:'+numTex(st.pCoeff)+'\\to\\text{'+st.newL+'}\\)':
        '\\(\\text{'+st.oldL+'}'+( st.op==='sub'?'-':'+')+( st.f2!==1?numTex(st.f2)+'\\cdot ':'')+'\\text{'+st.pivL+'}\\to\\text{'+st.newL+'}\\)';
      html+=qzDoneStep(opLbl,qzEqBanner(st.result,vars,st.newL));
    }
    if(si>=steps.length){
      html+=qzCurStep('Diagonalform erreicht',
        qzSystemBanner(qs.gjFinalM,vars,qs.gjFinalL)
        +'<button onclick="gjStartRead()">Werte ablesen &#8594;</button>');
    } else {
      var st=steps[si];var hl=qs.helpLevel;
      // init MC cache when entering hint2
      if(hl>=2&&!qs._mcCache){
        var ds=qzGenDistr(st.result,vars);
        qs._mcCache=qzShuffleMC(st.result,ds);
      }
      var hint1=hl>=1?'<div class="qz-hint-box">'+st.h1+'</div>':'';
      var hint2=hl>=2&&qs._mcCache?qzMCEqHtml(qs._mcCache.opts,qs._mcCache.corr,vars,'gjMCEqCheck'):'';
      var opLbl=st.type==='scale'?
        '\\(\\text{'+st.oldL+'}:'+numTex(st.pCoeff)+'\\to\\text{'+st.newL+'}\\)':
        '\\(\\text{'+st.oldL+'}'+( st.op==='sub'?'-':'+')+( st.f2!==1?numTex(st.f2)+'\\cdot ':'')+'\\text{'+st.pivL+'}\\to\\text{'+st.newL+'}\\)';
      html+=qzCurStep(opLbl,
        qzSystemBanner(st.Mb,vars,st.Lb)
        +'<div class="qz-sub">Gib \\(\\text{'+st.newL+'}\\) ein:</div>'
        +qzVarInsertBtns('qz_gi',vars)+'<div class="qz-inp-row"><input class="qz-inp" id="qz_gi" type="text"'+qzVarPlaceholder(vars)+' autofocus onkeydown="if(event.key===\'Enter\')gjCheck()">'
        +'<button onclick="gjCheck()">Prüfen</button>'
        +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
        +'<button class="btn-grey" onclick="gjSkip()">Überspringen</button>'
        +'</div><div id="qz_fb" class="qz-fb"></div>'+hint1+hint2);
    }
  } else if(qs.stage==='gauss_read'){
    // Read values from diagonal form
    var bsi=qs.gjReadIdx,bsteps=qs.gjReadSteps;
    for(var i=0;i<bsi;i++){
      var bs=bsteps[i];
      html+=qzDoneStep('\\('+vars[bs.vi]+' = '+numTex(bs.val)+'\\)','');
    }
    if(bsi>=bsteps.length){qs.stage='done';renderQuiz_gauss(qa);return;}
    var bs=bsteps[bsi];var hl=qs.helpLevel;
    if(hl>=2&&!qs._mcCache){
      var dv=qzGenValDistr(bs.val);qs._mcCache=qzShuffleMC(bs.val,dv);
    }
    var hint1=hl>=1?'<div class="qz-hint-box">Lies \\('+vars[bs.vi]+'\\) direkt aus Zeile \\(\\text{'+bs.lbl+'}\\) ab: \\('+eqTex(bs.eq.coeffs,vars,bs.eq.rhs)+'\\)</div>':'';
    var hint2=hl>=2&&qs._mcCache?qzMCValHtml(qs._mcCache.opts,qs._mcCache.corr,vars[bs.vi],'gjMCValCheck'):'';
    html+=qzCurStep('Wert von \\('+vars[bs.vi]+'\\) ablesen:',
      qzSystemBanner(qs.gjFinalM,vars,qs.gjFinalL)
      +qzKnownStr(vars,qs.gjKnown)
      +'<div class="qz-inp-row"><input class="qz-inp sm" id="qz_gv" type="text" autofocus onkeydown="if(event.key===\'Enter\')gjReadCheck()">'
      +'<button onclick="gjReadCheck()">Prüfen</button>'
      +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint1+hint2);
  } else if(qs.stage==='done'){html+=_quizDone();}
  qa.innerHTML=html;
}

  if(!p){qzFb('qz_fb','Format ungültig.','err');inp.classList.add('err');return;}

    inp.classList.add('ok');qzFb('qz_fb','✓ Richtig!','ok');
    setTimeout(function(){qs.gjStepIdx++;qs.helpLevel=0;qs._mcCache=null;renderQuiz();},500);
  } else {inp.classList.add('err');qzFb('qz_fb','Nicht korrekt.','err');}
}
function gjSkip(){

function gjStartRead(){
  var qs=quizState,M=qs.gjFinalM,vars=qLGS().vars,sol=qLGS().solution,n=qLGS().n;
  qs.gjReadSteps=[];
  for(var r=0;r<n;r++){
    var lead=-1;for(var c=0;c<n;c++){if(Math.abs(M[r].coeffs[c])>1e-9){lead=c;break;}}
    if(lead<0)continue;
    qs.gjReadSteps.push({vi:lead,val:sol[lead],lbl:qs.gjFinalL[r],eq:{coeffs:M[r].coeffs.slice(),rhs:M[r].rhs}});
  }
  qs.gjReadIdx=0;qs.gjKnown={};qs._mcCache=null;qs.stage='gauss_read';renderQuiz();
}

}

function initQuiz_gleich(){
  quizState.stage='gleich_choose_sv';
  quizState._mcCache=null;quizState.qKnown={};
  quizState.q3x3=false;quizState.qBacksubPhaseG=null;
  quizState.qEqIV=null;quizState.qEqV=null;quizState.qSubSv=null;
  quizState.qDirectMode=false;quizState.qDirectQueue=null;
  quizState.qBsPlanSub=null;quizState.qLastSolved=null;
  quizState.qPair2Opts=null;
}

function renderQuiz_gleich(qa){
  var qs=quizState,lgs=qLGS(),vars=lgs.vars,eqs=lgs.equations,sol=lgs.solution,n=lgs.n;
  var html='<div class="qz-stage">Gleichsetzungsverfahren</div>';

  // ── Choose sv ──
  if(qs.stage==='gleich_choose_sv'){
    var availG=[];
    vars.forEach(function(_,i){if(countEqsWithVar(eqs,i)>=2)availG.push(i);});
    if(availG.length===0){
      html+=qzCurStep('Kein Gleichsetzen nötig',
        '<div class="qz-hint-box">In diesem LGS kommt keine Variable in zwei Gleichungen gleichzeitig vor – jede Gleichung enthält nur eine Variable. Ein Gleichsetzen ist deshalb nicht nötig: Alle Werte lassen sich direkt berechnen.</div>'
        +'<div class="qz-btns"><button onclick="gqStartDirect()">Weiter &#8594;</button></div>');
    } else {
      html+=qzCurStep('Nach welcher Variable sollen alle Gleichungen umgestellt werden?',
        '<div class="qz-sub">Wähle eine Variable, die in mindestens zwei Gleichungen vorkommt:</div>'
        +'<div class="qz-btns">'+availG.map(function(i){
          return'<button class="qz-btn" onclick="gqPickSv('+i+',this)">'+varTex(vars[i])+'</button>';
        }).join('')+'</div>');
    }

  // ── Rearrange equations ──
  } else if(qs.stage==='gleich_rearrange'){
    var sv=qs.qSv,eqIdx=qs.qRearrIdx,hl=qs.helpLevel;
    var eq=eqs[eqIdx],lbl=qLbl(eqIdx),primedLbl=lbl+"'";
    var ansEq=makePrimedEq(eq,sv);
    // Show previously completed rearrangements (only equations in qRearrIdxs before this one)
    var svIdxsArr=qs.qRearrIdxs||[],curPos=svIdxsArr.indexOf(eqIdx);
    for(var pi=0;pi<curPos;pi++){
      var di=svIdxsArr[pi],dex=solvedExprTex(eqs[di],vars,sv);
      html+=qzDoneStep('\\(\\text{'+qLbl(di)+"'}: \\quad "+vars[sv]+' = '+(dex||'?')+'\\)','');
    }
    if(hl>=2&&!qs._mcCache){var ds=qzGenDistr(ansEq,vars);qs._mcCache=qzShuffleMC(ansEq,ds);}
    var hint1=hl>=1?'<div class="qz-hint-box">Löse Gl.\u202f'+lbl+' nach '+varTex(vars[sv])+' auf:<br>1. Alle Terme ohne '+varTex(vars[sv])+' auf die rechte Seite.<br>2. Durch den Koeffizienten von '+varTex(vars[sv])+' dividieren.</div>':'';
    var hint2=hl>=2&&qs._mcCache?qzMCEqHtml(qs._mcCache.opts,qs._mcCache.corr,vars,'gqMCRearr'):'';
    // Build a non-sv example variable
    var exVar=vars.filter(function(_,i){return i!==sv;})[0]||'y';
    html+=qzCurStep('Gl.\u202f'+lbl+' nach '+varTex(vars[sv])+' aufl\u00f6sen \u2192 '+primedLbl+':',
      qzEqBanner(eq,vars,lbl)
      +'<div class="qz-sub">Gib '+primedLbl+' ein (z.B. <code>'+vars[sv]+'=3-2'+exVar+'</code>):</div>'
      +qzVarInsertBtns('qz_re',vars)+'<div class="qz-inp-row"><input class="qz-inp" id="qz_re" type="text"'+qzVarPlaceholder(vars)+' autofocus onkeydown="if(event.key===\'Enter\')gqCheckRearr()">'
      +'<button onclick="gqCheckRearr()">Pr\u00fcfen</button>'
      +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'<button class="btn-grey" onclick="gqSkipRearr()">Überspringen</button>'
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint1+hint2);

  // ── (3×3 only) Choose pair ──
  } else if(qs.stage==='gleich_choose_pair'){
    var sv=qs.qSv,hasSv=eqs.map(function(e){return Math.abs(e.coeffs[sv])>1e-9;});
    var si=[];eqs.forEach(function(_,i){if(hasSv[i])si.push(i);});
    var pLabels=[];var pairs=[];
    for(var a=0;a<si.length;a++)for(var b=a+1;b<si.length;b++){
      pairs.push([si[a],si[b]]);
      pLabels.push(qLbl(si[a])+"' = "+qLbl(si[b])+"'");
    }
    var primedSummary=si.map(function(i){return'\\(\\text{'+qLbl(i)+"'}: "+vars[sv]+' = '+solvedExprTex(eqs[i],vars,sv)+'\\)';}).join(', ');
    html+=qzDoneStep('Umgestellt ('+primedSummary+')','');
    html+=qzCurStep('Welche zwei Gleichungen werden zuerst gleichgesetzt?',
      '<div class="qz-btns">'+pLabels.map(function(l,i){
        return'<button class="qz-btn" onclick="gqPickPair('+JSON.stringify(pairs[i])+','+i+',this)">'+l+'</button>';
      }).join('')+'</div>');

  // ── Equate & collect ──
  } else if(qs.stage==='gleich_equate'){
    var sv=qs.qSv,pa=qs.qPairA,hl=qs.helpLevel;
    var e0=eqs[pa[0]],e1=eqs[pa[1]];
    var ansEq=eqFromEquating(e0,e1,sv);
    var pLbl0=qLbl(pa[0])+"'",pLbl1=qLbl(pa[1])+"'";
    var expr0=solvedExprTex(e0,vars,sv)||'?',expr1=solvedExprTex(e1,vars,sv)||'?';
    var lIV=romanNum(qBaseN()+1);
    if(hl>=2&&!qs._mcCache){var ds=qzGenDistr(ansEq,vars);qs._mcCache=qzShuffleMC(ansEq,ds);}
    var hint1=hl>=1?'<div class="qz-hint-box">Setze die rechten Seiten gleich: \\('+expr0+' = '+expr1+'\\)<br>Bringe alle Variablen auf eine Seite, alle Zahlen auf die andere &rarr; '+lIV+'.</div>':'';
    var hint2=hl>=2&&qs._mcCache?qzMCEqHtml(qs._mcCache.opts,qs._mcCache.corr,vars,'gqMCEquate'):'';
    html+=qzCurStep('Gleichsetzen '+pLbl0+' = '+pLbl1+' &rarr; '+lIV+' (zusammengefasste Gleichung ohne '+varTex(vars[sv])+'):',
      qzSolvedFormBanner([e0,e1],vars,sv,[pLbl0,pLbl1])
      +'<div class="qz-sub">Gib '+lIV+' ein (z.B. <code>2y=4</code> oder <code>2y-4=0</code>):</div>'
      +qzVarInsertBtns('qz_ee',vars)+'<div class="qz-inp-row"><input class="qz-inp" id="qz_ee" type="text"'+qzVarPlaceholder(vars)+' autofocus onkeydown="if(event.key===\'Enter\')gqCheckEquate()">'
      +'<button onclick="gqCheckEquate()">Pr\u00fcfen</button>'
      +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'<button class="btn-grey" onclick="gqSkipEquate()">\u00dcberspringen</button>'
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint1+hint2);
  // ── Solve for remVar (or tv in 3×3) ──
  } else if(qs.stage==='gleich_solve'){
    var vi=qs.qSolveFor,expected=sol[vi],hl=qs.helpLevel;
    var ceq=qs.qCombinedEq;
    if(hl>=2&&!qs._mcCache){var dv=qzGenValDistr(expected);qs._mcCache=qzShuffleMC(expected,dv);}
    var hint1=hl>=1?'<div class="qz-hint-box">Löse \\('+eqTex(ceq.coeffs,vars,ceq.rhs)+'\\) nach \\('+vars[vi]+'\\) auf.</div>':'';
    var hint2=hl>=2&&qs._mcCache?qzMCValHtml(qs._mcCache.opts,qs._mcCache.corr,vars[vi],'gqMCVal'):'';
    html+=qzDoneStep('Gleichung: \\('+eqTex(ceq.coeffs,vars,ceq.rhs)+'\\)','');
    html+=qzCurStep('Welchen Wert hat '+varTex(vars[vi])+'?',
      qzKnownStr(vars,qs.qKnown)
      +'<div class="qz-inp-row"><span class="qz-varlbl">\\('+vars[vi]+' =\\)</span><input class="qz-inp sm" id="qz_sv" type="text" autofocus onkeydown="if(event.key===\'Enter\')gqCheckVal('+vi+','+expected+')">'
      +'<button onclick="gqCheckVal('+vi+','+expected+')">Pr\u00fcfen</button>'
      +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'<button class="btn-grey" onclick="gqSkipVal('+vi+','+expected+')">\u00dcberspringen</button>'
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint1+hint2);
  // ── Back-sub into primed equation ──
  } else if(qs.stage==='gleich_backsubst'){
    var sv=qs.qSv,bsEq=qs.qBsEq,bsExpr=qs.qBsExpr,bsLbl=qs.qBsLbl,vi=qs.qBsFor;
    var expected=sol[vi];var hl=qs.helpLevel;
    if(hl>=2&&!qs._mcCache){var dv=qzGenValDistr(expected);qs._mcCache=qzShuffleMC(expected,dv);}
    var knownEntries=Object.keys(qs.qKnown).map(function(k){return'\\('+vars[k]+' = '+numTex(qs.qKnown[k])+'\\)';});
    var hint1=hl>=1?'<div class="qz-hint-box">Setze '+knownEntries.join(', ')+' in \\(\\text{'+bsLbl+'}: \\quad '+vars[vi]+' = '+bsExpr+'\\) ein und löse nach '+varTex(vars[vi])+' auf.</div>':'';
    var hint2=hl>=2&&qs._mcCache?qzMCValHtml(qs._mcCache.opts,qs._mcCache.corr,vars[vi],'gqMCVal'):'';
    if(qs.qLastSolved)
      html+=qzDoneStep(varTex(vars[qs.qLastSolved.vi])+' = \\('+numTex(qs.qLastSolved.val)+'\\)','');
    html+=qzCurStep('Rückeinsetzen in \\(\\text{'+bsLbl+'}\\): '+varTex(vars[vi])+' berechnen',
      '<div class="qz-hint-box"><div class="scale-wrapper"><div class="scale-el">\\[\\text{'+bsLbl+'}: \\quad '+vars[vi]+' = '+bsExpr+'\\]</div></div></div>'
      +'<div class="qz-sub">Setze '+knownEntries.join(', ')+' ein und berechne '+varTex(vars[vi])+':</div>'
      +'<div class="qz-inp-row"><span class="qz-varlbl">\\('+vars[vi]+' =\\)</span><input class="qz-inp sm" id="qz_sv" type="text" autofocus onkeydown="if(event.key===\'Enter\')gqCheckVal('+vi+','+expected+')">'
      +'<button onclick="gqCheckVal('+vi+','+expected+')">Pr\u00fcfen</button>'
      +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'<button class="btn-grey" onclick="gqSkipVal('+vi+','+expected+')">\u00dcberspringen</button>'
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint1+hint2);
  // ── 3×3: choose second pair (→ V) ──
  } else if(qs.stage==='gleich_choose_pair2'){
    var sv=qs.qSv,opts=qs.qPair2Opts||[];
    html+=qzDoneStep(qLbl(qs.qPairA[0])+"' = "+qLbl(qs.qPairA[1])+"' \u2192 "+qs.qLblIV+': \\('+eqTex(qs.qEqIV.coeffs,vars,qs.qEqIV.rhs)+'\\)','');
    html+=qzCurStep('Welche Gleichungen sollen als Nächstes gleichgesetzt werden? (\u2192 '+qs.qLblV+')',
      '<div class="qz-sub">Für das zweite Gleichsetzen muss die noch nicht verwendete Gleichung dabei sein:</div>'
      +'<div class="qz-btns">'+opts.map(function(p,k){
        return'<button class="qz-btn" onclick="gqPickPair2('+k+',this)">'+qLbl(p[0])+"' = "+qLbl(p[1])+"'</button>";
      }).join('')+'</div>');
  // ── 3×3: choose variable for second equating round ──
  } else if(qs.stage==='gleich_choose_var2'){
    var sv=qs.qSv;
    html+=qzSystemBanner([qs.qEqIV,qs.qEqV],vars,[qs.qLblIV,qs.qLblV]);
    html+=qzCurStep('Nach welcher Variable sollen '+qs.qLblIV+' und '+qs.qLblV+' umgestellt werden?',
      '<div class="qz-btns">'+vars.map(function(v,i){
        var ok=i!==sv&&Math.abs(qs.qEqIV.coeffs[i])>1e-9&&Math.abs(qs.qEqV.coeffs[i])>1e-9;
        return ok?'<button class="qz-btn" onclick="gqPickVar2('+i+',this)">'+varTex(v)+'</button>':'';
      }).join('')+'</div>');
  // ── 3×3: Second equalization (→ V) ──
  } else if(qs.stage==='gleich_equate2'){
    var sv=qs.qSv,pb=qs.qPairB,hl=qs.helpLevel;
    var e0=eqs[pb[0]],e1=eqs[pb[1]];
    var ansEqV=eqFromEquating(e0,e1,sv);
    var pLbl0=qLbl(pb[0])+"'",pLbl1=qLbl(pb[1])+"'";
    var lV=qs.qLblV||romanNum(qBaseN()+2);
    if(hl>=2&&!qs._mcCache){var ds=qzGenDistr(ansEqV,vars);qs._mcCache=qzShuffleMC(ansEqV,ds);}
    var hint1=hl>=1?'<div class="qz-hint-box">Setze rechte Seiten gleich: \\('+solvedExprTex(e0,vars,sv)+'='+solvedExprTex(e1,vars,sv)+'\\) \u2192 alle Terme auf eine Seite bringen.</div>':'';
    var hint2=hl>=2&&qs._mcCache?qzMCEqHtml(qs._mcCache.opts,qs._mcCache.corr,vars,'gqMCEquate2'):'';
        html+=qzDoneStep(qLbl(qs.qPairA[0])+"' = "+qLbl(qs.qPairA[1])+"' \u2192 "+qs.qLblIV,'');
    html+=qzCurStep('Gleichsetzen '+pLbl0+' = '+pLbl1+' \u2192 '+lV+' (zusammengefasst, ohne '+varTex(vars[sv])+'):',
      qzSolvedFormBanner([e0,e1],vars,sv,[pLbl0,pLbl1])
      +'<div class="qz-sub">Gib '+lV+' ein:</div>'
      +qzVarInsertBtns('qz_e2',vars)+'<div class="qz-inp-row"><input class="qz-inp" id="qz_e2" type="text"'+qzVarPlaceholder(vars)+' autofocus onkeydown="if(event.key===\'Enter\')gqCheckEquate2()">'
      +'<button onclick="gqCheckEquate2()">Pr\u00fcfen</button>'
      +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'<button class="btn-grey" onclick="gqSkipEquate2()">\u00dcberspringen</button>'
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint1+hint2);

  // ── 3×3: Sub-rearrange IV and V for subSv ──
  } else if(qs.stage==='gleich_sub_rearrange'){
    var sv=qs.qSv,subSv=qs.qSubSv,step=qs.qSubRearrStep||0,hl=qs.helpLevel;
    var curEq=step===0?qs.qEqIV:qs.qEqV;
    var curLbl=step===0?qs.qLblIV:qs.qLblV;
    var curPrimedLbl=curLbl+"'";
    var ansEqSR=makePrimedEq(curEq,subSv);
    if(hl>=2&&!qs._mcCache){var ds=qzGenDistr(ansEqSR,vars);qs._mcCache=qzShuffleMC(ansEqSR,ds);}
    var hint1=hl>=1?'<div class="qz-hint-box">L\u00f6se \\('+eqTex(curEq.coeffs,vars,curEq.rhs)+'\\) nach '+varTex(vars[subSv])+' auf.</div>':'';
    var hint2=hl>=2&&qs._mcCache?qzMCEqHtml(qs._mcCache.opts,qs._mcCache.corr,vars,'gqMCSubRearr'):'';
    if(step===0){
      html+=qzSystemBanner([qs.qEqIV,qs.qEqV],vars,[qs.qLblIV,qs.qLblV]);
    } else {
      html+=qzDoneStep('\\(\\text{'+qs.qLblIV+"'}: \\quad "+vars[subSv]+' = '+solvedExprTex(qs.qEqIV,vars,subSv)+'\\)','');
      html+=qzSystemBanner([qs.qEqV],vars,[qs.qLblV]);
    }
    html+=qzCurStep('Gl. '+curLbl+' nach '+varTex(vars[subSv])+' umformen \u2192 '+curPrimedLbl+':',
      qzEqBanner(curEq,vars,curLbl)
      +'<div class="qz-sub">Gib '+curPrimedLbl+' ein:</div>'
      +qzVarInsertBtns('qz_sr',vars)+'<div class="qz-inp-row"><input class="qz-inp" id="qz_sr" type="text"'+qzVarPlaceholder(vars)+' autofocus onkeydown="if(event.key===\'Enter\')gqCheckSubRearr()">'
      +'<button onclick="gqCheckSubRearr()">Pr\u00fcfen</button>'
      +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'<button class="btn-grey" onclick="gqSkipSubRearr()">\u00dcberspringen</button>'
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint1+hint2);

  // ── 3×3: Sub-equate IV'=V' → VI ──
  } else if(qs.stage==='gleich_sub_equate'){
    var sv=qs.qSv,subSv=qs.qSubSv,hl=qs.helpLevel;
    var lIVp=qs.qLblIV+"'",lVp=qs.qLblV+"'",lVI=qs.qLblVI||romanNum(qBaseN()+3);
    var ansEqVI=eqFromEquating(qs.qEqIV,qs.qEqV,subSv);
    if(hl>=2&&!qs._mcCache){var ds=qzGenDistr(ansEqVI,vars);qs._mcCache=qzShuffleMC(ansEqVI,ds);}
    var exIV=solvedExprTex(qs.qEqIV,vars,subSv)||'?',exV=solvedExprTex(qs.qEqV,vars,subSv)||'?';
    var hint1=hl>=1?'<div class="qz-hint-box">Setze \\('+exIV+' = '+exV+'\\) gleich und fasse zusammen \u2192 '+lVI+'.</div>':'';
    var hint2=hl>=2&&qs._mcCache?qzMCEqHtml(qs._mcCache.opts,qs._mcCache.corr,vars,'gqMCSubEquate'):'';
    html+=qzDoneStep('\\(\\text{'+lIVp+'}: \\quad '+vars[subSv]+' = '+exIV+'\\)','');
    html+=qzDoneStep('\\(\\text{'+lVp+'}: \\quad '+vars[subSv]+' = '+exV+'\\)','');
    html+=qzCurStep('Gleichsetzen '+lIVp+' = '+lVp+' \u2192 '+lVI+' (ohne '+varTex(vars[subSv])+'):',
      qzSolvedFormBanner([qs.qEqIV,qs.qEqV],vars,subSv,[lIVp,lVp])
      +'<div class="qz-sub">Gib '+lVI+' ein:</div>'
      +qzVarInsertBtns('qz_se2',vars)+'<div class="qz-inp-row"><input class="qz-inp" id="qz_se2" type="text"'+qzVarPlaceholder(vars)+' autofocus onkeydown="if(event.key===\'Enter\')gqCheckSubEquate()">'
      +'<button onclick="gqCheckSubEquate()">Pr\u00fcfen</button>'
      +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'<button class="btn-grey" onclick="gqSkipSubEquate()">\u00dcberspringen</button>'
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint1+hint2);

  } else if(qs.stage==='done'){html+=_quizDone();}
  qa.innerHTML=html;
}

function exprsInSv(eq,sv){return Math.abs(eq.coeffs[sv])>1e-9;}

// Degenerate case: every equation contains only one variable → solve all directly
function gqStartDirect(){
  var qs=quizState,lgs=qLGS();if(!qs||!lgs)return;
  var vars=lgs.vars,eqs=lgs.equations;
  var items=[];
  eqs.forEach(function(eq){
    var vi=-1;for(var i=0;i<vars.length;i++){if(Math.abs(eq.coeffs[i])>1e-9){vi=i;break;}}
    if(vi>=0)items.push({eq:eq,vi:vi});
  });
  if(!items.length){qs.stage='done';renderQuiz();return;}
  var first=items.shift();
  qs.qDirectMode=true;qs.qDirectQueue=items;
  qs.qCombinedEq=first.eq;qs.qSolveFor=first.vi;
  qs.stage='gleich_solve';qs.helpLevel=0;qs._mcCache=null;
  renderQuiz();
}

function gqPickSv(vi,btn){
  btn.classList.add('qc');btn.closest('.qz-btns').querySelectorAll('.qz-btn').forEach(function(b){b.disabled=true;});
  quizState.qSv=vi;
  var lgs=qLGS(),eqs=lgs.equations;
  var svIdxs=[];eqs.forEach(function(e,i){if(Math.abs(e.coeffs[vi])>1e-9)svIdxs.push(i);});
  quizState.qRearrIdxs=svIdxs;quizState.qRearrIdx=svIdxs[0];
  quizState._mcCache=null;
  setTimeout(function(){quizState.stage='gleich_rearrange';quizState.helpLevel=0;renderQuiz();},400);
}

function gqCheckRearr(){
  var qs=quizState,lgs=qLGS(),vars=lgs.vars,eqs=lgs.equations;
  var sv=qs.qSv,eqIdx=qs.qRearrIdx;
  var inp=document.getElementById('qz_re');if(!inp)return;
  var p=parseUserEq(inp.value,vars);
  if(!p){qzFb('qz_fb','Format ungültig.','err');inp.classList.add('err');return;}
  var ansEq=makePrimedEq(eqs[eqIdx],sv);
  if(eqMatch(p.coeffs,p.rhs,ansEq.coeffs,ansEq.rhs)){
    inp.classList.add('ok');qzFb('qz_fb','✓ Richtig!','ok');
    setTimeout(function(){gqAdvanceRearr();},500);
  } else {inp.classList.add('err');qzFb('qz_fb','Nicht korrekt.','err');}
}

function gqSkipRearr(){
  var qs=quizState,vars=qLGS().vars,eqs=qLGS().equations;
  var sv=qs.qSv,eqIdx=qs.qRearrIdx;
  var ans=makePrimedEq(eqs[eqIdx],sv);
  var fb=document.getElementById('qz_fb');
  if(fb){fb.className='qz-fb ok';fb.innerHTML='Lösung: \\('+vars[sv]+' = '+solvedExprTex(eqs[eqIdx],vars,sv)+'\\)';MathJax.typesetPromise([fb]);}
  setTimeout(function(){gqAdvanceRearr();},1200);
}

function gqMCRearr(ci,corr,btn){
  qzMCHandle(ci,corr,btn,function(){gqAdvanceRearr();});
}

function gqAdvanceRearr(){
  var qs=quizState,lgs=qLGS(),eqs=lgs.equations,n=lgs.n,sv=qs.qSv;
  qs.helpLevel=0;qs._mcCache=null;
  var si=qs.qRearrIdxs,cur=si.indexOf(qs.qRearrIdx);
  if(cur<si.length-1){
    // Next equation to rearrange
    qs.qRearrIdx=si[cur+1];
    qs.stage='gleich_rearrange';
  } else if(n===3){
    qs.stage='gleich_choose_pair';
  } else {
    // 2×2: go to equating
    var c0=eqs[0].coeffs[sv],c1=eqs[1].coeffs[sv];
    qs.qPairA=[0,1];
    qs.qCombinedEq=eqFromEquating(eqs[0],eqs[1],sv);
    var rv=-1;for(var i=0;i<lgs.vars.length;i++){if(i!==sv&&Math.abs(qs.qCombinedEq.coeffs[i])>1e-9){rv=i;break;}}
    qs.qSolveFor=rv;
    qs.stage='gleich_equate';
  }
  renderQuiz();
}

function gqPickPair(pair,pIdx,btn){
  btn.classList.add('qc');btn.closest('.qz-btns').querySelectorAll('.qz-btn').forEach(function(b){b.disabled=true;});
  var qs=quizState,lgs=qLGS(),eqs=lgs.equations,vars=lgs.vars,sv=qs.qSv;
  qs.qPairA=pair;
  qs.qCombinedEq=eqFromEquating(eqs[pair[0]],eqs[pair[1]],sv);
  var rv=-1;for(var i=0;i<vars.length;i++){if(i!==sv&&Math.abs(qs.qCombinedEq.coeffs[i])>1e-9){rv=i;break;}}
  qs.qSolveFor=rv;qs._mcCache=null;
  setTimeout(function(){qs.stage='gleich_equate';qs.helpLevel=0;renderQuiz();},400);
}

function gqCheckEquate(){
  var qs=quizState,vars=qLGS().vars,eqs=qLGS().equations,sv=qs.qSv,pa=qs.qPairA;
  var inp=document.getElementById('qz_ee');if(!inp)return;
  var p=parseUserEq(inp.value,vars);
  if(!p){qzFb('qz_fb','Format ungültig.','err');inp.classList.add('err');return;}
  var ans=qs.qCombinedEq,sol=qLGS().solution,n=qLGS().n;
  if(eqMatch(p.coeffs,p.rhs,ans.coeffs,ans.rhs)){
    inp.classList.add('ok');qzFb('qz_fb','✓ Richtig!','ok');
    setTimeout(function(){gqAfterIV(ans);},500);
    return;
  }
  var solved=isSolvedFor(p,vars);
  if(solved&&Math.abs(solved.val-sol[solved.vi])<1e-6){
    inp.classList.add('ok');qzFb('qz_fb','✓ Richtig \u2013 Wert bereits bestimmt: \\('+vars[solved.vi]+' = '+numTex(solved.val)+'\\)','ok');
    MathJax.typesetPromise([document.getElementById('qz_fb')]);
    qs.qKnown[solved.vi]=solved.val;
    setTimeout(function(){gqAdvanceAfterVal(solved.vi,solved.val);},900);
    return;
  }
  inp.classList.add('err');qzFb('qz_fb','Nicht korrekt \u2013 pr\u00fcfe ob alle Terme zusammengefasst sind.','err');
}

function gqSkipEquate(){
  var qs=quizState,vars=qLGS().vars;
  var ans=qs.qCombinedEq;
  var fb=document.getElementById('qz_fb');
  if(fb){fb.className='qz-fb ok';fb.innerHTML='Ergebnis: \\('+eqTex(ans.coeffs,vars,ans.rhs)+'\\)';MathJax.typesetPromise([fb]);}
  setTimeout(function(){gqAfterIV(ans);},1200);
}

function gqMCEquate(ci,corr,btn){
  qzMCHandle(ci,corr,btn,function(){gqAfterIV(quizState.qCombinedEq);});
}

// ── Routing after the first equating step (→ IV) ──────────────
// 2×2: continue solving. 3×3: build the second 2×2 equation V – either by a
// second equating step or, if the third equation lacks sv, by taking it over
// directly – and then branch depending on the shape of IV and V.
function gqAfterIV(ans){
  var qs=quizState,lgs=qLGS();if(!qs||!lgs)return;
  var vars=lgs.vars,eqs=lgs.equations,n=lgs.n,sv=qs.qSv;
  qs.helpLevel=0;qs._mcCache=null;
  if(n!==3){qs.stage='gleich_solve';renderQuiz();return;}
  qs.q3x3=true;
  qs.qEqIV=ans;qs.qLblIV=romanNum(qBaseN()+1);
  var allI=[];for(var i=0;i<n;i++)allI.push(i);
  var rem3=allI.filter(function(i){return qs.qPairA.indexOf(i)<0;})[0];
  if(rem3!=null&&Math.abs(eqs[rem3].coeffs[sv])>1e-9){
    // Third equation contains sv → user chooses the second pair (like the solution path)
    qs.qPair2Opts=[[qs.qPairA[0],rem3],[qs.qPairA[1],rem3]];
    qs.qLblV=romanNum(qBaseN()+2);
    qs.stage='gleich_choose_pair2';renderQuiz();
  } else if(rem3!=null){
    // Third equation lacks sv → no second equating possible; take it over directly
    qs.qEqV=eqs[rem3];qs.qLblV=qLbl(rem3);
    qzInfo(varTex(vars[sv])+' kommt in Gl.\u202f'+qLbl(rem3)+' nicht vor (Koeffizient 0). Ein zweites Gleichsetzen ist deshalb nicht möglich und auch nicht nötig – Gl.\u202f'+qLbl(rem3)+' bildet zusammen mit '+qs.qLblIV+' direkt das 2×2-System.',
      function(){gqAfterEqV();});
  } else {
    qs.stage='gleich_solve';renderQuiz();
  }
}
function gqPickPair2(k,btn){
  var qs=quizState;if(!qs||!qs.qPair2Opts)return;
  if(btn){btn.classList.add('qc');btn.closest('.qz-btns').querySelectorAll('.qz-btn').forEach(function(b){b.onclick=null;});}
  qs.qPairB=qs.qPair2Opts[k];
  setTimeout(function(){qs.stage='gleich_equate2';qs.helpLevel=0;qs._mcCache=null;renderQuiz();},300);
}

// ── Routing once IV and V are both known ─────────────────────
// Normal case: user chooses the second variable (like the solution path),
// then IV and V are rearranged for it and equated again.
// Special case: one of the two equations contains only a single variable
// (a second variable vanished while collecting) → solve it directly and plan
// the back-substitution through the other equation.
function gqAfterEqV(){
  var qs=quizState,lgs=qLGS();if(!qs||!lgs)return;
  var vars=lgs.vars,n=lgs.n,sv=qs.qSv;
  var pairEqs=[qs.qEqIV,qs.qEqV],lbls=[qs.qLblIV,qs.qLblV];
  qs.helpLevel=0;qs._mcCache=null;
  var sIdx=-1,w=-1;
  for(var i=0;i<2;i++){
    var nz=[];for(var j=0;j<vars.length;j++){if(Math.abs(pairEqs[i].coeffs[j])>1e-9)nz.push(j);}
    if(nz.length===1){sIdx=i;w=nz[0];break;}
  }
  if(sIdx>=0){
    var oth=1-sIdx,u=-1;
    for(var j2=0;j2<vars.length;j2++){if(j2!==sv&&j2!==w&&Math.abs(pairEqs[oth].coeffs[j2])>1e-9){u=j2;break;}}
    qs.qCombinedEq=pairEqs[sIdx];qs.qSolveFor=w;
    qs.qBsPlanSub=u>=0?{
      eq:makePrimedEq(pairEqs[oth],u),
      expr:solvedExprTex(pairEqs[oth],vars,u)||'?',
      lbl:lbls[oth]+"'",vi:u
    }:null;
    qzInfo('Gl.\u202f'+lbls[sIdx]+' enthält nur noch '+varTex(vars[w])+' – beim Zusammenfassen ist eine weitere Variable weggefallen. Die Gleichung kann direkt gelöst werden; ein weiteres Umformen und Gleichsetzen entfällt.',
      function(){quizState.stage='gleich_solve';renderQuiz();});
    return;
  }
  // User chooses the variable for the second equating round (like the solution path)
  qs.stage='gleich_choose_var2';renderQuiz();
}
function gqPickVar2(vi,btn){
  var qs=quizState;if(!qs)return;
  if(btn){btn.classList.add('qc');btn.closest('.qz-btns').querySelectorAll('.qz-btn').forEach(function(b){b.onclick=null;});}
  qs.qSubSv=vi;qs.qSubRearrStep=0;qs.qLblVI=romanNum(qBaseN()+3);
  setTimeout(function(){qs.stage='gleich_sub_rearrange';qs.helpLevel=0;qs._mcCache=null;renderQuiz();},300);
}

function gqSkipVal(vi,expected){
  var qs=quizState,vars=qLGS().vars;
  qs.qKnown[vi]=expected;
  var fb=document.getElementById('qz_fb');
  if(fb){fb.className='qz-fb ok';fb.innerHTML='Lösung: \\('+vars[vi]+' = '+numTex(expected)+'\\)';MathJax.typesetPromise([fb]);}
  setTimeout(function(){gqAdvanceAfterVal(vi,expected);},1200);
}
function gqCheckVal(vi,expected){
  var qs=quizState,vars=qLGS().vars;
  var inp=document.getElementById('qz_sv');if(!inp)return;
  var val=parseValOrEq(inp.value,vars,vi);
  if(val===null){qzFb('qz_fb','Ungültige Eingabe (z.B. 3 oder '+vars[vi]+'=3).','err');return;}
  if(Math.abs(val-expected)<1e-6){
    inp.classList.add('ok');qzFb('qz_fb','✓ Richtig!','ok');
    qs.qKnown[vi]=expected;
    setTimeout(function(){gqAdvanceAfterVal(vi,expected);},500);
  } else {inp.classList.add('err');qzFb('qz_fb','Nicht korrekt.','err');}
}

function gqMCVal(ci,corr,btn){
  var qs=quizState,vi=qs.qSolveFor,expected=qLGS().solution[vi];
  // find the value from the MC options
  var mcVal=qs._mcCache?qs._mcCache.opts[ci]:null;
  qzMCHandle(ci,corr,btn,function(){
    qs.qKnown[vi]=expected;gqAdvanceAfterVal(vi,expected);
  });
}

function gqAdvanceAfterVal(vi,val){
  var qs=quizState,lgs=qLGS(),vars=lgs.vars,eqs=lgs.equations,n=lgs.n,sv=qs.qSv;
  qs.helpLevel=0;qs._mcCache=null;
  qs.qLastSolved={vi:vi,val:val};
  // Direct mode (degenerate systems): work through the queue, then finish
  if(qs.qDirectQueue&&qs.qDirectQueue.length){
    var nx=qs.qDirectQueue.shift();
    qs.qCombinedEq=nx.eq;qs.qSolveFor=nx.vi;
    qs.stage='gleich_solve';renderQuiz();return;
  }
  if(qs.qDirectMode){qs.stage='done';renderQuiz();return;}
  if(qs.stage==='gleich_solve'){
    if(qs.q3x3){
      // 3x3: first back-sub for the second variable
      var plan=qs.qBsPlanSub;
      if(plan){
        // Planned via gqAfterEqV (single-variable IV/V special case)
        qs.qBsEq=plan.eq;qs.qBsExpr=plan.expr;qs.qBsLbl=plan.lbl;
        qs.qBsFor=plan.vi;qs.qSolveFor=plan.vi;
        qs.qBsPlanSub=null;
      } else {
        var subSvG=qs.qSubSv;
        qs.qBsEq=makePrimedEq(qs.qEqIV,subSvG);
        qs.qBsExpr=solvedExprTex(qs.qEqIV,vars,subSvG)||'?';
        qs.qBsLbl=qs.qLblIV+"'";
        qs.qBsFor=subSvG;qs.qSolveFor=subSvG;
      }
      // Guard: if the planned/default variable is already known, skip straight
      // to the final back-substitution for sv
      if(qs.qKnown[qs.qBsFor]!==undefined){
        var bsEqIdx0=qs.qRearrIdxs[0];
        qs.qBsEq=makePrimedEq(eqs[bsEqIdx0],sv);
        qs.qBsExpr=solvedExprTex(eqs[bsEqIdx0],vars,sv)||'?';
        qs.qBsLbl=qLbl(bsEqIdx0)+"'";
        qs.qBsFor=sv;qs.qSolveFor=sv;
        qs.qBacksubPhaseG='main';
      } else {
        qs.qBacksubPhaseG='sub';
      }
    } else {
      var bsEqIdx=qs.qRearrIdxs[0];
      qs.qBsEq=makePrimedEq(eqs[bsEqIdx],sv);
      qs.qBsExpr=solvedExprTex(eqs[bsEqIdx],vars,sv)||'?';
      qs.qBsLbl=qLbl(bsEqIdx)+"'";
      qs.qBsFor=sv;qs.qSolveFor=sv;
    }
    qs.stage='gleich_backsubst';
  } else if(qs.stage==='gleich_backsubst'){
    if(qs.q3x3&&qs.qBacksubPhaseG==='sub'){
      // 3x3: now back-sub into I' for sv (x)
      var bsEqIdx2=qs.qRearrIdxs[0];
      qs.qBsEq=makePrimedEq(eqs[bsEqIdx2],sv);
      qs.qBsExpr=solvedExprTex(eqs[bsEqIdx2],vars,sv)||'?';
      qs.qBsLbl=qLbl(bsEqIdx2)+"'";
      qs.qBsFor=sv;qs.qSolveFor=sv;
      qs.qBacksubPhaseG='main';
      qs.stage='gleich_backsubst';
    } else {
      qs.stage='done';
    }
  }
  renderQuiz();
}

// ────────────────────────────────────────────────────────────
// EINSETZUNGSVERFAHREN QUIZ
// ────────────────────────────────────────────────────────────
function initQuiz_einsetz(){
  quizState.stage='einsetz_choose_eq';
  quizState._mcCache=null;quizState.qKnown={};
  quizState.qSubSys=null;quizState.qSubSv=null;quizState.qBacksubPhase=null;
  quizState.qRvLbl=null;quizState.qSubBsLbl=null;
}

function renderQuiz_einsetz(qa){
  var qs=quizState,lgs=qLGS(),vars=lgs.vars,eqs=lgs.equations,sol=lgs.solution,n=lgs.n;
  var html='<div class="qz-stage">Einsetzungsverfahren</div>';

      }).join('')+'</div>');

  } else if(qs.stage==='einsetz_choose_var'){

      qzEqBanner(eqs[fe],vars,qLbl(fe))

  } else if(qs.stage==='einsetz_rearrange'){

    var hint1=hl>=1?'<div class="qz-hint-box">Löse \\('+eqTex(eq.coeffs,vars,eq.rhs)+'\\) nach '+varTex(vars[sv]||"?")+' auf:<br>1. Alle anderen Terme auf die rechte Seite.<br>2. Durch den Koeffizienten von '+varTex(vars[sv]||"?")+' dividieren.</div>':'';
    var hint2=hl>=2&&qs._mcCache?qzMCEqHtml(qs._mcCache.opts,qs._mcCache.corr,vars,'eqMCRearr'):'';
    html+=qzDoneStep('Umzuformende Gl.: Gl.\u202f'+lbl+' nach '+varTex(vars[sv]),'');
    html+=qzCurStep('Gl.\u202f'+lbl+' nach '+varTex(vars[sv])+' umformen \u2192 '+pivLbl+':',
      qzEqBanner(eq,vars,lbl)
      +'<div class="qz-sub">Forme nach '+varTex(vars[sv])+' um und gib '+pivLbl+' ein:</div>'
      +qzVarInsertBtns('qz_re',vars)+'<div class="qz-inp-row"><input class="qz-inp" id="qz_re" type="text"'+qzVarPlaceholder(vars)+' autofocus onkeydown="if(event.key===\'Enter\')eqCheckRearr()">'
      +'<button onclick="eqCheckRearr()">Prüfen</button>'
      +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'<button class="btn-grey" onclick="eqSkipRearr()">Überspringen</button>'
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint1+hint2);

  } else if(qs.stage==='einsetz_substitute'){
    var fe=qs.qFe,sv=qs.qSv,hl=qs.helpLevel;
    var pivotEq=eqs[fe],oi=qs.qOiIdx;
    var oiEq=eqs[oi],oiLbl=qLbl(oi),oiPrimedLbl=oiLbl+"'";
    var expr=solvedExprTex(pivotEq,vars,sv);
    var svCoeffFe=pivotEq.coeffs[sv],svCoeffOi=oiEq.coeffs[sv];
    var ansEq=subCollected(oiEq,pivotEq,sv,svCoeffFe,svCoeffOi);
    if(hl>=2&&!qs._mcCache){var ds=qzGenDistr(ansEq,vars);qs._mcCache=qzShuffleMC(ansEq,ds);}
    var hint1=hl>=1?'<div class="qz-hint-box">Ersetze \\('+vars[sv]+'\\) in Gl.\u202f'+oiLbl+' durch \\('+expr+'\\) und fasse zusammen.</div>':'';
    var hint2=hl>=2&&qs._mcCache?qzMCEqHtml(qs._mcCache.opts,qs._mcCache.corr,vars,'eqMCSub'):'';
    html+=qzDoneStep('\\(\\text{'+qLbl(fe)+"'}: \\quad "+vars[sv]+' = '+expr+'\\)','');
    html+=qzCurStep('Einsetzen von \\('+vars[sv]+' = '+expr+'\\) in Gl.\u202f'+oiLbl+' \u2192 '+oiPrimedLbl+':',
      qzEqBanner(oiEq,vars,oiLbl)
      +'<div class="qz-sub">Setze \\('+vars[sv]+' = '+expr+'\\) in Gl.\u202f'+oiLbl+' ein und fasse zusammen \u2013 gib '+oiPrimedLbl+' ein (jede gleichwertige Form ist richtig):</div>'
      +qzVarInsertBtns('qz_se',vars)+'<div class="qz-inp-row"><input class="qz-inp" id="qz_se" type="text"'+qzVarPlaceholder(vars)+' autofocus onkeydown="if(event.key===\'Enter\')eqCheckSub()">'
      +'<button onclick="eqCheckSub()">Pr\u00fcfen</button>'
      +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'<button class="btn-grey" onclick="eqSkipSub()">\u00dcberspringen</button>'
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint1+hint2);
  } else if(qs.stage==='einsetz_solve_rv'){
    var rv=qs.qRv,expected=sol[rv],hl=qs.helpLevel;
    var subEq=qs.qSubEq;
    if(hl>=2&&!qs._mcCache){var dv=qzGenValDistr(expected);qs._mcCache=qzShuffleMC(expected,dv);}
    var hint1=hl>=1?'<div class="qz-hint-box">Löse \\('+eqTex(subEq.coeffs,vars,subEq.rhs)+'\\) nach \\('+vars[rv]+'\\) auf.</div>':'';
    var hint2=hl>=2&&qs._mcCache?qzMCValHtml(qs._mcCache.opts,qs._mcCache.corr,vars[rv],'eqMCVal'):'';
    var rvBannerLbl=qs.qRvLbl
      ||(qs.qSubSys?qLbl(qs.qSubSys.idxs[1-(qs.qSubPivIdx||0)])+"''"
        :(qs.qOiIdx!=null?qLbl(qs.qOiIdx)+"'":''));
    html+=qzDoneStep('\\(\\text{'+qLbl(qs.qFe)+"'}: \\quad "+vars[qs.qSv]+' = '+solvedExprTex(eqs[qs.qFe],vars,qs.qSv)+'\\)',
      qzEqBanner(subEq,vars,rvBannerLbl));
    html+=qzCurStep('Welchen Wert hat '+varTex(vars[rv])+'?',
      qzKnownStr(vars,qs.qKnown)
      +'<div class="qz-inp-row"><span class="qz-varlbl">\\('+vars[rv]+' =\\)</span><input class="qz-inp sm" id="qz_sv" type="text" autofocus onkeydown="if(event.key===\'Enter\')eqCheckVal('+rv+','+expected+')">'
      +'<button onclick="eqCheckVal('+rv+','+expected+')">Pr\u00fcfen</button>'
      +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'<button class="btn-grey" onclick="eqSkipVal('+rv+','+expected+')">\u00dcberspringen</button>'
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint1+hint2);
  // ── 3×3: choose sub-system pivot equation ──
  } else if(qs.stage==='einsetz_sub_choose_eq'){
    var sv=qs.qSv,subsys=qs.qSubSys;
    html+=qzDoneStep('\\(\\text{'+qLbl(qs.qFe)+"'}: \\quad "+vars[sv]+' = '+solvedExprTex(eqs[qs.qFe],vars,sv)+'\\)','');
    html+=qzCurStep('Teilsystem (2\u00d72): Welche Gleichung soll umgestellt werden?',
      qzSystemBanner(subsys.eqs,vars,[qLbl(subsys.idxs[0])+"'",qLbl(subsys.idxs[1])+"'"])
      +'<div class="qz-btns">'+subsys.eqs.map(function(_,k){
        return'<button class="qz-btn" onclick="eqPickSubEq('+k+',this)">Gleichung\u202f'+qLbl(subsys.idxs[k])+"'</button>";
      }).join('')+'</div>');
  // ── 3×3: choose sub-system variable ──
  } else if(qs.stage==='einsetz_sub_choose_var'){
    var sv=qs.qSv,subsys=qs.qSubSys,subFe0=qs.qSubPivIdx||0;
    var subEq0=subsys.eqs[subFe0];
    html+=qzCurStep('Nach welcher Variable soll Gl.\u202f'+qLbl(subsys.idxs[subFe0])+"' umgestellt werden?",
      qzEqBanner(subEq0,vars,qLbl(subsys.idxs[subFe0])+"'")
      +'<div class="qz-btns">'+vars.map(function(v,i){
        var ok=i!==sv&&Math.abs(subEq0.coeffs[i])>1e-9;
        return ok?'<button class="qz-btn" onclick="eqPickSubVar('+i+',this)">'+varTex(v)+'</button>':'';
      }).join('')+'</div>');
  // ── 3×3: Rearrange sub-pivot for sub-sv ──
  } else if(qs.stage==='einsetz_sub_rearrange'){
    var sv=qs.qSv,subSv=qs.qSubSv,hl=qs.helpLevel;
    var subsys=qs.qSubSys,subFe=qs.qSubPivIdx||0;
    var subEq=subsys.eqs[subFe];
    var subLbl=qLbl(subsys.idxs[subFe])+"'";
    var subPrimedLbl=qLbl(subsys.idxs[subFe])+"''";
    var ansEqSR=makePrimedEq(subEq,subSv);
    if(hl>=2&&!qs._mcCache){var ds=qzGenDistr(ansEqSR,vars);qs._mcCache=qzShuffleMC(ansEqSR,ds);}
    var hint1=hl>=1?'<div class="qz-hint-box">L\u00f6se \\('+eqTex(subEq.coeffs,vars,subEq.rhs)+'\\) nach '+varTex(vars[subSv])+' auf.</div>':'';
    var hint2=hl>=2&&qs._mcCache?qzMCEqHtml(qs._mcCache.opts,qs._mcCache.corr,vars,'eqMCSubRearr'):'';
    html+=qzDoneStep('\\(\\text{'+qLbl(qs.qFe)+"'}: \\quad "+vars[sv]+' = '+solvedExprTex(eqs[qs.qFe],vars,sv)+'\\)','');
    html+=qzCurStep('Teilsystem (2\u00d72): Gl.\u202f'+subLbl+' nach '+varTex(vars[subSv])+' umformen \u2192 '+subPrimedLbl+':',
      qzSystemBanner(subsys.eqs,vars,[qLbl(subsys.idxs[0])+"'",qLbl(subsys.idxs[1])+"'"])
      +qzEqBanner(subEq,vars,subLbl)
      +'<div class="qz-sub">Gib '+subPrimedLbl+' ein:</div>'
      +qzVarInsertBtns('qz_srr',vars)+'<div class="qz-inp-row"><input class="qz-inp" id="qz_srr" type="text"'+qzVarPlaceholder(vars)+' autofocus onkeydown="if(event.key===\'Enter\')eqCheckSubRearr()">'
      +'<button onclick="eqCheckSubRearr()">Pr\u00fcfen</button>'
      +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'<button class="btn-grey" onclick="eqSkipSubRearr()">\u00dcberspringen</button>'
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint1+hint2);

  // ── 3×3: Substitute sub-primed into second sub-eq ──
  } else if(qs.stage==='einsetz_sub_substitute'){
    var sv=qs.qSv,subSv=qs.qSubSv,hl=qs.helpLevel;
    var subsys=qs.qSubSys,subFe=qs.qSubPivIdx||0,subOi=1-subFe;
    var subPivEq=subsys.eqs[subFe],subOiEq=subsys.eqs[subOi];
    var subPrimedLbl=qLbl(subsys.idxs[subFe])+"''";
    var subOiLbl=qLbl(subsys.idxs[subOi])+"'";
    var subOiPrimedLbl=qLbl(subsys.idxs[subOi])+"''";
    var subExpr=solvedExprTex(subPivEq,vars,subSv)||'?';
    var subAnsEq=subCollected(subOiEq,subPivEq,subSv,subPivEq.coeffs[subSv],subOiEq.coeffs[subSv]);
    if(hl>=2&&!qs._mcCache){var ds=qzGenDistr(subAnsEq,vars);qs._mcCache=qzShuffleMC(subAnsEq,ds);}
    var hint1=hl>=1?'<div class="qz-hint-box">Ersetze \\('+vars[subSv]+'\\) in \\('+eqTex(subOiEq.coeffs,vars,subOiEq.rhs)+'\\) durch \\('+subExpr+'\\) und fasse zusammen.</div>':'';
    var hint2=hl>=2&&qs._mcCache?qzMCEqHtml(qs._mcCache.opts,qs._mcCache.corr,vars,'eqMCSubSub'):'';
    html+=qzDoneStep('\\(\\text{'+subPrimedLbl+'}: \\quad '+vars[subSv]+' = '+subExpr+'\\)','');
    html+=qzCurStep('Einsetzen von \\('+vars[subSv]+' = '+subExpr+'\\) in '+subOiLbl+' \u2192 '+subOiPrimedLbl+':',
      qzEqBanner(subOiEq,vars,subOiLbl)
      +'<div class="qz-sub">Setze \\('+vars[subSv]+' = '+subExpr+'\\) ein und fasse zusammen \u2013 gib '+subOiPrimedLbl+' ein:</div>'
      +qzVarInsertBtns('qz_ss',vars)+'<div class="qz-inp-row"><input class="qz-inp" id="qz_ss" type="text"'+qzVarPlaceholder(vars)+' autofocus onkeydown="if(event.key===\'Enter\')eqCheckSubSub()">'
      +'<button onclick="eqCheckSubSub()">Pr\u00fcfen</button>'
      +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
      +'<button class="btn-grey" onclick="eqSkipSubSub()">\u00dcberspringen</button>'
      +'</div><div id="qz_fb" class="qz-fb"></div>'+hint1+hint2);

  // ── Phase-aware einsetz_backsubst ──
  } else if(qs.stage==='einsetz_backsubst'){
    var phase=qs.qBacksubPhase||'main';
    var forVar,bsExpr2,bsLbl2;
    if(phase==='sub'){
      forVar=qs.qSubSv;
      var subFe2b=qs.qSubPivIdx||0;
      bsExpr2=solvedExprTex(qs.qSubSys.eqs[subFe2b],vars,forVar)||'?';
      bsLbl2=qs.qSubBsLbl||(qLbl(qs.qSubSys.idxs[subFe2b])+"''");
    } else {
      forVar=qs.qSv;
      bsExpr2=solvedExprTex(eqs[qs.qFe],vars,forVar)||'?';
      bsLbl2=qLbl(qs.qFe)+"'";
    }
    var expected2=sol[forVar],hl=qs.helpLevel;
    if(hl>=2&&!qs._mcCache){var dv=qzGenValDistr(expected2);qs._mcCache=qzShuffleMC(expected2,dv);}
    var knownE2=Object.keys(qs.qKnown).map(function(k){return'\\('+vars[k]+' = '+numTex(qs.qKnown[k])+'\\)';});
    var hint1bs=hl>=1?'<div class="qz-hint-box">Setze '+knownE2.join(', ')+' in \\(\\text{'+bsLbl2+'}: \\quad '+vars[forVar]+' = '+bsExpr2+'\\) ein.</div>':'';
    var hint2bs=hl>=2&&qs._mcCache?qzMCValHtml(qs._mcCache.opts,qs._mcCache.corr,vars[forVar],'eqMCVal'):'';
    if(qs.qRv!==undefined&&qs.qKnown[qs.qRv]!==undefined)

function eqAdvanceToSub(k){
  var qs=quizState,lgs=qLGS(),eqs=lgs.equations,n=lgs.n,fe=qs.qFe,vars=lgs.vars,sv=qs.qSv;
  var otherIdxs=[];for(var i=0;i<n;i++)if(i!==fe)otherIdxs.push(i);
  // Skip equations that do not contain sv – nothing can be substituted there.
  if(k<otherIdxs.length&&Math.abs(eqs[otherIdxs[k]].coeffs[sv])<1e-9){
    var oiSkip=otherIdxs[k];
    qzInfo(varTex(vars[sv])+' kommt in Gl.\u202f'+qLbl(oiSkip)+' nicht vor (Koeffizient 0) – hier kann und muss nichts eingesetzt werden. Die Gleichung wird unverändert übernommen ('+qLbl(oiSkip)+"' = "+qLbl(oiSkip)+').',
      function(){eqAdvanceToSub(k+1);});
    return;
  }
  if(k<otherIdxs.length){
    qs.qOiIdx=otherIdxs[k];qs.qOiList=otherIdxs;qs.qOiListIdx=k;
    qs._mcCache=null;qs.stage='einsetz_substitute';qs.helpLevel=0;renderQuiz();
  } else {
    // All substituted – compute substituted equations for each other eq
    var pivotEq=eqs[fe],vars3=lgs.vars;
    var subEqsList=otherIdxs.map(function(oi){
      return subCollected(eqs[oi],pivotEq,sv,pivotEq.coeffs[sv],eqs[oi].coeffs[sv]);
    });
    if(n===2){
      // 2×2: single remaining equation with one unknown
      qs.qSubEq=subEqsList[0];
      var rv=-1;for(var i=0;i<vars3.length;i++){if(i!==sv&&Math.abs(subEqsList[0].coeffs[i])>1e-9){rv=i;break;}}
      if(rv<0){qs.stage='done';renderQuiz();return;}
      qs.qRv=rv;qs.qRvLbl=qLbl(otherIdxs[0])+"'";
      qs._mcCache=null;qs.stage='einsetz_solve_rv';qs.helpLevel=0;renderQuiz();
      return;
    }
    // 3×3: 2×2 sub-system
    qs.qSubSys={eqs:subEqsList,idxs:otherIdxs.slice()};
    // Count unknowns (≠ sv) in each substituted equation
    var cnt=subEqsList.map(function(e){
      var c=0;for(var i=0;i<vars3.length;i++){if(i!==sv&&Math.abs(e.coeffs[i])>1e-9)c++;}return c;
    });
    var sIdx=cnt[0]===1?0:(cnt[1]===1?1:-1);
    if(cnt[0]===0||cnt[1]===0){
      // Degenerate (should not occur for regular systems)
      qs.stage='done';renderQuiz();return;
    }
    if(sIdx>=0){
      // One substituted equation contains only a single variable → solve directly,
      // then determine the second variable from the other substituted equation.
      var oth=1-sIdx,w=-1,u=-1;
      for(var i2=0;i2<vars3.length;i2++){if(i2!==sv&&Math.abs(subEqsList[sIdx].coeffs[i2])>1e-9){w=i2;break;}}
      for(var i3=0;i3<vars3.length;i3++){if(i3!==sv&&i3!==w&&Math.abs(subEqsList[oth].coeffs[i3])>1e-9){u=i3;break;}}
      qs.qSubEq=subEqsList[sIdx];qs.qRv=w;
      qs.qRvLbl=qLbl(otherIdxs[sIdx])+"'";
      if(u>=0){qs.qSubSv=u;qs.qSubPivIdx=oth;qs.qSubBsLbl=qLbl(otherIdxs[oth])+"'";}
      else{qs.qSubSys=null;qs.qSubSv=undefined;}
      qzInfo('Nach dem Einsetzen enthält Gl.\u202f'+qLbl(otherIdxs[sIdx])+"' nur noch "+varTex(vars3[w])+' – eine weitere Variable ist beim Zusammenfassen weggefallen. Die Gleichung kann direkt gelöst werden; ein weiteres Umstellen und Einsetzen im Teilsystem entfällt.',
        function(){quizState._mcCache=null;quizState.stage='einsetz_solve_rv';quizState.helpLevel=0;renderQuiz();});
      return;
    }
    // Regular sub-system: apply Einsetzungsverfahren recursively –
    // the user chooses equation and variable (like the solution path)
    qs.qSubBsLbl=null;
    qs._mcCache=null;qs.stage='einsetz_sub_choose_eq';qs.helpLevel=0;renderQuiz();
  }
}

  var inp=document.getElementById('qz_se');if(!inp)return;
  var p=parseUserEq(inp.value,vars);
  if(!p){qzFb('qz_fb','Format ungültig.','err');inp.classList.add('err');return;}
  var pivotEq=eqs[fe],oiEq=eqs[oi];
  var svCoeffFe=pivotEq.coeffs[sv],svCoeffOi=oiEq.coeffs[sv];
  var ansEq=subCollected(oiEq,pivotEq,sv,svCoeffFe,svCoeffOi);
  if(eqMatch(p.coeffs,p.rhs,ansEq.coeffs,ansEq.rhs)){
    inp.classList.add('ok');qzFb('qz_fb','✓ Richtig!','ok');
    setTimeout(function(){eqAdvanceToSub(qs.qOiListIdx+1);},500);
    return;
  }
  // Accept if user already solved the variable directly (e.g. "y=3")
  var solved=isSolvedFor(p,vars);
  if(solved&&Math.abs(solved.val-sol[solved.vi])<1e-6){
    inp.classList.add('ok');qzFb('qz_fb','✓ Richtig – Wert bereits bestimmt: \\('+vars[solved.vi]+' = '+numTex(solved.val)+'\\)','ok');
    MathJax.typesetPromise([document.getElementById('qz_fb')]);
    qs.qSubEq=ansEq;qs.qKnown[solved.vi]=solved.val;qs.qRv=solved.vi;
    setTimeout(function(){qs.helpLevel=0;qs._mcCache=null;qs.stage='einsetz_backsubst';renderQuiz();},900);
    return;
  }
  inp.classList.add('err');qzFb('qz_fb','Nicht korrekt – prüfe ob alle Terme zusammengefasst sind.','err');
}
function eqSkipSub(){
  var qs=quizState,vars=qLGS().vars,eqs=qLGS().equations;
  var fe=qs.qFe,sv=qs.qSv,oi=qs.qOiIdx;
  var pivotEq=eqs[fe],oiEq=eqs[oi];
  var ans=subCollected(oiEq,pivotEq,sv,pivotEq.coeffs[sv],oiEq.coeffs[sv]);
  var fb=document.getElementById('qz_fb');
  if(fb){fb.className='qz-fb ok';fb.innerHTML='Ergebnis: \\('+eqTex(ans.coeffs,vars,ans.rhs)+'\\)';MathJax.typesetPromise([fb]);}
  setTimeout(function(){eqAdvanceToSub(qs.qOiListIdx+1);},1200);
}
function eqMCSub(ci,corr,btn){
  var qs=quizState;
  qzMCHandle(ci,corr,btn,function(){eqAdvanceToSub(qs.qOiListIdx+1);});
}
function eqSkipVal(vi,expected){
  var qs=quizState,vars=qLGS().vars;
  qs.qKnown[vi]=expected;
  var fb=document.getElementById('qz_fb');
  if(fb){fb.className='qz-fb ok';fb.innerHTML='Lösung: \\('+vars[vi]+' = '+numTex(expected)+'\\)';MathJax.typesetPromise([fb]);}
  setTimeout(function(){
    qs.helpLevel=0;qs._mcCache=null;
    if(qs.stage==='einsetz_solve_rv'){
      qs.qBacksubPhase=qs.qSubSys?'sub':'main';
      qs.stage='einsetz_backsubst';
    } else if(qs.stage==='einsetz_backsubst'){
      if(qs.qSubSys&&qs.qBacksubPhase==='sub'){qs.qBacksubPhase='main';qs.stage='einsetz_backsubst';}
      else{qs.stage='done';}
    }
    renderQuiz();
  },1200);
}
function eqCheckVal(vi,expected){
  var qs=quizState,vars=qLGS().vars;
  var inp=document.getElementById('qz_sv');if(!inp)return;
  var val=parseValOrEq(inp.value,vars,vi);
  if(val===null){qzFb('qz_fb','Ungültige Eingabe (z.B. 3 oder '+vars[vi]+'=3).','err');return;}
  if(Math.abs(val-expected)<1e-6){
    inp.classList.add('ok');qzFb('qz_fb','✓ Richtig!','ok');
    qs.qKnown[vi]=expected;
    setTimeout(function(){
      qs.helpLevel=0;qs._mcCache=null;
      if(qs.stage==='einsetz_solve_rv'){
        qs.qBacksubPhase=qs.qSubSys?'sub':'main';
        qs.stage='einsetz_backsubst';
      } else if(qs.stage==='einsetz_backsubst'){
        if(qs.qSubSys&&qs.qBacksubPhase==='sub'){qs.qBacksubPhase='main';qs.stage='einsetz_backsubst';}
        else{qs.stage='done';}
      }
      renderQuiz();
    },500);
  } else {inp.classList.add('err');qzFb('qz_fb','Nicht korrekt.','err');}
}
function eqMCVal(ci,corr,btn){
  var qs=quizState;
  var vi=qs.stage==='einsetz_solve_rv'?qs.qRv:(qs.qBacksubPhase==='sub'?qs.qSubSv:qs.qSv);
  var expected=qLGS().solution[vi];
  qzMCHandle(ci,corr,btn,function(){
    qs.qKnown[vi]=expected;qs.helpLevel=0;qs._mcCache=null;
    if(qs.stage==='einsetz_solve_rv'){
      qs.qBacksubPhase=qs.qSubSys?'sub':'main';
      qs.stage='einsetz_backsubst';
    } else if(qs.stage==='einsetz_backsubst'){
      if(qs.qSubSys&&qs.qBacksubPhase==='sub'){qs.qBacksubPhase='main';qs.stage='einsetz_backsubst';}
      else{qs.stage='done';}
    }
    renderQuiz();
  });
}
