// §6  SOLUTION PATH – ADDITIONSVERFAHREN (inline choices)
// =============================================================

// Smart defaults
function bestElimVar(eqs, vars) {
  var best=0, bestK=Infinity;
  for(var v=0;v<vars.length;v++){
    var cs=eqs.map(function(e){return Math.abs(e.coeffs[v]);}).filter(function(c){return c>1e-9;});
    if(cs.length<2)continue;
    var k=rationalLcm(cs[0],cs[1]);
    if(k<bestK){bestK=k;best=v;}
  }
  return best;
}
function getValidPairs(eqs, ev) {
  var pairs=[];
  for(var i=0;i<eqs.length;i++)for(var j=i+1;j<eqs.length;j++)
    if(Math.abs(eqs[i].coeffs[ev])>1e-9&&Math.abs(eqs[j].coeffs[ev])>1e-9)pairs.push([i,j]);
  return pairs;
}
function bestPair(eqs, ev) {
  var p=getValidPairs(eqs,ev);
  if(!p.length)return[0,1];
  p.sort(function(a,b){return rationalLcm(eqs[a[0]].coeffs[ev],eqs[a[1]].coeffs[ev])-rationalLcm(eqs[b[0]].coeffs[ev],eqs[b[1]].coeffs[ev]);});
  return p[0];
}
function bestElimVarIn2x2(eqs, vars, exclude) {
  var best=-1, bestK=Infinity;
  for(var v=0;v<vars.length;v++){
    if(v===exclude)continue;
    var cs=eqs.map(function(e){return Math.abs(e.coeffs[v]);}).filter(function(c){return c>1e-9;});
    if(cs.length<2)continue;
    var k=rationalLcm(cs[0],cs[1]);
    if(k<bestK){bestK=k;best=v;}
  }
  return best>=0?best:0;
}
function factorsFromTarget(c1,c2,target,sameSign){
  var kgv=rationalLcm(c1,c2);
  var raw=parseFloat(target);
  var T=(isNaN(raw)||raw===0)?kgv:raw;
  var f1,f2,op;
  if(sameSign){
    // Both equations get coefficient exactly +T → f=T/c (can be negative)
    f1=T/c1; f2=T/c2; op='sub';
  } else {
    f1=T/Math.abs(c1); f2=T/Math.abs(c2);
    op=((c1>0&&c2>0)||(c1<0&&c2<0))?'sub':'add';
  }
  return{f1:snapRational(f1),f2:snapRational(f2),op:op,kgv:kgv,T:T};
}
function computeEvFromKnown(eq,ev,known,vars){
  var rhs=eq.rhs;
  eq.coeffs.forEach(function(c,i){if(i!==ev&&known[i]!==undefined)rhs-=c*known[i];});
  return rhs/eq.coeffs[ev];
}

// UI helpers for inline choices
function spChoice(label, content){
  return'<div class="sp-choice"><span class="sp-choice-lbl">'+label+'</span>'+content+'</div>';
}
function spVarBtns(vars, key, cur, eqs){
  var h='<div class="qz-btns" style="margin-top:2px;">';
  vars.forEach(function(v,i){
    if(eqs&&!eqs.some(function(e){return Math.abs(e.coeffs[i])>1e-9;}))return;
    h+='<button class="qz-btn'+(cur===i?' qc':'')+'" onclick="setSPC(\''+key+'\','+i+')">\\('+v+'\\)</button>';
  });
  return h+'</div>';
}
function spPairBtns(pairs, key, cur, eqs){
  var h='<div class="qz-btns" style="margin-top:2px;">';
  pairs.forEach(function(p){
    var act=cur&&cur[0]===p[0]&&cur[1]===p[1];
    h+='<button class="qz-btn'+(act?' qc':'')+'" onclick="setSPC(\''+key+'\',['+p[0]+','+p[1]+'])">'+romanNum(p[0]+1)+' ; '+romanNum(p[1]+1)+'</button>';
  });
  return h+'</div>';
}
// Debounced setSPCnum: triggers re-render 400ms after last keystroke
var _spcTimers={};
function setSPCdelay(key,val,fb){clearTimeout(_spcTimers[key]);_spcTimers[key]=setTimeout(function(){setSPCnum(key,val,fb);},400);}

function spFactBtns(c1, c2, key, cur, ss){
  var kgv=rationalLcm(c1,c2);
  var T=cur!=null&&cur!==0?cur:kgv;
  var ssKey=key+'_ss';
  // One row: [kgV button] [1 button] [number input] – all inline
  var h='<div class="qz-btns" style="margin-top:3px;align-items:center;">';
  function qbtn(val,lbl){
    var act=Math.abs(T-val)<1e-9&&!ss;
    h+='<button class="qz-btn'+(act?' qc':'')+'" onclick="setSPC(\''+key+'\','+val+')">'+lbl+'</button>';
  }
  qbtn(kgv,'kgV\u202f=\u202f\\('+numTex(kgv)+'\\)');
  qbtn(1,'1');
  h+='<input class="qz-inp sm" id="spc_'+key+'" type="text" inputmode="text" '
    +'value="'+numPlain(T)+'" title="Ganze Zahl, Kommazahl (2,5) oder Bruch (5/2)" '
    +'oninput="setSPCdelay(\''+key+'\',this.value,\''+numPlain(kgv)+'\')" '
    +'onblur="setSPCnum(\''+key+'\',this.value,\''+numPlain(kgv)+'\')" '
    +'onkeydown="if(event.key===\'Enter\'){setSPCnum(\''+key+'\',this.value,\''+numPlain(kgv)+'\');this.blur();}">'
    +'</div>'
    +'<label style="font-size:.8em;color:#555;cursor:pointer;display:flex;align-items:center;gap:4px;margin-top:3px;">'
    +'<input type="checkbox" '+(ss?'checked':'')+' onchange="setSPC(\''+ssKey+'\',this.checked)">'
    +' Gleiches Vorzeichen (beide exakt \\('+numTex(T)+'x\\))</label>';
  return h;
}
function spEqBtns(labels, key, cur){
  var h='<div class="qz-btns" style="margin-top:2px;">';
  labels.forEach(function(lbl,i){
    h+='<button class="qz-btn'+(cur===i?' qc':'')+'" onclick="setSPC(\''+key+'\','+i+')">Gl.\u202f'+lbl+'</button>';
  });
  return h+'</div>';
}

// Main solution path entry
function solPath_add(lgs, ch){
  var eqs=lgs.equations,vars=lgs.vars,sol=lgs.solution,n=lgs.n;
  var html=solSec('Gleichungssystem:',solEq(systemTex(eqs,vars,eqs.map(function(_,i){return romanNum(i+1);}))));
  // Direct solving of single-variable equations first
  var red=reduceSingleVarEqs(eqs,vars);
  if(red.steps.length){
    html+=renderReductionHTML(red,vars);
    if(red.eqs.length===0)
      return html+solSec('Ergebnis:',solEq(solResultTex(vars,sol)));
    html+=solText('Das verbleibende System wird mit dem Additionsverfahren gelöst:');
    html+=_sp_add_2x2(red.eqs,vars,sol,ch,red.lbls);
    return html;
  }
  if(n===2) html+=_sp_add_2x2(eqs,vars,sol,ch);
  else      html+=_sp_add_3x3(eqs,vars,sol,ch);
  return html;
}

function _sp_add_2x2(eqs,vars,sol,ch,lblsIn){
  var html='';
  var lbls=lblsIn||['I','II'];
  // ── Variable choice ──
  var ev=ch.elimVar!=null?ch.elimVar:bestElimVar(eqs,vars);
  if(countEqsWithVar(eqs,ev)===0)ev=bestElimVar(eqs,vars);
  html+=spChoice('Welche Variable soll eliminiert werden?',spVarBtns(vars,'elimVar',ev,eqs));
  // ── Factor choice ──
  var c1=eqs[0].coeffs[ev],c2=eqs[1].coeffs[ev];
  if(Math.abs(c1)<1e-9&&Math.abs(c2)<1e-9)
    return html+solText(varTex(vars[ev])+' kommt in keiner Gleichung vor und kann nicht eliminiert werden – wähle eine andere Variable.');
  if(Math.abs(c1)<1e-9||Math.abs(c2)<1e-9){
    // One equation already lacks ev → no elimination needed
    var zi=Math.abs(c1)<1e-9?0:1,wi=1-zi;
    html+=solText(varTex(vars[ev])+' kommt in Gl.\u202f'+lbls[zi]+' nicht vor (Koeffizient 0) – eine Elimination ist nicht nötig: Gl.\u202f'+lbls[zi]+' enthält nur eine Variable und ist direkt lösbar.');
    var rvD=-1;for(var iD=0;iD<vars.length;iD++){if(iD!==ev&&Math.abs(eqs[zi].coeffs[iD])>1e-9){rvD=iD;break;}}
    if(rvD<0)return html+solText('Fehler: Gl.\u202f'+lbls[zi]+' enthält keine lösbare Variable.');
    var rvValD=eqs[zi].rhs/eqs[zi].coeffs[rvD];
    html+=solSec(vars[rvD]+' bestimmen (aus Gl.\u202f'+lbls[zi]+'):',
      solEq(solveAlignedTex(eqs[zi].coeffs,vars,eqs[zi].rhs,rvD,rvValD)));
    var knwD={};knwD[rvD]=rvValD;
    var evValD=computeEvFromKnown(eqs[wi],ev,knwD,vars);
    html+=solSec(vars[ev]+' bestimmen (Einsetzen in Gl.\u202f'+lbls[wi]+'):',
      solEq(backSubAlignedTex(eqs[wi],vars,knwD,ev,evValD)));
    html+=solSec('Ergebnis:',solEq(solResultTex(vars,sol)));
    return html;
  }
  var kgv=rationalLcm(c1,c2);
  var T=ch.add_target1!=null?ch.add_target1:kgv;
  var ss1=ch['add_target1_ss']||false;
  html+=spChoice('Zielfaktor:',spFactBtns(c1,c2,'add_target1',T,ss1));
  // ── Elimination ──
  var fp=factorsFromTarget(c1,c2,T,ss1);
  var newEq=applyRowOp(eqs[0],eqs[1],fp.f1,fp.f2,fp.op);
  html+=solEq(elimStepTex(lbls[0],eqs[0],fp.f1,lbls[1],eqs[1],fp.f2,fp.op,newEq,vars));
  // ── Solve remaining var ──
  var rv=-1;for(var i=0;i<vars.length;i++)if(i!==ev&&Math.abs(newEq.coeffs[i])>1e-9){rv=i;break;}
  if(rv<0)return html+solText('Fehler.');
  var rvVal=newEq.rhs/newEq.coeffs[rv];
  html+=solSec(vars[rv]+' bestimmen:',solEq(solveAlignedTex(newEq.coeffs,vars,newEq.rhs,rv,rvVal)));
  // ── Back-sub equation choice ──
  var bsIdx=ch.add_bs0!=null?ch.add_bs0:0;
  html+=spChoice('In welche Gleichung einsetzen?',spEqBtns(lbls,'add_bs0',bsIdx));
  var knw={};knw[rv]=rvVal;
  var evVal=computeEvFromKnown(eqs[bsIdx],ev,knw,vars);
  html+=solSec(vars[ev]+' bestimmen (Einsetzen in Gl.\u202f'+lbls[bsIdx]+'):',
    solEq(backSubAlignedTex(eqs[bsIdx],vars,knw,ev,evVal)));
  html+=solSec('Ergebnis:',solEq(solResultTex(vars,sol)));
  return html;
}

function _sp_add_3x3(eqs,vars,sol,ch){
  var html='';
  var n=eqs.length; // 3
  // ── Variable choice ──
  var ev=ch.elimVar!=null?ch.elimVar:bestElimVar(eqs,vars);
  html+=spChoice('Welche Variable soll eliminiert werden?',spVarBtns(vars,'elimVar',ev,eqs));

  // Classify equations: which already have zero coefficient for ev?
  var zeroIdxs=[],nonZeroIdxs=[];
  for(var i=0;i<n;i++){
    if(Math.abs(eqs[i].coeffs[ev])<1e-9)zeroIdxs.push(i);
    else nonZeroIdxs.push(i);
  }

  var newEqs,newLbls;
  var lIV=romanNum(n+1);

  if(zeroIdxs.length>=2){
    // Two equations already lack ev → no elimination needed
    html+=solText('\\('+vars[ev]+'\\) kommt in Gl.\u202f'+romanNum(zeroIdxs[0]+1)+' und Gl.\u202f'+romanNum(zeroIdxs[1]+1)+' nicht vor – direkt als 2×2-System nutzbar.');
    newEqs=[eqs[zeroIdxs[0]],eqs[zeroIdxs[1]]];
    newLbls=[romanNum(zeroIdxs[0]+1),romanNum(zeroIdxs[1]+1)];
  } else if(zeroIdxs.length===1){
    // One equation lacks ev → only one elimination step needed
    var pA=nonZeroIdxs[0],pB=nonZeroIdxs[1];
    var c1a=eqs[pA].coeffs[ev],c1b=eqs[pB].coeffs[ev];
    var kgv1=rationalLcm(c1a,c1b);
    var T1=ch.add_target1!=null?ch.add_target1:kgv1;
    var ss1=ch['add_target1_ss']||false;
    html+=solSec('Gleichungspaar:',solEq(systemTex([eqs[pA],eqs[pB]],vars,[romanNum(pA+1),romanNum(pB+1)])));
    html+=spChoice('Zielfaktor:',spFactBtns(c1a,c1b,'add_target1',T1,ss1));
    var fp1=factorsFromTarget(c1a,c1b,T1,ss1);
    var ne1=applyRowOp(eqs[pA],eqs[pB],fp1.f1,fp1.f2,fp1.op);
    html+=solSec('→ Gl.\u202f'+lIV+':',solEq(elimStepTex(romanNum(pA+1),eqs[pA],fp1.f1,romanNum(pB+1),eqs[pB],fp1.f2,fp1.op,ne1,vars,lIV)));
    html+=solText('Gl.\u202f'+romanNum(zeroIdxs[0]+1)+' enthält \\('+vars[ev]+'\\) nicht (Koeffizient 0) → direkt übernehmen.');
    newEqs=[ne1,eqs[zeroIdxs[0]]];
    newLbls=[lIV,romanNum(zeroIdxs[0]+1)];
  } else {
    // Standard: two elimination steps
    var allP=getValidPairs(eqs,ev);
    var defP1=bestPair(eqs,ev);
    var p1=ch.add_pair1;
    if(!p1||!allP.some(function(p){return p[0]===p1[0]&&p[1]===p1[1];}))p1=defP1;
    html+=spChoice('1. Gleichungspaar:',spPairBtns(allP,'add_pair1',p1,eqs));
    html+=solEq(systemTex([eqs[p1[0]],eqs[p1[1]]],vars,[romanNum(p1[0]+1),romanNum(p1[1]+1)]));
    var c1a=eqs[p1[0]].coeffs[ev],c1b=eqs[p1[1]].coeffs[ev];
    var kgv1=rationalLcm(c1a,c1b);
    var T1=ch.add_target1!=null?ch.add_target1:kgv1;
    var ss1=ch['add_target1_ss']||false;
    html+=spChoice('Zielfaktor:',spFactBtns(c1a,c1b,'add_target1',T1,ss1));
    var fp1=factorsFromTarget(c1a,c1b,T1,ss1);
    var ne1=applyRowOp(eqs[p1[0]],eqs[p1[1]],fp1.f1,fp1.f2,fp1.op);
    var lIV=romanNum(n+1);
    html+=solSec('→ Gl.\u202f'+lIV+':',solEq(elimStepTex(romanNum(p1[0]+1),eqs[p1[0]],fp1.f1,romanNum(p1[1]+1),eqs[p1[1]],fp1.f2,fp1.op,ne1,vars,lIV)));
    var remP=allP.filter(function(p){return!(p[0]===p1[0]&&p[1]===p1[1]);});
    var defP2=remP.length>0?remP.slice().sort(function(a,b){return rationalLcm(eqs[a[0]].coeffs[ev],eqs[a[1]].coeffs[ev])-rationalLcm(eqs[b[0]].coeffs[ev],eqs[b[1]].coeffs[ev]);})[0]:allP[0];
    var p2=ch.add_pair2;
    if(!p2||!remP.some(function(p){return p[0]===p2[0]&&p[1]===p2[1];}))p2=defP2;
    var lV=romanNum(n+2);
    if(remP.length>0){
      html+=spChoice('2. Gleichungspaar:',spPairBtns(remP,'add_pair2',p2,eqs));
      html+=solEq(systemTex([eqs[p2[0]],eqs[p2[1]]],vars,[romanNum(p2[0]+1),romanNum(p2[1]+1)]));
    }
    var c2a=eqs[p2[0]].coeffs[ev],c2b=eqs[p2[1]].coeffs[ev];
    var kgv2=rationalLcm(c2a,c2b);
    var T2=ch.add_target2!=null?ch.add_target2:kgv2;
    var ss2=ch['add_target2_ss']||false;
    html+=spChoice('Zielfaktor:',spFactBtns(c2a,c2b,'add_target2',T2,ss2));
    var fp2=factorsFromTarget(c2a,c2b,T2,ss2);
    var ne2=applyRowOp(eqs[p2[0]],eqs[p2[1]],fp2.f1,fp2.f2,fp2.op);
    html+=solSec('→ Gl.\u202f'+lV+':',solEq(elimStepTex(romanNum(p2[0]+1),eqs[p2[0]],fp2.f1,romanNum(p2[1]+1),eqs[p2[1]],fp2.f2,fp2.op,ne2,vars,lV)));
    newEqs=[ne1,ne2];
    newLbls=[lIV,lV];
  }

  // ── Show 2×2 ──
  html+=solSec('Entstandenes 2×2-System:',solEq(systemTexCompact(newEqs,vars,newLbls)));

  // Check if any 2×2 equation is already single-variable
  var singIdx=-1,singVar=-1;
  for(var i=0;i<2;i++){
    var nzC=[];for(var j=0;j<vars.length;j++){if(Math.abs(newEqs[i].coeffs[j])>1e-9)nzC.push(j);}
    if(nzC.length===1){singIdx=i;singVar=nzC[0];break;}
  }

  var tv,tvVal,ev2,ev2Val;
  var bs2EqIdxs=[];eqs.forEach(function(e,i){if(Math.abs(e.coeffs[ev])>1e-9)bs2EqIdxs.push(i);});

  if(singIdx>=0){
    // One 2×2 equation is already single-variable → solve directly
    tv=singVar;
    tvVal=newEqs[singIdx].rhs/newEqs[singIdx].coeffs[tv];
    html+=solText('Gl.\u202f'+newLbls[singIdx]+' enthält nur \\('+vars[tv]+'\\) → direkt lösbar:');
    html+=solSec(vars[tv]+' bestimmen:',solEq(solveAlignedTex(newEqs[singIdx].coeffs,vars,newEqs[singIdx].rhs,tv,tvVal)));
    // ev2: the other variable in the remaining 2×2 equation
    var otherIdx=1-singIdx;
    ev2=-1;
    for(var j=0;j<vars.length;j++){if(j!==tv&&j!==ev&&Math.abs(newEqs[otherIdx].coeffs[j])>1e-9){ev2=j;break;}}
    if(ev2<0)return html+solText('Fehler: zweite Variable nicht gefunden.');
    var knw1={};knw1[tv]=tvVal;
    ev2Val=computeEvFromKnown(newEqs[otherIdx],ev2,knw1,vars);
    html+=solSec(vars[ev2]+' (Einsetzen in Gl.\u202f'+newLbls[otherIdx]+'):',
      solEq(backSubAlignedTex(newEqs[otherIdx],vars,knw1,ev2,ev2Val)));
  } else {
    // ── Variable choice for 2×2 round ──
    ev2=ch.add_elimVar2!=null&&ch.add_elimVar2>=0?ch.add_elimVar2:-1;
    // Sanitize: a previously chosen variable may no longer be valid (equal to ev or
    // not present in the new 2×2 system) after the user changed earlier choices.
    if(ev2<0||ev2===ev||!newEqs.some(function(e){return Math.abs(e.coeffs[ev2])>1e-9;}))
      ev2=bestElimVarIn2x2(newEqs,vars,ev);
    html+=spChoice('Variable in {Gl.\u202f'+newLbls[0]+', Gl.\u202f'+newLbls[1]+'} eliminieren:',spVarBtns(vars,'add_elimVar2',ev2,newEqs));
    var c3a=newEqs[0].coeffs[ev2],c3b=newEqs[1].coeffs[ev2];
    var finalEq;
    if(Math.abs(c3a)<1e-9){
      html+=solText('Gl.\u202f'+newLbls[0]+' enthält \\('+vars[ev2]+'\\) nicht → direkt lösbar.');
      finalEq=newEqs[0];
    } else if(Math.abs(c3b)<1e-9){
      html+=solText('Gl.\u202f'+newLbls[1]+' enthält \\('+vars[ev2]+'\\) nicht → direkt lösbar.');
      finalEq=newEqs[1];
    } else {
      var kgv3=rationalLcm(c3a,c3b);
      var T3=ch.add_target3!=null?ch.add_target3:kgv3;
      var ss3=ch['add_target3_ss']||false;
      html+=spChoice('Zielfaktor:',spFactBtns(c3a,c3b,'add_target3',T3,ss3));
      var fp3=factorsFromTarget(c3a,c3b,T3,ss3);
      finalEq=applyRowOp(newEqs[0],newEqs[1],fp3.f1,fp3.f2,fp3.op);
      html+=solEq(elimStepTex(newLbls[0],newEqs[0],fp3.f1,newLbls[1],newEqs[1],fp3.f2,fp3.op,finalEq,vars));
    }
    // ── Solve tv ──
    tv=-1;for(var i=0;i<vars.length;i++)if(i!==ev&&i!==ev2&&Math.abs(finalEq.coeffs[i])>1e-9){tv=i;break;}
    if(tv<0)return html+solText('Fehler: dritte Variable nicht gefunden.');
    tvVal=finalEq.rhs/finalEq.coeffs[tv];
    html+=solSec(vars[tv]+' bestimmen:',solEq(solveAlignedTex(finalEq.coeffs,vars,finalEq.rhs,tv,tvVal)));
    // ── Back-sub ev2 from one of newEqs ──
    var bs1=ch.add_bs1!=null?ch.add_bs1:0;
    html+=spChoice('Einsetzen zum Bestimmen von \\('+vars[ev2]+'\\):',spEqBtns(newLbls,'add_bs1',bs1));
    var knw1={};knw1[tv]=tvVal;
    ev2Val=computeEvFromKnown(newEqs[bs1],ev2,knw1,vars);
    html+=solSec(vars[ev2]+' (Einsetzen in Gl.\u202f'+newLbls[bs1]+'):',
      solEq(backSubAlignedTex(newEqs[bs1],vars,knw1,ev2,ev2Val)));
  }

  // ── Back-sub ev from original eqs (only ones with ev≠0) ──
  var bs2=ch.add_bs2!=null?ch.add_bs2:0;
  if(bs2>=bs2EqIdxs.length)bs2=0;
  html+=spChoice('Einsetzen zum Bestimmen von \\('+vars[ev]+'\\):',
    spEqBtns(bs2EqIdxs.map(function(i){return romanNum(i+1);}),'add_bs2',bs2));
  var bs2ActIdx=bs2EqIdxs[bs2]!=null?bs2EqIdxs[bs2]:0;
  var knw2={};knw2[tv]=tvVal;knw2[ev2]=ev2Val;
  var evVal=computeEvFromKnown(eqs[bs2ActIdx],ev,knw2,vars);
  html+=solSec(vars[ev]+' (Einsetzen in Gl.\u202f'+romanNum(bs2ActIdx+1)+'):',
    solEq(backSubAlignedTex(eqs[bs2ActIdx],vars,knw2,ev,evVal)));
  html+=solSec('Ergebnis:',solEq(solResultTex(vars,sol)));
  return html;
}

// =============================================================
// §7  HELPER FUNCTIONS FOR SOLUTION PATHS
// =============================================================
// Create "primed" form of eq: divide all coefficients + rhs by coeffs[sv]
// so that coeffs[sv]=1.  Used to display back-substitution into solved form.
function makePrimedEq(eq,sv){
  var c=eq.coeffs[sv];
  if(Math.abs(c)<1e-9)return eq;
  return{coeffs:eq.coeffs.map(function(x){return x/c;}),rhs:eq.rhs/c};
}
// Render variable name: use \(v\) for single ASCII letters, plain text for emoji
function varTex(v){return /^[a-zA-Z]$/.test(v)?'\\('+v+'\\)':v;}
// Best variable to solve for in eq (prefer coeff ±1; exclude excludeIdx)
function bestVarForEq(eq,vars,excludeIdx){
  var best=-1,bestAbs=Infinity;
  for(var j=0;j<vars.length;j++){
    if(j===excludeIdx||Math.abs(eq.coeffs[j])<1e-9)continue;
    var a=Math.abs(eq.coeffs[j]);
    if(Math.abs(a-1)<1e-9)return j;
    if(best<0||a<bestAbs){best=j;bestAbs=a;}
  }
  return best>=0?best:0;
}
// LHS string of an equation (terms only, no "= rhs")
function eqLhsTex(coeffs,vars){
  var parts=[];
  for(var i=0;i<vars.length;i++){
    var t=termTex(coeffs[i],vars[i],parts.length===0);
    if(t!==null)parts.push(t);
  }
  return parts.join('')||'0';
}
// Build array rows for "rearrange eq for sv":
//   row 1: original (label lbl1)
//   row 2: c_sv*sv = rhs - other_terms  (move step; label lbl2 if no divide needed)
//   row 3: sv = expr  (divide step; label lbl2; skipped when |c_sv|=1 and other terms exist)
// Returns array-rows string for \begin{array}{r @{\qquad} r c l}
function rearrangeRows(eq,vars,sv,lbl1,lbl2){
  var cSv=eq.coeffs[sv];
  var expr=solvedExprTex(eq,vars,sv);
  if(!expr)return'\\text{'+lbl1+'}: & ? & = & ?';
  // Row 1: original equation
  var rows=['\\text{'+lbl1+'}: & '+eqLhsTex(eq.coeffs,vars)+' & = & '+numTex(eq.rhs)];
  // Row 2: move other terms to RHS (sv on left, everything else on right)
  var hasOther=vars.some(function(v,j){return j!==sv&&Math.abs(eq.coeffs[j])>1e-9;});
  if(hasOther){
    var movLhs=termTex(cSv,vars[sv],true)||vars[sv];
    var movRhsParts=[];
    if(Math.abs(eq.rhs)>1e-9)movRhsParts.push(numTex(eq.rhs));
    for(var j=0;j<vars.length;j++){
      if(j===sv||Math.abs(eq.coeffs[j])<1e-9)continue;
      var t=termTex(-eq.coeffs[j],vars[j],movRhsParts.length===0);
      if(t)movRhsParts.push(t);
    }
    var movRhs=movRhsParts.join('')||'0';
    var needsDivide=Math.abs(Math.abs(cSv)-1)>1e-9||cSv<0;
    var movLabel=needsDivide?'':'\\text{'+lbl2+'}:';
    rows.push(movLabel+' & '+movLhs+' & = & '+movRhs);
    if(needsDivide)rows.push('\\text{'+lbl2+'}: & '+vars[sv]+' & = & '+expr);
  } else {
    // Only sv term: just show the divided form
    rows.push('\\text{'+lbl2+'}: & '+vars[sv]+' & = & '+expr);
  }
  return rows.join(' \\\\ ');
}
// Build distributed (not-yet-collected) LHS string after substituting sv=pivExpr into targetEq
function distribLhs(targetEq,pivotEq,sv,svCoeffT,svCoeffFe,vars){
  var parts=[];
  // Constant from bracket expansion
  var cConst=svCoeffT/svCoeffFe*pivotEq.rhs;
  if(Math.abs(cConst)>1e-9)parts.push(parts.length===0?numTex(cConst):(cConst>0?'+':'')+numTex(cConst));
  // Variable terms from bracket
  for(var j=0;j<vars.length;j++){
    if(j===sv||Math.abs(pivotEq.coeffs[j])<1e-9)continue;
    var bc=-svCoeffT/svCoeffFe*pivotEq.coeffs[j];
    if(Math.abs(bc)<1e-9)continue;
    var t=termTex(bc,vars[j],parts.length===0);
    if(t)parts.push(t);
  }
  // Other terms from target equation
  for(var j=0;j<vars.length;j++){
    if(j===sv||Math.abs(targetEq.coeffs[j])<1e-9)continue;
    var t=termTex(targetEq.coeffs[j],vars[j],parts.length===0);
    if(t)parts.push(t);
  }
  return parts.join('')||'0';
}
// Build substitution block rows: raw-bracket, distributed, simplified
// Format for \begin{array}{r @{\qquad} r c l}
function subRows3(targetEq,pivotEq,sv,svCoeffFe,svCoeffOi,expr,ne,lbl,newLbl,vars){
  var rawLhs=buildSubLHS2(targetEq,expr,sv,svCoeffOi,vars);
  var dist=distribLhs(targetEq,pivotEq,sv,svCoeffOi,svCoeffFe,vars);
  var rhs=numTex(targetEq.rhs);
  var neLhs=eqLhsTex(ne.coeffs,vars);
  return [
    '\\text{'+lbl+'}: & '+rawLhs+' & = & '+rhs,
    ' & '+dist+' & = & '+rhs,
    '\\text{'+newLbl+'}: & '+neLhs+' & = & '+numTex(ne.rhs)
  ].join(' \\\\ ');
}
// Build raw-substitution LHS with \left( \right) brackets (standalone helper)
function buildSubLHS2(targetEq,expr,sv,svCoeffOi,vars){
  var cAbs=Math.abs(svCoeffOi);
  var bracket='\\left('+expr+'\\right)';
  var cStr=(cAbs===1?'':numTex(cAbs)+'\\cdot ')+bracket;
  var parts=[svCoeffOi<0?'-'+cStr:cStr];
  for(var j=0;j<vars.length;j++){
    if(j===sv)continue;
    var t=termTex(targetEq.coeffs[j],vars[j],parts.length===0);
    if(t)parts.push(t);
  }
  return parts.join('')||'0';
}

// ── Collected forms (no implicit scaling) ─────────────────────
// Natural collected form of equating expr0=expr1 for sv.
// Variables → left, constants → right. May have fractional coefficients.
function eqFromEquating(eq0,eq1,sv){
  var c0=eq0.coeffs[sv],c1=eq1.coeffs[sv];
  if(Math.abs(c0)<1e-9||Math.abs(c1)<1e-9)return applyRowOp(eq0,eq1,1,1,'sub');
  var nc=eq0.coeffs.map(function(c,j){
    if(j===sv)return 0;
    return eq1.coeffs[j]/c1-c/c0;
  });
  return{coeffs:nc,rhs:eq1.rhs/c1-eq0.rhs/c0};
}
// Truly collected form after substituting sv=(pivot_expr) into targetEq.
// Uses ratio svCoeffOi/svCoeffFe. No scaling by svCoeffFe.
function subCollected(targetEq,pivotEq,sv,svCoeffFe,svCoeffOi){
  if(Math.abs(svCoeffFe)<1e-9)return targetEq;
  var ratio=svCoeffOi/svCoeffFe;
  var nc=targetEq.coeffs.map(function(c,j){
    if(j===sv)return 0;
    return c-ratio*pivotEq.coeffs[j];
  });
  return{coeffs:nc,rhs:targetEq.rhs-ratio*pivotEq.rhs};
}
// Show back-substitution starting from the SOLVED form "sv = expr".
// Row 1: sv = expr (symbolic)
// Row 2: sv = expr with known values substituted (shows coeff·value)
// Row 3: sv = final numeric value
function backSubSolvedForm(solvedEq,svIdx,svExpr,vars,knownVars,svVal){
  var rows=[vars[svIdx]+' & = & '+svExpr];
  // Build row 2 showing substitution with cdot notation
  var row2Parts=[];
  if(Math.abs(solvedEq.rhs)>1e-9)row2Parts.push(numTex(solvedEq.rhs));
  var hasSub=false;
  for(var j=0;j<vars.length;j++){
    if(j===svIdx||Math.abs(solvedEq.coeffs[j])<1e-9)continue;
    var rc=-solvedEq.coeffs[j]; // coefficient in solved form: sv = rhs - cj*vars[j]
    var isFirst=row2Parts.length===0;
    var kv=knownVars[j];
    if(kv!==undefined&&kv!==null){
      hasSub=true;
      var absRc=Math.abs(rc);
      var neg=rc<0;
      var valDisp=numTexParen(kv);
      var termStr;
      if(Math.abs(absRc-1)<1e-9){
        termStr=(neg?(isFirst?'-':'-'):(isFirst?'':'+'))+valDisp;
      } else {
        var rcStr=numTex(absRc);
        termStr=(neg?(isFirst?'-':'-'):(isFirst?'':'+'))+rcStr+'\\cdot '+valDisp;
      }
      row2Parts.push(termStr);
    } else {
      var t=termTex(rc,vars[j],isFirst);
      if(t)row2Parts.push(t);
    }
  }
  var substStr=row2Parts.join('')||'0';
  if(hasSub)rows.push(vars[svIdx]+' & = & '+substStr);
  var finalStr=numTex(svVal);
  if(!hasSub||substStr!==finalStr)rows.push(vars[svIdx]+' & = & '+finalStr);
  return solEq('\\begin{array}{r c l}'+rows.join(' \\\\ ')+'\\end{array}');
}

// =============================================================
// §8  SOLUTION PATH – GAUß (Gauss-Jordan)
// =============================================================
function solPath_gauss(lgs){
  var n=lgs.n,vars=lgs.vars,sol=lgs.solution;
  var M=lgs.equations.map(function(eq){return{coeffs:eq.coeffs.slice(),rhs:eq.rhs};});
  var primes=M.map(function(){return 0;});
  function lbl(r){return romanNum(r+1)+"'".repeat(primes[r]);}
  function sysTex(){return systemTex(M,vars,M.map(function(_,r){return lbl(r);}));}
  var html='';
  html+=solSec('Ausgangssystem:',solEq(sysTex()));
  var showedFinal=false;

  for(var col=0;col<n;col++){
    // Find pivot row
    var pivRow=col;
    while(pivRow<n&&Math.abs(M[pivRow].coeffs[col])<1e-9)pivRow++;
    if(pivRow>=n)continue;
    // Swap rows if needed
    if(pivRow!==col){
      var tmp=M[col];M[col]=M[pivRow];M[pivRow]=tmp;
      var tp=primes[col];primes[col]=primes[pivRow];primes[pivRow]=tp;
      html+=solSec('Zeilentausch:',solEq(sysTex()));
    }
    // Scale pivot row to leading 1
    var pCoeff=M[col].coeffs[col];
    var pivLbl=lbl(col);
    if(Math.abs(Math.abs(pCoeff)-1)>1e-9){
      var scaled={coeffs:M[col].coeffs.map(function(c){return c/pCoeff;}),rhs:M[col].rhs/pCoeff};
      primes[col]++;
      var newPivLbl=lbl(col);
      M[col]=scaled;
      // Title uses inline math so the fraction/sign renders correctly
      html+=solSec('\\(\\text{'+pivLbl+'} : '+numTex(pCoeff)+' \\to \\text{'+newPivLbl+'}\\):',
        solEq(sysTex()));
      pivLbl=newPivLbl;
    } else if(pCoeff<-1e-9){
      // pCoeff = -1: negate row
      var negated={coeffs:M[col].coeffs.map(function(c){return -c;}),rhs:-M[col].rhs};
      primes[col]++;
      var newPivLbl=lbl(col);
      M[col]=negated;
      html+=solSec('\\(\\text{'+pivLbl+'} : (-1) \\to \\text{'+newPivLbl+'}\\):',
        solEq(sysTex()));
      pivLbl=newPivLbl;
    }
    // Eliminate pivot column from all other rows
    var changed=false;
    for(var r=0;r<n;r++){
      if(r===col)continue;
      var ef=M[r].coeffs[col];
      if(Math.abs(ef)<1e-9)continue;
      var oldLbl=lbl(r);
      var f2=Math.abs(ef);
      var op=ef>0?'sub':'add';
      var ne=applyRowOp(M[r],M[col],1,f2,op);
      primes[r]++;
      var newLbl=lbl(r);
      html+=solEq(elimStepTex(oldLbl,M[r],1,pivLbl,M[col],f2,op,ne,vars,newLbl));
      M[r]=ne;
      changed=true;
    }
    // Show complete LGS after all operations in this column
    if(changed){
      var colTitle=(col===n-1)?'Diagonalform:':'System nach Spalte '+(col+1)+':';
      if(col===n-1)showedFinal=true;
      html+=solSec(colTitle,solEq(sysTex()));
    }
  }
  if(!showedFinal)html+=solSec('Diagonalform:',solEq(sysTex()));
  html+=solSec('Ergebnis:',solEq(solResultTex(vars,sol)));
  return html;
}

// =============================================================
// §9  SOLUTION PATH – GLEICHSETZUNGSVERFAHREN
// =============================================================
function solPath_gleich(lgs,ch){
  var n=lgs.n,vars=lgs.vars,eqs=lgs.equations,sol=lgs.solution;
  var html='';
  html+=solSec('Gleichungssystem:',solEq(systemTex(eqs,vars,eqs.map(function(_,i){return romanNum(i+1);}))));
  var baseN=n,lbls=eqs.map(function(_,i){return romanNum(i+1);});
  // Direct solving of single-variable equations first
  var red=reduceSingleVarEqs(eqs,vars);
  if(red.steps.length){
    html+=renderReductionHTML(red,vars);
    if(red.eqs.length===0)
      return html+solSec('Ergebnis:',solEq(solResultTex(vars,sol)));
    html+=solText('Das verbleibende System wird mit dem Gleichsetzungsverfahren gelöst:');
    eqs=red.eqs;n=red.eqs.length;lbls=red.lbls;
  }
  var sv=ch.gleich_var!=null?ch.gleich_var:0;
  if(countEqsWithVar(eqs,sv)===0){
    // Default/stale choice points to a variable not present anymore
    for(var s0=0;s0<vars.length;s0++){if(countEqsWithVar(eqs,s0)>=2){sv=s0;break;}}
  }
  html+=spChoice('Nach welcher Variable umstellen?',spVarBtns(vars,'gleich_var',sv,eqs));
  var exprs=eqs.map(function(eq){return solvedExprTex(eq,vars,sv);});
  var primedLbls=lbls.map(function(l){return l+"'";});
  var SPEC='r @{\\qquad} r c l';
  // Show each equation individually rearranged for sv
  eqs.forEach(function(eq,i){
    if(!exprs[i])return;
    html+=solSec('Gl.\u202f'+lbls[i]+' nach '+vars[sv]+' aufl\u00f6sen:',
      solEq('\\begin{array}{'+SPEC+'}'+rearrangeRows(eq,vars,sv,lbls[i],primedLbls[i])+'\\end{array}'));
  });
  // Summary: all primed equations together before equating
  var sumRows=[];
  eqs.forEach(function(eq,i){if(exprs[i])sumRows.push('\\text{'+primedLbls[i]+'}: & '+vars[sv]+' & = & '+exprs[i]);});
  html+=solSec('\u00dcbersicht nach dem Aufl\u00f6sen:',
    solEq('\\begin{array}{r @{\\qquad} r c l}'+sumRows.join(' \\\\ ')+'\\end{array}'));

  // ── 2×2 case ──
  if(n===2){
    if(!exprs[0]&&!exprs[1])
      return html+solText(varTex(vars[sv])+' kommt in keiner Gleichung vor – wähle eine andere Variable.');
    if(!exprs[0]||!exprs[1]){
      // sv fehlt in genau einer Gleichung → diese enthält nur die andere Variable
      var ziG=exprs[0]?1:0,wiG=1-ziG;
      html+=solText(varTex(vars[sv])+' kommt in Gl.\u202f'+lbls[ziG]+' nicht vor – ein Gleichsetzen ist hier nicht nötig: Gl.\u202f'+lbls[ziG]+' enthält nur eine Variable und kann direkt gelöst werden.');
      var rvG=-1;for(var iG=0;iG<vars.length;iG++){if(iG!==sv&&Math.abs(eqs[ziG].coeffs[iG])>1e-9){rvG=iG;break;}}
      if(rvG<0)return html+solText('Fehler: keine lösbare Variable in Gl.\u202f'+lbls[ziG]+' gefunden.');
      var rvValG=eqs[ziG].rhs/eqs[ziG].coeffs[rvG];
      html+=solSec(vars[rvG]+' bestimmen (aus Gl.\u202f'+lbls[ziG]+'):',
        solEq(solveAlignedTex(eqs[ziG].coeffs,vars,eqs[ziG].rhs,rvG,rvValG)));
      var knwG={};knwG[rvG]=rvValG;
      var primedWG=makePrimedEq(eqs[wiG],sv);
      var svValG=computeEvFromKnown(primedWG,sv,knwG,vars);
      html+=solSec(varTex(vars[sv])+' (Einsetzen in Gl.\u202f'+primedLbls[wiG]+'):',
        backSubSolvedForm(primedWG,sv,exprs[wiG],vars,knwG,svValG));
      html+=solSec('Ergebnis:',solEq(solResultTex(vars,sol)));
      return html;
    }
    var cEq=eqFromEquating(eqs[0],eqs[1],sv);
    var lIV=romanNum(baseN+1);
    var remVar=-1;
    for(var i=0;i<vars.length;i++){if(i!==sv&&Math.abs(cEq.coeffs[i])>1e-9){remVar=i;break;}}
    if(remVar<0)return html+solText('Fehler.');
    var remVal=cEq.rhs/cEq.coeffs[remVar];
    // Equating block: equating row → collected → solved
    var eqRows=[exprs[0]+' & = & '+exprs[1]];
    eqRows.push(eqLhsTex(cEq.coeffs,vars)+' & = & '+numTex(cEq.rhs));
    if(!isAlreadySolved(cEq.coeffs,remVar))
      eqRows.push(vars[remVar]+' & = & '+numTex(remVal));
    html+=solSec('Gleichsetzen ('+primedLbls[0]+' = '+primedLbls[1]+') \u2192 '+vars[remVar]+' bestimmen:',
      solEq('\\begin{array}{r c l}'+eqRows.join(' \\\\ ')+'\\end{array}'));
    // Back-sub into primed equation (solved form) — always use I' or II', no button
    var bs0=ch.gleich_bs0!=null?ch.gleich_bs0:0;
    html+=spChoice('In welche Gleichung einsetzen?',spEqBtns(primedLbls,'gleich_bs0',bs0));
    var knw={};knw[remVar]=remVal;
    var primedBsEq=makePrimedEq(eqs[bs0],sv);
    var svVal=computeEvFromKnown(primedBsEq,sv,knw,vars);
    html+=solSec(varTex(vars[sv])+' (Einsetzen in Gl.\u202f'+primedLbls[bs0]+'):',
      backSubSolvedForm(primedBsEq,sv,exprs[bs0],vars,knw,svVal));

  // ── 3×3 case ──
  } else {
    var hasSv=eqs.map(function(e){return Math.abs(e.coeffs[sv])>1e-9;});
    var svIdxs=[];eqs.forEach(function(_,i){if(hasSv[i])svIdxs.push(i);});
    if(svIdxs.length<2){
      var altsG=[];
      vars.forEach(function(v,i){if(i!==sv&&countEqsWithVar(eqs,i)>=2)altsG.push(varTex(v));});
      return html+solText(varTex(vars[sv])+' kommt '+(svIdxs.length===1?'nur in einer Gleichung':'in keiner Gleichung')
        +' vor – ein Gleichsetzen ist damit nicht möglich.'
        +(altsG.length?' Wähle stattdessen '+altsG.join(' oder ')+' (kommt in mindestens zwei Gleichungen vor).':''));
    }
    var lIV=romanNum(n+1),lV=romanNum(n+2);
    var allPairs=[[svIdxs[0],svIdxs[1]]];
    if(svIdxs.length>2)allPairs.push([svIdxs[0],svIdxs[2]],[svIdxs[1],svIdxs[2]]);
    var pairLabels=allPairs.map(function(p){return primedLbls[p[0]]+' = '+primedLbls[p[1]];});
    var p1Idx=ch.gleich_pair1>=0&&ch.gleich_pair1<allPairs.length?ch.gleich_pair1:0;
    if(allPairs.length>1)html+=spChoice('Welche Gleichungen gleichsetzen? (\u2192 '+lIV+')',spEqBtns(pairLabels,'gleich_pair1',p1Idx));
    var pairA=allPairs[p1Idx];
    var remSvIdx=svIdxs.filter(function(i){return i!==pairA[0]&&i!==pairA[1];})[0];
    var eqIV=eqFromEquating(eqs[pairA[0]],eqs[pairA[1]],sv);
    // First equating → IV
    var rowsA=[exprs[pairA[0]]+' & = & '+exprs[pairA[1]]];
    rowsA.push(eqLhsTex(eqIV.coeffs,vars)+' & = & '+numTex(eqIV.rhs));
    html+=solSec('Gleichsetzen '+primedLbls[pairA[0]]+' = '+primedLbls[pairA[1]]+' \u2192 '+lIV+':',
      solEq('\\begin{array}{r c l}'+rowsA.join(' \\\\ ')+'\\end{array}'));

    var eqV,lbl2;
    if(remSvIdx!==undefined){
      // Second pair button
      var pair2Opts=[[pairA[0],remSvIdx],[pairA[1],remSvIdx]];
      var pair2Labels=pair2Opts.map(function(p){return primedLbls[p[0]]+' = '+primedLbls[p[1]];});
      var p2Idx=ch.gleich_pair2>=0&&ch.gleich_pair2<pair2Opts.length?ch.gleich_pair2:0;
      html+=spChoice('Welche Gleichungen gleichsetzen? (\u2192 '+lV+')',spEqBtns(pair2Labels,'gleich_pair2',p2Idx));
      var pairB=pair2Opts[p2Idx];
      eqV=eqFromEquating(eqs[pairB[0]],eqs[pairB[1]],sv);
      lbl2=lV;
      var rowsB=[exprs[pairB[0]]+' & = & '+exprs[pairB[1]]];
      rowsB.push(eqLhsTex(eqV.coeffs,vars)+' & = & '+numTex(eqV.rhs));
      html+=solSec('Gleichsetzen '+primedLbls[pairB[0]]+' = '+primedLbls[pairB[1]]+' \u2192 '+lV+':',
        solEq('\\begin{array}{r c l}'+rowsB.join(' \\\\ ')+'\\end{array}'));
    } else {
      var noSvIdx=eqs.map(function(e,i){return !hasSv[i]?i:-1;}).filter(function(i){return i>=0;})[0];
      eqV=noSvIdx!=null?eqs[noSvIdx]:eqIV;
      lbl2=noSvIdx!=null?romanNum(noSvIdx+1):lV;
      html+=solText('Gl.\u202f'+lbl2+' enth\u00e4lt '+vars[sv]+' nicht \u2192 direkt \u00fcbernehmen.');
    }
    html+=solSec('Entstandenes 2\u00d72-System:',solEq(systemTex([eqIV,eqV],vars,[lIV,lbl2])));
    var newEqs=[eqIV,eqV],newLbls=[lIV,lbl2];
    var primedIV=lIV+"'",primedV=lbl2+"'";
    var singIdx=-1,singVar=-1;
    for(var i=0;i<2;i++){
      var nzC2=[];for(var j=0;j<vars.length;j++){if(Math.abs(newEqs[i].coeffs[j])>1e-9)nzC2.push(j);}
      if(nzC2.length===1){singIdx=i;singVar=nzC2[0];break;}
    }
    var tv,tvVal,ev2,ev2Val;
    if(singIdx>=0){
      tv=singVar;tvVal=newEqs[singIdx].rhs/newEqs[singIdx].coeffs[tv];
      html+=solText('Gl.\u202f'+newLbls[singIdx]+' enth\u00e4lt nur '+varTex(vars[tv])+':');
      html+=solSec(varTex(vars[tv])+' bestimmen:',
        solEq(solveAlignedTex(newEqs[singIdx].coeffs,vars,newEqs[singIdx].rhs,tv,tvVal)));
      var oth=1-singIdx;
      ev2=-1;for(var j=0;j<vars.length;j++){if(j!==tv&&j!==sv&&Math.abs(newEqs[oth].coeffs[j])>1e-9){ev2=j;break;}}
      if(ev2<0)return html+solText('Fehler.');
      var primedOth=makePrimedEq(newEqs[oth],ev2);
      var knwT={};knwT[tv]=tvVal;
      ev2Val=computeEvFromKnown(primedOth,ev2,knwT,vars);
      var ev2ExprOth=solvedExprTex(newEqs[oth],vars,ev2);
      html+=solSec(varTex(vars[ev2])+' (Einsetzen in Gl.\u202f'+newLbls[oth]+'):',
        backSubSolvedForm(primedOth,ev2,ev2ExprOth||'?',vars,knwT,ev2Val));
    } else {
      var bestV2=bestElimVarIn2x2(newEqs,vars,sv);
      ev2=ch.gleich_var2>=0?ch.gleich_var2:-1;
      // Sanitize: choice may be stale after earlier choices changed
      if(ev2<0||ev2===sv||!newEqs.every(function(e){return Math.abs(e.coeffs[ev2])>1e-9;}))ev2=bestV2;
      html+=spChoice('Variable in {'+lIV+', '+lbl2+'} gleichsetzen:',spVarBtns(vars,'gleich_var2',ev2,newEqs));
      var exIV=solvedExprTex(eqIV,vars,ev2),exV=solvedExprTex(eqV,vars,ev2);
      if(!exIV||!exV)return html+solText('Fehler: '+varTex(vars[ev2])+' nicht in beiden Gleichungen.');
      // Rearrange IV and lbl2 individually
      html+=solSec('Gl.\u202f'+lIV+' nach '+vars[ev2]+' aufl\u00f6sen:',
        solEq('\\begin{array}{'+SPEC+'}'+rearrangeRows(eqIV,vars,ev2,lIV,primedIV)+'\\end{array}'));
      html+=solSec('Gl.\u202f'+lbl2+' nach '+vars[ev2]+' aufl\u00f6sen:',
        solEq('\\begin{array}{'+SPEC+'}'+rearrangeRows(eqV,vars,ev2,lbl2,primedV)+'\\end{array}'));
      // Equating IV' = V' with transformation steps (no scaling)
      var finEq=eqFromEquating(eqIV,eqV,ev2);
      tv=-1;for(var i=0;i<vars.length;i++){if(i!==sv&&i!==ev2&&Math.abs(finEq.coeffs[i])>1e-9){tv=i;break;}}
      if(tv<0)return html+solText('Fehler: dritte Variable nicht gefunden.');
      tvVal=finEq.rhs/finEq.coeffs[tv];
      var tvRows=[exIV+' & = & '+exV];
      tvRows.push(eqLhsTex(finEq.coeffs,vars)+' & = & '+numTex(finEq.rhs));
      if(!isAlreadySolved(finEq.coeffs,tv))tvRows.push(vars[tv]+' & = & '+numTex(tvVal));
      html+=solSec('Gleichsetzen ('+primedIV+' = '+primedV+') \u2192 '+vars[tv]+' bestimmen:',
        solEq('\\begin{array}{r c l}'+tvRows.join(' \\\\ ')+'\\end{array}'));
      // Back-sub ev2
      var bsEv2=ch.gleich_bs0!=null?ch.gleich_bs0:0;
      html+=spChoice('Einsetzen zum Bestimmen von '+varTex(vars[ev2])+':',
        spEqBtns([primedIV,primedV],'gleich_bs0',bsEv2));
      var bsEqBase=bsEv2===0?eqIV:eqV;
      var bsExprEv2=bsEv2===0?exIV:exV;
      var bsPrimed=makePrimedEq(bsEqBase,ev2);
      var knwT2={};knwT2[tv]=tvVal;
      ev2Val=computeEvFromKnown(bsPrimed,ev2,knwT2,vars);
      html+=solSec(varTex(vars[ev2])+' (Einsetzen in Gl.\u202f'+(bsEv2===0?primedIV:primedV)+'):',
        backSubSolvedForm(bsPrimed,ev2,bsExprEv2,vars,knwT2,ev2Val));
    }
    // Back-sub sv into primed original equation (solved form)
    var svAvail=eqs.map(function(_,i){return hasSv[i]?primedLbls[i]:null;}).filter(Boolean);
    var bsSv=ch.gleich_bs_sv!=null?ch.gleich_bs_sv:0;
    if(bsSv>=svAvail.length)bsSv=0;
    html+=spChoice('Einsetzen zum Bestimmen von '+varTex(vars[sv])+':',
      spEqBtns(svAvail,'gleich_bs_sv',bsSv));
    var svEqIdx=svIdxs[bsSv]!=null?svIdxs[bsSv]:svIdxs[0];
    var svBsPrimed=makePrimedEq(eqs[svEqIdx],sv);
    var knwSv={};knwSv[tv]=tvVal;knwSv[ev2]=ev2Val;
    var svVal=computeEvFromKnown(svBsPrimed,sv,knwSv,vars);
    html+=solSec(varTex(vars[sv])+' (Einsetzen in Gl.\u202f'+primedLbls[svEqIdx]+'):',
      backSubSolvedForm(svBsPrimed,sv,exprs[svEqIdx],vars,knwSv,svVal));
  }
  html+=solSec('Ergebnis:',solEq(solResultTex(vars,sol)));
  return html;
}

// =============================================================
// §10  SOLUTION PATHHH – EINSETZUNGSVERFAHREN
// =============================================================
function solPath_einsetz(lgs,ch){
  var n=lgs.n,vars=lgs.vars,eqs=lgs.equations,sol=lgs.solution;
  var html='';
  html+=solSec('Gleichungssystem:',solEq(systemTex(eqs,vars,eqs.map(function(_,i){return romanNum(i+1);}))));
  var lbls=eqs.map(function(_,i){return romanNum(i+1);});
  // Direct solving of single-variable equations first
  var red=reduceSingleVarEqs(eqs,vars);
  if(red.steps.length){
    html+=renderReductionHTML(red,vars);
    if(red.eqs.length===0)
      return html+solSec('Ergebnis:',solEq(solResultTex(vars,sol)));
    html+=solText('Das verbleibende System wird mit dem Einsetzungsverfahren gelöst:');
    eqs=red.eqs;n=red.eqs.length;lbls=red.lbls;
  }
  var fe=ch.einsetz_eq!=null?ch.einsetz_eq:0;
  if(fe<0||fe>=eqs.length)fe=0;
  html+=spChoice('Welche Gleichung umstellen?',spEqBtns(lbls,'einsetz_eq',fe));
  // Default: variable with the "nicest" coefficient in the chosen pivot equation
  var sv=ch.einsetz_var!=null?ch.einsetz_var:bestVarForEq(eqs[fe],vars,-1);
  html+=spChoice('Nach welcher Variable umstellen?',spVarBtns(vars,'einsetz_var',sv,eqs));

  var pivotEq=eqs[fe];
  var expr=solvedExprTex(pivotEq,vars,sv);
  if(expr===null){
    var availV=[];
    vars.forEach(function(v,i){if(Math.abs(pivotEq.coeffs[i])>1e-9)availV.push(varTex(v));});
    return html+solText(varTex(vars[sv])+' kommt in Gl.\u202f'+lbls[fe]+' nicht vor (Koeffizient 0) und kann daraus nicht freigestellt werden. '
      +(availV.length?'Gl.\u202f'+lbls[fe]+' enthält '+availV.join(', ')+' – wähle eine dieser Variablen oder eine andere Gleichung.':'Wähle eine andere Gleichung.'));
  }
  var pivLbl=lbls[fe]+"'";
  var SPEC='r @{\\qquad} r c l';

  // Rearranging: 3 steps (original → move terms → divide by coeff)
  html+=solSec(varTex(vars[sv])+' aus Gl.\u202f'+lbls[fe]+' auflösen:',
    solEq('\\begin{array}{'+SPEC+'}'+rearrangeRows(pivotEq,vars,sv,lbls[fe],pivLbl)+'\\end{array}'));

  // ── 2×2 case ──
  if(n===2){
    var oi=fe===0?1:0;
    var otherEq=eqs[oi];
    var oiLbl=lbls[oi]+"'";
    var svCoeffFe=pivotEq.coeffs[sv],svCoeffOi=otherEq.coeffs[sv];
    if(Math.abs(svCoeffOi)<1e-9){
      html+=solText(varTex(vars[sv])+' kommt nicht in Gl.\u202f'+lbls[oi]+' vor → direkt lösbar.');
      var rv=-1;for(var i=0;i<vars.length;i++){if(i!==sv&&Math.abs(otherEq.coeffs[i])>1e-9){rv=i;break;}}
      if(rv<0)return html+solText('Fehler.');
      var rvVal=otherEq.rhs/otherEq.coeffs[rv];
      html+=solSec(varTex(vars[rv])+' bestimmen:',solEq(solveAlignedTex(otherEq.coeffs,vars,otherEq.rhs,rv,rvVal)));
      var primedPiv=makePrimedEq(pivotEq,sv);
      var knwRv={};knwRv[rv]=rvVal;
      var svVal=computeEvFromKnown(primedPiv,sv,knwRv,vars);
      html+=solSec(varTex(vars[sv])+' (Einsetzen in Gl.\u202f'+pivLbl+'):',
        solEq(backSubAlignedTex(primedPiv,vars,knwRv,sv,svVal)));
    } else {
      var ne=subCollected(otherEq,pivotEq,sv,svCoeffFe,svCoeffOi);
      html+=solSec('Einsetzen in Gl.\u202f'+lbls[oi]+' \u2192 '+oiLbl+':',
        solEq('\\begin{array}{'+SPEC+'}'
          +subRows3(otherEq,pivotEq,sv,svCoeffFe,svCoeffOi,expr,ne,lbls[oi],oiLbl,vars)
          +'\\end{array}'));
      var rv=-1;for(var i=0;i<vars.length;i++){if(i!==sv&&Math.abs(ne.coeffs[i])>1e-9){rv=i;break;}}
      if(rv<0)return html+solText('Fehler.');
      var rvVal=ne.rhs/ne.coeffs[rv];
      html+=solSec(varTex(vars[rv])+' bestimmen:',solEq(solveAlignedTex(ne.coeffs,vars,ne.rhs,rv,rvVal)));
      // Back-sub into I' (pivot solved form) — always
      var knw2={};knw2[rv]=rvVal;
      var primedPiv2=makePrimedEq(pivotEq,sv);
      var svVal2=computeEvFromKnown(primedPiv2,sv,knw2,vars);
      html+=solSec(varTex(vars[sv])+' (Einsetzen in Gl.\u202f'+pivLbl+'):',
        backSubSolvedForm(primedPiv2,sv,expr,vars,knw2,svVal2));
    }

  // ── 3×3 case ──
  } else {
    var svCoeffFe=pivotEq.coeffs[sv];
    var otherIdxs=[];for(var i=0;i<n;i++)if(i!==fe)otherIdxs.push(i);
    var newEqs=[],newLbls=[];
    for(var k=0;k<otherIdxs.length;k++){
      var oi=otherIdxs[k];
      var oEq=eqs[oi];
      var svCoeffOi=oEq.coeffs[sv];
      var oiPrimedLbl=romanNum(oi+1)+"'";
      newLbls.push(oiPrimedLbl);
      if(Math.abs(svCoeffOi)<1e-9){
        html+=solText(varTex(vars[sv])+' nicht in Gl.\u202f'+romanNum(oi+1)+' → direkt übernehmen.');
        newEqs.push(oEq);
      } else {
        var ne2=subCollected(oEq,pivotEq,sv,svCoeffFe,svCoeffOi);
        html+=solSec('Einsetzen in Gl.\u202f'+romanNum(oi+1)+' \u2192 '+oiPrimedLbl+':',
          solEq('\\begin{array}{'+SPEC+'}'
            +subRows3(oEq,pivotEq,sv,svCoeffFe,svCoeffOi,expr,ne2,romanNum(oi+1),oiPrimedLbl,vars)
            +'\\end{array}'));
        newEqs.push(ne2);
      }
    }

    // ── 2×2 sub-system via Einsetzungsverfahren ──
    html+=solSec('Entstandenes 2×2-System:',solEq(systemTexCompact(newEqs,vars,newLbls)));

    // Check if one equation is already single-variable
    var singIdx2=-1,singVar2=-1;
    for(var i=0;i<2;i++){
      var nzC3=[];for(var j=0;j<vars.length;j++){if(Math.abs(newEqs[i].coeffs[j])>1e-9)nzC3.push(j);}
      if(nzC3.length===1){singIdx2=i;singVar2=nzC3[0];break;}
    }
    var tv2,tvVal2,ev22,ev2Val2;
    if(singIdx2>=0){
      tv2=singVar2;
      tvVal2=newEqs[singIdx2].rhs/newEqs[singIdx2].coeffs[tv2];
      html+=solSec(varTex(vars[tv2])+' bestimmen:',
        solEq(solveAlignedTex(newEqs[singIdx2].coeffs,vars,newEqs[singIdx2].rhs,tv2,tvVal2)));
      var oth3=1-singIdx2;
      ev22=-1;for(var j=0;j<vars.length;j++){if(j!==tv2&&j!==sv&&Math.abs(newEqs[oth3].coeffs[j])>1e-9){ev22=j;break;}}
      if(ev22<0)return html+solText('Fehler.');
      var primedOth3=makePrimedEq(newEqs[oth3],ev22);
      var knwT3={};knwT3[tv2]=tvVal2;
      ev2Val2=computeEvFromKnown(primedOth3,ev22,knwT3,vars);
      html+=solSec(varTex(vars[ev22])+' (Einsetzen in Gl.\u202f'+newLbls[oth3]+'):',
        solEq(backSubAlignedTex(primedOth3,vars,knwT3,ev22,ev2Val2)));
    } else {
      // Einsetzungsverfahren for 2×2
      var subFe=ch.einsetz_sub_eq>=0?ch.einsetz_sub_eq:0;
      if(subFe>1)subFe=0;
      html+=spChoice('Welche Gleichung umstellen?',spEqBtns(newLbls,'einsetz_sub_eq',subFe));
      var subSvDef=bestVarForEq(newEqs[subFe],vars,sv);
      var subSv=ch.einsetz_sub_var>=0?ch.einsetz_sub_var:-1;
      // Sanitize: choice may be stale (equal to sv or not present in the chosen equation)
      if(subSv<0||subSv===sv||Math.abs(newEqs[subFe].coeffs[subSv])<1e-9)subSv=subSvDef;
      html+=spChoice('Nach welcher Variable?',spVarBtns(vars,'einsetz_sub_var',subSv,[newEqs[subFe]]));

      var subPivot=newEqs[subFe];
      var subExpr=solvedExprTex(subPivot,vars,subSv);
      if(!subExpr)return html+solText('Fehler.');
      var subPivLbl=newLbls[subFe]+"'";
      // Rearranging sub-pivot: 3 steps aligned
      html+=solSec(varTex(vars[subSv])+' aus Gl.\u202f'+newLbls[subFe]+' auflösen:',
        solEq('\\begin{array}{'+SPEC+'}'+rearrangeRows(subPivot,vars,subSv,newLbls[subFe],subPivLbl)+'\\end{array}'));

      // Substitute into the other new equation
      var subOiIdx=1-subFe;
      var subOi=newEqs[subOiIdx];
      var subOiLbl=newLbls[subOiIdx]+"'";
      var subCoeffFe=subPivot.coeffs[subSv];
      var subCoeffOi=subOi.coeffs[subSv];

      if(Math.abs(subCoeffOi)<1e-9){
        html+=solText(varTex(vars[subSv])+' nicht in Gl.\u202f'+newLbls[subOiIdx]+' \u2192 direkt lösbar.');
        tv2=-1;for(var j=0;j<vars.length;j++){if(j!==sv&&j!==subSv&&Math.abs(subOi.coeffs[j])>1e-9){tv2=j;break;}}
        if(tv2<0)return html+solText('Fehler.');
        tvVal2=subOi.rhs/subOi.coeffs[tv2];
        html+=solSec(varTex(vars[tv2])+' bestimmen:',
          solEq(solveAlignedTex(subOi.coeffs,vars,subOi.rhs,tv2,tvVal2)));
      } else {
        var subNe=subCollected(subOi,subPivot,subSv,subCoeffFe,subCoeffOi);
        html+=solSec('Einsetzen in Gl.\u202f'+newLbls[subOiIdx]+' \u2192 '+subOiLbl+':',
          solEq('\\begin{array}{'+SPEC+'}'
            +subRows3(subOi,subPivot,subSv,subCoeffFe,subCoeffOi,subExpr,subNe,newLbls[subOiIdx],subOiLbl,vars)
            +'\\end{array}'));
        tv2=-1;for(var j=0;j<vars.length;j++){if(j!==sv&&j!==subSv&&Math.abs(subNe.coeffs[j])>1e-9){tv2=j;break;}}
        if(tv2<0)return html+solText('Fehler: dritte Variable nicht gefunden.');
        tvVal2=subNe.rhs/subNe.coeffs[tv2];
        html+=solSec(varTex(vars[tv2])+' bestimmen:',
          solEq(solveAlignedTex(subNe.coeffs,vars,subNe.rhs,tv2,tvVal2)));
      }
      // Back-sub subSv via primed sub-pivot (solved form)
      ev22=subSv;
      var primedSubPiv=makePrimedEq(subPivot,subSv);
      var knwSubSv={};knwSubSv[tv2]=tvVal2;
      ev2Val2=computeEvFromKnown(primedSubPiv,subSv,knwSubSv,vars);
      html+=solSec(varTex(vars[subSv])+' (Einsetzen in Gl.\u202f'+subPivLbl+'):',
        backSubSolvedForm(primedSubPiv,subSv,subExpr,vars,knwSubSv,ev2Val2));
    }

    // Back-sub sv using primed pivot equation (solved form) — no button needed
    var primedPiv=makePrimedEq(pivotEq,sv);
    var knwSv2={};knwSv2[tv2]=tvVal2;knwSv2[ev22]=ev2Val2;
    var svFinal=computeEvFromKnown(primedPiv,sv,knwSv2,vars);
    html+=solSec(varTex(vars[sv])+' (Einsetzen in Gl.\u202f'+pivLbl+'):',
      backSubSolvedForm(primedPiv,sv,expr,vars,knwSv2,svFinal));
  }
  html+=solSec('Ergebnis:',solEq(solResultTex(vars,sol)));
  return html;
}

// =============================================================
// §11  SOLUTION PATH – RENDER WRAPPER
// =============================================================
function setSPC(key,val){
  solPathChoices[key]=val;
  renderSolutionPath();
}
function setSPCnum(key,val,fallback){
  var n=parseNum(String(val));
  if(n===null||n===0)n=parseNum(String(fallback));
  if(n===null||n===0)n=1;
  setSPC(key,n);
  var inp=document.getElementById('spc_'+key);
  if(inp)inp.value=numPlain(n);
}
function spFactorRow(c1,c2,choiceKey){
  var kgv=rationalLcm(c1,c2);
  var cur=solPathChoices[choiceKey]!=null?solPathChoices[choiceKey]:kgv;
  var h='<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:3px 0 4px;">';
  h+='<span style="font-size:.82em;color:#555;">Zielfaktor:</span>';
  h+='<button class="qz-btn'+(cur===kgv||solPathChoices[choiceKey]===null?' qc':'')+'" style="font-size:.8em;padding:3px 9px;" onclick="setSPC(\''+choiceKey+'\','+kgv+')">kgV\u202f=\u202f\\('+numTex(kgv)+'\\)</button>';
  var a=Math.abs(c1),b=Math.abs(c2);
  if(a!==kgv&&b%a===0)h+='<button class="qz-btn'+(cur===a?' qc':'')+'" style="font-size:.8em;padding:3px 9px;" onclick="setSPC(\''+choiceKey+'\','+a+')">\\('+numTex(a)+'\\)</button>';
  if(b!==kgv&&a%b===0&&b!==a)h+='<button class="qz-btn'+(cur===b?' qc':'')+'" style="font-size:.8em;padding:3px 9px;" onclick="setSPC(\''+choiceKey+'\','+b+')">\\('+numTex(b)+'\\)</button>';
  h+='<input type="number" id="spc_'+choiceKey+'" min="1" value="'+cur+'" '
    +'style="width:54px;padding:3px 5px;border:1px solid #aaa;border-radius:4px;font-size:.88em;" '
    +'onchange="setSPCnum(\''+choiceKey+'\',this.value,'+kgv+')" '
    +'onblur="setSPCnum(\''+choiceKey+'\',this.value,'+kgv+')" '
    +'onkeydown="if(event.key===\'Enter\'){setSPCnum(\''+choiceKey+'\',this.value,'+kgv+');this.blur();}">';
  return h+'</div>';
}

function qzSystemBanner(eqs,vars,labels,extra){
  return'<div class="qz-hint-box" style="margin-bottom:6px;">'
    +'<div class="scale-wrapper"><div class="scale-el">\\['+systemTex(eqs,vars,labels)+'\\]</div></div>'+(extra||'')+'</div>';
}

document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('solutionPathDetails').addEventListener('toggle',function(){
    if(this.open&&currentLGS)renderSolutionPath();
  });
});

function renderSolutionPath(){
  if(!currentLGS)return;
  var method=getMethod();
  var cont=document.getElementById('solutionPathContent');
  var choiceArea=document.getElementById('solPathChoicesArea');
  var ch=solPathChoices;
  var vars=currentLGS.vars,n=currentLGS.n,eqs=currentLGS.equations;

  var choiceHtml='<div style="padding:6px 0 8px;border-bottom:1px solid #c8d8c8;margin-bottom:8px;font-size:.9em;">';
  if(method==='gauss'){
    choiceHtml+='<span style="color:#555;"><b>Gauß-Verfahren:</b> feste systematische Vorgehensweise (Gauss-Jordan)</span>';
  } else {
    choiceHtml+='<span style="color:#555;font-size:.85em;">Die Auswahlmöglichkeiten erscheinen direkt im Lösungsweg.</span>';
  }
  choiceHtml+='</div>';
  choiceArea.innerHTML=choiceHtml;
  MathJax.typesetPromise([choiceArea]);

  var html='';
  switch(method){
    case 'gauss':   html=solPath_gauss(currentLGS);break;
    case 'gleich':  html=solPath_gleich(currentLGS,ch);break;
    case 'einsetz': html=solPath_einsetz(currentLGS,ch);break;
    default:        html=solPath_add(currentLGS,ch);break;
  }
  cont.innerHTML=html;
  MathJax.typesetPromise([cont]).then(function(){if(typeof scaleAllElements==='function')scaleAllElements();});
}
// =============================================================
// §11  QUIZ ENGINE
// =============================================================
var quizState=null;

function toggleQuiz(){
  var on=document.getElementById('quizMode').checked;
  var qa=document.getElementById('quizArea');
  if(!on){
    quizState=null;
    qa.innerHTML='';
    qa.style.display='none';
  } else {
    qa.style.display='';
    if(currentLGS)initQuiz(); // always start fresh
  }
}

function initQuiz(){
  if(!currentLGS)return;
  var method=getMethod();
  var lgs=currentLGS;
  var n=lgs.n;
  // Pre-compute elimination factors for the quiz
  quizState={
    method:method,n:n,
    helpLevel:0,
    stage:'start',
    // for add/gauss
    elimVar:0,
    // for 3x3 round tracking
    round:0,
    currentEqs:lgs.equations.slice(),
    currentLabels:lgs.equations.map(function(_,i){return romanNum(i+1);}),
    pivotIdx:0,otherIdx:1,other2Idx:2,
    f1:null,f2:null,op:null,
    newEqs:[],
    // for gauß: step counter
    gaussStep:0,gaussM:null,gaussLabels:null,gaussKnown:{},
    // for gleich/einsetz
    solveVar:0,
    fromEq:0,
    combinedEq:null,
    // final known values
    knownVars:{},
    backSubStep:0,backSubOrder:[],
  };
  switch(method){
    case 'gauss':  initQuiz_gauss();break;
    case 'gleich': initQuiz_gleich();break;
    case 'einsetz':initQuiz_einsetz();break;
    default:       quizState.stage='add_choose_var';break;
  }
  // Direct solving of single-variable equations first (all methods except Gauß,
  // which handles such rows systematically anyway)
  if(method!=='gauss'){
    var red=reduceSingleVarEqs(currentLGS.equations,currentLGS.vars);
    if(red.steps.length){
      quizState.preRed=red;
      quizState.preIdx=0;
      quizState.preMethodStage=quizState.stage;  // where to continue afterwards
      quizState.stage='pre_solve';
    }
  }
  renderQuiz();
}

// ── Working system: after the direct-solve phase the methods operate on the
//    reduced system (with proper labels such as II', III). ──
function qLGS(){return(quizState&&quizState.workLGS)||currentLGS;}
function qLbl(i){
  var w=quizState&&quizState.workLGS;
  return w?w.lbls[i]:romanNum(i+1);
}
function qBaseN(){
  var w=quizState&&quizState.workLGS;
  return w?w.baseN:(currentLGS?currentLGS.n:2);
}
// Labels for the equations of the reduced 2x2 system in the Additionsverfahren.
// They continue the roman numbering of the original system: a 3x3 yields IV and V.
function qNewLbl(i){return romanNum(qBaseN()+1+i);}
function qNewLbls(){return [qNewLbl(0),qNewLbl(1)];}

// ── Pre-solve stage: equations with only one variable are solved directly ──
function renderPreSolve(qa){
  var qs=quizState,lgs=currentLGS,vars=lgs.vars;
  var st=qs.preRed.steps[qs.preIdx];
  var sysEqs=qs.preIdx===0?lgs.equations:qs.preRed.steps[qs.preIdx-1].remainEqs;
  var sysLbls=qs.preIdx===0?lgs.equations.map(function(_,i){return romanNum(i+1);}):qs.preRed.steps[qs.preIdx-1].remainLbls;
  var hl=qs.helpLevel;
  var hint='';
  if(hl>=1)hint='<div class="qz-hint-box">Löse Gl.\u202f'+st.lbl+' nach '+varTex(vars[st.vi])+' auf: teile durch den Koeffizienten '+numTex(st.eq.coeffs[st.vi])+'.</div>';
  if(hl>=2)hint='<div class="qz-hint-box">\\['+solveAlignedTex(st.eq.coeffs,vars,st.eq.rhs,st.vi,st.val)+'\\]</div>';
  var html='<div class="qz-stage">'+methodLabel(qs.method)+'</div>';
  html+=qzCurStep('Gl.\u202f'+st.lbl+' enthält nur eine Variable – direkt lösen!',
    qzSystemBanner(sysEqs,vars,sysLbls)
    +'<div class="qz-sub">Gl.\u202f'+st.lbl+' enthält als einzige Variable '+varTex(vars[st.vi])+'. Welchen Wert hat '+varTex(vars[st.vi])+'?</div>'
    +'<div class="qz-inp-row">'
    +'<span style="align-self:center;">\\('+vars[st.vi]+' =\\)</span>'
    +'<input class="qz-inp sm" id="qz_pre" type="text" onkeydown="if(event.key===\'Enter\')preCheckVal()">'
    +'<button onclick="preCheckVal()">Prüfen</button>'
    +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
    +'<button class="btn-grey" onclick="preSkipVal()">Überspringen</button>'
    +'</div><div id="qz_fb" class="qz-fb"></div>'+hint);
  qa.innerHTML=html;
}
function preCheckVal(){
  var qs=quizState,st=qs.preRed.steps[qs.preIdx];
  var inp=document.getElementById('qz_pre');if(!inp)return;
  var v=parseValOrEq(inp.value,currentLGS.vars,st.vi);
  if(v===null){qzFb('qz_fb','Ungültige Eingabe.','err');inp.classList.add('err');return;}
  if(Math.abs(v-st.val)<1e-6){
    inp.classList.add('ok');qzFb('qz_fb','✓ Richtig!','ok');
    setTimeout(function(){preAdvance();},500);
  } else {
    inp.classList.add('err');qzFb('qz_fb','Nicht korrekt.','err');
  }
}
function preSkipVal(){
  var qs=quizState,st=qs.preRed.steps[qs.preIdx],vars=currentLGS.vars;
  var fb=document.getElementById('qz_fb');
  if(fb){fb.className='qz-fb ok';fb.innerHTML='Lösung: \\('+vars[st.vi]+' = '+numTex(st.val)+'\\)';MathJax.typesetPromise([fb]);}
  setTimeout(function(){preAdvance();},1200);
}
function preAdvance(){
  var qs=quizState,lgs=currentLGS,vars=lgs.vars;
  var st=qs.preRed.steps[qs.preIdx];
  _preRecordKnown(st.vi,st.val);
  qs.helpLevel=0;
  var isLast=qs.preIdx>=qs.preRed.steps.length-1;
  if(st.remainEqs.length>0){
    var msg='Setze \\('+vars[st.vi]+' = '+numTex(st.val)+'\\) in die '
      +(st.remainEqs.length>1?'übrigen Gleichungen':'übrige Gleichung')+' ein:'
      +'<div class="scale-wrapper"><div class="scale-el">\\['+systemTexCompact(st.remainEqs,vars,st.remainLbls)+'\\]</div></div>'
      +(isLast&&st.remainEqs.length>0
        ?'<div style="margin-top:4px;">Das verbleibende System wird nun mit dem '+methodLabel(qs.method)+' gelöst.</div>'
        :'');
    qzInfo(msg,function(){_preNext(isLast);});
  } else {
    _preNext(isLast);
  }
}
function _preRecordKnown(vi,val){
  var qs=quizState;
  if(qs.method==='add')qs.knownVars[vi]=val;
  else if(qs.qKnown)qs.qKnown[vi]=val;
}
function _preNext(isLast){
  var qs=quizState,lgs=currentLGS;
  if(!isLast){
    qs.preIdx++;
    qs.stage='pre_solve';qs.helpLevel=0;renderQuiz();
    return;
  }
  var red=qs.preRed;
  if(red.eqs.length===0){qs.stage='done';renderQuiz();return;}
  // Continue with the chosen method on the reduced system
  qs.workLGS={n:red.eqs.length,vars:lgs.vars,equations:red.eqs,
    solution:lgs.solution,lbls:red.lbls,baseN:lgs.n};
  var known={};
  red.steps.forEach(function(s){known[s.vi]=s.val;});
  switch(qs.method){
    case 'gleich': initQuiz_gleich();break;
    case 'einsetz':initQuiz_einsetz();break;
    default:       qs.stage='add_choose_var';break;
  }
  // Re-apply pre-solved values (method init resets them)
  Object.keys(known).forEach(function(k){_preRecordKnown(parseInt(k),known[k]);});
  qs.helpLevel=0;renderQuiz();
}

function renderQuiz(){
  if(!quizState||!currentLGS)return;
  var qa=document.getElementById('quizArea');
  try{
    // Shared informational interstitial (used for special cases: missing variables,
    // equations that become single-variable, unnecessary elimination steps, …)
    if(quizState.stage==='qinfo'){
      qa.innerHTML='<div class="qz-stage">'+methodLabel(quizState.method)+'</div>'
        +qzCurStep('Hinweis',
          '<div class="qz-hint-box">'+(quizState.qInfoMsg||'')+'</div>'
          +'<div class="qz-btns"><button onclick="qzInfoNext()">Weiter &#8594;</button></div>');
      MathJax.typesetPromise([qa]).then(function(){if(typeof scaleAllElements==='function')scaleAllElements();});
      return;
    }
    // Direct solving of single-variable equations before the actual method starts
    if(quizState.stage==='pre_solve'){
      renderPreSolve(qa);
      MathJax.typesetPromise([qa]).then(function(){if(typeof scaleAllElements==='function')scaleAllElements();});
      return;
    }
    switch(quizState.method){
      case 'gauss':  renderQuiz_gauss(qa);break;
      case 'gleich': renderQuiz_gleich(qa);break;
      case 'einsetz':renderQuiz_einsetz(qa);break;
      default:       renderQuiz_add(qa);break;
    }
    MathJax.typesetPromise([qa]).then(function(){if(typeof scaleAllElements==='function')scaleAllElements();});
  }catch(e){
    qa.innerHTML='<div class="qz-cur-step" style="color:#900;">Fehler: '+e.message+'</div>';
    console.error('Quiz-Fehler:',e);
  }
}

// ---- Shared helpers ----
function qzFb(id,msg,cls){var el=document.getElementById(id);if(el){el.className='qz-fb '+cls;el.innerHTML=msg;}}
function qzDoneStep(title,content){return'<div class="qz-done-step"><div class="qz-step-title">✓ '+title+'</div>'+content+'</div>';}
function qzCurStep(title,content){return'<div class="qz-cur-step"><div class="qz-step-title">'+title+'</div>'+content+'</div>';}
function methodLabel(m){return{add:'Additionsverfahren',gauss:'Gauß-Verfahren',gleich:'Gleichsetzungsverfahren',einsetz:'Einsetzungsverfahren'}[m]||m;}
function qzHelp(){
  if(quizState)quizState.helpLevel=(quizState.helpLevel||0)+1;
  renderQuiz();
}
// Show an informational interstitial step, then continue with nextFn on "Weiter"
function qzInfo(msg,nextFn){
  if(!quizState)return;
  quizState.qInfoMsg=msg;
  quizState._qInfoNext=nextFn;
  quizState.stage='qinfo';
  quizState.helpLevel=0;quizState._mcCache=null;
  renderQuiz();
}
function qzInfoNext(){
  if(!quizState)return;
  var f=quizState._qInfoNext;
  quizState._qInfoNext=null;quizState.qInfoMsg='';
  if(typeof f==='function')f();else renderQuiz();
}
function _quizDone(){return'<div class="qz-done-step" style="background:#d4edda;border:1px solid #28a745;border-radius:4px;padding:10px;text-align:center;font-weight:bold;">✓ '+methodLabel(quizState&&quizState.method||'')+' vollständig gelöst!</div>';}

// Show "I': sv = expr, II': sv = expr" aligned — each variable term in its own column
function qzSolvedFormBanner(eqsArr,vars,sv,labels){
  var n=vars.length;
  var otherIdx=vars.map(function(_,i){return i;}).filter(function(i){return i!==sv;});
  // spec: r @{\qquad} r c r [c r]* — label, var, =, const, [sign, coeff*var]*
  var spec='r @{\\qquad} r c r';
  for(var ii=0;ii<otherIdx.length-1;ii++)spec+=' c r';
  // if there are other vars at all, add one more pair
  if(otherIdx.length>0)spec+=' c r';
  var rows=eqsArr.map(function(eq,k){
    var c_sv=eq.coeffs[sv];
    if(Math.abs(c_sv)<1e-9)return'\\text{'+labels[k]+'}: \\quad & '+vars[sv]+' & = & ?';
    var constVal=eq.rhs/c_sv;
    var hasOther=otherIdx.some(function(j){return Math.abs(eq.coeffs[j])>1e-9;});
    var row='\\text{'+labels[k]+'}: \\quad & '+vars[sv]+' & = ';
    var firstNZ=true;
    if(Math.abs(constVal)>1e-9||!hasOther){
      row+='& '+numTex(constVal);firstNZ=false;
    } else {
      row+='& ';
    }
    for(var ii2=0;ii2<otherIdx.length;ii2++){
      var j=otherIdx[ii2];
      var coeff=-eq.coeffs[j]/c_sv;
      if(Math.abs(coeff)<1e-9){row+=' & & ';continue;}
      var sign=firstNZ?(coeff<0?'-':''):(coeff>0?'+':'-');
      var absC=Math.abs(coeff);
      var termStr=(Math.abs(absC-1)<1e-9?'':numTex(absC))+vars[j];
      row+=' & '+sign+' & '+termStr;firstNZ=false;
    }
    return row;
  });
  return'<div class="qz-hint-box" style="margin:4px 0;">'
    +'<div class="scale-wrapper"><div class="scale-el">\\[\\begin{array}{'+spec+'}'
    +rows.join(' \\\\ ')+'\\end{array}\\]</div></div></div>';
}

// Accept both "3" and "y=3" or "y = 3" as a value input
// Check if equation p represents "vi = constant" — returns {vi, val} or null
function isSolvedFor(p,vars){
  var solvedIdx=-1,count=0;
  for(var i=0;i<vars.length;i++){if(Math.abs(p.coeffs[i])>1e-9){solvedIdx=i;count++;}}
  if(count!==1)return null;
  return{vi:solvedIdx,val:p.rhs/p.coeffs[solvedIdx]};
}
function parseValOrEq(input,vars,vi){
  var s=(input||'').trim().replace(/,/g,'.').replace(/[−–]/g,'-');
  var n=parseNum(s);
  if(n!==null)return n;
  var p=parseUserEq(s,vars);
  if(p&&Math.abs(p.coeffs[vi]-1)<1e-6){
    var allZero=p.coeffs.every(function(c,i){return i===vi||Math.abs(c)<1e-9;});
    if(allZero)return p.rhs;
  }
  return null;
}
function qzStageNum(){
  var qs=quizState,m=qs.method,n=qs.n;
  var stage=qs.stage;
  var map={
    add_choose_var:1,add_factors:2,add_op:3,add_result:4,
    add_pair2_factors:5,add_pair2_op:6,add_pair2_result:7,
    add_show_2x2:8,add_choose_var2:9,add_factors2:10,add_op2:11,add_result2:12,
    add_solve:n===3?13:5,add_backsubst:n===3?14:6,add_backsubst2:15,
    done:99
  };
  return map[stage]||'';
}
// ---- ADDITIONSVERFAHREN QUIZ ----
function renderQuiz_add(qa){
  var qs=quizState,lgs=qLGS(),vars=lgs.vars,eqs=lgs.equations;
  var n=lgs.n;
  var methodName=n===2?'Additionsverfahren (2×2)':'Additionsverfahren (3×3)';
  var html='<div class="qz-stage">'+methodName+'</div>';

  // Completed stages summary
  if(qs.stage!=='add_choose_var')
    html+=qzDoneStep('Zu eliminierende Variable: \\('+vars[qs.elimVar]+'\\)','');
  if(qs.stage!=='add_choose_var'&&qs.stage!=='add_choose_pair1'&&n===3
    &&qs.pair1!=null){
    html+=qzDoneStep('1.\u202fGleichungspaar: '+qLbl(qs.pair1[0])+' ; '+qLbl(qs.pair1[1]),'');
  }

  // Current stage rendering
  switch(qs.stage){
    case 'add_choose_var':
      var availAdd=[];
      vars.forEach(function(_,i){if(countEqsWithVar(eqs,i)>=2)availAdd.push(i);});
      if(availAdd.length===0){
        // Degenerate system (with zero coefficients): no variable appears in two equations
        html+=qzCurStep('Schritt 1: Keine Elimination nötig',
          '<div class="qz-hint-box">In diesem LGS kommt keine Variable in zwei Gleichungen gleichzeitig vor – jede Gleichung enthält nur eine Variable. Es muss also nichts eliminiert werden: Alle Werte lassen sich direkt aus den einzelnen Gleichungen berechnen.</div>'
          +'<div class="qz-btns"><button onclick="addStartDirect()">Weiter &#8594;</button></div>');
      } else {
        html+=qzCurStep('Schritt 1: Welche Variable soll eliminiert werden?',
          '<div class="qz-sub">Wähle eine Variable, die in mindestens zwei Gleichungen vorkommt:</div>'
          +'<div class="qz-btns">'+availAdd.map(function(i){
            return'<button class="qz-btn" onclick="addPickVar('+i+',this)">'+varTex(vars[i])+'</button>';
          }).join('')+'</div>');
      }
      break;

    case 'add_choose_pair1':
      html+=_addRenderPairStage(1);
      break;

    case 'add_choose_pair2':
      html+=_addRenderPairStage(2);
      break;

    case 'add_factors':
    case 'add_pair2_factors':
      html+=_addRenderFactorStage(vars,eqs,false);
      break;

    case 'add_op':
    case 'add_pair2_op':
      html+=_addRenderOpStage(vars);
      break;

    case 'add_result':
    case 'add_pair2_result':
      html+=_addRenderResultStage(vars,eqs);
      break;

    case 'add_show_2x2':
      html+=qzCurStep('Entstandenes 2×2-System:',
        qzSystemBanner(qs.newEqs,vars,qNewLbls())
        +'<button onclick="addAdvanceFrom2x2Show()">Weiter &#8594;</button>');
      break;

    case 'add_choose_var2':
      html+=_addRender2x2ChooseVar(vars);
      break;

    case 'add_factors2':
      html+=_addRenderFactorStage(vars,eqs,true);
      break;

    case 'add_op2':
      html+=_addRenderOpStage(vars,true);
      break;

    case 'add_result2':
      html+=_addRenderResultStage(vars,eqs,true);
      break;

    case 'add_solve':
    case 'add_backsubst':
    case 'add_backsubst2':
      html+=_addRenderSolveStage(vars,eqs);
      break;

    case 'done':
      html+=_quizDone();
      break;
  }
  qa.innerHTML=html;
}

function addPickVar(vi,btn){
  btn.closest('.qz-btns').querySelectorAll('.qz-btn').forEach(function(b){b.onclick=null;});
  btn.classList.add('qc');
  quizState.elimVar=vi;
  var lgs=qLGS(),eqs=lgs.equations,n=lgs.n;
  if(n===2){
    quizState.pair1=[0,1];
    setTimeout(function(){quizState.stage='add_factors';quizState.helpLevel=0;renderQuiz();},500);
  } else {
    setTimeout(function(){quizState.stage='add_choose_pair1';quizState.helpLevel=0;renderQuiz();},500);
  }
}

// Degenerate case: every equation contains only one variable → solve directly
function addStartDirect(){
  var qs=quizState;if(!qs||!qLGS())return;
  qs.finalEq=qLGS().equations[0];
  qs.newEqs=[];
  qs.stage='add_solve';qs.helpLevel=0;
  renderQuiz();
}

function _addRenderPairStage(round){
  var qs=quizState,lgs=qLGS(),eqs=lgs.equations,vars=lgs.vars;
  var vi=qs.elimVar;
  // Build valid pairs for this variable
  var allPairs=[];
  for(var i=0;i<3;i++)for(var j=i+1;j<3;j++)
    if(Math.abs(eqs[i].coeffs[vi])>1e-9&&Math.abs(eqs[j].coeffs[vi])>1e-9)allPairs.push([i,j]);
  // For round 2, exclude pair1
  var pairs=round===2?allPairs.filter(function(p){
    var p1=qs.pair1;return!(p[0]===p1[0]&&p[1]===p1[1]);
  }):allPairs;
  var btnHtml='<div class="qz-btns">'+pairs.map(function(p){
    return'<button class="qz-btn" onclick="addPickPair('+JSON.stringify(p)+','+round+',this)">'
      +qLbl(p[0])+' ; '+qLbl(p[1])+'</button>';
  }).join('')+'</div>';
  var stepTitle=round===1
    ?'Schritt 2: Welches Gleichungspaar eliminiert \\('+vars[vi]+'\\)?'
    :'Schritt 3: Welches zweite Paar eliminiert \\('+vars[vi]+'\\)?';
  return qzCurStep(stepTitle,
    '<div class="qz-sub">Wähle zwei Gleichungen, aus denen \\('+vars[vi]+'\\) eliminiert werden soll:</div>'
    +btnHtml);
}

function addPickPair(pair,round,btn){
  btn.classList.add('qc');
  btn.closest('.qz-btns').querySelectorAll('.qz-btn').forEach(function(b){b.onclick=null;});
  var qs=quizState;
  if(round===1){qs.pair1=pair;qs.pivotIdx=pair[0];qs.otherIdx=pair[1];}
  else{qs.pair2=pair;qs.pivotIdx=pair[0];qs.other2Idx=pair[1];}
  var nextStage=round===1?'add_factors':'add_pair2_factors';
  setTimeout(function(){qs.stage=nextStage;qs.helpLevel=0;renderQuiz();},400);
}

function _addGetCurrentPair(){
  var qs=quizState,lgs=qLGS(),eqs=lgs.equations;
  var stage=qs.stage;
  var is2nd=stage==='add_pair2_factors'||stage==='add_pair2_op'||stage==='add_pair2_result';
  var is2x2=stage==='add_factors2'||stage==='add_op2'||stage==='add_result2';
  if(is2nd){
    var p=qs.pair2||[qs.pivotIdx,qs.other2Idx];
    return{eq1:eqs[p[0]],eq2:eqs[p[1]],l1:qLbl(p[0]),l2:qLbl(p[1]),vi:qs.elimVar};
  }
  if(is2x2)return{eq1:qs.newEqs[0],eq2:qs.newEqs[1],l1:qNewLbl(0),l2:qNewLbl(1),vi:qs.elimVar2};
  var p1=qs.pair1||[qs.pivotIdx,qs.otherIdx];
  return{eq1:eqs[p1[0]],eq2:eqs[p1[1]],l1:qLbl(p1[0]),l2:qLbl(p1[1]),vi:qs.elimVar};
}

function _addRenderFactorStage(vars,eqs,is2x2Round){
  var qs=quizState;
  var p=_addGetCurrentPair();
  var vi=p.vi;
  var ef=getElimFactors(p.eq1,p.eq2,vi);
  // Safety net: if the variable is missing in one of the two equations,
  // there are no valid factors (kgV would be 0) – no elimination is needed.
  if(!ef||ef.kgv===0){
    var ziF=Math.abs(p.eq1.coeffs[vi])<1e-9?0:1;
    return qzCurStep('Hinweis',
      '<div class="qz-hint-box">'+varTex(vars[vi])+' kommt in Gl.\u202f'+(ziF===0?p.l1:p.l2)+' nicht vor (Koeffizient 0) – hier muss nichts eliminiert werden. Die Gleichung kann direkt weiterverwendet werden.</div>'
      +'<div class="qz-btns"><button onclick="addFactorZeroAdvance('+ziF+')">Weiter &#8594;</button></div>');
  }
  var stepN=is2x2Round
    ?'Faktoren für das Paar '+qNewLbl(0)+'\u202f;\u202f'+qNewLbl(1)+' bestimmen (\\('+vars[qs.elimVar2]+'\\) eliminieren)'
    :'Faktoren für \\('+vars[vi]+'\\) eliminieren ('+p.l1+' ; '+p.l2+')';
  var hl=qs.helpLevel;
  var c1=p.eq1.coeffs[vi],c2=p.eq2.coeffs[vi];
  var hintHtml='';
  if(hl>=1&&ef&&ef.kgv>0){
    hintHtml='<div class="qz-hint-box">Tipp: \\(\\operatorname{kgV}(|'+numTex(c1)+'|,\\,|'+numTex(c2)+'|) = '+numTex(ef.kgv)+'\\)'
      +'<br><span style="color:#555;font-size:.87em;">Welche Faktoren bringen beide Gleichungen betragsmäßig auf diesen Koeffizienten? Die Vorzeichen der Faktoren darfst du frei wählen – addiert oder subtrahiert wird im nächsten Schritt passend dazu.</span></div>';
  }
  if(hl>=2&&ef){
    hintHtml='<div class="qz-hint-box">\\(\\operatorname{kgV} = '+numTex(ef.kgv)+'\\)'
      +' \\(\\Rightarrow\\) \\('+numTex(ef.f1)+'\\cdot '+p.l1+'\\), \\('+numTex(ef.f2)+'\\cdot '+p.l2+'\\)</div>';
  }
  // Show equations column-aligned (CSS table) with | · input per row
  // This mirrors the systemTex layout: label | terms... | = | rhs | |· | input
  var n=vars.length;
  var td='style="padding:2px 3px;white-space:nowrap;vertical-align:middle;"';
  function makeEqRow(lbl,eq,inputId){
    var cells='<td '+td+' align="right">\\(\\text{'+lbl+'}:\\)</td>';
    // First term
    var c0=eq.coeffs[0];
    if(Math.abs(c0)<1e-9){cells+='<td '+td+'></td>';}
    else{var a0=Math.abs(c0);cells+='<td '+td+' align="right">\\('+(c0<0?'-':'')+(a0===1?'':numTex(a0))+vars[0]+'\\)</td>';}
    // Remaining terms
    for(var j=1;j<n;j++){
      var cj=eq.coeffs[j];
      if(Math.abs(cj)<1e-9){cells+='<td '+td+'></td><td '+td+'></td>';}
      else{
        var aj=Math.abs(cj);
        cells+='<td '+td+' align="center">\\('+(cj>0?'+':'-')+'\\)</td>';
        cells+='<td '+td+' align="right">\\('+(aj===1?'':numTex(aj))+vars[j]+'\\)</td>';
      }
    }
    cells+='<td '+td+' align="center">\\(=\\)</td>';
    cells+='<td '+td+' align="right">\\('+numTex(eq.rhs)+'\\)</td>';
    cells+='<td '+td+' style="padding-left:1em;padding-right:2px;">\\(\\qquad|\\cdot\\)</td>';
    cells+='<td '+td+'><input class="qz-inp sm" id="'+inputId+'" type="text" '
      +'placeholder="z.B.\u202f3" onkeydown="if(event.key===\'Enter\')addCheckFactors()"></td>';
    return'<tr>'+cells+'</tr>';
  }
  var eqRows='<table style="border-spacing:0;border-collapse:collapse;margin:4px 0;">'
    +makeEqRow(p.l1,p.eq1,'qz_f1')+makeEqRow(p.l2,p.eq2,'qz_f2')
    +'</table>';
  return qzCurStep(stepN,
    eqRows
    +'<div class="qz-btns" style="margin-top:6px;">'
    +'<button onclick="addCheckFactors()">Prüfen</button>'
    +(hl<2?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
    +'<button class="btn-grey" onclick="addSkipFactors()">Überspringen</button>'

}

    return;

function _addRenderOpStage(vars,is2x2){
  var qs=quizState;
  var p=_addGetCurrentPair();
  var vi=p.vi;
  var f1=is2x2?(qs.f1c):(qs.stage==='add_pair2_op'?qs.f1b:qs.f1);
  var f2=is2x2?(qs.f2c):(qs.stage==='add_pair2_op'?qs.f2b:qs.f2);
  var c1=p.eq1.coeffs[vi],c2=p.eq2.coeffs[vi];
  var prod1=f1*c1,prod2=f2*c2;
  var correctOp=Math.abs(prod1-prod2)<1e-9?'sub':'add';
  var eq1s={coeffs:p.eq1.coeffs.map(function(c){return f1*c;}),rhs:f1*p.eq1.rhs};
  var eq2s={coeffs:p.eq2.coeffs.map(function(c){return f2*c;}),rhs:f2*p.eq2.rhs};
  var hl=qs.helpLevel;
  // Labels via factorLbl so 	ext{} keeps them upright
  var lbl1=factorLbl(f1,p.l1);
  var lbl2=factorLbl(f2,p.l2);
  var signNote='<div class="qz-hint-box">'
    +'<b>Regel:</b> Vergleiche die Koeffizienten von \\('+vars[vi]+'\\) nach dem Multiplizieren: '
    +'\\('+numTex(prod1)+'\\) und \\('+numTex(prod2)+'\\). '
    +(Math.abs(prod1-prod2)<1e-9
      ? 'Gleiche Vorzeichen: <b>subtrahieren</b> (\\('+numTex(prod1)+' - '+numTex(prod2)+' = 0\\))'
      : 'Verschiedene Vorzeichen: <b>addieren</b> (\\('+numTex(prod1)+' + ('+numTex(prod2)+') = 0\\))')
    +'</div>';
  var hintHtml=hl>=1?signNote:'';
  var extraId='qz_op_fb';
  return qzCurStep('Addieren oder subtrahieren?',
    qzSystemBanner([eq1s,eq2s],vars,[lbl1,lbl2])
    +'<div class="qz-sub">Welche Operation eliminiert \\('+vars[vi]+'\\)?</div>'
    +'<div class="qz-btns">'
    +'<button class="qz-btn" id="qz_op_add" onclick="addCheckOp(\'add\',\''+correctOp+'\',this)">Addieren (+)</button>'
    +'<button class="qz-btn" id="qz_op_sub" onclick="addCheckOp(\'sub\',\''+correctOp+'\',this)">Subtrahieren (−)</button>'
    +(hl<1?'<button class="btn-orange" onclick="qzHelp()">Hilfe</button>':'')
    +'</div>'
    +'<div id="'+extraId+'" class="qz-fb"></div>'
    +hintHtml);
}

function _addStoreResult(newEq,is2nd,is2x2){
  var qs=quizState,lgs=qLGS(),n=lgs.n;
  if(is2x2){
    // Final 1-var equation from 2x2 round
    qs.finalEq=newEq;
    qs.stage='add_solve';qs.helpLevel=0;
  } else if(is2nd){
    // Second pair result (3x3 only)
    qs.newEqs[1]=newEq;
    qs.stage='add_show_2x2';qs.helpLevel=0;
  } else {
    // First pair result
    if(n===2){
      qs.finalEq=newEq;qs.stage='add_solve';qs.helpLevel=0;
    } else {
      qs.newEqs=[newEq];
      // Are there any remaining valid pairs for the elimination variable?
      var eqsA=lgs.equations,viA=qs.elimVar,remPairs=[];
      for(var iA=0;iA<3;iA++)for(var jA=iA+1;jA<3;jA++){
        if(Math.abs(eqsA[iA].coeffs[viA])>1e-9&&Math.abs(eqsA[jA].coeffs[viA])>1e-9
          &&!(qs.pair1&&iA===qs.pair1[0]&&jA===qs.pair1[1]))remPairs.push([iA,jA]);
      }
      if(remPairs.length===0){
        // elimVar occurs in only two equations → the third one lacks it and is
        // taken over into the 2×2 system unchanged.
        var ziA=-1;for(var kA=0;kA<3;kA++){if(Math.abs(eqsA[kA].coeffs[viA])<1e-9){ziA=kA;break;}}
        if(ziA>=0){
          qs.newEqs=[newEq,eqsA[ziA]];
          qzInfo(varTex(lgs.vars[viA])+' kommt in Gl.\u202f'+qLbl(ziA)+' nicht vor (Koeffizient 0). Ein zweiter Eliminationsschritt ist daher nicht nötig – Gl.\u202f'+qLbl(ziA)+' wird unverändert in das 2×2-System übernommen.',
            function(){quizState.stage='add_show_2x2';quizState.helpLevel=0;renderQuiz();});
          return;
        }
        qs.stage='add_show_2x2';qs.helpLevel=0;
      } else {
        qs.stage='add_choose_pair2';qs.helpLevel=0;  // Let user pick second pair
      }
    }
  }
  renderQuiz();
}

function addAdvanceFrom2x2Show(){
  var qs=quizState,lgs=qLGS(),vars=lgs.vars;
  // Did a second variable vanish during elimination? Then one of the new
  // equations contains only a single variable and can be solved directly.
  var sIdx=-1,sVar=-1;
  for(var i=0;i<qs.newEqs.length;i++){
    var nz=[];for(var j=0;j<vars.length;j++){if(Math.abs(qs.newEqs[i].coeffs[j])>1e-9)nz.push(j);}
    if(nz.length===1){sIdx=i;sVar=nz[0];break;}
  }
  if(sIdx>=0){
    qs.finalEq=qs.newEqs[sIdx];
    qzInfo('Gl.\u202f'+qNewLbl(sIdx)+' enthält nur noch die Variable '+varTex(vars[sVar])+' – beim Umformen ist eine weitere Variable weggefallen. Eine zweite Elimination ist deshalb nicht nötig: Gl.\u202f'+qNewLbl(sIdx)+' kann direkt gelöst werden.',
      function(){quizState.stage='add_solve';quizState.helpLevel=0;renderQuiz();});
    return;
  }
  qs.stage='add_choose_var2';qs.helpLevel=0;renderQuiz();
}

function _addRender2x2ChooseVar(vars){
  var qs=quizState;
  var newEqs=qs.newEqs;
  var avail=vars.filter(function(v,i){
    return newEqs.some(function(eq){return Math.abs(eq.coeffs[i])>1e-9;})&&i!==qs.elimVar;
  });
  return qzCurStep('2. Runde: Welche Variable soll eliminiert werden?',
    qzSystemBanner(newEqs,vars,qNewLbls())
    +'<div class="qz-btns">'+vars.map(function(v,i){
      if(i===qs.elimVar||!newEqs.some(function(eq){return Math.abs(eq.coeffs[i])>1e-9;}))return'';
      return'<button class="qz-btn" onclick="addPickVar2('+i+',this)">\\('+v+'\\)</button>';
    }).join('')+'</div>');
}
