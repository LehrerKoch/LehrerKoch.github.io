  <script>
/* Faellt ohne theme-language.js auf Deutsch zurueck. */
function T(de, en) { return (typeof tlText === 'function') ? tlText(de, en) : de; }
/* Formelfarben: im dunklen Modus heller, sonst wie gehabt */
// Hinweis: MathJax akzeptiert in \color{...} keine #-Hexwerte, daher rgb(...)
function FBLAU() { return (typeof tlDunkel === 'function' && tlDunkel()) ? 'rgb(130,177,255)' : 'blue'; }
function FROT()  { return (typeof tlDunkel === 'function' && tlDunkel()) ? 'rgb(239,83,80)' : 'red'; }

    const modeSwitchInput = document.getElementById('modeSwitchInput');
    // Modus: "bin2dec" oder "dec2bin"
    let mode = 'bin2dec';

    // Elemente
    const inputLeft = document.getElementById('inputLeft');
    const inputRight = document.getElementById('inputRight');
    const randomBtn = document.getElementById('randomBtn');
    const helpBtn = document.getElementById('helpBtn');
    const swapBtn = document.getElementById('swapBtn');
    const solutionBtn = document.getElementById('solutionBtn');
    const checkBtn = document.getElementById('checkBtn');
    const helpBox = document.getElementById('helpBox');
    const labelLeft = document.getElementById('labelLeft');
    const labelRight = document.getElementById('labelRight');
    const labelArrow = document.getElementById('labelArrow');
    const title = document.getElementById('title');

    // URL-Parameter auslesen
    function getParams() {
      const urlParams = new URLSearchParams(window.location.search);
      return {
        mode: urlParams.has('mode') ? urlParams.get('mode') : 'bin2dec'
      };
    }

    // URL-Parameter aktualisieren
    function updateURLParams() {
      const queryParams = new URLSearchParams(window.location.search);
      queryParams.set('mode', mode);
      const newURL = window.location.pathname + '?' + queryParams.toString();
      history.replaceState({}, '', newURL);
    }


    // Hilfsfunktionen
    function setInvalid(el, invalid) {
      el.classList.toggle('invalid', invalid);
    }

    function setResultClass(el, cls) {
      el.classList.remove('correct','wrong');
      if (cls) el.classList.add(cls);
    }
    
    function resetResultAndHelp() {
      inputRight.value = '';
      inputRight.classList.remove('invalid','correct','wrong');
      checkBtn.style.visibility = 'hidden';
      helpBox.style.display = 'none';
    }

    function switchMode() {
      mode = (mode === 'bin2dec') ? 'dec2bin' : 'bin2dec';
      beschrifte();
      // reset fields
      inputLeft.value = '';
      resetResultAndHelp();
      inputLeft.classList.remove('invalid');
      checkBtn.style.visibility = 'hidden'; // sicherheitshalber
      updateCheckButtonVisibility(); // überprüft sofort, falls Feld schon Werte enthält
      updateURLParams();
    }

    // Zufallszahl einfügen
    function insertRandom() {
      resetResultAndHelp();
      if (mode === 'bin2dec') {
        const length = Math.floor(Math.random()*5) + 3; // 3-7 Stellen
        let b = '';
        for (let i=0;i<length;i++) b += Math.random()<0.5 ? '0' : '1';
        inputLeft.value = b.replace(/^0+/, '') || '0';
        validateLeft();
      } else {
        const n = Math.floor(Math.random()*256); // 0-255
        inputLeft.value = String(n);
        validateLeft();
      }
      checkBtn.style.visibility = 'hidden'; // sicherheitshalber
      updateCheckButtonVisibility(); // überprüft sofort, falls Feld schon Werte enthält

    }

    function showSolution() {
      const left = inputLeft.value.trim();
      if (!validateLeft() || left === '') return;

      let result = '';
      if (mode === 'bin2dec') {
        result = parseInt(left, 2).toString();
      } else {
        result = parseInt(left, 10).toString(2);
      }

      inputRight.value = result;
      inputRight.classList.remove('wrong', 'invalid');
      setResultClass(inputRight, 'correct');  // ← Ergebnis grün einfärben
      checkBtn.style.visibility = 'hidden';   // Check-Button weiterhin ausblenden
    }

    // Überprüfen (check) — steht rechts vom Ergebnisfeld
    function checkAnswer() {
      if (!validateLeft()) return;
      const left = inputLeft.value.trim();
      const right = inputRight.value.trim();
      if (right === '') return;
      let expected;
      if (mode === 'bin2dec') {
        expected = String(parseInt(left, 2));
      } else {
        expected = parseInt(left,10).toString(2);
      }
      if (expected === right) {
        setResultClass(inputRight, 'correct');
      } else {
        setResultClass(inputRight, 'wrong');
      }
    }

    // Validierung der Eingaben beim Tippen
    function validateLeft() {
      const v = inputLeft.value.trim();
      if (v === '') { setInvalid(inputLeft,false); return true; }
      if (mode === 'bin2dec') {
        const ok = /^[01]+$/.test(v);
        setInvalid(inputLeft, !ok);
        if (!ok) {
          resetResultAndHelp();
        }
        return ok;
      } else {
        const ok = /^\d+$/.test(v);
        setInvalid(inputLeft, !ok);
        if (!ok) resetResultAndHelp();
        return ok;
      }
    }

    function validateRight() {
      const v = inputRight.value.trim();

      // leeres Feld -> kein Fehler
      if (v === '') {
        inputRight.classList.remove('invalid');
        // entferne evtl. vorherige Ergebnisfärbung
        setResultClass(inputRight, null);
        return true;
      }

      // je nach Modus andere erlaubte Zeichen
      const ok = (mode === 'bin2dec') ? /^\d+$/.test(v) : /^[01]+$/.test(v);

      // visuelle Markierung bei ungültiger Eingabe
      inputRight.classList.toggle('invalid', !ok);

      // wenn ungültig, entferne Korrekt/Fehler-Färbung
      if (!ok) setResultClass(inputRight, null);

      return ok;
    }

    function updateCheckButtonVisibility() {
      const leftVal = inputLeft.value.trim();
      const rightVal = inputRight.value.trim();

      const leftValid = (mode === 'bin2dec') ? /^[01]+$/.test(leftVal) : /^\d+$/.test(leftVal);
      const rightValid = (mode === 'bin2dec') ? /^\d+$/.test(rightVal) : /^[01]+$/.test(rightVal);

      if (leftVal !== '' && rightVal !== '' && leftValid && rightValid) {
        checkBtn.style.visibility = 'visible';
      } else {
        checkBtn.style.visibility = 'hidden';
      }
    }

    function toggleHelp() {
      if (helpBox.style.display === 'block') { 
        helpBox.style.display = 'none'; 
        return; 
      }

      // Prüfe Linkseingabe
      if (!validateLeft()) {
        alert(T('Bitte erst eine gültige Eingabe im linken Feld machen.', 'Please enter something valid in the left field first.'));
        return;
      }
      const left = inputLeft.value.trim();
      if (left === '') { 
        alert(T('Bitte zuerst eine Zahl eingeben.', 'Please enter a number first.')); 
        return; 
      }

      if (mode === 'bin2dec') {
          const bits = left.split('').map(b => b.trim());
          const n = bits.length;
          const values = Array.from({length: n}, (_, i) => Math.pow(2, n - 1 - i));
          const dec = parseInt(left, 2);

          // Obere Reihe: Stellenwerte, kleiner, blau bei 1
          const topRow = values.map((v, i) =>
              bits[i] === '1' ? `\\scriptstyle \\color{${FBLAU()}}{${v}}` : `\\scriptstyle ${v}`
          ).join(' & ');

          // Mittlere Reihe: Binärzahl fett, größer, blau bei 1
          const middleRow = bits.map(b =>
              b === '1' ? `\\Huge \\mathbf{\\color{${FBLAU()}}{${b}}}` : `\\Huge \\mathbf{${b}}`
          ).join(' & ');

          // Untere Reihe: Summe mit Pluszeichen nur dort, wo nachfolgend noch eine 1 kommt
          let sumRow = '';
          for (let i = 0; i < n; i++) {
              if (bits[i] === '1') {
                  sumRow += `\\color{${FBLAU()}}{${values[i]}}`;
                  // Prüfen, ob noch weitere 1 folgen, dann +~ setzen
                  let restHasOne = bits.slice(i + 1).some(b => b === '1');
                  if (restHasOne) sumRow += ' & +~ ';
              } else {
                  sumRow += `\\phantom{${values[i]}} & `;
              }
          }
          sumRow += ` & = \\vcenter{\\hbox{$\\Huge\\mathbf{\\color{${FROT()}}{${dec}}}$}}`;

          // LaTeX Array
          const latex = `
            \\[
            \\begin{array}{${'c '.repeat(n)}l}
            ${topRow} \\\\
            ${middleRow} \\\\
            ${sumRow}
            \\end{array}
            \\]
            `;

          // HTML einsetzen
          helpBox.innerHTML = `<div><strong>${T('Stellenwertsystem', 'Place-value system')}</strong><br>${latex}</div>`;
          helpBox.style.display = 'block';

          // MathJax stabil rendern
          if (typeof MathJax !== "undefined") {
            MathJax.typesetClear();
            MathJax.typesetPromise([helpBox]).catch((err) => console.error(err.message));
          }
      }
      else {
        // --- Dezimal → Binär (Modulo-Verfahren) ---
        let n = parseInt(left,10);
        if (isNaN(n)) { alert(T('Bitte eine gültige Dezimalzahl eingeben.', 'Please enter a valid decimal number.')); return; }

        const steps = [];
        let num = n;
        const remainders = [];
        while (num > 0) {
          const q = Math.floor(num / 2);
          const r = num % 2;
          steps.push({num, q, r});
          remainders.push(r);
          num = q;
        }
        const binary = remainders.length ? remainders.reverse().join('') : '0';

        // LaTeX array: rechtsbündige Zahlen, Rest links, gleiche Breite minimal
        const rows = steps.map(s => {
          return `${s.num} : 2 = & ${s.q} & \\text{${T('Rest:', 'remainder:')}} & \\color{${FROT()}}{${s.r}} \\\\`;
        }).join('\n');

        const latex = `
          \\(
          \\begin{array}{r r l r}
          ${rows}
          \\end{array}\\)
           <h4>${T('Ergebnis (Reste von unten nach oben lesen):', 'Result (read the remainders from bottom to top):')}</h4>
           \\(${n} = \\vcenter{\\hbox{$\\Large\\mathbf{\\color{${FROT()}}{${binary}_2}}$}}\\)
        `;

        helpBox.innerHTML = `<div><h3>${T('Modulo-Verfahren (Division durch 2)', 'Repeated division by 2')}</h3>${latex}</div>`;
        helpBox.style.display = 'block';
        // MathJax stabil rendern
          if (typeof MathJax !== "undefined") {
            MathJax.typesetClear();
            MathJax.typesetPromise([helpBox]).catch((err) => console.error(err.message));
          }

      }
    }

    // Event-Listener
    randomBtn.addEventListener('click', () => insertRandom());
    swapBtn.addEventListener('click', () => switchMode());
    solutionBtn.addEventListener('click', () => showSolution());
    helpBtn.addEventListener('click', () => toggleHelp());
    checkBtn.addEventListener('click', () => checkAnswer());
    

    inputLeft.addEventListener('input', () => {
      resetResultAndHelp();
      validateLeft();
      updateCheckButtonVisibility(); // neu
    });

    inputRight.addEventListener('input', () => {
      inputRight.classList.remove('correct','wrong');
      validateRight();
      updateCheckButtonVisibility(); // neu
    });
    // Slider Event-Listener
    modeSwitchInput.addEventListener('change', () => switchMode());

    // Enter-Taste im rechten Eingabefeld
    inputRight.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && checkBtn.style.visibility === 'visible') {
        checkAnswer();
      }
    });

    // Beschriftungen zur aktuellen Richtung und Sprache setzen
    function beschrifte() {
      if (mode === 'dec2bin') {
        title.textContent = T('Dezimalzahl → Binärzahl', 'Decimal → Binary');
        labelLeft.textContent = T('Dezimalzahl', 'Decimal number');
        labelRight.textContent = T('Binärzahl', 'Binary number');
        inputLeft.placeholder = T('z. B. 55', 'e.g. 55');
      } else {
        title.textContent = T('Binärzahl → Dezimalzahl', 'Binary → Decimal');
        labelLeft.textContent = T('Binärzahl', 'Binary number');
        labelRight.textContent = T('Dezimalzahl', 'Decimal number');
        inputLeft.placeholder = T('z. B. 1011', 'e.g. 1011');
      }
      labelArrow.textContent = '→';
      inputRight.placeholder = T('Ergebnis', 'Result');
      modeSwitchInput.checked = (mode === 'dec2bin');
    }

    // Sprach- und Themewechsel: Beschriftungen neu setzen, bei offener
    // Hilfe auch deren Formeln (Farben haengen am Farbschema).
    // Die eingegebenen Zahlen bleiben stehen.
    function neuZeichnen() {
      beschrifte();
      if (helpBox.style.display === 'block') { toggleHelp(); toggleHelp(); }
    }
    window.addEventListener('tl-sprache', neuZeichnen);
    window.addEventListener('tl-theme',   neuZeichnen);

    // Beim Klick auf "Fehler melden": Richtung und aktuelle Eingabe
    window.fehlerKontext = function () {
      return [title.textContent.trim(),
              inputLeft.value  ? T('Eingabe: ', 'Input: ')  + inputLeft.value  : '',
              inputRight.value ? T('Ausgabe: ', 'Output: ') + inputRight.value : ''
             ].filter(Boolean).join(' \u00b7 ');
    };

    // initial
    (function init(){
      const params = getParams();
      mode = params.mode === 'dec2bin' ? 'dec2bin' : 'bin2dec';
      beschrifte();

      inputLeft.value = '';
      inputRight.value = '';
      helpBox.style.display = 'none';
      checkBtn.style.visibility = 'hidden';
    })();

  </script>
