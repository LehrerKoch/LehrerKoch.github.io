  <title data-de="Graphen erkennen" data-en="Recognising Graphs">Graphen erkennen</title>

  <style>
    /* Farben, die auch per JS gesetzt werden (hell = bisheriges Aussehen) */
    :root{
      --karte-bg:#ffffff;
      --karte-bg-rueck:#fcfcfc;
      --karte-rand:#ddd;
      --wrap-rand:#eee;
      --tint-richtig:212,237,218;
      --tint-falsch:248,215,218;
    }
    html.dark{
      --karte-bg:#1e2429;
      --karte-bg-rueck:#232a31;
      --karte-rand:#3a434b;
      --wrap-rand:#333c44;
      --tint-richtig:30,70,32;
      --tint-falsch:74,32,32;
    }
    body { font-family: Calibri, sans-serif; -webkit-user-select: none; user-select: none; }
    *:focus { outline: none; }
    /* „Lösung anzeigen" ist überall der blaue Knopf aus aufgaben.css. */
    #showSolutionBtn { margin-top: 15px; }

    #flashOverlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      opacity: 0; transition: opacity 1s;
    }
    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 12px 24px; border-radius: 10px;
      font-size: 0.95em; opacity: 0; pointer-events: none;
      transition: opacity 0.4s; z-index: 999; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* Card area — taller to show graph images */
    #taskWrap {
      position: relative; width: 100%; height: 360px; margin-top: 20px;
      border: 1px solid var(--wrap-rand); border-radius: 10px; perspective: 1000px; z-index: 1;
    }
    #wrongBtn, #correctBtn {
      position: absolute; top: 0; bottom: 0; width: 75px;
      border: none; font-size: 0.7em; z-index: 1; cursor: pointer;
    }
    #wrongBtn  { left: 0;  background-color: #f8d7da; color: #721c24; }
    #correctBtn{ right: 0; background-color: #d4edda; color: #155724; }
    html.dark #wrongBtn  { background-color: #4a2020; color: #f0b0b0; }
    html.dark #correctBtn{ background-color: #1e4620; color: #a5d6a7; }

    #taskCard {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      text-align: center; border-radius: 15px; cursor: grab;
      width: calc(100% - 220px); max-width: 360px; height: 90%;
      z-index: 2; box-sizing: border-box;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      /* Wischen klappt so auch mit Stift (Promethean): waagerechtes Ziehen wird
         nicht vom Browser zum Schieben/Scrollen abgefangen, senkrecht scrollt
         die Seite weiter, Zwei-Finger-Zoom bleibt erhalten. */
      touch-action: pan-y pinch-zoom;
    }
    #taskCard.flipped { transform: translate(-50%, -50%) rotateY(180deg); }

    .card-face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border: 2px solid var(--karte-rand); border-radius: 15px; background: var(--karte-bg);
      transition: background-color 0.2s ease; overflow: hidden;
    }
    .card-back { transform: rotateY(180deg); background-color: var(--karte-bg-rueck); }

    #cardImage {
      max-width: 100%; max-height: 100%;
      object-fit: contain; pointer-events: none;
    }
    #cardImageBack {
      max-width: 80%; max-height: 75%;
      object-fit: contain; pointer-events: none; opacity: 0.25;
    }
    .card-loesung { font-size: 1.6em; margin-top: 10px; }

    #showSolutionBtn { width: 100%; margin-top: 15px; padding: 10px; cursor: pointer; }

    /* Die Graphen sind transparente PNGs mit schwarzen Achsen: im Dunkelmodus
       umgekehrt darstellen, damit Achsen und Beschriftung sichtbar bleiben.
       hue-rotate holt die rote Kurve nach dem Invertieren zurück ins Rote. */
    html.dark #cardImage, html.dark #cardImageBack { filter: invert(1) hue-rotate(180deg); }
    html.dark #toast { background:#e7eae8; color:#14181c; }
  </style>
</head>
<body class="tk-seite">
  <div id="flashOverlay"></div>
  <div id="toast"></div>
  <div style="position:relative; z-index:1;">

  <header class="tool-kopf">
    <div class="tk-text">
      <h1 data-de="Graphen zuordnen" data-en="Matching Graphs">Graphen zuordnen</h1>
      <p class="tk-unter" data-de="Welche Standard-Funktion wird dargestellt?" data-en="Which standard function is shown?">Welche Standard-Funktion wird dargestellt?</p>
    </div>
  </header>
  <p data-de="Gib die passende Funktionsgleichung zum abgebildeten Graphen an." data-en="State the function equation that matches the graph shown.">Gib die passende Funktionsgleichung zum abgebildeten Graphen an.</p>
  <p style="text-align:center;"><span class="punkte"><button id="btnPunkteReset" type="button" title="Punktzahl zurücksetzen" data-de-title="Punktzahl zurücksetzen" data-en-title="Reset the score">↺</button><span id="counter">Richtig: 0 / 0</span><button id="btnPunkteUndo" type="button" disabled title="Rückgängig" data-de-title="Rückgängig" data-en-title="Undo">↶</button></span></p>

  <div id="taskWrap">
    <button id="wrongBtn" data-de="Noch unsicher" data-en="Not sure yet">Noch unsicher</button>
    <div id="taskCard">
      <div class="card-face" id="faceFront">
        <img id="cardImage" src="" alt="Graph">
      </div>
      <div class="card-face card-back" id="faceBack">
        <img id="cardImageBack" src="" alt="Graph">
        <div id="loesung" class="card-loesung"></div>
      </div>
    </div>
    <button id="correctBtn" data-de="Kann ich sicher" data-en="I know this one">Kann ich sicher</button>
  </div>

  <button id="showSolutionBtn" class="btn-loesung" data-de="Lösung anzeigen" data-en="Show solution">Lösung anzeigen</button>

  </div>

<script>
// Übersetzungshilfe: nutzt theme-language.js, fällt ohne sie auf Deutsch zurück
function T(de, en) { return (typeof tlText === 'function') ? tlText(de, en) : de; }

// MathJax wird async geladen: vor dem Laden ist window.MathJax nur die
// Konfiguration ohne typeset(). Diese Hilfsfunktion wartet dann ab -
// den ersten Durchlauf erledigt MathJax beim Laden ohnehin selbst.
function mjTypeset(el) {
  if (window.MathJax && MathJax.typesetPromise) return MathJax.typesetPromise(el).catch(() => {});
  if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
    return MathJax.startup.promise.then(() => MathJax.typesetPromise(el)).catch(() => {});
  }
  return Promise.resolve();
}

const cards = [
  {img: "static/images/Graphen/1t.png",     loesung: "\\(f(x)=1\\)"},
  {img: "static/images/Graphen/sqrtt.png",  loesung: "\\(f(x)=\\sqrt{x}\\)"},
  {img: "static/images/Graphen/sint.png",   loesung: "\\(f(x)=\\sin(x)\\)"},
  {img: "static/images/Graphen/x2t.png",    loesung: "\\(f(x)=x^2\\)"},
  {img: "static/images/Graphen/x3t.png",    loesung: "\\(f(x)=x^3\\)"},
  {img: "static/images/Graphen/xt.png",     loesung: "\\(f(x)=x\\)"},
  {img: "static/images/Graphen/cost.png",   loesung: "\\(f(x)=\\cos(x)\\)"},
  {img: "static/images/Graphen/lnt.png",    loesung: "\\(f(x)=\\ln(x)\\)"},
  {img: "static/images/Graphen/et.png",     loesung: "\\(f(x)=e^x\\)"},
  {img: "static/images/Graphen/1_xt.png",   loesung: "\\(f(x)=\\frac{1}{x}\\)"},
  {img: "static/images/Graphen/1_x2t.png",  loesung: "\\(f(x)=\\frac{1}{x^2}\\)"},
];

let taskPool = [...cards];
let currentTask = null, correctCount = 0, totalCount = 0, lastTask = null;
let startX = null, currentX = 0, startTime = 0, ignoreMouseUp = false;

const card  = document.getElementById('taskCard');
const faces = document.querySelectorAll('.card-face');
const counterEl = document.getElementById('counter');

function showToast(msg, duration = 1800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

function flashResult(color) {
  const ov = document.getElementById('flashOverlay');
  ov.style.transition = 'none';
  ov.style.backgroundColor = color;
  ov.style.opacity = '1';
  setTimeout(() => { ov.style.transition = 'opacity 1s'; ov.style.opacity = '0'; }, 50);
}

function generateTask() {
  if (taskPool.length === 0) {
    taskPool = [...cards];
    showToast(T('🎉 Alle Karten geschafft! Stapel wird neu gemischt…', '🎉 All cards done! Reshuffling the deck…'));
  }
  let idx;
  do { idx = Math.floor(Math.random() * taskPool.length); }
  while (taskPool.length > 1 && taskPool[idx] === lastTask);
  const sel = taskPool[idx];
  lastTask = sel;
  currentTask = { poolIdx: idx, data: sel };
  window.currentSolution = null; // erst nach Flip verfügbar

  // Sofort: Vorderseite befüllen + zurückblättern
  document.getElementById('cardImage').src = sel.img;
  faces.forEach(f => f.style.backgroundColor = '');
  card.removeAttribute('style');
  card.classList.remove('flipped');

  // Nach 600ms (Rückseite nicht mehr sichtbar): Rückseite befüllen
  setTimeout(() => {
    document.getElementById('loesung').innerHTML = '';
    document.getElementById('cardImageBack').src = sel.img;
    window.currentSolution = sel.loesung;
    mjTypeset();
  }, 600);
}

function showSolution() {
  if (!window.currentSolution) return;
  document.getElementById('loesung').innerHTML = window.currentSolution;
  card.classList.add('flipped');
  mjTypeset();
}

function markAnswer(correct) {
  if (!currentTask) return;
  flashResult(correct ? (typeof tlDunkel === 'function' && tlDunkel() ? '#1e4620' : '#d4edda')
                      : (typeof tlDunkel === 'function' && tlDunkel() ? '#4a2020' : '#f8d7da'));
  punkteMerken();
  totalCount++;
  if (correct) {
    correctCount++;
    taskPool.splice(currentTask.poolIdx, 1);
  }
  counterEl.textContent = `${T('Richtig', 'Correct')}: ${correctCount} / ${totalCount}`;
  showSolution();
  currentTask = null;
  setTimeout(generateTask, 1200);
}

card.onmousedown = (e) => { startTime = Date.now(); handleStart(e); };
card.onmouseup   = (e) => {
  if (ignoreMouseUp) { ignoreMouseUp = false; return; }
  const duration = Date.now() - startTime;
  if (duration < 250 && Math.abs(currentX) < 20) {
    startX = null; currentX = 0;
    requestAnimationFrame(() => {
      card.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
      requestAnimationFrame(() => { showSolution(); });
    });
    return;
  }
  handleEnd();
};
card.ontouchstart = (e) => { startTime = Date.now(); handleStart(e); };
card.ontouchend   = (e) => {
  ignoreMouseUp = true;
  const duration = Date.now() - startTime;
  if (duration < 250 && Math.abs(currentX) < 20) {
    startX = null; currentX = 0;
    requestAnimationFrame(() => {
      card.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
      requestAnimationFrame(() => { showSolution(); });
    });
    return;
  }
  handleEnd();
};

const handleStart = (e) => { startX = e.clientX || (e.touches && e.touches[0].clientX); card.style.transition = 'none'; };
const handleMove  = (e) => {
  if (startX === null) return;
  currentX = (e.clientX || (e.touches && e.touches[0].clientX)) - startX;
  const rot = card.classList.contains('flipped') ? 180 : 0;
  card.style.transform = `translate(calc(-50% + ${currentX}px), -50%) rotateY(${rot}deg)`;
  const intensity = Math.min(Math.abs(currentX) / (card.parentElement.offsetWidth * 0.25), 0.8);
  const tint = getComputedStyle(document.documentElement).getPropertyValue(currentX > 0 ? '--tint-richtig' : '--tint-falsch').trim();
  faces.forEach(f => f.style.backgroundColor = `rgba(${tint},${intensity})`);
};
const handleEnd = () => {
  if (startX === null) return;
  const threshold = card.parentElement.offsetWidth * 0.25;
  const triggered = currentX > threshold || currentX < -threshold;
  const wasCorrect = currentX > 0;
  faces.forEach(f => f.style.backgroundColor = '');
  card.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
  if (triggered) {
    markAnswer(wasCorrect);
    requestAnimationFrame(() => {
      card.style.transform = `translate(-50%, -50%) rotateY(${card.classList.contains('flipped') ? 180 : 0}deg)`;
      setTimeout(() => { card.removeAttribute('style'); }, 600);
    });
  } else {
    card.style.transform = `translate(-50%, -50%) rotateY(${card.classList.contains('flipped') ? 180 : 0}deg)`;
    setTimeout(() => { if (startX === null) card.removeAttribute('style'); }, 600);
  }
  startX = null; currentX = 0;
};
document.onmousemove = handleMove;
card.ontouchmove = handleMove;
document.onmouseup = () => { if (startX !== null) handleEnd(); };

document.onkeydown = (e) => {
  if (e.code === 'Space')      { e.preventDefault(); showSolution(); }
  if (e.code === 'ArrowLeft')  markAnswer(false);
  if (e.code === 'ArrowRight') markAnswer(true);
};

// Sprachwechsel: Zählertext in neuer Sprache neu setzen
window.addEventListener('tl-sprache', () => {
  counterEl.textContent = `${T('Richtig', 'Correct')}: ${correctCount} / ${totalCount}`;
});

document.getElementById('showSolutionBtn').onclick = showSolution;
document.getElementById('wrongBtn').onclick  = () => markAnswer(false);
document.getElementById('correctBtn').onclick = () => markAnswer(true);

generateTask();
</script>

<script>
/* Beim Klick auf "Fehler melden" wird die gerade angezeigte Aufgabe
   mitgeschickt - direkt aus dem DOM, also immer der aktuelle Stand. */
window.fehlerKontext = function () {
  // Diese Seite zeigt Graphen als Bild - der Dateiname identifiziert die Karte
  const bild = document.getElementById('cardImage');
  const quelle = bild && bild.getAttribute('src');
  const zaehler = document.getElementById('counter');
  return [quelle ? quelle.split('/').pop() : '',
          zaehler ? zaehler.innerText.replace(/\s+/g, ' ').trim() : ''].filter(Boolean).join(' | ');
};

/* ── Punktestand: zurücksetzen und rückgängig ─────────────────────────────
   Ein Vertipper kostet so keine Serie: „rückgängig" stellt Punktzahl, Stapel
   und die zuletzt gezeigte Karte wieder her.                               */
let _stand = null;
function _undoKnopf(an){
  const u = document.getElementById('btnPunkteUndo');
  if (u) u.disabled = !an;
}
function punkteMerken(){
  _stand = { r: correctCount, g: totalCount, pool: taskPool.slice(), karte: currentTask, letzte: lastTask };
  _undoKnopf(true);
}
function zaehlerZeigen(){
  if (counterEl) counterEl.textContent = `${T('Richtig', 'Correct')}: ${correctCount} / ${totalCount}`;
}
function punkteZuruecksetzen(){
  correctCount = 0; totalCount = 0; _stand = null; _undoKnopf(false);
  taskPool = [...cards];
  zaehlerZeigen();
  generateTask();
}
function punkteRueckgaengig(){
  if (!_stand) return;
  correctCount = _stand.r; totalCount = _stand.g;
  taskPool = _stand.pool; currentTask = _stand.karte; lastTask = _stand.letzte;
  _stand = null; _undoKnopf(false);
  zaehlerZeigen();
  /* dieselbe Karte noch einmal zeigen */
  if (currentTask && currentTask.data){
    window.currentSolution = currentTask.data.ableitung || currentTask.data.loesung || window.currentSolution;
    const vorn = document.getElementById('taskText');
    if (vorn) vorn.innerHTML = currentTask.data.funktion || vorn.innerHTML;
    const hinten = document.getElementById('taskTextBack');
    if (hinten) hinten.innerHTML = currentTask.data.funktion || hinten.innerHTML;
    card.classList.remove('flipped');
    card.removeAttribute('style');
    faces.forEach(f => f.style.backgroundColor = '');
    mjTypeset();
    if (typeof scaleAllElements === 'function') scaleAllElements();
  }
}
document.addEventListener('DOMContentLoaded', () => {
  const r = document.getElementById('btnPunkteReset');
  if (r) r.addEventListener('click', punkteZuruecksetzen);
  const u = document.getElementById('btnPunkteUndo');
  if (u) u.addEventListener('click', punkteRueckgaengig);
});

</script>
