<script>
// Übersetzungshilfe: nutzt theme-language.js, fällt ohne sie auf Deutsch zurück
function T(de, en) { return (typeof tlText === 'function') ? tlText(de, en) : de; }
function istDunkel() { return typeof tlDunkel === 'function' && tlDunkel(); }

// Termfarben nach Potenz. Hell = bisherige Farben, Dunkel = aufgehellt.
function termFarben() {
  return istDunkel()
    ? { konst:'rgb(130,177,255)', x:'rgb(179,179,255)', x2:'rgb(129,199,132)',
        x3:'rgb(206,147,216)', x4:'rgb(255,183,77)', x5:'rgb(200,162,122)' }
    : { konst:'blue', x:'rgb(150, 150, 255)', x2:'green', x3:'purple', x4:'orange', x5:'brown' };
}
// MathJax akzeptiert in \color{...} keine #-Hexwerte, daher rgb(...)
function solFarbe() { return istDunkel() ? 'rgb(239,83,80)' : 'red'; }

// ---------------- Hilfsfunktionen ----------------
const rand = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;

// erzeugt Polynom bis Grad maxDeg
function makePoly(maxDeg){
  // Grad zufällig zwischen 1 und maxDeg
  let deg = rand(1, maxDeg);

  let coeffs = [];
  for(let i=deg;i>=0;i--){
    let c;

    if(i === deg){
      // Leitkoeffizient darf NICHT 0 sein → sichert den Grad
      do {
        c = rand(-5,5);
      } while(c === 0);
    } else {
      // alle anderen dürfen auch 0 sein
      c = rand(-5,5);
    }

    coeffs.push(c);
  }

  function polyToString(coeffs){
    let s='';
    let deg = coeffs.length-1;
    coeffs.forEach((c,idx)=>{
      let p = deg-idx;
      if(c===0) return;
      let term='';
      if(p===0) term=''+c;
      else if(p===1) term=(c===1?'':c===-1?'-':c)+'x';
      else term=(c===1?'':c===-1?'-':c)+`x^${p}`;
      s += (term.startsWith('-')?term:'+'+term);
    });
    return s.replace(/^\+/,'');
  }

  function polyDerivative(coeffs){
    let deg = coeffs.length-1;
    let d = [];
    coeffs.forEach((c,idx)=>{
      let p = deg-idx;
      if(p>0) d.push(c*p);
    });
    return polyToString(d);
  }

  return {
    f: polyToString(coeffs),
    d: polyDerivative(coeffs),
    deg: deg   // falls du den Grad später anzeigen willst
  };
}

// ---- Polynom-Parser: "2x^2-3x+1" -> Map {2:2, 1:-3, 0:1}
function parsePoly(str){
  let terms = new Map();
  str = str.replace(/\s+/g,'');

  // Normieren: führendes + ergänzen
  if(!str.startsWith('-')) str = '+' + str;

  let regex = /([+-])([^+-]+)/g;
  let m;
  while((m = regex.exec(str)) !== null){
    let sign = m[1] === '-' ? -1 : 1;
    let term = m[2];

    let coeff, power;

    if(term.includes('x')){
      let parts = term.split('x');
      coeff = parts[0] === '' ? 1 : parts[0] === '-' ? -1 : Number(parts[0]);
      power = parts[1].startsWith('^') ? Number(parts[1].slice(1)) : 1;
    } else {
      coeff = Number(term);
      power = 0;
    }

    let old = terms.get(power) || 0;
    terms.set(power, old + sign*coeff);
  }

  return terms; // Map(power -> coeff)
}

// ---- Multipliziert zwei Polynome (als Strings)
function multiplyPolys(p1, p2){
  let A = parsePoly(p1);
  let B = parsePoly(p2);

  let R = new Map();

  for(let [pA, cA] of A){
    for(let [pB, cB] of B){
      let p = pA + pB;
      let c = cA * cB;
      let old = R.get(p) || 0;
      R.set(p, old + c);
    }
  }

  return R; // Map
}

// ---- Addiert zwei Polynome (Maps)
function addPolys(A, B){
  let R = new Map(A);
  for(let [p,c] of B){
    let old = R.get(p) || 0;
    R.set(p, old + c);
  }
  return R;
}

// ---- Map -> String in Standardform
function polyMapToString(M){
  let powers = [...M.keys()].sort((a,b)=>b-a);
  let s = '';

  powers.forEach(p=>{
    let c = M.get(p);
    if(c === 0) return;

    let term = '';
    if(p === 0) term = '' + c;
    else if(p === 1) term = (c===1?'':c===-1?'-':c) + 'x';
    else term = (c===1?'':c===-1?'-':c) + `x^${p}`;

    s += (term.startsWith('-') ? term : '+' + term);
  });

  return s.replace(/^\+/,'') || '0';
}

// ---- Farbmarkierung nach Potenzen
function colorPoly(expr) {
  // Trenne am Vorzeichen, behalte das Vorzeichen aber beim Term
  let terms = expr.match(/[+-]?[^+-]+/g) || [];
  
  return terms.map(t => {
    let term = t.trim();
    if (term === '') return '';
    
    const F = termFarben();
    let color = F.konst; // Standard für Konstanten
    if (term.includes('x^5')) color = F.x5;
    else if (term.includes('x^4')) color = F.x4;
    else if (term.includes('x^3')) color = F.x3;
    else if (term.includes('x^2')) color = F.x2;
    else if (term.includes('x')) color = F.x;

    // Nutze geschweifte Klammern um den gesamten Farbblock zu isolieren
    return `{\\color{${color}}{${term}}}`;
  }).join('\\,\\,'); // Nutze ein einfaches Leerzeichen statt der Tilde
}

// ---- erzeugt Liste einzelner Terme als Strings, ohne Zusammenfassen
function expandPolyTerms(p1, p2){
  let A = parsePoly(p1);
  let B = parsePoly(p2);

  let terms = [];

  for(let [pA, cA] of A){
    for(let [pB, cB] of B){
      let p = pA + pB;
      let c = cA * cB;

      if(c === 0) continue;

      let term = '';
      if(p === 0) term = '' + c;
      else if(p === 1) term = (c===1?'':c===-1?'-':c) + 'x';
      else term = (c===1?'':c===-1?'-':c) + `x^${p}`;

      terms.push(term);
    }
  }

  return terms; // Array von Term-Strings, z.B. ["6x^3","-2x"]
}


let currentExpr = '';

// externer Lösungsrechner wie bisher
function openSteps(){
  // Englische Zwillingsseite von ableitungsrechner.net (gleiche URL-Parameter)
  const basis = (typeof tlSprache === 'function' && tlSprache() === 'en')
    ? 'https://www.derivative-calculator.net/'
    : 'https://www.ableitungsrechner.net/';
  const url = basis + '#expr=' + encodeURIComponent(currentExpr) + '&showsteps=1';
  window.open(url,'_blank');
}

// ---------------- Task ----------------
// Die zuletzt gewürfelte Aufgabe, damit sie bei Theme-/Sprachwechsel
// unverändert neu gezeichnet werden kann.
let aktuelleAufgabe = null;

function newTask(){
  /* Nur Lösung und Lösungsweg klappen zu - der Einstellungsbereich bleibt offen. */
  document.querySelectorAll('details.loesung, details.weg').forEach(d => d.removeAttribute('open'));

  const maxDeg   = +document.getElementById('polyDeg').value;
  const allowIn  = document.getElementById('allowInner').checked;
  const innerDeg = +document.getElementById('innerDeg').value;
  const orderVal = document.querySelector('input[name="order"]:checked').value;

  // Bestimme swap basierend auf Radio-Auswahl
  let swap = false;
  if (orderVal === 'pFirst') swap = true;
  if (orderVal === 'both') swap = Math.random() > 0.5;

  // äußeres Polynom p(x)
  let p = makePoly(maxDeg);

  // innere Funktion g(x)
  let g = { f:'x', d:'1' };
  if(allowIn){
    let inner = makePoly(innerDeg);
    g = { f: inner.f, d: inner.d };
  }

  aktuelleAufgabe = { p, g, swap, allowIn };
  renderTask();
}

/** Zeichnet die zuletzt gewürfelte Aufgabe (Farben/Sprache aktuell). */
function renderTask(){
  if (!aktuelleAufgabe) return;
  const { p, g, swap, allowIn } = aktuelleAufgabe;

  const gDerivSafe = (g.d.includes('x') || g.d.includes('+') || g.d.includes('-')) ? `(${g.d})` : g.d;

  // e^{g(x)} und Ableitung
  let eF  = `e^{${g.f}}`;
  let deF = g.d === '1' ? `e^{${g.f}}` : `e^{${g.f}}\\cdot ${gDerivSafe}`;

  let f, prod1, prod2;

  if(!swap){
    f     = `${eF}\\cdot\\left(${p.f}\\right)`;
    prod1= `${deF}\\cdot\\left(${p.f}\\right)`;
    prod2= `${eF}\\cdot\\left(${p.d}\\right)`;
  } else {
    f     = `\\left(${p.f}\\right)\\cdot ${eF}`;
    prod1= `\\left(${p.d}\\right)\\cdot ${eF}`;
    prod2= `\\left(${p.f}\\right)\\cdot ${deF}`;
  }
  // 1. Produktregel
  let step1 = `${prod1} + ${prod2}`;

  // 2. e-Funktion ausklammern
  // let step2 = `e^{${g.f}}\\cdot\\left( (${g.d})\\cdot(${p.f}) + (${p.d}) \\right)`;
  let step2 = `e^{${g.f}}\\cdot\\left( ${gDerivSafe}\\cdot(${p.f}) + (${p.d}) \\right)`;
  // 3. Ausmultipliziert & Farbig (dein alter step4)
  let rawTerms = expandPolyTerms(g.d, p.f);
  let derivTerms = expandPolyTerms("1", p.d);
  let allTerms = rawTerms.concat(derivTerms);
  let expandedRaw = allTerms.map(t => (t.startsWith('-') ? t : '+' + t)).join('').replace(/^\+/,'');
  let stepColor = `e^{${g.f}}\\cdot\\left( ${colorPoly(expandedRaw)} \\right)`;

  // 4. Zusammengefasst (dein alter step5)
  let sumPoly = new Map();
  allTerms.forEach(term => {
    let M = parsePoly(term);
    for(let [pwr, coeff] of M) {
      let old = sumPoly.get(pwr) || 0;
      sumPoly.set(pwr, old + coeff);
    }
  });
  let stepFinal = `e^{${g.f}}\\cdot\\left( ${colorPoly(polyMapToString(sumPoly))} \\right)`;

  // --- Zusammenbau der Rechenkette ---
  const op1 = `&&~~ |\\,\\scriptstyle\\text{${T('($e$-Term ausklammern)', '(factor out the $e$ term)')}}`;
  const op2 = `&&~~ |\\,\\scriptstyle\\text{${T('innere Klammer ausmult.', 'expand inner bracket')}}`;
  const op3 = `&&~~ |\\,\\scriptstyle\\text{${T('gleichart. Terme zsmf.', 'collect like terms')}}`;

  let finalResult = `e^{${g.f}}\\cdot\\left( ${polyMapToString(sumPoly)} \\right)`;

  let solutionPathHTML = '';

  if (!allowIn || g.d === '1') {
    solutionPathHTML = `
    $$
    \\begin{aligned}
    f'(x) &= ${step1} ${op1} \\\\
          &= ${stepColor} ${op3} \\\\
          &= ${stepFinal}
    \\end{aligned}
    $$`;
  } else {
    solutionPathHTML = `
    $$
    \\begin{aligned}
    f'(x) &= ${step1} ${op1} \\\\
          &= ${step2} ${op2} \\\\
          &= ${stepColor} ${op3} \\\\
          &= ${stepFinal}
    \\end{aligned}
    $$`;
  }

  document.getElementById('solution').innerHTML = `$$\\color{${solFarbe()}}{f'(x) = ${finalResult}}$$`;
  document.getElementById('solutionPathContent').innerHTML = `<div style="color:${solFarbe()}">${solutionPathHTML}</div>`;
  document.getElementById('task').innerHTML = `$$f(x) = ${f}$$`;
  mjSetzen().then(() => { if (typeof scaleAllElements === 'function') scaleAllElements(); });
  currentExpr = f;
}
// Theme-/Sprachwechsel: dieselbe Aufgabe mit neuen Farben bzw. Texten zeichnen
window.addEventListener('tl-theme',   () => renderTask());
window.addEventListener('tl-sprache', () => renderTask());

document.getElementById('solutionPath')?.addEventListener('toggle', () => {
  if (window.MathJax) mjSetzen().then(() => scaleToFit(document.getElementById('solutionPathContent')));
});

function updateLabels() {
  document.getElementById('degOut').innerText = document.getElementById('polyDeg').value;
  document.getElementById('degIn').innerText = document.getElementById('innerDeg').value;
}

function updateParams() {
  const polyDeg = document.getElementById('polyDeg');
  const innerDeg = document.getElementById('innerDeg');
  const allowInner = document.getElementById('allowInner');
  const innerDegLabel = document.getElementById('innerDegLabel');
  
  // UI-Zustand steuern
  if (!allowInner.checked) {
    innerDeg.disabled = true;
    innerDegLabel.classList.add('disabled-text');
  } else {
    innerDeg.disabled = false;
    innerDegLabel.classList.remove('disabled-text');
  }

  // Labels aktualisieren
  document.getElementById('degOut').innerText = polyDeg.value;
  document.getElementById('degIn').innerText = innerDeg.value;

  // URL-Parameter synchronisieren
  const pDeg = polyDeg.value;
  const iDeg = innerDeg.value;
  const allow = allowInner.checked;
  const order = document.querySelector('input[name="order"]:checked').value;
  
  const newURL = `${window.location.pathname}?pDeg=${pDeg}&iDeg=${iDeg}&allow=${allow}&order=${order}`;
  window.history.replaceState({}, '', newURL);
}

// In window.onload am Ende ergänzen:
window.onload = () => {
  const params = new URLSearchParams(window.location.search);
  if (params.has('pDeg')) document.getElementById('polyDeg').value = params.get('pDeg');
  if (params.has('iDeg')) document.getElementById('innerDeg').value = params.get('iDeg');
  if (params.has('allow')) document.getElementById('allowInner').checked = params.get('allow') === 'true';
  if (params.has('order')) {
    const radio = document.querySelector(`input[name="order"][value="${params.get('order')}"]`);
    if (radio) radio.checked = true;
  }
  
  // WICHTIG: updateParams stellt den Initialzustand der UI (Disabled/Grau) her
  updateParams(); 
  mjStart(() => newTask());
};
</script>
