    <script>
        
        document.addEventListener('click', function(event) {
                if (event.target.classList.contains('loesungstext')) {
                    var id = event.target.getAttribute('data-solution-id');
                    toggleSolution(id, event.target);
                }
            });

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('radioForm');
            const queryParams = new URLSearchParams(window.location.search);
            
            // Setzen der Standardwerte für Radiobuttons basierend auf URL-Parametern
            form.querySelectorAll('input[type="radio"]').forEach(radio => {
                const name = radio.name;
                const value = radio.value;
                if (queryParams.getAll(name).includes(value)) {
                    radio.checked = true;
                }
                
                // Hinzufügen eines Event-Listeners für Radiobutton-Änderungen, um URL-Parameter zu aktualisieren
                radio.addEventListener('change', () => {
                    updateURLParams();
                });
            });
            
            // Setzen der Standardwerte für Checkboxes basierend auf URL-Parametern
            form.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                const name = checkbox.name;
                const value = queryParams.getAll(name).includes("1") ? "1" : "0"; // Wert auf "1" oder "0" setzen
                if (queryParams.getAll(name).includes("1")) {
                    checkbox.checked = true;
                }
                
                // Hinzufügen eines Event-Listeners für Checkbox-Änderungen, um URL-Parameter zu aktualisieren
                checkbox.addEventListener('change', () => {
                    updateURLParams();
                });
            });
            
            // Funktion zum Aktualisieren der URL-Parameter
            function updateURLParams() {
                const queryParams = new URLSearchParams();
                form.querySelectorAll('input[type="radio"]:checked, input[type="checkbox"]').forEach(input => {
                    if (input.type === 'checkbox') {
                        queryParams.append(input.name, input.checked ? "1" : "0");
                    } else {
                        queryParams.append(input.name, input.value);
                    }
                });
                const newURL = window.location.pathname + '?' + queryParams.toString();
                history.pushState({}, '', newURL);
            }
        });
        
        function getParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return {
                diff: urlParams.has('diff') ? parseInt(urlParams.get('diff')) : 1,
                as: urlParams.has('as') ? parseInt(urlParams.get('as')) : 3,
                auch0: urlParams.has('auch0') ? parseInt(urlParams.get('auch0')) : 1,
                auch1: urlParams.has('auch1') ? parseInt(urlParams.get('auch1')) : 1,
                auch2: urlParams.has('auch2') ? parseInt(urlParams.get('auch2')) : 1,
                nurSpez: urlParams.has('nurSpez') ? parseInt(urlParams.get('nurSpez')) : 0,
                keinP: urlParams.has('keinP') ? parseInt(urlParams.get('keinP')) : 1,
                keinQ: urlParams.has('keinQ') ? parseInt(urlParams.get('keinQ')) : 1
            };
        }

        function monomText(coefficient, exponent, printPlusSign = 1, printNull = 0, printKlammernBeiNegativen = 0, variable = 'x') {
            let coefficientText = '';
            if (coefficient === 0) {
                if (printNull === 1){
                    return '0';
                } else {
                    return '';
                }
            }
            if (coefficient === 1 && exponent > 0){
                coefficientText = '';
            } else if (coefficient === -1  && exponent > 0) {
                coefficientText = '-';
            } else {
                coefficientText = `${coefficient}`.replace('.','{,}');
            }
            let exponentText = '';
            if (exponent === 0) {
                exponentText = '';
            } else if (exponent === 1) {
                exponentText = variable;
            } else {
                exponentText = `${variable}^${exponent}`;
            }
            if (printKlammernBeiNegativen === 1 && coefficient < 0) {
                coefficientText = `(${coefficientText})`;
            }
            // console.log(`${coefficient}, ${exponent}, ${printPlusSign}, ${printNull}, ${printKlammernBeiNegativen}, ${variable}`)
            let plusSign = '';
            if (printPlusSign === 1 && coefficient > 0){
                plusSign = '+';
            }
            return `${plusSign} ${coefficientText}${exponentText}`;
        }

        function randomElement(array) {
            // console.log(array);
            // console.log(array.length);
            return array[Math.floor(Math.random() * array.length)];
        }

// XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX

        function generateRandomNumbers() {

            const { diff, as, auch0, auch1, auch2, nurSpez, keinP, keinQ} = getParams();
            // console.log(as);

            // Mögliche Werte für a mit entsprechender Häufigkeit
            const easyAValues = [1, 1, 1];
            const mediumAValues = [2, 2, 2, 3, 3, 4, 5, 10];
            const mediumNegativeAValues = [-1, -1, -2, -2, -2, -3, -3, -4, -5, -10];
            const hardAValues = [.5, -.5, .25, -0.25, 1.5, -1.5, 2.5, -2.5];
            
            let possibleAValues = [];
            if (as === 1) {
                possibleAValues = easyAValues;
            } else if (as === 2) {
                possibleAValues = easyAValues.concat(mediumAValues);
            } else if (as === 3) {
                possibleAValues = easyAValues.concat(mediumAValues, mediumNegativeAValues);
            } else if (as === 4) {
                possibleAValues = easyAValues.concat(mediumAValues, mediumNegativeAValues, hardAValues);
            }
            // console.log(possibleAValues);

            // Generiere zufällige Werte für a
            a = randomElement(possibleAValues);
            console.log('a =', a);


            let possiblePValues = [];
            if (keinP === 1) {
                possiblePValues.push(0);
                possiblePValues.push(0);
            }


            if (keinP === 0 || nurSpez === 0){
                if (diff === 0) {
                    einfacheWerte.forEach(element => {
                        if (einfacheWerte.includes(element/2) && einfacheQuadratzahlen.includes(element*element/4)) {
                            possiblePValues.push(element);
                        }
                    })
                } else if (diff === 1) {
                    mittlereWerte.forEach(element => {
                        if (mittlereWerte.includes(element/2) && mittlereQuadratzahlen.includes(element*element/4)) {
                            possiblePValues.push(element);
                        }
                    })
                }
            }
            console.log('possiblePValues =', possiblePValues);

            p = randomElement(possiblePValues);
            console.log('p =', p);

            let possibleQuadratZahlen = [];
            if (diff === 0) {
                possibleQuadratZahlen = [].concat(einfacheQuadratzahlen);
            } else if (diff === 1) {
                possibleQuadratZahlen = [].concat(mittlereQuadratzahlen);
            }
            console.log('possibleQuadratZahlen =', possibleQuadratZahlen);

            
            let possibleQValues = [];
            
            if (auch2 == 1 && keinQ === 1){
                possibleQValues.push(0);
                possibleQValues.push(0);
            }

            if (auch1 == 1  && (keinQ == 0  || nurSpez == 0)) {
                    // if (poolQ.includes(p*p/4) || (keinP === 1 && p === 0)) {
                        possibleQValues.push(p*p/4);
                        possibleQValues.push(p*p/4);
                        possibleQValues.push(p*p/4);
                        possibleQValues.push(p*p/4);
                    // }
                } 
            
            // console.log('possibleQValues =', possibleQValues);
            // console.log('keinQ =', keinQ);
            // console.log('nurSpez =', nurSpez);

            if (keinQ === 0 || nurSpez === 0){
                if (auch2 === 1 || auch0 === 1){
                    poolQ.forEach(element => {
                        if (auch2 === 1) {
                            if (possibleQuadratZahlen.includes(p*p/4 - element)) {
                                possibleQValues.push(element);
                            }
                        } 
                        if (auch0 === 1) {
                            if (possibleQuadratZahlen.includes(element - p*p/4)) {
                                possibleQValues.push(element);
                            }
                        }
                    });
                }
            }
            
            console.log('possibleQValues =', possibleQValues);
            q = randomElement(possibleQValues);
            console.log('q =', q);

            b = p*a;
            c = q*a;
            console.log('b =', b);
            console.log('c =', c);

            // Berechne die Lösungen der quadratischen Gleichung
            const discriminant = b*b - 4*a*c;
            if (discriminant < 0) {
                x1 = '\\text{Keine Lösung}';
                x2 = '\\text{Keine Lösung}';
            } else if (discriminant === 0) {
                x1 = -b / (2*a);
                x2 = x1;
            } else {
                x1 = (-b + Math.sqrt(discriminant)) / (2*a);
                x2 = (-b - Math.sqrt(discriminant)) / (2*a);
            }

            let temp = x1;
            if (x1 > x2) {
                x1 = x2;
                x2 = temp;
            }

            // b = a * (-x1 - x2);
            // c = a * (x1 * x2);
            
            const formula = `0 = ${monomText(a, 2, 0)} ${monomText(b, 1)} ${monomText(c, 0)}`;
            
            if ((auch0 === 0 && auch1 === 0 && auch2 ===0) || possibleQValues.length === 0){
                document.getElementById('formula').innerHTML = "$$\\text{Keine Gleichung möglich}$$"
            } else {
                document.getElementById('formula').innerHTML = `$$${formula}$$`;
            }
            loesung_anzeigen = 0;
            hilfe_anzeigen = 0;
            document.getElementById('loesung').innerHTML = '';
            document.getElementById('schritte_button').innerHTML = '';
            document.getElementById('vorgehen').innerHTML = '';
            
            // MathJax neu rendern
            MathJax.typeset();
        }

        function toggleSolution(id, element) {
            var solutionDiv = document.getElementById(id);
            if (solutionDiv && element && element.parentNode) {
                element.parentNode.replaceChild(solutionDiv, element);
                solutionDiv.style.display = 'inline';
                solutionDiv.style.color = 'red';
            } else {
                if (!solutionDiv) {
                    console.error(`Element with ID ${id} was not found.`);
                }
                if (!element) {
                    console.error(`The element to be replaced was not found.`);
                }
                if (element && !element.parentNode) {
                    console.error(`The element to be replaced does not have a parent node.`);
                }
            }
        }

        function toggleAllSolutions() {
            // loesungsschritte_anzeigen = 1 - loesungsschritte_anzeigen;
            var details = document.querySelectorAll('.loesungstext');
            details.forEach(function(detail) {
                var id = detail.getAttribute('data-solution-id');
                var solutionDiv = document.getElementById(id);
                if (solutionDiv && detail) {
                    detail.parentNode.replaceChild(solutionDiv, detail);
                    solutionDiv.style.display = 'inline';
                    solutionDiv.style.color = 'red';
                } else {
                    console.error(`Element with ID ${id} or the detail element to be replaced was not found.`);
                }
            });
        }

// XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX

        // Generiere die Zufallszahlen beim Laden der Seite
        window.onload = generateRandomNumbers;
        // Generiere die Zufallszahlen bei jeder Änderung 
        window.onchange = generateRandomNumbers;
        let a = 1;
        let b = 0;
        let c = 0;
        let x1 = 0;
        let x2 = 0;
        let hilfe_anzeigen = 0;
        let loesung_anzeigen = 0;

        let einfacheWerte = [];
        for (let i = 1; i < 21; i++) {
            einfacheWerte.push(i);
            einfacheWerte.push(-i);
        }
        console.log('einfacheWerte =', einfacheWerte);

        let mittlereWerte = [].concat(einfacheWerte, [0.5, -0.5, 1.5, -1.5, 2.5, -2.5, 3.5, -3.5]);
        console.log('mittlereWerte =', mittlereWerte);
        
        const einfacheQuadratzahlen = [];
        for (let i = 1; i < 11; i++) {
            einfacheQuadratzahlen.push(i*i);
        }
        console.log('einfacheQuadratzahlen =', einfacheQuadratzahlen);
        const mittlereQuadratzahlen = [].concat(einfacheQuadratzahlen, [0.25, 2.25, 12.25]);
        for (let i = 11; i < 21; i++) {
            mittlereQuadratzahlen.push(i*i);
        }
        console.log('mittlereQuadratzahlen =', mittlereQuadratzahlen);

        const poolQ = [];
        for (let i = 1; i < 804; i++) {
            poolQ.push(i/4);
            poolQ.push(-i/4);
        }
        console.log('poolQ =', poolQ);

    </script>

<script>

// ── Hilfsfunktionen Zahlenformatierung (für Quiz) ──
function N(n)  { return String(n).replace('.', '{,}'); }
function NP(n) { return n < 0 ? '(' + N(n) + ')' : N(n); }

// ── Neue Aufgabe: Wrapper um generateRandomNumbers ──
function neueAufgabe() {
    generateRandomNumbers();
    // Details schließen (ohne ontoggle zu verwenden)
    document.getElementById('solutionDetails').removeAttribute('open');
    document.getElementById('solutionPathDetails').removeAttribute('open');
    // Quiz zurücksetzen
    var qm = document.getElementById('quizMode');
    if (qm.checked) { qm.checked = false; }
    document.getElementById('quizArea').style.display = 'none';
    document.getElementById('quizArea').innerHTML = '';
    quizState = null;
}

// window.onload und window.onchange überschreiben (Settings-Form bleibt aber über eigene Listener verbunden)
window.onload  = function() { neueAufgabe(); };
window.onchange = null; // deaktivieren – Settings-Form hat eigene Listener via DOMContentLoaded

// Settings-Form-Änderungen zusätzlich abfangen (löst neueAufgabe aus statt nur generateRandomNumbers)
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('radioForm').addEventListener('change', function() {
        neueAufgabe();
    });

    // ── Toggle-Listener für Details ──
    document.getElementById('solutionDetails').addEventListener('toggle', function() {

});

// ── Lösung anzeigen ──
function renderSolution() {
    var el = document.getElementById('loesung');
    var tex;
    if (typeof x1 === 'string') {
        tex = '\\mathbb{L} = \\{\\}';
    } else if (x1 === x2) {
        tex = 'x_{1,~2} = ' + x1;
    } else {
        tex = 'x_1 = ' + x1 + ',\\quad x_2 = ' + x2;
    }
    el.innerHTML = '\\[' + tex + '\\]';
    MathJax.typesetPromise([el]);
}

// ── Vollständiger Lösungsweg (Inhalt aus originalem hilfe(), ohne Toggle-Logik) ──

        '<p>Lies nun die Werte für \\(p\\) und \\(q\\) ab (<strong>mit Vorzeichen</strong>):<br>' +

        '<div class="hier_anzeigen">' +

                '<div class="column">' +

    // Lösung-Divs befüllen

    document.getElementById('solution7').innerHTML = '\\(x_{1,~2}=' + monomText(-ph, 0, 0) + ' \\pm \\sqrt{' + monomText(D,0,0,1) + '}~~\\)';

// ═══════════════════════════════════════════════════════════════════
// QUIZ
// ═══════════════════════════════════════════════════════════════════
var quizState = null;

function toggleQuiz() {
    var on = document.getElementById('quizMode').checked;
    var qa = document.getElementById('quizArea');
    qa.style.display = on ? '' : 'none';
    if (on) { quizState = null; initQuiz(); }
    else     { qa.innerHTML = ''; quizState = null; }
}

function qzDoneStep(title, content) {
    return '<div class="qz-done-step"><div class="qz-step-title">✓ ' + title + '</div>' + content + '</div>';
}
function qzCurStep(title, content) {
    return '<div class="qz-cur-step"><div class="qz-step-title">' + title + '</div>' + content + '</div>';
}
function qzFb(id, msg, cls) {
    var el = document.getElementById(id);
    if (el) { el.className = 'qz-fb ' + cls; el.innerHTML = msg; }
}
function numEq(val, ans) {
    var parse = function(s) { return parseFloat(String(s).replace(',','.').replace('{,}','.')); };
    var v = parse(val), a2 = parse(String(ans));
    return isFinite(v) && isFinite(a2) && Math.abs(v - a2) < 1e-9;
}

function buildQuizSteps() {
    var ph = p/2;
    var D  = p*p/4 - q;
    var W  = D >= 0 ? Math.sqrt(D) : null;
    var steps = [];

    // ── Schritt: Normieren (falls a ≠ 1) ──
    if (a !== 1) {
        if (p === 0 && q === 0) {
            steps.push({
                title: 'Normieren',
                qHtml: 'Dividiere durch \\(' + NP(a) + '\\). Was erhältst du?',
                noInput: true,
                revealTex: '0 = x^2'
            });
        } else if (p === 0) {
            steps.push({
                title: 'Normieren',
                qHtml: 'Dividiere durch \\(' + NP(a) + '\\). Welchen Wert hat \\(q\\)?',
                inputs: [{id:'nq', label:'q\\,=', ans:q}],
                hintTex: 'q = \\tfrac{c}{a} = \\tfrac{' + N(c) + '}{' + NP(a) + '} = ' + N(q),
                revealTex: '0 = x^2 ' + monomText(q, 0, 1)
            });
        } else if (q === 0) {
            steps.push({
                title: 'Normieren',
                qHtml: 'Dividiere durch \\(' + NP(a) + '\\). Welchen Wert hat \\(p\\)?',
                inputs: [{id:'np', label:'p\\,=', ans:p}],
                hintTex: 'p = \\tfrac{b}{a} = \\tfrac{' + N(b) + '}{' + NP(a) + '} = ' + N(p),
                revealTex: '0 = x^2 ' + monomText(p, 1)
            });
        } else {
            steps.push({
                title: 'Normieren',
                qHtml: 'Dividiere durch \\(' + NP(a) + '\\). Lies \\(p\\) und \\(q\\) ab:',
                inputs: [{id:'np', label:'p\\,=', ans:p}, {id:'nq', label:'q\\,=', ans:q}],
                hintTex: 'p = \\tfrac{' + N(b) + '}{' + NP(a) + '} = ' + N(p) + ',\\quad q = \\tfrac{' + N(c) + '}{' + NP(a) + '} = ' + N(q),
                revealTex: '0 = x^2 ' + monomText(p,1) + ' ' + monomText(q,0)
            });
        }
    }

    // ── Spezialfall: p = 0, q = 0 ──
    if (p === 0 && q === 0) {
        steps.push({
            title: 'Lösung',
            qHtml: 'Die Gleichung lautet \\(0 = x^2\\). Welche Lösung hat sie?',
            noInput: true,
            revealTex: 'x_{1,2} = 0'
        });
        return steps;
    }

    // ── Spezialfall: q = 0 ──
    if (q === 0) {
        var pt = p > 0 ? '+ ' + N(p) : N(p);
        steps.push({
            title: 'Ausklammern',
            qHtml: 'Klamme \\(x\\) aus: \\(0 = x \\cdot (x ' + pt + ')\\).<br>Welche zweite Lösung gibt es neben \\(x_1 = 0\\)?',
            inputs: [{id:'x2v', label:'x_2\\,=', ans:-p}],
            hintTex: 'x = 0\\text{ oder }x ' + pt + ' = 0 \\Rightarrow x_2 = ' + N(-p),
            revealTex: 'x_1 = 0,\\quad x_2 = ' + N(-p)
        });
        return steps;
    }

    // ── Spezialfall: p = 0 ──
    if (p === 0) {
        var qTerm = q >= 0 ? '+ ' + N(q) : N(q);
        steps.push({
            title: 'Gleichung umformen',
            qHtml: 'Forme \\(0 = x^2 ' + qTerm + '\\) um. Was ergibt sich für \\(x^2\\)?',
            inputs: [{id:'xsq', label:'x^{2}\\,=', ans:-q}],
            hintTex: 'x^2 = ' + N(-q),
            revealTex: 'x^2 = ' + N(-q)
        });
        if (D < 0) {
            steps.push({
                title: 'Lösungsanzahl',
                qHtml: '\\(x^2 = ' + N(-q) + '\\) – da \\(' + N(-q) + ' < 0\\): Wie viele reelle Lösungen gibt es?',
                mc: ['0','1','2'], mcAns: '0',
                hintTex: '\\sqrt{' + N(-q) + '}\\text{ ist nicht reell} \\Rightarrow \\mathbb{L} = \\{\\}',
                revealTex: '\\mathbb{L} = \\{\\}'
            });
        } else {
            steps.push({
                title: 'Lösung(en) berechnen',
                qHtml: '\\(x^2 = ' + N(-q) + '\\) – ziehe die Wurzel (beachte \\(\\pm\\)):',
                inputs: [{id:'x1v', label:'x_1\\,=', ans:x1}, {id:'x2v', label:'x_2\\,=', ans:x2}],
                hintTex: 'x = \\pm\\sqrt{' + N(-q) + '} = \\pm' + N(W),
                revealTex: 'x_1 = ' + N(x1) + ',\\quad x_2 = ' + N(x2)
            });
        }
        return steps;
    }

    // ── Normalfall ──
    steps.push({
        title: 'Diskriminante berechnen',
        qHtml: 'Berechne \\(D = \\left(\\dfrac{p}{2}\\right)^2 - q = \\left(\\dfrac{' + N(p) + '}{2}\\right)^2 - ' + NP(q) + '\\):',
        inputs: [{id:'disc', label:'D\\,=', ans:D}],
        hintTex: 'D = ' + N(ph) + '^2 - ' + NP(q) + ' = ' + N(ph*ph) + ' - ' + NP(q) + ' = ' + N(D),
        revealTex: 'D = ' + N(D)
    });

    if (D < 0) {
        steps.push({
            title: 'Lösungsanzahl',
            qHtml: '\\(D = ' + N(D) + ' < 0\\) – wie viele reelle Lösungen hat die Gleichung?',
            mc: ['0','1','2'], mcAns: '0',
            hintTex: 'D < 0 \\Rightarrow \\text{keine reelle Lösung} \\Rightarrow \\mathbb{L} = \\{\\}',
            revealTex: '\\mathbb{L} = \\{\\}'
        });
    } else if (D === 0) {
        steps.push({
            title: 'Lösung berechnen',
            qHtml: '\\(D = 0\\) – genau eine Lösung. Berechne \\(x_{1,2}\\):',
            inputs: [{id:'x12', label:'x_{1,2}\\,=', ans:-ph}],
            hintTex: 'x_{1,2} = -\\dfrac{p}{2} = -\\dfrac{' + N(p) + '}{2} = ' + N(-ph),
            revealTex: 'x_{1,2} = ' + N(-ph)
        });
    } else {
        steps.push({
            title: 'Lösungen berechnen',
            qHtml: '\\(D = ' + N(D) + ' > 0\\) – berechne beide Lösungen mit \\(x_{1,2}=-\\tfrac{p}{2}\\pm\\sqrt{D}\\):',
            inputs: [{id:'x1v', label:'x_1\\,=', ans:x1}, {id:'x2v', label:'x_2\\,=', ans:x2}],
            hintTex: 'x_{1,2} = ' + N(-ph) + ' \\pm \\sqrt{' + N(D) + '} = ' + N(-ph) + ' \\pm ' + N(W),
            revealTex: 'x_1 = ' + N(x1) + ',\\quad x_2 = ' + N(x2)
        });
    }
    return steps;
}

function initQuiz() {
    quizState = { steps: buildQuizSteps(), idx: 0 };
    renderQuiz();
}

function renderQuiz() {
    if (!quizState) return;
    var qa = document.getElementById('quizArea');
    var steps = quizState.steps;
    var idx   = quizState.idx;
    var total = steps.length;
    var html  = '<div class="qz-stage">pq-Formel (' + total + ' Schritt' + (total===1?'':'e') + ')</div>';

    // Abgeschlossene Schritte
    for (var i = 0; i < idx; i++) {
        html += qzDoneStep(steps[i].title, '<div>\\(' + steps[i].revealTex + '\\)</div>');
    }

    if (idx >= total) {
        html += '<div style="text-align:center;padding:12px;">'
              + '<span style="color:#1a6a1a;font-size:1.1em;font-weight:bold;">✓ Quiz abgeschlossen!</span><br>'
              + '<span style="font-size:.9em;color:#444;">Die Aufgabe ist vollständig gelöst.</span>'
              + '<div style="margin-top:8px;"><button onclick="neueAufgabe()">&#x27F3;&nbsp;Neue Aufgabe</button></div>'
              + '</div>';
        qa.innerHTML = html;
        MathJax.typesetPromise([qa]);
        return;
    }

    var s = steps[idx];

    if (s.noInput) {
        html += qzCurStep(
            'Schritt ' + (idx+1) + '\u202f/\u202f' + total + ': ' + s.title,
            '<div class="qz-sub">' + s.qHtml + '</div>'
            + '<div style="margin:5px 0;">\\(' + s.revealTex + '\\)</div>'
            + '<div class="qz-btns"><button onclick="quizAdvance()">Weiter &#8594;</button></div>'
        );
    } else if (s.mc) {
        var mcBtns = s.mc.map(function(opt) {
            return '<button class="qz-btn" onclick="quizCheckMC(\'' + opt + '\')">' + opt + '</button>';
        }).join('');
        html += qzCurStep(
            'Schritt ' + (idx+1) + '\u202f/\u202f' + total + ': ' + s.title,
            '<div class="qz-sub">' + s.qHtml + '</div>'
            + '<div class="qz-btns">' + mcBtns + '</div>'
            + '<div id="qz_fb" class="qz-fb"></div>'
        );
    } else {
        var inpHtml = s.inputs.map(function(inp) {
            return '<span style="font-size:.9em;margin-right:2px;">\\(' + inp.label + '\\)</span>'
                 + '<input class="qz-inp sm" id="' + inp.id + '" type="text" autocomplete="off"'
                 + ' onkeydown="if(event.key===\'Enter\')quizCheck()">';
        }).join('<span style="margin:0 5px;color:#aaa;">|</span>');
        html += qzCurStep(
            'Schritt ' + (idx+1) + '\u202f/\u202f' + total + ': ' + s.title,
            '<div class="qz-sub">' + s.qHtml + '</div>'
            + '<div class="qz-inp-row">' + inpHtml
            + '<button onclick="quizCheck()">Prüfen</button>'
            + '<button class="btn-orange" onclick="quizHint()">Tipp</button>'
            + '</div>'
            + '<div id="qz_fb" class="qz-fb"></div>'
        );
    }

    qa.innerHTML = html;
    MathJax.typesetPromise([qa]).then(function() {
        var fi = qa.querySelector('.qz-inp.sm');
        if (fi) setTimeout(function(){ fi.focus(); }, 80);
    });
}

function quizCheck() {
    if (!quizState) return;
    var s = quizState.steps[quizState.idx];
    var allOk = true;
    s.inputs.forEach(function(inp) {
        var el = document.getElementById(inp.id);
        if (!el) return;
        var ok = numEq(el.value, inp.ans);
        el.classList.toggle('ok',  ok);
        el.classList.toggle('err', !ok);
        if (!ok) allOk = false;
    });
    if (allOk) {
        qzFb('qz_fb', '✓ Richtig!', 'ok');
        setTimeout(function(){ quizAdvance(); }, 550);
    } else {
        qzFb('qz_fb', 'Nicht korrekt – versuche es nochmal.', 'err');
    }
}

function quizCheckMC(val) {
    if (!quizState) return;
    var s = quizState.steps[quizState.idx];
    document.querySelectorAll('.qz-btn').forEach(function(b) {
        if (b.textContent === val) b.classList.add(val === s.mcAns ? 'qc' : 'qw');
    });
    if (val === s.mcAns) {
        qzFb('qz_fb', '✓ Richtig!', 'ok');
        setTimeout(function(){ quizAdvance(); }, 550);
    } else {
        qzFb('qz_fb', 'Nicht ganz – versuche es nochmal.', 'err');
    }
}

function quizHint() {
    if (!quizState) return;
    var s  = quizState.steps[quizState.idx];
    var fb = document.getElementById('qz_fb');
    if (!fb) return;
    fb.className = 'qz-fb';
    fb.innerHTML = '<div class="qz-hint-box">\\(' + s.hintTex + '\\)</div>';
    MathJax.typesetPromise([fb]);
}

function quizAdvance() {
    if (!quizState) return;
    quizState.idx++;
    renderQuiz();
}
